# Golden retrieval set for the Mímir eval harness (NIU-1055).
#
# Categories:
#   keyword   — query terms appear (nearly) verbatim in the target page
#   semantic  — paraphrases sharing few or no keywords with the target;
#               expected to be weak in FTS-only mode (headroom for Phases 1–2)
#   relational — answered by relationships between entities
#   temporal  — answered by timeline entries and dates
#
# Every `expected` path must exist under tests/test_mimir/evals/corpus/ —
# run_eval() validates this and refuses to run otherwise.

queries:
