# ─── resident-skuld-broker-autonomy-proof ───────────────────────────────────
#
# Local Skuld broker for the resident daemon autonomy proof.
#
# Start before `ravn daemon`:
#
#   NIUU_CONFIG=scripts/setups/configs/resident-skuld-broker-autonomy-proof.yaml \
#     uv run python -m skuld
#
# This is the real Skuld websocket/Telegram path used by Ravn's skuld channel:
#
#   Ravn daemon -> ws://127.0.0.1:8081/ws/ravn/{peer_id}
#     -> Skuld RoomBridge
#     -> TelegramChannel notify_only=false
#     -> human reply
#     -> Skuld directed message
#     -> Ravn directed-message interceptor
#     -> resident operator reply persisted to Mimir
#
# The Telegram credential is loaded from the existing ~/.niuu file credential
# store. Do not put raw bot tokens in this file.
# ─────────────────────────────────────────────────────────────────────────────

host: 127.0.0.1
port: 8081

session:
  id: resident-autonomy-proof-clean-20260622-2005
  name: Kanuck Valley Resident Operator Room
  model: gpt-5.5
  workspace_dir: /Users/jozefvaneenbergen/git/niuu/software/volundr
  system_prompt: ""
  initial_prompt: ""

transport_adapter: skuld.transports.codex_ws.CodexWebSocketTransport
approval_policy: on-request
sandbox: workspace-write

persistence_mount_path: /private/tmp/resident-daemon-autonomy-proof-clean-20260622-2005/skuld
volundr_api_url: ""
chronicle_watcher_enabled: false
chronicle_on_stop_enabled: false
event_log_enabled: false

room:
  enabled: true

telegram:
  enabled: true
  credential_name: telegram-main
  credential_owner_type: user
  credential_owner_id: dev-user
  notify_only: false
  topic_mode: shared_chat

mesh:
  enabled: false

peer_watchdog:
  enabled: false
