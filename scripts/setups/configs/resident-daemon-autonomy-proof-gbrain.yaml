# ─── resident-daemon-autonomy-proof-gbrain ───────────────────────────────────
#
# Real daemon proof for resident inbox intake using GBrain as the resident state
# adapter and Mimir as resident work storage. This runs through the production
# daemon path:
#
#   ravn daemon
#     -> DriveLoop
#     -> ResidentAutonomyTrigger
#     -> EnvironmentSignalRuntime with mesh enabled
#     -> MimirResidentInbox under resident/inbox/...
#     -> ResidentInboxRuntime wake extension
#     -> resident portfolio objective creation
#
# There is no proof-script resident loop here. The proof input is a configured
# inbox signal source plus the mandate below; delegation and opportunity
# generation are disabled so the run stays focused on inbox intake and triage.
#
# Expected local preflight:
#   ./start-dev
#   NIUU_CONFIG=scripts/setups/configs/resident-skuld-broker-autonomy-proof.yaml \
#     uv run python -m skuld
#
# Proof command:
#   RAVN_GBRAIN_API_TOKEN=<token> \
#   CODEX_HOME=/Users/jozefvaneenbergen/.codex \
#   UV_CACHE_DIR=/private/tmp/uv-cache \
#     uv run ravn daemon --config scripts/setups/configs/resident-daemon-autonomy-proof-gbrain.yaml
# ─────────────────────────────────────────────────────────────────────────────

memory:
  backend: sqlite

mimir:
  enabled: true
  path: /private/tmp/resident-daemon-autonomy-proof-clean-20260622-2005/mimir
  search:
    backend: fts
  source_trigger:
    enabled: false
  staleness_trigger:
    enabled: false

resident_state:
  adapter: ravn.adapters.resident_state.gbrain.GBrainResidentStateAdapter
  kwargs:
    root: /private/tmp/resident-daemon-autonomy-proof-clean-20260622-2005/state
    command: /private/tmp/bun/bin/gbrain
    mcp_url: http://127.0.0.1:3131/mcp
    ingest_url: http://127.0.0.1:3131/ingest
    write_mode: put_page
    capture_enabled: true
    search_enabled: true
    timeout_seconds: 60
  secret_kwargs_env:
    api_token: RAVN_GBRAIN_API_TOKEN

resident_work:
  adapter: ravn.adapters.resident_work.mimir.MimirResidentWorkAdapter
  kwargs: {}

resident_autonomy:
  enabled: true
  mandate: |
    Kanuck Valley Models is my small 3D printing company.
    You are its resident Ravn.
    Help it become easier to run, more creative, and more successful.
    Ask before spending money or operating physical machines.
  bootstrap_portfolio: false
  persona: resident-codex
  operator_contact: skuld
  poll_interval_seconds: 60
  initial_delay_seconds: 5
  max_cycles_per_wake: 1
  max_wall_clock_seconds: 1800
  sleep_between_cycles_seconds: 20
  max_objectives_selected: 2
  max_active_objectives: 3
  max_wake_cycles: 30
  orientation_turns: 1
  max_workstream_turns: 1

resident_inbox:
  enabled: true
  environment_signals_enabled: true
  directed_messages_enabled: true
  max_signals_per_wake: 5
  create_objectives: true
  attach_to_existing_objectives: true
  min_attach_score: 1

resident_delegation_execution:
  adapter: ravn.adapters.resident_execution.workflow.ConfiguredWorkflowResidentExecutionAdapter
  kwargs:
    workflow_source_adapter: ravn.adapters.capabilities.ting_workflows.TingWorkflowCapabilityAdapter
    workflow_source_kwargs:
      base_url: "http://192.168.1.106:8080"
      allow_anonymous: true
      timeout_seconds: 30.0
    workflow_id: "1bfc01b1-4d01-5d20-86e1-2956dff11464"
    connection_id: "local"
    model: "gpt-5.5"
    definition: "skuldCodex"
  max_delegations: 1
  max_observations: 8
  max_follow_up_objectives: 4
  abandon_after_seconds: 0

resident_opportunity_generation:
  enabled: false
  sources:
    - adapter: ravn.adapters.opportunity.web_search.WebSearchOpportunitySource
      enabled: true
      kwargs:
        num_results: 3
        query_templates:
          - "{domain} tabletop terrain customer pain points"
          - "{domain} 3d printing workflow improvements"
          - "{domain} miniature terrain market trends"
  max_signals: 6
  max_candidates: 4
  max_selected: 2

resident_capability_discovery:
  enabled: false
  adapter: ravn.adapters.capabilities.resident_discovery.CatalogWebCapabilityDiscoveryBackend
  include_builtin_catalog: true
  kwargs:
    num_results: 3
  max_options: 4
  max_follow_up_objectives: 3

budget:
  daily_cap_usd: 5.0

environment:
  id: kanuck-valley-models-local
  name: Kanuck Valley Models Local Proof
  type: host
  resident_name: Kanuck Valley Resident Ravn
  signal_poll_interval_seconds: 2
  signal_task_severities: []
  signal_sources: []

initiative:
  enabled: true
  max_concurrent_tasks: 1
  queue_journal_path: /private/tmp/resident-daemon-autonomy-proof-clean-20260622-2005/queue.json

thread:
  enabled: false

wakefulness:
  enabled: false

recap:
  enabled: false

dream_cycle:
  enabled: false

odin_court:
  enabled: false

gateway:
  enabled: false

sleipnir:
  enabled: false

mesh:
  enabled: true
  own_peer_id: resident-inbox-proof-ravn
  adapter: nng
  nng:
    pub_sub_address: "ipc:///private/tmp/resident-inbox-proof-ravn-clean-20260622-2005-pub.ipc"
    req_rep_address: "ipc:///private/tmp/resident-inbox-proof-ravn-clean-20260622-2005-rep.ipc"

skuld:
  enabled: true
  broker_url: "ws://127.0.0.1:8081/ws/ravn"
  display_name: "Kanuck Valley Resident Ravn"

logging:
  level: info
