# ─── resident-forge-proof ───────────────────────────────────────────────────
#
# Resident delegation profile for real local Forge-backed proof runs.
#
# This profile keeps resident execution on the existing hexagonal route:
#   ResidentExecutionPort
#     -> WorkflowCapabilityPort
#     -> Ting workflow launch
#     -> Volundr/Forge session
#
# It does not use the local simulated/subprocess delegation backends.
# It expects `./start-dev` to be running on http://127.0.0.1:8080 with
# `auth.allow_anonymous_dev: true`.
#
# Launch preflight:
#   uv run python scripts/prove_resident_delegation.py \
#     --config scripts/setups/configs/resident-forge-proof.yaml \
#     --preflight-only
#
# Launch real proof:
#   uv run python scripts/prove_resident_delegation.py \
#     --config scripts/setups/configs/resident-forge-proof.yaml \
#     --require-real-session \
#     --poll-attempts 30 \
#     --poll-interval-seconds 60
# ─────────────────────────────────────────────────────────────────────────────

llm:
  model: gpt-5.5
  max_tokens: 8192
  timeout: 180
  provider:
    adapter: ravn.adapters.llm.openai.OpenAICompatibleAdapter
    kwargs:
      base_url: "http://localhost:8088"

memory:
  backend: sqlite

mimir:
  enabled: true
  path: ~/.ravn/mimir
  search:
    backend: fts

resident_delegation_execution:
  adapter: ravn.adapters.resident_execution.workflow.ConfiguredWorkflowResidentExecutionAdapter
  kwargs:
    workflow_source_adapter: ravn.adapters.capabilities.ting_workflows.TingWorkflowCapabilityAdapter
    workflow_source_kwargs:
      base_url: "http://127.0.0.1:8080"
      allow_anonymous: true
      timeout_seconds: 30.0
    # Research Campaign. Pinning avoids accidentally selecting a tool-builder
    # workflow for a generic resident proof objective.
    workflow_id: "1bfc01b1-4d01-5d20-86e1-2956dff11464"
    connection_id: "local"
    repo: ""
    branch: ""
    model: "gpt-5.5"
    definition: "skuldCodex"
  max_delegations: 1
  max_observations: 8
  max_follow_up_objectives: 4

resident_review:
  max_findings: 6

budget:
  daily_cap_usd: 5.0

trust:
  reading: free
  writing_notes: free
  sandbox_experiments: free
  consulting_peers: free
  drafting_tickets: free
  producing_recaps: free
  opening_tickets: approval
  closing_tickets: approval
  pushing_branches: approval
  pushing_main: never
  external_messages: approval
  spending_beyond_cap: approval

thread:
  enabled: false

wakefulness:
  enabled: false

recap:
  enabled: false

initiative:
  enabled: false

gateway:
  enabled: false

sleipnir:
  enabled: false

mesh:
  enabled: false

logging:
  level: info
