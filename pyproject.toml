[project]
name = "volundr"
version = "0.1.0"
description = "Volundr — self-hosted AI-native development platform"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["development-platform", "remote-coding", "ai", "kubernetes", "self-hosted"]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.2,<2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "claude-agent-sdk==0.2.128",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "idna>=3.18",
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "python-multipart>=0.0.32",
    "PyJWT>=2.13.0",
    "cryptography>=50.0.0",
    "urllib3>=2.7.0",
    "uvicorn>=0.52.0",
    "websockets>=17.0.1",
    "python-on-whales>=0.81.0",
    "gitpython>=3.1.57",
    "msgpack>=1.2.1",
    "typer>=0.27.0",
    "respx>=0.23.1",
    "pynng>=0.9.0",
    "zeroconf>=0.150.0",
    "python-telegram-bot>=22.8",
    "sqlite-vec>=0.1.9",
    "docker>=7.2.0",
]

[project.optional-dependencies]
openshell = [
    "openshell==0.0.96; python_version >= '3.12'",
]
nats = [
    "nats-py[nkeys]>=2.15.0",
]
# Semantic search for Mimir (NIU-1056): hybrid retrieval needs an embedding
# model. FTS-only mode works without this extra.
embeddings = [
    "sentence-transformers>=5.6.1",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "httpx2>=2.9.1",
    "aiohttp>=3.14.3",
]
rabbitmq = [
    "aio-pika>=10.0.1",
]
redis = [
    "redis[hiredis]>=8.1.0",
]
k8s = [
    "kubernetes-asyncio>=36.1.0",
]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]
encryption = [
    "cryptography>=50.0.0",
]
browser = [
    "playwright>=1.62.0",
]
infra = [
    "redis>=8.1.0",
]
cli = [
    "typer>=0.27.0",
    "textual>=8.2.8",
    "nuitka[onefile]>=4.1.3",
    "ordered-set>=4.1",
    "patchelf>=0.17.2.4; sys_platform == 'linux'",
]
tui = [
    "textual>=8.2.8",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1,<0.17",
    "respx>=0.23.1",
    "httpx2>=2.9.1",
    "cryptography>=50.0.0",
    "textual>=8.2.8",
    "typer>=0.27.0",
    "nats-py[nkeys]>=2.15.0",
    "aiohttp>=3.14.3",
]

[project.scripts]
niuu = "niuu.__main__:main"
guild = "guild.main:main"
audit = "audit.main:main"
identity = "identity.main:main"
features = "features.main:main"
credentials = "credentials.main:main"
integrations = "integrations.main:main"
tracker = "tracker.main:main"
skuld = "skuld.broker:main"
bifrost = "bifrost.__main__:main"
ting = "ting.main:main"
observatory = "observatory.main:main"
ravn = "ravn.cli.commands:app"
ravn-api = "ravn.main:main"
ravn-approvals = "ravn.cli.commands:approvals_main"
ravn-gateway = "ravn.cli.commands:gateway_main"
ravn-evolve = "ravn.cli.commands:evolve_main"
ravn-mimir = "ravn.cli.commands:mimir_main"

[project.entry-points."niuu.plugins"]
niuu = "niuu.plugin:NiuuPlugin"
guild = "guild.plugin:GuildPlugin"
volundr = "volundr.plugin:VolundrPlugin"
audit = "audit.plugin:AuditPlugin"
identity = "identity.plugin:IdentityPlugin"
features = "features.plugin:FeaturesPlugin"
credentials = "credentials.plugin:CredentialsPlugin"
integrations = "integrations.plugin:IntegrationsPlugin"
tracker = "tracker.plugin:TrackerPlugin"
ting = "ting.plugin:TingPlugin"
mimir = "mimir.plugin:MimirPlugin"
ravn = "ravn.plugin:RavnPlugin"
bifrost = "bifrost.plugin:BifrostPlugin"
observatory = "observatory.plugin:ObservatoryPlugin"
personas = "personas.plugin:PersonasPlugin"

[project.urls]
Homepage = "https://github.com/niuulabs/volundr"
Documentation = "https://github.com/niuulabs/volundr"
Repository = "https://github.com/niuulabs/volundr"
Issues = "https://github.com/niuulabs/volundr/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit", "src/cli", "src/credentials", "src/features", "src/guild", "src/identity", "src/integrations", "src/niuu", "src/volundr", "src/ting", "src/tracker", "src/skuld", "src/sleipnir", "src/ravn", "src/bifrost", "src/mimir", "src/observatory", "src/personas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -m 'not integration and not broker and not kind_integration'"
markers = [
    "integration: tests that require a real PostgreSQL database",
    "broker: tests that require real message broker services (NATS, RabbitMQ, Redis)",
    "ravn: tests for the Ravn agent module",
    "e2e: end-to-end tests for full agent conversation flows",
    "browser: tests that require a real browser (Playwright + Chromium)",
    "kind_integration: tests that require a live kind cluster (set KIND_INTEGRATION=1 to enable)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["src/audit", "src/volundr", "src/cli", "src/credentials", "src/features", "src/guild", "src/identity", "src/integrations", "src/ting", "src/tracker", "src/niuu", "src/skuld", "src/sleipnir", "src/ravn", "src/bifrost", "src/mimir", "src/observatory"]
branch = true
# Textual TUI widgets require a running terminal and cannot be exercised with
# plain pytest. They are excluded from coverage measurement until Textual
# Pilot-based widget tests are added. The same applies to ting/tui/ and
# ting/plugin.py (CLI plugin registration with TUI imports).
# Sleipnir transport adapters require live broker services (NATS, NNG, RabbitMQ)
# and cannot be tested in CI without those services running.
# Ravn infrastructure adapters that require live Kubernetes, PostgreSQL, mDNS,
# or HTTP services are also excluded from coverage measurement.
omit = [
    "src/ravn/tui/*",
    "src/ting/tui/*",
    "src/ting/plugin.py",
    "src/sleipnir/adapters/nats_transport.py",
    "src/sleipnir/adapters/nng_transport.py",
    "src/sleipnir/adapters/rabbitmq.py",
    "src/ravn/adapters/checkpoint/postgres.py",
    "src/ravn/adapters/checkpoint/sleipnir_trigger.py",
    "src/ravn/adapters/discovery/mdns.py",
    "src/ravn/adapters/mesh/webhook.py",
    "src/ravn/adapters/mesh/composite.py",
    "src/ravn/adapters/spawn/kubernetes_spawn.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1,<0.17",
]
