graph:
  tags:
  - research
  - campaign
  nodes:
  - id: research-request
    kind: trigger
    label: Start research campaign
    source: user research
    dispatchEvent: research.requested
    position:
      x: 96
      y: 280
  - id: research-memory
    kind: resource
    label: Research Memory
    resourceType: mimir
    bindingMode: registry
    registryEntryId: mimir-yggdrasil
    url: https://mimir.yggdrasil.niuu.world/api/v1
    authRef: workload:mimir
    role: shared
    categories:
    - research
    - memory
    - sources
    position:
      x: 320
      y: 560
  - id: research-frame
    kind: stage
    label: Frame the inquiry
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-framer
      budget: 16
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.requested
    position:
      x: 320
      y: 280
  - id: research-coordinate
    kind: stage
    label: Define and dispatch exploration threads
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-coordinator
      budget: 20
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.framed
      - research.threads.blocked
    position:
      x: 608
      y: 280
  - id: research-threads
    kind: subworkflow
    label: Explore the framed question across parallel threads
    templates:
      breadth: breadth
      depth: depth
      contrarian: contrarian
      general: general
    allowedCoordinator: research-coordinator
    maxChildren: 12
    maxActiveChildren: 3
    maxAttempts: 2
    joinMode: all
    blockedEvent: research.threads.blocked
    inputSchema:
      type: object
      properties:
        slug: {type: string}
        angle: {type: string}
      required: [slug, angle]
      additionalProperties: false
    resultSchema:
      type: object
      properties:
        question: {type: string, minLength: 1}
        findings:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        sources:
          type: array
          items: {type: string, minLength: 1}
        confidence: {type: string, enum: [high, medium, low]}
        openQuestions:
          type: array
          items: {type: string, minLength: 1}
      required: [question, findings, sources, confidence, openQuestions]
      additionalProperties: false
    children:
    - key: breadth
      objective: Map the landscape widely across the framed question before anyone collapses too early into one story.
      template: breadth
      input: {slug: campaign, angle: breadth}
    - key: depth
      objective: Drill into the highest-value thread from the frame and track mechanisms, not just headlines.
      template: depth
      input: {slug: campaign, angle: depth}
    - key: contrarian
      objective: Hunt for counterpoints, contradictory evidence, and neglected context that weaken the default story.
      template: contrarian
      input: {slug: campaign, angle: contrarian}
    position:
      x: 928
      y: 280
  - id: research-analysis
    kind: stage
    label: Analyze the joined threads
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-analyst
      budget: 28
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.threads.joined
    position:
      x: 1216
      y: 280
  - id: research-challenge
    kind: stage
    label: Challenge the thesis
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-skeptic
      budget: 14
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.analyzed
    position:
      x: 1504
      y: 280
  - id: research-synthesis
    kind: stage
    label: Synthesize the research
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-synthesist
      budget: 16
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.challenged
    position:
      x: 1792
      y: 280
  - id: research-curation
    kind: stage
    label: Curate learnings and follow-ups
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-curator
      budget: 12
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.synthesized
    position:
      x: 2080
      y: 280
  - id: research-publish
    kind: stage
    label: Publish to Mimir
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: research-publisher
      budget: 10
      model: gpt-5.6-terra
      consumesEventTypes:
      - research.curated
    position:
      x: 2368
      y: 280
  - id: research-complete
    kind: end
    label: Research complete
    joinMode: all
    completionEvent: research.completed
    position:
      x: 2656
      y: 280
  edges:
  - id: edge-research-request-to-frame
    source: research-request
    target: research-frame
    label: research.requested -> research.requested
  - id: edge-frame-to-coordinate
    source: research-frame
    target: research-coordinate
    label: research.framed -> research.framed
  - id: edge-coordinate-to-threads
