# Tyr config for M6 flock e2e testing
dispatch:
  flock:
    enabled: true
    default_personas:
      - raid-executor
      - name: coding-agent
      - name: reviewer
        consumes_event_types:
          - review.requested
        system_prompt_extra: |
          For delegated flock reviews, inspect the concrete declared file paths and acceptance
          criteria directly. If git diff is empty because the change is untracked, use file
          inspection and git status instead of blocking on a missing diff.
    sleipnir_publish_urls: []
  default_session_definition: skuldClaude

review:
  auto_approve_threshold: 0.70
  max_retries: 3
  reviewer_session_enabled: false
  ravn_arbiter_enabled: false

ravn_outcome:
  enabled: true
  owner_id: dev-user
  scope_adherence_threshold: 0.7

sleipnir:
  enabled: true
  adapter: "sleipnir.adapters.in_process.InProcessBus"

auth:
  allow_anonymous_dev: true
