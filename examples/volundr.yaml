# Volundr Configuration
# =====================
#
# Copy this file to config.yaml and customize for your environment.
#
# Configuration precedence:
# 1. Default values
# 2. YAML config file (this file)
# 3. Environment variables (override YAML values)
#
# Kubernetes deployment:
# - Mount this as a ConfigMap at /etc/volundr/config.yaml
# - Use Secrets -> env vars for sensitive values (tokens)
#
# Example ConfigMap:
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: volundr-config
#   data:
#     config.yaml: |
#       database:
#         host: postgres.default.svc.cluster.local
#       git:
#         github:
#           instances:
#             - name: GitHub
#               base_url: https://api.github.com
#               # Token comes from GITHUB_TOKEN env var (Secret)
#
# Example Secret -> env var:
#   env:
#     - name: GITHUB_TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: git-tokens
#           key: github-token
#     - name: GITLAB_TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: git-tokens
#           key: gitlab-token

database:
  host: localhost
  port: 5432
  user: volundr
  password: volundr
  name: volundr
  min_pool_size: 5
  max_pool_size: 20

pod_manager:
  adapter: "volundr.adapters.outbound.flux.FluxPodManager"
  kwargs:
    namespace: default
    chart_name: skuld
    chart_version: "0.1.0"
    source_ref_kind: HelmRepository
    source_ref_name: skuld
    base_domain: volundr.local
    chat_scheme: wss
    code_scheme: https
    chat_path: /session
    code_path: /

