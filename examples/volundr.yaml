# Launch specs (system-scope session blueprints offered in the launch catalog)
# A launch spec is a complete blueprint: runtime, model, resources and workspace.
# Setting this list REPLACES the built-in catalog (standard-claude and
# standard-codex); omit it to keep those defaults.
launch_specs:
  - name: standard-claude
    description: "Default Claude Code session with modest resources."
    is_default: true
    session_definition: skuldClaude
    workload_type: session
    model: "claude-sonnet-4-6"
    cli_tool: claude
    resource_config:
      cpu: "1"
      memory: "2Gi"

  # - name: data-science
