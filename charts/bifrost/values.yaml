# Default values for the Bifröst LLM gateway Helm chart.
# Override these values in your environment-specific values file.

# -- Number of replicas when autoscaling is disabled.
global:
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown

replicaCount: 2

# -- How many old ReplicaSets to retain.
revisionHistoryLimit: 10

image:
  # -- Container image registry.
  registry: "ghcr.io/niuulabs"
  # -- Container image repository.
  repository: niuu
  # -- Image tag. Defaults to Chart.appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Override container command. Defaults to the unified niuu image running the Bifröst API.
command:
  - python
  - -m
  - bifrost

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the gateway pods.
  create: true
  # -- ServiceAccount name. Auto-generated when blank.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

# -- Annotations added to every pod.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8088"

# -- Additional pod labels.
podLabels: {}

# -- Pod-level security context (merged with the hardened defaults in the template).
podSecurityContext: {}

# -- Container-level security context (merged with the hardened defaults in the template).
securityContext: {}

# -- Optional priority class name.
priorityClassName: ""

# -- Seconds the pod has to shut down gracefully.
terminationGracePeriodSeconds: 30

service:
  # -- Service type.
  type: ClusterIP
  # -- Port exposed by the Service.
  port: 80
  # -- Port the container listens on.
  targetPort: 8088
# -- Additional service annotations.
  annotations: {}

# Envoy sidecar proxy (JWT validation, header extraction)
envoy:
  # -- Enable Envoy sidecar proxy
  enabled: false
  image:
    # -- Envoy image repository
    repository: envoyproxy/envoy
    # -- Envoy image tag
    tag: "v1.32-latest"
    # -- Envoy image pull policy
    pullPolicy: IfNotPresent
  # -- Envoy listener port (becomes the service target when enabled)
  port: 8443
  # -- Envoy admin interface port (localhost only)
  adminPort: 9901
  # -- Upstream connect timeout
  connectTimeout: "0.25s"
  # -- Upstream request timeout
  upstreamTimeout: "300s"
  # -- Resource limits for the Envoy sidecar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # -- Header names Envoy sets on upstream requests
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  # JWT authentication (via Keycloak)
  jwt:
    # -- Enable JWT authentication filter
    enabled: false
    # -- JWT issuer URL (Keycloak realm)
    issuer: ""
    # -- Allowed JWT audiences
    audiences: []
    # -- JWKS URI for key retrieval
    jwksUri: ""
    # -- JWKS fetch timeout
    jwksTimeout: "5s"
    # -- JWKS cache duration in seconds
    jwksCacheDurationSeconds: 300
    # -- JWT claim containing tenant ID
    tenantClaim: "tenant_id"
    # -- JWT claim containing roles
    rolesClaim: "resource_access.volundr-api.roles"
    # -- Keycloak upstream host (for JWKS fetching)
    keycloakHost: ""
    # -- Keycloak upstream port
    keycloakPort: 8080
    # -- Enable TLS for Keycloak upstream
    keycloakTls: false
    # -- Additional JWT claim-to-header mappings
    extraClaimHeaders: []
    # -- Path prefixes that bypass JWT validation
    bypassPrefixes:
      - /health
      - /healthz
      - /readyz
      - /metrics
    # -- Additional JWT provider for short-lived Niuu workload tokens.
    # When enabled, Envoy accepts either Keycloak user tokens or workload tokens.
    workload:
      enabled: false
      issuer: ""
      audiences: []
      jwksUri: ""
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.volundr-api.roles"
      extraClaimHeaders: []
      jwksHost: ""
      jwksPort: 443
      jwksTls: true
  # -- Extra HTTP filters (inserted before the router filter)
  extraHttpFilters: []
  # -- Extra upstream clusters
  extraClusters: []

# Prometheus metrics scraping configuration.
metrics:
  # -- Expose a dedicated metrics port in the Service (same port as HTTP).
  enabled: true
  # -- Port number used when creating the metrics service port entry.
  port: 9090

# -- Container resource requests and limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  # -- Enable HorizontalPodAutoscaler.
  enabled: true
  # -- Minimum number of replicas.
  minReplicas: 2
  # -- Maximum number of replicas.
  maxReplicas: 10
  # -- Target CPU utilisation percentage (null to disable).
  targetCPUUtilizationPercentage: 70
  # -- Target memory utilisation percentage (null to disable).
  targetMemoryUtilizationPercentage: null
  # -- Target average requests-per-second per pod (requires prometheus-adapter).
  # Set to null to disable RPS-based scaling.
  targetRPS: 100
  # -- Custom HPA metrics in addition to the built-in ones.
  customMetrics: []
  # -- HPA scale-up/down behaviour overrides.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

podDisruptionBudget:
  # -- Enable PodDisruptionBudget to maintain availability during disruptions.
  enabled: true
  # -- Minimum number of pods that must be available. Set one of minAvailable or
  # maxUnavailable.
  minAvailable: 1
  # -- Maximum number of pods that can be unavailable (alternative to minAvailable).
  maxUnavailable: null

# -- Deployment rollout strategy.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# -- Node selector for pod assignment.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- Topology spread constraints for even distribution.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: bifrost

# -- Extra environment variables injected into the gateway container.
extraEnv: []
# -- Extra envFrom sources (ConfigMaps / Secrets).
envFrom: []
# -- Extra volume mounts added to the gateway container.
extraVolumeMounts: []
# -- Extra volumes added to the pod spec.
extraVolumes: []
# -- Annotations added to the Deployment resource.
deploymentAnnotations: {}

# ---------------------------------------------------------------------------
# Provider secret references (keys populated from Kubernetes Secrets via ESO)
# ---------------------------------------------------------------------------
# Each entry maps a provider name to the Secret that holds its API key.
# The Secret itself is created either manually or via externalSecrets below.
#
# Example:
#   providers:
#     anthropic:
#       apiKeyEnv: ANTHROPIC_API_KEY
#       existingSecret: bifrost-anthropic-secret
#       secretKey: api-key
#     openai:
#       apiKeyEnv: OPENAI_API_KEY
#       existingSecret: bifrost-openai-secret
#       secretKey: api-key
providers: {}

config:
  host: 0.0.0.0
  port: 8088
  auth_mode: open
  aliases: {}
  providers: {}
  routing_strategy: failover
  guardrails: {}
  default_quota: {}
  tenant_quotas: {}
  agent_permissions: {}
  key_vault: {}
  cache:
    mode: disabled
  events:
    adapter: "null"
  usage_store:
    adapter: memory
  audit:
    adapter: "null"
  rules: []

database:
  name: bifrost
  createSecret: false
  existingSecret: ""
  userKey: username
  passwordKey: password
  username: ""
  password: "CHANGE_ME"
  extraSecretData: {}
  secretAnnotations: {}
  external:
    enabled: true
    host: postgresql.default.svc.cluster.local
    port: 5432

migrations:
  # Ignored unless the usage store or audit log is postgres-backed: a gateway
  # keeping both in process has no schema to migrate.
  enabled: true
  image:
    repository: migrate/migrate
    tag: "v4.17.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

initContainers: []

# ---------------------------------------------------------------------------
# PAT signing secret
# ---------------------------------------------------------------------------
pat:
  # -- Name of the Secret containing the HS256 PAT signing secret.
  # Required when the bifrost config sets auth_mode: pat.
  existingSecret: ""
  # -- Key within the Secret that holds the PAT secret value.
  secretKey: "pat-secret"

# ---------------------------------------------------------------------------
# Usage store DSN secret
# ---------------------------------------------------------------------------
usageStore:
  # -- Name of the Secret containing the PostgreSQL DSN for the usage store.
  existingSecret: ""
  # -- Key within the Secret that holds the DSN value.
  secretKey: "dsn"

# ---------------------------------------------------------------------------
# External Secrets Operator (ESO) — OpenBao integration
# ---------------------------------------------------------------------------
externalSecrets:
  # -- Enable ExternalSecret resources to sync secrets from OpenBao via ESO.
  enabled: false
  # -- Name of the (Cluster)SecretStore that points at OpenBao.
  secretStoreName: openbao
  # -- Kind of the secret store: SecretStore or ClusterSecretStore.
  secretStoreKind: ClusterSecretStore
  # -- List of ExternalSecret definitions to create.
  # Each entry becomes a separate ExternalSecret manifest.
  #
  # Example:
  #   secrets:
  #     - name: bifrost-anthropic-secret
  #       refreshInterval: 1h
  #       data:
  #         - secretKey: api-key
  #           remoteKey: secret/bifrost/anthropic
  #           remoteProperty: api_key
  secrets: []

# ---------------------------------------------------------------------------
# Bifröst gateway configuration
# ---------------------------------------------------------------------------
# The contents of this section are rendered verbatim into the bifrost.yaml
# ConfigMap that is mounted at /etc/bifrost/bifrost.yaml.
# See bifrost.yaml.example in the repository root for all available options.
config:
  routing_strategy: failover
  host: "0.0.0.0"
  port: 8088
  auth_mode: open
  providers: {}
  aliases: {}
  default_quota: {}
  tenant_quotas: {}
  agent_permissions: {}
  guardrails: {}
  rules: []
  usage_store:
    adapter: memory
  key_vault: {}
  events:
    adapter: "null"
  cache:
    mode: disabled
