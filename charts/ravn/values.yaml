# Ravn — agent runtime and warden API

replicaCount: 1
revisionHistoryLimit: 10

updateStrategy:
  type: Recreate

image:
  registry: ghcr.io/niuulabs
  repository: niuu
  tag: ""
  pullPolicy: IfNotPresent

command:
  - python
  - -m
  - ravn.main
args: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  # Kubernetes discovery permissions for standalone-resident discovery
  # (resident_discovery Settings section). Disabled by default.
  discovery:
    enabled: false
    # Grant cluster-wide read access (ClusterRole/ClusterRoleBinding) instead
    # of a single namespace.
    clusterWide: false
    # Namespace the Role/RoleBinding are created in; defaults to the release
    # namespace. Ignored when clusterWide is true.
    namespace: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8084
  annotations: {}

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /api/v1/ravn/metrics

config:
  host: "0.0.0.0"
  port: 8084
  logLevel: "info"
  # Ravn Settings (src/ravn/config.py schema) rendered to /etc/ravn/config.yaml
  # and loaded via RAVN_CONFIG. Canonical YAML settings are preferred;
  # documented legacy environment aliases remain supported. Example:
  #   settings:
  #     gateway:
  #       platform:
  #         base_url: "http://niuu-volundr.volundr.svc.cluster.local:80"
  #     valkyrie:
  #       telemetry:
  #         nats_url: "nats://sleipnir:4222"
  #         retry_seconds: 30
  #       command:
  #         subject_prefix: "ravn.environment"
  #       room:
  #         url: "http://skuld:8081"
  #     # Which repos each tenant's event triggers may reference — empty by
  #     # default (fail closed): see ravn.config.TriggerRepoAllowlistConfig.
  #     trigger_repo_allowlist:
  #       grants:
  #         tenant-a: ["org/repo-a"]
  #     # Whether any resident in THIS deployment actually executes stored
  #     # triggers — operator-declared, kept in sync with the volundr
  #     # chart's podManager.kwargs.resident_triggers_enabled and the skuld
  #     # chart's resident.triggers.enabled. See
  #     # ravn.config.TriggerExecutionConfig for why this cannot be
  #     # auto-detected from this process.
  #     trigger_execution:
  #       enabled: false
  settings: {}

# database.enabled / persistence.enabled are general-purpose: they existed
# before trigger/budget storage did (persistence already backs the cron job
# store and a sqlite memory backend under the same mount) and an operator
# may set either for those, unrelated to this feature. So they are NOT by
# themselves what turns POST /api/v1/ravn/triggers / GET /api/v1/ravn/budget/*
# on — triggerStore.enabled / budgetLedger.enabled (below) are the explicit,
# feature-specific opt-in; database.enabled/persistence.enabled then say
# WHERE that store lives. An already-deployed release with persistence.enabled
# or database.enabled true for its own, prior reasons gets no new behaviour
# from this feature until it ALSO sets triggerStore.enabled/budgetLedger.enabled.
database:
  enabled: false
  # Secret holding the Postgres DSN both trigger_store and budget_ledger
  # read from — they resolve to the same env var on purpose, so they share
  # one connection pool (see ravn.adapters._lazy_asyncpg_pool) instead of
  # each opening its own.
  existingSecret: ""
  secretKey: "dsn"
  dsnEnvVar: "RAVN_STORE_DSN"

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /home/niuu/.ravn

# Durable storage for POST /api/v1/ravn/triggers (ravn.config.TriggerStoreConfig).
# Opt-in (default false): with it left false, /api/v1/ravn/triggers returns
# 503 with the remedy, and /api/v1/ravn/settings reports the store
# unavailable — exactly as if this feature did not exist, regardless of
# database.enabled/persistence.enabled being set for something else. When
# true, this chart picks the Postgres adapter if database.enabled, else the
# file adapter if persistence.enabled, else the render fails (an operator
# who asks for the store must also provide it a backing store). This chart
# runs behind an HPA (see autoscaling below) — each replica keeping its own
# file would give a different, incomplete trigger set, so a horizontally
# scaled deployment with triggerStore.enabled MUST also set database.enabled.
triggerStore:
  enabled: false

# Durable storage for GET/POST /api/v1/ravn/budget/* (ravn.config.BudgetLedgerConfig).
# Same opt-in shape and Postgres/file selection as triggerStore above.
budgetLedger:
  enabled: false

envoy:
  enabled: false
  image:
    repository: envoyproxy/envoy
    tag: "v1.32-latest"
    pullPolicy: IfNotPresent
  port: 8443
  adminPort: 9901
  connectTimeout: "0.25s"
  upstreamTimeout: "60s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  jwt:
    enabled: false
    issuer: ""
    audiences: []
    jwksUri: ""
    jwksTimeout: "5s"
    jwksCacheDurationSeconds: 300
    tenantClaim: "tenant_id"
    rolesClaim: "resource_access.volundr-api.roles"
    keycloakHost: ""
    keycloakPort: 8080
    keycloakTls: false
    extraClaimHeaders: []
    bypassPrefixes:
      - /health
    workload:
      enabled: false
      issuer: ""
      audiences: []
      jwksUri: ""
      jwksHost: ""
      jwksPort: 443
      jwksTls: true
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.volundr-api.roles"
      extraClaimHeaders: []
  extraHttpFilters: []
  extraClusters: []

livenessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

global:
  imagePullSecrets: []
  image:
    registry: ""
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown
