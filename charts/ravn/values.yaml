# Ravn — agent runtime and warden API

replicaCount: 1
revisionHistoryLimit: 10

updateStrategy:
  type: Recreate

image:
  registry: ghcr.io/niuulabs
  repository: niuu
  tag: ""
  pullPolicy: IfNotPresent

command:
  - python
  - -m
  - ravn.main
args: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  # Kubernetes discovery permissions for standalone-resident discovery
  # (resident_discovery Settings section). Disabled by default.
  discovery:
    enabled: false
    # Grant cluster-wide read access (ClusterRole/ClusterRoleBinding) instead
    # of a single namespace.
    clusterWide: false
    # Namespace the Role/RoleBinding are created in; defaults to the release
    # namespace. Ignored when clusterWide is true.
    namespace: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8084
  annotations: {}

config:
  host: "0.0.0.0"
  port: 8084
  logLevel: "info"
  # Ravn Settings (src/ravn/config.py schema) rendered to /etc/ravn/config.yaml
  # and loaded via RAVN_CONFIG. Standard RAVN_* env vars still override
  # individual fields. Example:
  #   settings:
  #     gateway:
  #       platform:
  #         base_url: "http://niuu-volundr.volundr.svc.cluster.local:80"
  settings: {}

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /home/niuu/.ravn

envoy:
  enabled: false
  image:
    repository: envoyproxy/envoy
    tag: "v1.32-latest"
    pullPolicy: IfNotPresent
  port: 8443
  adminPort: 9901
  connectTimeout: "0.25s"
  upstreamTimeout: "60s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  jwt:
    enabled: false
    issuer: ""
    audiences: []
    jwksUri: ""
    jwksTimeout: "5s"
    jwksCacheDurationSeconds: 300
    tenantClaim: "tenant_id"
    rolesClaim: "resource_access.volundr-api.roles"
    keycloakHost: ""
    keycloakPort: 8080
    keycloakTls: false
    extraClaimHeaders: []
    bypassPrefixes:
      - /health
    workload:
      enabled: false
      issuer: ""
      audiences: []
      jwksUri: ""
      jwksHost: ""
      jwksPort: 443
      jwksTls: true
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.volundr-api.roles"
      extraClaimHeaders: []
  extraHttpFilters: []
  extraClusters: []

livenessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

global:
  imagePullSecrets: []
  image:
    registry: ""
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown
