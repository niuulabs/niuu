apiVersion: v1
kind: Service
metadata:
  name: {{ include "ravn.fullname" . }}
  labels:
    {{- include "ravn.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 80 }}
      targetPort: {{ if .Values.envoy.enabled }}envoy{{ else }}http{{ end }}
      protocol: TCP
  selector:
    {{- include "ravn.selectorLabels" . | nindent 4 }}
