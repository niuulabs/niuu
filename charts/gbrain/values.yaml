# Observatory discovery identity; supplied by the deployment target in Niuu.
niuu:
  cluster: unknown
  instanceId: ""
  tenantId: ""
# Published by the Niuu container release pipeline.
image:
  repository: ghcr.io/niuulabs/gbrain
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
persistence:
  existingClaim: ""
  storageClass: ""
  size: 5Gi
service:
  port: 3131
# Secret containing GBRAIN_ADMIN_BOOTSTRAP_TOKEN (32+ URL-safe characters).
# May also contain model provider keys and GBRAIN_DATABASE_URL for PostgreSQL.
existingSecret: ""
# pglite uses the PVC; postgres uses the managed database or existingSecret.
engine: pglite
embedding:
  enabled: false
  model: ""
  dimensions: 1024
# Additional native gbrain config, excluding credentials and storage settings.
config: {}
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
dream:
  enabled: false
  schedule: "0 2 * * *"
  # PostgreSQL only: a separate job must not open the live PGLite store.
  phases: [lint, backlinks, orphans]
  activeDeadlineSeconds: 1800

# -- Pod-level security context of the server and the dream job. Set a field to null to drop it (for example runAsUser: null where an
# admission policy rejects an explicit UID).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
# -- Container-level security context of the server and the dream job.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

replicaCount: 1

# Provision a database per release through the installed CloudNativePG operator.
postgres:
  enabled: false
  image: ghcr.io/cloudnative-pg/postgresql:17
  # The job that creates the gbrain database, run as the postgres image's user (26).
  databaseInit:
    # -- Pod-level security context. Set a field to null to drop it.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 26
      runAsGroup: 26
    # -- Container-level security context.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
  instances: 2
  storageClass: ""
  size: 5Gi

# Publish a scoped native MCP credential for the tenant-owned deployment.
connection:
  enabled: false
