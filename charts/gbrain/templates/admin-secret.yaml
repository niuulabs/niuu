{{- if not .Values.existingSecret }}
{{- $name := printf "%s-admin" (include "gbrain.name" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  {{- if $existing }}
  GBRAIN_ADMIN_BOOTSTRAP_TOKEN: {{ index $existing.data "GBRAIN_ADMIN_BOOTSTRAP_TOKEN" | quote }}
  {{- else }}
  GBRAIN_ADMIN_BOOTSTRAP_TOKEN: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
