apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observatory.fullname" . }}
  labels:
    {{- include "observatory.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | default "info" | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | default "json" | quote }}
  HOST: {{ .Values.config.host | default "0.0.0.0" | quote }}
  PORT: {{ .Values.service.targetPort | default 8083 | quote }}
  {{- with .Values.config.extra }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

  config.yaml: |
    logging:
      level: {{ .Values.config.logLevel | default "info" | quote }}
      format: {{ .Values.config.logFormat | default "json" | quote }}

    cors:
      allowed_origins:
        {{- range .Values.config.cors.allowedOrigins }}
        - {{ . | quote }}
        {{- end }}
      allow_credentials: {{ .Values.config.cors.allowCredentials | default true }}
      allow_methods:
        - "*"
      allow_headers:
        - "*"

    database:
      min_pool_size: {{ .Values.database.minPoolSize | default 5 }}
      max_pool_size: {{ .Values.database.maxPoolSize | default 20 }}

    observatory:
      directory:
        instance_id: {{ .Values.directory.instanceId | default (printf "%s-observatory" .Release.Name) | quote }}
        cluster_id: {{ .Values.global.niuu.cluster | default "unknown" | quote }}
        card_timeout_seconds: {{ .Values.directory.cardTimeoutSeconds | default 4.0 }}
        card_cache_ttl_seconds: {{ .Values.directory.cardCacheTtlSeconds | default 300.0 }}
        local_max_concurrency: {{ .Values.directory.localMaxConcurrency | default 8 }}
        guild_timeout_seconds: {{ .Values.directory.guildTimeoutSeconds | default 5.0 }}
        guild_max_concurrency: {{ .Values.directory.guildMaxConcurrency | default 8 }}
        signature_algorithms: {{ .Values.directory.signatureAlgorithms | toJson }}
        authenticated_card_origins: {{ .Values.directory.authenticatedCardOrigins | toJson }}
      guild:
        url: {{ .Values.guild.url | default (printf "http://%s-guild" .Release.Name) | quote }}
      discovery:
        {{- if .Values.discovery.adapters }}
        {{- range .Values.discovery.adapters }}
        - adapter: {{ .adapter | quote }}
          kwargs: {{ .kwargs | default dict | toJson }}
          {{- if .secretKwargs }}
          secret_kwargs_env:
            {{- range .secretKwargs }}
            {{ .kwarg }}: OBSERVATORY_DISCOVERY_SK_{{ .kwarg | upper }}
            {{- end }}
          {{- else }}
          secret_kwargs_env: {}
          {{- end }}
        {{- end }}
        {{- else }}
        []
        {{- end }}
