{{- if .Values.envoy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observatory.fullname" . }}-envoy
  labels:
    {{- include "observatory.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoy.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    stream_idle_timeout: 0s
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format: "[ENVOY] %REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE% %UPSTREAM_HOST% %RESPONSE_FLAGS%\n"
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            {{- range .Values.envoy.ssePathPrefixes | default list }}
                            - match:
                                prefix: {{ . | quote }}
                              route:
                                cluster: local_service
                                timeout: 0s
                                idle_timeout: 0s
                            {{- end }}
                            - match:
                                prefix: "/"
                              route:
                                cluster: local_service
                                timeout: {{ .Values.envoy.upstreamTimeout }}
                    http_filters:
                      {{- if .Values.envoy.jwt.enabled }}
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              issuer: {{ .Values.envoy.jwt.issuer | quote }}
                              {{- if .Values.envoy.jwt.audiences }}
                              audiences:
                                {{- range .Values.envoy.jwt.audiences }}
                                - {{ . | quote }}
                                {{- end }}
                              {{- end }}
                              from_headers:
                                - name: Authorization
                                  value_prefix: "Bearer "
                              from_params:
                                - token
                              remote_jwks:
                                http_uri:
                                  uri: {{ .Values.envoy.jwt.jwksUri | quote }}
                                  cluster: keycloak
                                  timeout: {{ .Values.envoy.jwt.jwksTimeout }}
                                cache_duration:
                                  seconds: {{ .Values.envoy.jwt.jwksCacheDurationSeconds }}
                              forward: true
                              payload_in_metadata: jwt_payload
                              claim_to_headers:
                                - header_name: {{ .Values.envoy.headerNames.userId }}
                                  claim_name: sub
                                - header_name: {{ .Values.envoy.headerNames.email }}
                                  claim_name: email
                                - header_name: {{ .Values.envoy.headerNames.tenant }}
                                  claim_name: {{ .Values.envoy.jwt.tenantClaim }}
                                - header_name: {{ .Values.envoy.headerNames.roles }}
                                  claim_name: {{ .Values.envoy.jwt.rolesClaim }}
                                {{- range .Values.envoy.jwt.extraClaimHeaders }}
                                - header_name: {{ .headerName | quote }}
                                  claim_name: {{ .claimName | quote }}
                                {{- end }}
                            {{- if .Values.envoy.jwt.workload.enabled }}
                            workload:
                              issuer: {{ .Values.envoy.jwt.workload.issuer | quote }}
                              {{- if .Values.envoy.jwt.workload.audiences }}
                              audiences:
                                {{- range .Values.envoy.jwt.workload.audiences }}
                                - {{ . | quote }}
                                {{- end }}
                              {{- end }}
                              from_headers:
                                - name: Authorization
                                  value_prefix: "Bearer "
                              remote_jwks:
                                http_uri:
                                  uri: {{ .Values.envoy.jwt.workload.jwksUri | quote }}
                                  cluster: workload_jwks
                                  timeout: {{ .Values.envoy.jwt.workload.jwksTimeout | default "5s" }}
                                cache_duration:
                                  seconds: {{ .Values.envoy.jwt.workload.jwksCacheDurationSeconds | default 300 }}
                              forward: true
                              payload_in_metadata: jwt_payload
                              claim_to_headers:
                                - header_name: {{ .Values.envoy.headerNames.userId }}
                                  claim_name: sub
                                - header_name: {{ .Values.envoy.headerNames.email }}
                                  claim_name: email
                                - header_name: {{ .Values.envoy.headerNames.tenant }}
                                  claim_name: {{ .Values.envoy.jwt.workload.tenantClaim | default "tenant_id" }}
                                - header_name: {{ .Values.envoy.headerNames.roles }}
                                  claim_name: {{ .Values.envoy.jwt.workload.rolesClaim | default "resource_access.volundr-api.roles" }}
                                {{- range .Values.envoy.jwt.workload.extraClaimHeaders }}
                                - header_name: {{ .headerName | quote }}
                                  claim_name: {{ .claimName | quote }}
                                {{- end }}
                            {{- end }}
                          rules:
                            - match:
                                prefix: "/"
                                headers:
                                  - name: ":method"
                                    exact_match: "OPTIONS"
                            {{- range .Values.envoy.jwt.bypassPrefixes }}
                            - match:
                                prefix: {{ . | quote }}
                            {{- end }}
                            - match:
                                prefix: "/"
                              requires:
                                {{- if .Values.envoy.jwt.workload.enabled }}
                                requires_any:
                                  requirements:
                                    - provider_name: keycloak
                                    - provider_name: workload
                                {{- else }}
                                provider_name: keycloak
                                {{- end }}
                      {{- end }}
                      {{- with .Values.envoy.extraHttpFilters }}
                      {{- toYaml . | nindent 22 }}
                      {{- end }}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: local_service
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: local_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ .Values.service.targetPort | default 8083 }}
        {{- if .Values.envoy.jwt.enabled }}
        - name: keycloak
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: keycloak
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.jwt.keycloakHost | quote }}
                          port_value: {{ .Values.envoy.jwt.keycloakPort }}
          {{- if .Values.envoy.jwt.keycloakTls }}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ .Values.envoy.jwt.keycloakHost | quote }}
          {{- end }}
        {{- if .Values.envoy.jwt.workload.enabled }}
        - name: workload_jwks
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: workload_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.jwt.workload.jwksHost | quote }}
                          port_value: {{ .Values.envoy.jwt.workload.jwksPort | default 443 }}
          {{- if .Values.envoy.jwt.workload.jwksTls }}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ .Values.envoy.jwt.workload.jwksHost | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.envoy.extraClusters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{ .Values.envoy.adminPort }}
{{- end }}
