# Example values for a resident product steward — a long-lived, named ravn
# with a chat surface, in the same shape as values-k8s-valkyrie.yaml.
#
# Two deployment shapes exist for residents:
#
# 1. PLATFORM-MANAGED (recommended): create a Forge session with
#    `workload_type: "resident"` — Volundr's ResidentContributor provisions
#    the pod (Skuld room-mode broker + this daemon), wires ownership, and
#    the resident appears in the Ravn web UI with a Chat tab. No Helm
#    release needed.
#
#      POST /api/v1/forge/sessions
#      {
#        "name": "muninn",
#        "workload_type": "resident",
#        "workload_config": {
#          "persona": "product-steward",
#          "resident_name": "Muninn",
#          "mimir": {"hosted_url": "https://mimir.internal/api/v1"},
#          "platform": {"enabled": true, "base_url": "http://volundr:8080"}
#        }
#      }
#
# 2. STANDALONE (this file): run the steward daemon directly with this
#    chart — useful off-platform or in a separate cluster. It serves its
#    own HTTP gateway for chat and reaches the platform (Ting workflows,
#    sagas, tracker, Mimir) over REST using workload identity or a PAT.

agent:
  persona: product-steward
  workspaceRoot: /workspace

# The steward needs no repo checkout and no cluster privileges.
rbac:
  create: false

config:
  value: |-
    permission:
      mode: read_only
      workspace_root: /workspace
    logging:
      level: info
      format: text
    environment:
      id: steward
      type: generic
      resident_name: "Muninn"
    initiative:
      enabled: true
      default_persona: {{ .Values.agent.persona | quote }}
      queue_journal_path: /home/agent/.ravn/daemon/queue.json
    gateway:
      enabled: true
      channels:
        http:
          enabled: true
          host: 0.0.0.0
          port: 7680
      platform:
        enabled: true
        # Platform API base — Ting workflows/sagas, Forge sessions, tracker.
        base_url: "http://volundr.niuu.svc.cluster.local:8080"
        # In-cluster: exchange workload identity for a scoped token.
        workload_token_file: /var/run/secrets/niuu/token
        workload_exchange_url: "http://volundr.niuu.svc.cluster.local:8080/api/v1/tokens/workload/exchange"
        # Off-cluster alternative: set pat_token via env override
        # RAVN_GATEWAY__PLATFORM__PAT_TOKEN (never bake tokens into values).
    mimir:
      enabled: true
      instances:
        - name: hosted
          adapter: http
          url: "http://mimir.niuu.svc.cluster.local/mimir"
    wakefulness:
      enabled: false
    dream_cycle:
      enabled: false
      state_dir: /home/agent/.ravn/daemon/state

service:
  enabled: true
  type: ClusterIP
  port: 7680
  targetPort: 7680
