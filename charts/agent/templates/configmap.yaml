{{- if and .Values.config.create (not .Values.config.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.configMapName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
  {{ .Values.config.key | default "config.yaml" }}: |-
    {{- tpl .Values.config.value . | nindent 4 }}
{{- end }}
