# Niuu Agent - Ravn CLI and daemon runtime

replicaCount: 1
revisionHistoryLimit: 10

image:
  registry: ghcr.io/niuulabs
  repository: agent
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

agent:
  persona: mimir-warden
  profile: ""
  configPath: /etc/ravn/config.yaml
  workspaceRoot: /workspace

command: []
args: []

config:
  create: true
  existingConfigMap: ""
  key: config.yaml
  value: |-
    permission:
      mode: workspace_write
      workspace_root: /workspace
    logging:
      level: info
      format: text
    initiative:
      enabled: true
      default_persona: {{ .Values.agent.persona | quote }}
      queue_journal_path: /home/agent/.ravn/daemon/queue.json
    gateway:
      channels:
        http:
          enabled: false
    wakefulness:
      enabled: false
    dream_cycle:
      enabled: false
      state_dir: /home/agent/.ravn/daemon/state
    mimir:
      enabled: false
    {{- if .Values.learnedToolRunner.enabled }}
    resident_evolution:
      learned_tool_execution_backend: k8s_job
      learned_tool_k8s:
        namespace: {{ .Release.Namespace | quote }}
        image: {{ .Values.learnedToolRunner.image | quote }}
        deny_policy_name: {{ include "agent.learnedToolDenyPolicyName" . | quote }}
        allow_policy_name: {{ include "agent.learnedToolAllowPolicyName" . | quote }}
        network_policy_label_key: {{ .Values.learnedToolRunner.networkPolicyLabelKey | quote }}
        job_pod_start_timeout_seconds: {{ .Values.learnedToolRunner.podStartTimeoutSeconds }}
        job_ttl_seconds_after_finished: {{ .Values.learnedToolRunner.jobTtlSecondsAfterFinished }}
    {{- end }}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: false
  rules: []
  # Example read-only Kubernetes valkyrie rules:
  # rules:
  #   - apiGroups: [""]
  #     resources: ["pods", "pods/log", "events", "nodes", "services", "configmaps"]
  #     verbs: ["get", "list", "watch"]
  #   - apiGroups: ["apps"]
  #     resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  #     verbs: ["get", "list", "watch"]

learnedToolRunner:
  # Creates the verified NetworkPolicies/RBAC contract and selects k8s_job in
  # the chart's default Ravn config. Custom config maps must set the matching
  # resident_evolution.learned_tool_k8s coordinates themselves.
  #
  # Peer-proposal re-verification (KubernetesJobLearnedToolRunner.verify())
  # runs in the SAME kind of denied-network Job execute() uses; it never
  # installs dependencies (declared requirements are refused outright, same
  # as run()). Job resource requests/limits and the writable /tmp size come
  # from resident_evolution.learned_tool_k8s.job_* fields (sensible
  # defaults; set them in a custom config map to override for this cluster).
  enabled: false
  image: >-
    ghcr.io/niuulabs/devrunner@sha256:ec7a32ffd8ca1f3ddb8bd4983198988538ab74804201ce45e14e56241adfc518
  networkPolicyLabelKey: niuu.world/tool-network
  # Separate budget for a verify() Job's pod to leave Pending and start
  # running (scheduling, image pull) before it counts as an infrastructure
  # failure — decoupled from the verify() test timeout, which only starts
  # counting once the container is actually running, so a slow image pull
  # is never confused with the tool's own code hanging. run() has no
  # separate pod-start budget: its activeDeadlineSeconds is exactly the
  # invocation timeout, and this value is not consulted there.
  podStartTimeoutSeconds: 120
  # Kubernetes ttlSecondsAfterFinished set on every learned-tool Job, as a
  # backup sweep if the explicit post-run delete never runs (process
  # crash). 0 disables the TTL and relies solely on the explicit delete.
  jobTtlSecondsAfterFinished: 3600

service:
  enabled: false
  type: ClusterIP
  port: 80
  targetPort: 7477
  annotations: {}

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /home/agent/.ravn

workspace:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /workspace
  emptyDir: true

livenessProbe:
  enabled: false
  exec:
    command:
      - ravn
      - --help
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: false
  exec:
    command:
      - ravn
      - --help
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
deploymentLabels: {}
deploymentAnnotations: {}
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

global:
  imagePullSecrets: []
  image:
    registry: ""
    tag: ""
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown
