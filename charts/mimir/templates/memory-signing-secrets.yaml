{{- /*
A memory system's signing key, created by the chart when its signingKeySecret says
`create: true`. It seals the trust and layer of every record, so it is kept across
upgrades (read back from the cluster) and survives an uninstall.
*/ -}}
{{- if .Values.config.memory.enabled }}
{{- range $system := .Values.config.memory.systems }}
{{- if ($system.signingKeySecret).create }}
{{- $name := required (printf "config.memory.systems[%s].signingKeySecret.name is required" $system.name) $system.signingKeySecret.name }}
{{- $key := $system.signingKeySecret.key | default "key" }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mimir.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index ($existing.data | default dict) $key) }}
  {{ $key }}: {{ index $existing.data $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
