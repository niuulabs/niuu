apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mimir.fullname" . }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
data:
  # Instance metadata — used by the deployment args
  MIMIR_NAME: {{ .Values.config.name | default "local" | quote }}
  MIMIR_ROLE: {{ .Values.config.role | default "local" | quote }}
  MIMIR_DATA_PATH: {{ .Values.config.dataPath | default "/data/mimir" | quote }}
  MIMIR_PORT: {{ .Values.config.port | default 7477 | quote }}
  {{- if .Values.config.announceUrl }}
  MIMIR_ANNOUNCE_URL: {{ .Values.config.announceUrl | quote }}
  {{- end }}
  {{- if .Values.config.categories }}
  MIMIR_CATEGORIES: {{ .Values.config.categories | join "," | quote }}
  {{- end }}

  config.yaml: |
    tenant_id: {{ .Values.niuu.tenantId | default "" | quote }}
    backend:
      adapter: mimir.adapters.gbrain.GBrainMimirAdapter
      mcp_url: {{ required "config.backend.mcpUrl is required: Mímir has no default store; set it to the gbrain /mcp endpoint" .Values.config.backend.mcpUrl | quote }}
      api_token_file: {{ include "mimir.backendTokenFile" . | quote }}
      {{- with .Values.config.backend.ingestUrl }}
      ingest_url: {{ . | quote }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.config.backend.timeoutSeconds) }}
      timeout_seconds: {{ .Values.config.backend.timeoutSeconds }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.config.backend.searchLimit) }}
      search_limit: {{ .Values.config.backend.searchLimit }}
      {{- end }}
      {{- with .Values.config.backend.thinkModel }}
      think_model: {{ . | quote }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.config.backend.queryExpansion) }}
      query_expansion: {{ .Values.config.backend.queryExpansion }}
      {{- end }}
    {{- if .Values.knowledgeDeployment }}
    deployment:
      {{- toYaml .Values.knowledgeDeployment | nindent 6 }}
    {{- end }}
    {{- with .Values.config.observability }}
    observability:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.config.liveActivity }}
    live_activity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
