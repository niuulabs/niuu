{{- if and .Values.niuu.tenantId .Values.envoy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mimir.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "mimir.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.envoy.port }}
{{- end }}
