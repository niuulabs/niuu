apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mimir.fullname" . }}
  labels:
    {{- if .Values.warden.enabled }}
    niuu.world/kind: warden
    niuu.world/warden-id: {{ printf "%s-warden" .Values.config.name | quote }}
    niuu.world/mimir-mount: {{ .Values.config.name | quote }}
    {{- end }}
    {{- include "mimir.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "mimir.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/warden: {{ include (print $.Template.BasePath "/warden.yaml") . | sha256sum }}
        {{- include "mimir.checksumAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mimir.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "mimir.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "mimir.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: mimir
          image: {{ include "mimir.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- with .Values.securityContext }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "serve"
            - "--path"
            - {{ .Values.config.dataPath | default "/data/mimir" | quote }}
            - "--port"
            - {{ .Values.config.port | default 7477 | quote }}
            - "--name"
            - {{ .Values.config.name | default "local" | quote }}
            - "--role"
            - {{ .Values.config.role | default "local" | quote }}
            - {{ ternary "--eval-capture" "--no-eval-capture" .Values.config.evalCapture | quote }}
            {{- if .Values.config.announceUrl }}
            - "--announce-url"
            - {{ .Values.config.announceUrl | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 7477 }}
              protocol: TCP
          env:
            {{- if .Values.knowledgeDeployment }}
            - name: MIMIR_CONFIG
              value: /etc/mimir/config.yaml
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | default "info" | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.startupProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 60 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.knowledgeDeployment }}
            - name: deployment-config
              mountPath: /etc/mimir
              readOnly: true
            {{- end }}
            - name: data
              mountPath: {{ .Values.config.dataPath | default "/data/mimir" }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.envoy.enabled }}
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: envoy
              containerPort: {{ .Values.envoy.port }}
              protocol: TCP
          {{- with .Values.envoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
        {{- end }}
        {{- if .Values.warden.enabled }}
        - name: warden
          image: {{ required "warden.image is required" .Values.warden.image | quote }}
          command: ["python", "-m", "ravn.cli.embedded_warden"]
          args:
            - --spec
            - /etc/warden/spec.yaml
            - --name
            - {{ .Values.config.name | quote }}
            - --data-path
            - {{ .Values.config.dataPath | quote }}
          env:
            - name: HOME
              value: {{ printf "%s/.warden" .Values.config.dataPath | quote }}
          {{- with .Values.warden.envFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml .Values.warden.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: {{ .Values.config.dataPath | quote }}}
            - {name: warden-config, mountPath: /etc/warden, readOnly: true}
        {{- end }}
      volumes:
        {{- if .Values.warden.enabled }}
        - name: warden-config
          configMap:
            name: {{ include "mimir.fullname" . }}-warden
        {{- end }}
        {{- if .Values.knowledgeDeployment }}
        - name: deployment-config
          configMap:
            name: {{ include "mimir.fullname" . }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mimir.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.envoy.enabled }}
        - name: envoy-config
          configMap:
            name: {{ include "mimir.fullname" . }}-envoy
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
