# Default values for the Mímir standalone knowledge service Helm chart.
# Override these values in your environment-specific values file.

# -- Number of replicas. Mímir uses a PVC for storage so this should stay at 1
# unless you use a ReadWriteMany storage class.
global:
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown

# Optional per-instance discovery identity, supplied by the deployment target.
niuu:
  cluster: ""
  instanceId: ""
  # Owning tenant for named instances; empty denotes an operator-shared service.
  tenantId: ""

replicaCount: 1

# -- How many old ReplicaSets to retain.
revisionHistoryLimit: 10

image:
  # -- Container image registry.
  registry: "ghcr.io/niuulabs"
  # -- Container image repository.
  repository: niuu
  # -- Image tag. Defaults to Chart.appVersion.
  tag: ""
  # -- Immutable image digest; takes precedence over local and global tags.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Override container command. Defaults to the unified niuu image running the Mímir service.
command:
  - python
  - -m
  - mimir

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the Mímir pods.
  create: true
  # -- ServiceAccount name. Auto-generated when blank.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

# -- Annotations added to every pod.
podAnnotations: {}

# -- Additional pod labels.
podLabels: {}

# -- Pod-level security context. Set a field to null to drop it (for example runAsUser: null where an
# admission policy rejects an explicit UID).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# -- Container-level security context. Set a field to null to drop it (for example runAsUser: null where an
# admission policy rejects an explicit UID).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Optional priority class name.
priorityClassName: ""

# -- Seconds the pod has to shut down gracefully.
terminationGracePeriodSeconds: 30

service:
  # -- Service type.
  type: ClusterIP
  # -- Port exposed by the Service.
  port: 80
  # -- Port the container listens on.
  targetPort: 7477
  # -- Additional service annotations.
  annotations: {}

envoy:
  # -- Envoy sidecar container securityContext. Set a field to null to drop it (for example runAsUser: null where an
  # admission policy rejects an explicit UID).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL
  enabled: false
  image:
    repository: envoyproxy/envoy
    tag: "v1.32-latest"
    pullPolicy: IfNotPresent
  port: 8443
  adminPort: 9901
  connectTimeout: "0.25s"
  upstreamTimeout: "60s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  jwt:
    enabled: false
    issuer: ""
    audiences: []
    jwksUri: ""
    jwksTimeout: "5s"
    jwksCacheDurationSeconds: 300
    tenantClaim: "tenant_id"
    rolesClaim: "resource_access.volundr-api.roles"
    keycloakHost: ""
    keycloakPort: 8080
    keycloakTls: false
    extraClaimHeaders: []
    bypassPrefixes:
      - /health
      - /mimir/health
      - /api/v1/mimir/health
      - /mimir/stats
    workload:
      enabled: false
      issuer: ""
      audiences: []
      jwksUri: ""
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.mimir.roles"
      jwksHost: ""
      jwksPort: 443
      jwksTls: true
      extraClaimHeaders: []
  extraHttpFilters: []
  extraClusters: []

# -- Container resource requests and limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Startup probe. Liveness and readiness probes remain disabled until this
# succeeds.
startupProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 60

autoscaling:
  # -- Enable HorizontalPodAutoscaler.
  # Disable when using a single-writer PVC (ReadWriteOnce).
  enabled: false
  # -- Minimum number of replicas.
  minReplicas: 1
  # -- Maximum number of replicas.
  maxReplicas: 3
  # -- Target CPU utilisation percentage (null to disable).
  targetCPUUtilizationPercentage: 70
  # -- Target memory utilisation percentage (null to disable).
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  # -- Enable PodDisruptionBudget.
  enabled: true
  # -- Minimum number of pods that must be available.
  minAvailable: 0
  # -- Maximum pods that can be unavailable (alternative to minAvailable).
  maxUnavailable: null

# -- Node selector for pod assignment.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []

# -- Extra environment variables injected into the container.
extraEnv: []
# -- Extra envFrom sources (ConfigMaps / Secrets).
envFrom: []
# -- Extra volume mounts added to the container.
extraVolumeMounts: []
# -- Extra volumes added to the pod spec.
extraVolumes: []
# -- Annotations added to the Deployment resource.
deploymentAnnotations: {}

# ---------------------------------------------------------------------------
# Persistent storage for the service's own state (mount registry, eval captures).
# Knowledge lives in the gbrain backend, not here.
# ---------------------------------------------------------------------------
persistence:
  # -- Enable a PersistentVolumeClaim for the service state directory.
  enabled: true
  # -- Use an existing PVC instead of creating one.
  existingClaim: ""
  # -- Storage class name. Leave empty to use the cluster default.
  storageClass: ""
  # -- Access mode. Use ReadWriteMany if running multiple replicas.
  accessMode: ReadWriteOnce
  # -- Storage size.
  size: 5Gi
  # -- Additional annotations for the PVC.
  annotations: {}

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  # -- Enable an Ingress resource.
  enabled: false
  # -- Ingress class name (e.g. "nginx", "traefik").
  className: ""
  # -- Hostname for the Ingress rule.
  host: ""
  # -- Enable TLS. Set to `true` for auto-generated secret name (<fullname>-tls),
  # or use an object `{ enabled: true, secretName: "existing-secret" }` to reuse
  # an existing TLS secret.
  tls: false
  # -- Additional annotations for the Ingress resource.
  annotations: {}

# ---------------------------------------------------------------------------
# Mímir service configuration
# ---------------------------------------------------------------------------
config:
  # -- Instance name (shown in the mount registry).
  name: "local"
  # -- Instance role: shared, local, or domain.
  role: "local"
  # -- Public URL this instance is reachable at. Empty = registered as a local mount.
  announceUrl: ""
  # -- Category filter for domain-scoped Mímirs. Empty = all categories.
  categories: []
  # -- Path inside the container for the service's own state: the mount registry and
  # eval captures. It holds no knowledge.
  dataPath: "/data/mimir"
  # -- The store this Mímir serves. Required: there is no default store, and the chart
  # refuses to render without mcpUrl and apiTokenSecret.name.
  backend:
    # -- MCP endpoint of the gbrain instance, such as http://gbrain:3131/mcp.
    mcpUrl: ""
    # -- Secret holding the gbrain bearer token (`gbrain auth create <name>`). It is
    # mounted read-only and the service reads the token from the file.
    apiTokenSecret:
      name: ""
      key: token
    # -- gbrain /ingest endpoint for bulk markdown writes. Empty = not used.
    ingestUrl: ""
    # -- Seconds before a call to gbrain times out. Null = the adapter's own default.
    timeoutSeconds: null
    # -- Results requested per search. Null = the adapter's own default.
    searchLimit: null
    # -- Model gbrain synthesises answers with, as <provider>:<model>. Empty = unset.
    thinkModel: ""
    # -- Whether gbrain may rewrite each query into variants before retrieving.
    # Null = the adapter's own default.
    queryExpansion: null
  # Record real search traffic for service diagnostics.
  evalCapture: true
  # -- HTTP port the service listens on.
  port: 7477
  # -- Log level.
  logLevel: "info"
  # -- OpenTelemetry trace/metric export. Empty (the default) means
  # unconfigured — observability.enabled defaults to false, a decision, not
  # a fallback. Fields match niuu.domain.observability.ObservabilityConfig.
  observability: {}
  # -- In-memory live read/write activity window for the 3D memory UI
  # (GET /mimir/activity/live). Empty means the code defaults apply
  # (buffer_size: 2000, window_seconds: 900). Fields match
  # mimir.config.LiveActivityConfig.
  liveActivity: {}
  # The memory gateway (docs/design/memory): the `memory` tools Forge sessions call
  # (GET/POST /memory/tools), over the org, project and session layers held in one
  # gbrain per org. Off by default. The service checks every part at startup.
  memory:
    # -- Serve the memory tools.
    enabled: false
    # -- Forge's base URL, e.g. http://volundr:8080. The gateway asks Forge who each
    # session is on every call. Required when enabled.
    forgeBaseUrl: ""
    # -- Seconds before a call to Forge times out. Null = the service default (10).
    forgeTimeoutSeconds: null
    # -- Changes the change feed is asked for per call (a page size, not a cap: the feed is
    # read until it has no more). Null = the service default (10).
    defaultResultCount: null
    # -- One gbrain per org. Each entry:
    #   name: acme-brain                 # referenced by `tenants`
    #   mcpUrl: http://acme-brain:3131/mcp
    #   adminTokenSecret: {name: acme-brain-admin, key: token}      # gbrain's GBRAIN_ADMIN_BOOTSTRAP_TOKEN:
    #                                       # creates each layer's gbrain source and client
    #   signingKeySecret: {name: acme-memory-seal, key: key}        # seals trust and layer
    #   timeoutSeconds / pageSize / recallLimit / timelineLimit: optional, null = default
    systems: []
    # -- Tenant id -> the `name` of the system holding that org's layers.
    tenants: {}
    # -- How the gateway authenticates as a service (Forge's memory/ended for retention):
    # a niuu.ports.http_auth.HttpAuthPort dynamic adapter,
    # rendered as given. Required when enabled. Examples:
    #   {adapter: niuu.adapters.outbound.http_auth.FileBearerTokenAuthAdapter,
    #    token_file: /var/run/secrets/memory/token}
    #   {adapter: niuu.adapters.outbound.http_auth.NoAuthHeaderAdapter}   # no auth at all
    serviceAuth: {}
    # -- Days a run or session layer outlives its run or session. Null = default (14).
    retentionDays: null
    # -- Seconds between retention sweeps. Null = the service default (3600).
    retentionSweepSeconds: null
    # -- How stale the knowledge graph (GET /memory/graph) may be, in seconds: a graph is
    # served again for this long before it is rebuilt. 0 rebuilds on every request.
    # Null = the service default (30).
    graphCacheSeconds: null
    # -- Memory-system reads in flight at once while one knowledge graph is built.
    # Null = the service default (8).
    graphConcurrency: null
    # -- Roles that make a person an org admin (decides org proposals).
    # Empty = the service default ([volundr:admin]).
    orgAdminRoles: []
    # -- Workload subjects (the `act.sub` of a verified workload-identity token) that may
    # write connector sources through POST /memory/sources, e.g. [ting]. Empty = no caller
    # is a connector, and the route answers 403 naming this setting.
    connectorServiceSubjects: []

# Optional dynamic Flux deployment adapter configuration. Disabled by default.
# Supply namespace, source_name, chart_versions, images and cluster in this map.
knowledgeDeployment: null
