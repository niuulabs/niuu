# values-shared.yaml — ODIN-wide shared Mímir instance.
#
# Install:
#   helm install mimir-shared charts/mimir -f charts/mimir/values-shared.yaml -n valhalla \
#     --set config.backend.mcpUrl=<gbrain /mcp url> \
#     --set config.backend.apiTokenSecret.name=<secret holding the gbrain token>
#
# Mímir has no default store: the chart refuses to render without both values.

config:
  name: "shared"
  role: "shared"
  categories: []
  announceUrl: ""
  port: 7477
  logLevel: "info"

persistence:
  size: 50Gi

ingress:
  enabled: true
  className: nginx
  host: "mimir-shared.odin.niuu.world"
  tls: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
