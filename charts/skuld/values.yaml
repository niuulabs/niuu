# Skuld Helm Chart Values
# Claude Code CLI session pod with WebSocket broker and terminal/local-service support

# Global values (can be set by parent chart)
global:
  # -- Global image pull secrets (list of secret names)
  imagePullSecrets: []
  # - ghcr-pull-secret
  image:
    # -- Global image repository override
    repository: ""
    # -- Global image tag override
    tag: ""

# Session configuration (set by Volundr at deployment time)
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown
session:
  # -- Session identifier (UUID, set by Volundr)
  id: ""
  # -- Human-readable session name
  name: ""
  # -- User ID (IDP sub) that owns this session. When set, the broker enforces
  # WebSocket ownership (see skuld ws_auth). Rendered into the broker config.
  ownerId: ""
  # -- Tenant the session belongs to. Rendered into the broker config.
  tenantId: ""
  # -- AI model to use for the session
  model: "claude-sonnet-4-6"
  # -- Reasoning effort passed to transports that support it
  reasoningEffort: ""
  # -- Ad-hoc instructions from the launch request. With a persona they are appended after
  # the persona's own instructions, never in place of them.
  systemPrompt: ""
  # -- The pinned portable persona document this session plays (schema_version, id, revision,
  # definition), as Forge resolved it at launch. Skuld projects it onto the harness on every
  # start and refuses to start when the harness cannot enforce its limits. Empty: no persona.
  persona: {}
  # -- Initial user message sent when the CLI starts
  initialPrompt: ""

# -- MCP server configurations supplied by session contributors. Use credential references, not tokens.
mcpServers: []

# Container image for the Skuld broker
# Note: repository and tag are updated by CI/CD pipeline
# Default values are for local development
image:
  # -- Skuld broker image repository
  repository: ghcr.io/niuulabs/skuld
  # -- Skuld broker image tag
  tag: "latest"
  # -- Image pull policy
  pullPolicy: Always

# Resource limits for the Skuld broker container
resources:
  requests:
    # -- Broker CPU request
    memory: "256Mi"
    # -- Broker memory request
    cpu: "100m"
  limits:
    # -- Broker memory limit (includes Claude CLI child process)
    memory: "4Gi"
    # -- Broker CPU limit
    cpu: "1"

# Nginx entry point (routes all traffic internally)
# All external traffic enters via nginx on port 8080 and is routed
# to the broker, terminal, and local services based on URL path.
nginx:
  image:
    # -- Nginx image repository
    repository: nginx
    # -- Nginx image tag
    tag: "alpine"
    # -- Nginx image pull policy
    pullPolicy: IfNotPresent
  resources:
    requests:
      # -- Nginx memory request
      memory: "32Mi"
      # -- Nginx CPU request
      cpu: "10m"
    limits:
      # -- Nginx memory limit
      memory: "128Mi"
      # -- Nginx CPU limit
      cpu: "100m"

# Local service testing (devrunner sidecar)
localServices:
  # -- Enable local service management
  enabled: true
  # -- Port range for dynamic services
  portRange:
    # -- Start of dynamic port range
    start: 9001
    # -- End of dynamic port range
    end: 9020
  # -- Terminal (shell over WebSocket)
  terminal:
    # -- Terminal WebSocket port
    port: 7681
    # -- Run the terminal in restricted-shell mode
    restricted: false
    # -- Override allowed commands in restricted mode (comma-separated, empty = use defaults)
    allowedCommands: ""
    # -- Enable debug UI at /debug/ (xterm.js test page)
    debug: false
  # -- Devrunner container configuration
  devrunner:
    image:
      # -- Devrunner image repository
      repository: ghcr.io/niuulabs/devrunner
      # -- Devrunner image tag
      tag: "latest"
      # -- Devrunner image pull policy
      pullPolicy: Always
    resources:
      requests:
        # -- Devrunner memory request
        memory: "512Mi"
        # -- Devrunner CPU request
        cpu: "100m"
      limits:
        # -- Devrunner memory limit
        memory: "4Gi"
        # -- Devrunner CPU limit
        cpu: "2000m"

# Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Single entry point port (nginx)
  port: 8080

# Ingress configuration
ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress routing mode: "host" (hostname-based, default) or "path" (path-prefix, for IP-only access)
  mode: host
  # -- Ingress class name
  className: traefik
  # -- Ingress annotations (controller-specific)
  # Traefik handles WebSocket and streaming automatically.
  # For NGINX, add proxy-read-timeout, proxy-send-timeout, etc.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
  # -- Hostname for the session ingress (set by Volundr, e.g., session-uuid.niuu.world)
  host: ""
  # Path routing configuration (used by nginx internally)
  paths:
    # -- WebSocket path for Skuld broker
    session: /session
    # -- IDE path (catch-all)
    ide: /
  tls:
    # -- Enable TLS
    enabled: true
    # -- TLS secret name (auto-generated from release name if empty)
    secretName: ""

# Shared storage for session workspace data
persistence:
  # -- Enable workspace persistence
  enabled: true
  # -- Use a pod-local emptyDir for the sessions volume instead of the shared
  # existingClaim PVC. Self-contained sessions don't need the shared sessions
  # PVC but still get a writable workspace.
  emptyDir: false
  # -- Name of an existing PVC to use
  existingClaim: "volundr-sessions"
  # -- Mount path for the sessions PVC
  mountPath: "/volundr/sessions"

# Persistent home directory (shared across all sessions for a user)
# Stores CLI config dirs (.claude/, .codex/, etc.) and shell config.
# Credential files are mounted from a K8s Secret and symlinked into
# $HOME/<destDir>/ so they auto-update when the secret changes (~60s).
homeVolume:
  # -- Store /tmp per session/container and shared caches in the user home PVC.
  # Enable only with a suitably sized home claim (64 GiB recommended).
  persistentTmp: false
  # -- Enable persistent home volume
  enabled: false
  # -- Name of an existing PVC to use for the home directory
  existingClaim: ""
  # -- Mount path for the home PVC
  mountPath: "/volundr/home"
  credentialFiles:
    # -- Pre-existing K8s secret containing CLI credential files
    secretName: ""
    # -- Subdirectory under mountPath where credential symlinks are placed
    # e.g. ".claude" for Claude Code, ".codex" for OpenAI Codex
    destDir: ".claude"
    # -- Internal mount path for the credentials secret volume
    secretMountPath: "/volundr/secrets/credential-files"

# Git repository to clone (optional, cloned on session start)
# Each session clones into its own workspace: /volundr/sessions/{session-id}/workspace
# Multiple sessions with different repos coexist on the same PVC
git:
  # -- Git repository URL to clone (empty = no clone)
  repoUrl: ""
  # -- Branch to checkout (empty = default branch)
  branch: ""
  # -- Base branch to create feature branch from if it doesn't exist on the remote
  baseBranch: ""
  # -- Default commit identity, used only when Git has no identity configured
  userName: ""
  userEmail: ""
  # Credentials for private repos (HTTPS token auth)
  credentials:
    # -- Session-injected integration token file; takes precedence over secretName
    tokenFile: ""
    # -- Name of a Kubernetes secret containing a git token
    secretName: ""
    # -- Key within the secret that holds the token
    tokenKey: "token"
    # -- Username for HTTPS auth (default works with GitHub PATs and deploy tokens)
    username: "x-access-token"
  image:
    # -- Git init container image repository
    repository: alpine/git
    # -- Git init container image tag
    tag: "latest"
    # -- Git init container image pull policy
    pullPolicy: IfNotPresent

# Broker configuration (Skuld application settings)
# -- Workflow step hosting. Forge sets these for a session a workflow run launched: a member
# (the create request's workflow_step_host) or the run's root (the run's room). A member takes the
# run's offers from the mesh and offers the workflow_step_close tool; the root publishes them.
# An ordinary session leaves everything off and empty. Skuld refuses to start a member or root
# that lacks a field it needs (a member: runId, member, personaAlias, orchestratorPeerId; the
# root: runId).
workflowSteps:
  # -- This session is a member of a workflow run
  enabled: false
  # -- This session is the root of a workflow run (exclusive with enabled)
  root: false
  # -- The workflow run the session belongs to
  runId: ""
  # -- The member's name in the workflow stage
  member: ""
  # -- The alias the workflow gives the member's pinned persona
  personaAlias: ""
  # -- The mesh peer id of the run's root; a member takes offers published by this peer only
  orchestratorPeerId: ""
  # -- The member's eventFilters from the workflow; empty takes every offer of its topics
  eventFilters: {}
  # -- Every topic the workflow routes to the member (its stages' consumesEventTypes); it
  # subscribes to them on top of its persona's own topics
  topics: []
  # -- Who decides the run's next step: engine or session. Empty keeps Skuld's default (engine)
  orchestration: ""

broker:
  conversationRecentMaxTurns: 15
  conversationRecentMaxBytes: 262144
  conversationSnapshotMaxBytes: 921600
  liveFrameMaxBytes: 921600
  codexReceiveMaxBytes: 16777216
  # -- Append every frame to the Forge session's durable event log
  # (/api/v1/forge/sessions/<id>/log). Off for a runtime with no Forge session.
  eventLogEnabled: true
  # -- Report activity state to the Forge session
  # (/api/v1/forge/sessions/<id>/activity). Off for a runtime with no Forge session.
  activityReportingEnabled: true
  historyHydrationEnabled: true
  historyHydrationTimeoutSeconds: 30
  historyHydrationPageSize: 1000
  historyHydrationMaxFrames: 100000
  historyHydrationMaxBytes: 67108864
  effortControlTimeoutSeconds: 15
  # PI paths refer to the session container, not the API host.
  pi:
    binary: pi
    agent_dir: ""
    session_dir: ""
    command_timeout_s: 30
    turn_timeout_s: 1800
    shutdown_timeout_s: 5
  historyReadTimeoutSeconds: 2.0
  historyBootstrapMaxFrames: 256
  # Native question proof bounds and optional Muse executable override.
  tmuxQuestionTranscriptMaxBytes: 1048576
  tmuxQuestionResultHistoryLimit: 128
  # -- Longest a PreToolUse hook waits for the native transcript text before that tool
  tmuxNativeTextWaitSeconds: 0.1
  # -- Interval between native transcript reads while that wait is open
  tmuxNativeTextPollSeconds: 0.005
  museBin: ""
  # -- (DEPRECATED) AI CLI backend: "claude" (Claude Code, default) or "codex" (OpenAI Codex).
  # Use broker.transportAdapter instead. Kept for backward compatibility during rollout.
  cliType: claude
  # -- (DEPRECATED) CLI transport mode for Claude: "sdk" (default) or "subprocess".
  # Use broker.transportAdapter instead. Kept for backward compatibility during rollout.
  transport: sdk
  # -- Fully-qualified class path of the transport adapter to use.
  # Replaces broker.cliType + broker.transport with a single, extensible field.
  # ``skuld.transports.sdk_websocket.SdkWebSocketTransport`` is deprecated.
  # Examples:
  #   "skuld.transports.sdk.SDKTransport"                       # Claude Code (default)
  #   "skuld.transports.codex.CodexSubprocessTransport"         # OpenAI Codex
  #   "skuld.transports.grok.GrokACPTransport"                  # xAI Grok Build (ACP / Scaldy)
  #   "skuld.transports.muse.MuseMSPTransport"                  # Meta Muse Code (MSP / Scaldy)
  transportAdapter: "skuld.transports.sdk.SDKTransport"
  # -- CLI executable used by subprocess-based transports.
  cliBinary: "claude"
  # -- Claude Remote Control permission-mode override. Empty follows skipPermissions.
  remoteControlPermissionMode: ""
  # -- Maximum size, in bytes, accepted by the present-file endpoint.
  maxPresentedFileBytes: 52428800
  # -- Skip tool permission prompts and use full access (Claude bypassPermissions,
  # Codex approvalPolicy=never with danger-full-access)
  skipPermissions: true
  # -- Enable Claude Code experimental Agent Teams (Claude only)
  agentTeams: true

# The session-bound Forge credential (forge_session). Forge sets these per session
# when it mounts the credential from a Secret (Volundr's
# forge_mcp.session_tokens.projection_adapter); never set the token itself here.
forgeMcp:
  # -- File the mounted credential is read from at start. Empty: no session credential.
  tokenFile: ""
  # -- Tool grants of the credential (message, lifecycle). Null keeps the token's own.
  grants: null
  # -- Seconds the engine allows one stdio-server -> broker tool call (forge_mcp.broker_request_timeout_s).
  # Null keeps the broker default (60). Must exceed secretRequests.waitMaxS.
  brokerRequestTimeoutS: null
  # -- Seconds the engine allows one MCP tool call (forge_mcp.tool_timeout_s). Null keeps the broker
  # default (120). Set as Codex's tool_timeout_sec and as Claude Code's per-server timeout for the
  # Forge server, so both engines are bounded by it. Must exceed secretRequests.waitMaxS and ask.waitMaxS.
  toolTimeoutS: null

# request_secret / request-secret: the agent asks the user for a secret through a masked chat card.
secretRequests:
  # -- Seconds between checks of whether the user answered the card (secret_requests.poll_interval_s).
  pollIntervalS: 2
  # -- Longest one request_secret call waits for the user, in seconds (secret_requests.wait_max_s).
  # Bounded by the engine's MCP call timeouts: it must stay below forgeMcp.brokerRequestTimeoutS
  # (default 60) and forgeMcp.toolTimeoutS (default 120), or the broker refuses to start. When it
  # passes, the call fails and the request stays open in the chat; the agent calls it again.
  waitMaxS: 50

# ask: the agent sends a message to another session and waits for its answer.
ask:
  # -- Seconds between checks of whether the recipient is blocked on a person or gone (ask.poll_interval_s).
  # The answer itself is not polled; it wakes the wait when it reaches the session's inbox.
  pollIntervalS: 2
  # -- Longest one ask call waits, and the ceiling for the deadline_s a caller passes (ask.wait_max_s).
  # Bounded by the engine's MCP call timeouts like secretRequests.waitMaxS: it must stay below
  # forgeMcp.brokerRequestTimeoutS (default 60) and forgeMcp.toolTimeoutS (default 120), or the
  # broker refuses to start. When it passes, the call returns deadline and the agent calls it again.
  waitMaxS: 50

# Volundr API (for token usage reporting back to the control plane)
volundr:
  # -- URL of the Volundr API service (set by session definition).
  # This should be the Envoy-routed API origin, not an internal service bypass.
  apiUrl: ""
  # -- Service identity for internal API calls (x-auth-user-id header)
  serviceUserId: "skuld-broker"
  # -- Tenant ID for internal API calls (x-auth-tenant header)
  serviceTenantId: "default"
  # -- Existing Secret reference for the outbound Volundr service token.
  # Keep empty when workload identity or the normal authenticated path is used.
  externalApiTokenSecret:
    name: ""
    key: "token"

# -- Secrets injected as environment variables into the skuld broker container.
# Each entry maps one key from a Kubernetes Secret to an env var.
# Works for any provider -- no template changes needed for new CLIs.
envSecrets:
  - envVar: ANTHROPIC_API_KEY
    secretName: anthropic-api-key
    secretKey: api-key

claude:
  # -- Keep Claude Code from updating itself in cluster sessions. The CLI is
  # pinned in the image; a self-update restarts it mid-start-up (breaking the
  # interactive transport's readiness and delivery checks) and fails anyway
  # without write access to the npm prefix. Sets DISABLE_AUTOUPDATER=1.
  disableAutoUpdate: true

# -- Plain environment variables injected into the skuld broker container.
# Use for non-secret configuration like proxy URLs or auth tokens.
envVars:
  # Cluster pods have no ~/.claude login, so Claude transports must keep the
  # injected ANTHROPIC_API_KEY. Host/mini-mode deployments default to the
  # host's claude.ai subscription instead (see skuld.transports.claude_env).
  - name: SKULD__CLAUDE_AUTH
    value: "api_key"
# Example: Anthropic-compatible proxy endpoint (replaces api.baseUrl/authToken)
# - name: ANTHROPIC_BASE_URL
#   value: "https://proxy.example.com"
# - name: ANTHROPIC_AUTH_TOKEN
#   value: "bearer-token"

# Envoy sidecar proxy (JWT validation, header extraction)
envoy:
  authorization:
    # Optional central identity/PAT revocation check before gateway admission.
    # Use identity.adapters.remote.RemoteHeaderAuthenticationAdapter with HTTPS authority_url.
    identity: null
    # Keep outside localServices.portRange (9001-9020).
    port: 9000
    # -- Envoy's budget for the authorization decision. When identityAuthority is
    # enabled, identityAuthority.timeout is added so the identity lookup fits.
    timeout: 1s
    shutdownGraceSeconds: 5
    extraVolumeMounts: []
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    roleMapping:
      admin: volundr:admin
      developer: volundr:developer
      viewer: volundr:viewer
  # -- Enable Envoy sidecar proxy
  enabled: false
  image:
    # -- Envoy image repository
    repository: envoyproxy/envoy
    # -- Envoy image tag
    tag: "v1.32-latest"
    # -- Envoy image pull policy
    pullPolicy: IfNotPresent
  # -- Envoy listener port (becomes the service target when enabled)
  port: 8444
  # -- Envoy admin interface port (localhost only)
  adminPort: 9901
  # -- Upstream connect timeout
  connectTimeout: "0.25s"
  # -- Upstream request timeout (long for WebSocket sessions)
  upstreamTimeout: "3600s"
  # -- Resource limits for the Envoy sidecar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # -- Header names Envoy sets on upstream requests
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
    # A client-supplied copy must never reach the broker: only the session
    # proxy (niuu.session_proxy) is trusted to stamp this, from a verified
    # session_participants grant (see the room-scoped Cedar actions).
    roomRole: x-niuu-room-role
    # The member session posting into a room (room_post). Forge stamps it from the
    # caller's verified session credential; a client-supplied copy must never reach
    # the broker, which seats the message as that session's.
    roomCallerSession: x-niuu-room-caller-session
  # JWT authentication (via Keycloak)
  jwt:
    # -- Enable JWT authentication filter
    enabled: false
    # -- JWT issuer URL (Keycloak realm)
    # issuer: "https://keycloak.example.com/realms/volundr"
    issuer: ""
    # -- Allowed JWT audiences
    # audiences:
    #   - skuld
    audiences: []
    # -- JWKS URI for key retrieval
    # jwksUri: "https://keycloak.example.com/realms/volundr/protocol/openid-connect/certs"
    jwksUri: ""
    # -- JWKS fetch timeout
    jwksTimeout: "5s"
    # -- JWKS cache duration in seconds
    jwksCacheDurationSeconds: 300
    # -- JWT claim containing tenant ID
    tenantClaim: "tenant_id"
    # -- JWT claim containing roles
    rolesClaim: "resource_access.volundr.roles"
    # -- Keycloak upstream host
    # keycloakHost: "keycloak.default.svc.cluster.local"
    keycloakHost: ""
    # -- Keycloak upstream port
    keycloakPort: 8080
    # -- Enable TLS for Keycloak upstream
    keycloakTls: false
    keycloakCaFile: /etc/ssl/certs/ca-certificates.crt
    # -- Additional JWT claim-to-header mappings
    extraClaimHeaders: []
    workload:
      # -- Enable workload JWT authentication as an additional accepted provider
      enabled: false
      # -- Workload JWT issuer URL
      issuer: ""
      # -- Allowed workload JWT audiences
      audiences: []
      # -- Workload JWT JWKS URI
      jwksUri: ""
      # -- Hostname used by the Envoy JWKS cluster for workload tokens
      jwksHost: ""
      # -- Port used by the Envoy JWKS cluster for workload tokens
      jwksPort: 443
      # -- Enable TLS for the workload JWKS cluster
      jwksTls: true
      jwksCaFile: /etc/ssl/certs/ca-certificates.crt
      # -- JWKS fetch timeout
      jwksTimeout: "5s"
      # -- JWKS cache duration in seconds
      jwksCacheDurationSeconds: 300
      # -- Workload JWT claim containing tenant ID
      tenantClaim: "tenant_id"
      # -- Workload JWT claim containing roles
      rolesClaim: "resource_access.volundr-api.roles"
      # -- Additional workload JWT claim-to-header mappings
      extraClaimHeaders: []
  # -- Extra HTTP filters (inserted before the router filter)
  extraVolumeMounts: []
  extraHttpFilters: []
  # -- Extra upstream clusters
  extraClusters: []

# Gateway API routing (managed by this chart, not Volundr)
# When enabled, creates an HTTPRoute + optional SecurityPolicy per session.
# Gateway config is passed from Volundr at session creation time.
gateway:
  # -- Enable Gateway API HTTPRoute for this session
  enabled: false
  # -- Name of the shared Gateway resource
  name: "volundr-gateway"
  # -- Namespace where the shared Gateway lives
  namespace: "volundr-system"
  # -- User ID label for the HTTPRoute (owner of the session)
  userId: ""
  # CORS configuration for cross-origin browser requests
  cors:
    # -- Allowed origins (e.g. ["https://volundr.example.com"])
    allowOrigins:
      - "*"
    # -- Allowed HTTP methods
    allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    # -- Allowed request headers
    allowHeaders:
      - Authorization
      - Content-Type
    # -- Allow credentials (cookies, auth headers)
    allowCredentials: true
  # JWT validation (Envoy SecurityPolicy)
  jwt:
    # -- Enable JWT SecurityPolicy for this session's HTTPRoute
    enabled: false
    # -- JWT issuer URL
    issuer: ""
    # -- Allowed JWT audiences
    audiences: []
    # -- JWKS URI for key retrieval
    jwksUri: ""
    tenantClaim: tenant_id
    rolesClaim: resource_access.volundr-api.roles
    workload:
      # -- Enable workload JWT validation as an additional session-route provider
      enabled: false
      # -- Workload JWT issuer URL
      issuer: ""
      # -- Allowed workload JWT audiences
      audiences: []
      # -- JWKS URI for workload JWT key retrieval
      jwksUri: ""
      tenantClaim: tenant_id
      rolesClaim: resource_access.volundr-api.roles

# Pod configuration
# -- Extra labels applied to session pods (e.g. volundr/owner for PVC isolation)
podLabels: {}
# -- Extra annotations applied to session pods (e.g. for secret injection webhooks)
podAnnotations: {}
# -- Node selector for scheduling
nodeSelector: {}
# -- Tolerations for scheduling
tolerations: []
# -- Affinity rules for scheduling
affinity: {}

# -- Runtime class name for the pod (e.g., "nvidia", "kata", "gvisor")
runtimeClassName: ""

# -- Service account name for the pod, set by a secret injection contributor.
serviceAccountName: ""

# -- Additional init containers to add to the session pod.
extraInitContainers: []

# -- Additional sidecar containers to add to the session pod.
extraContainers: []

# -- Extra volumes to add to the pod (e.g., CSI secret volumes)
extraVolumes: []

# -- Extra volume mounts added to skuld and devrunner containers
extraVolumeMounts: []

# -- Port of this release's broker (config `port`). A member of a unit (below) is given its own.
brokerPort: 8081

# -- The unit this release's broker is part of. Forge sets it on the members' values, never on
# the root's own: a member renders as a container of the root's pod, so its workspace is the
# root's (one checkout for the run) and its scratch directories live under the root's.
unit:
  # -- Id of the unit's root session (the release's own `session.id`). Empty for a release that
  # is not hosting a unit, and for the root itself.
  sessionId: ""
  # -- The directory every Skuld of the unit shares for its local mesh: nng on loopback with
  # `registry` discovery on a file in it (an `emptyDir` mounted into every container). Set by
  # Forge with `members`; empty leaves the pod without it.
  meshDir: ""
  # -- Id of the member whose repository, branch and Git credential the unit's one checkout is
  # cloned from, when the root itself names no repository. Forge sets it; every member that
  # names a repository names the same one.
  checkoutFrom: ""

# -- The sessions this pod hosts besides its own: one Skuld container per member, each with its
# own configuration, credential and broker port, all started with the pod (a workflow run is
# one unit). Forge sets it for a unit root, from the members' own launches. Each entry:
# `id` (the member session's id), `port` (its broker port) and `values` (the complete values the
# member would have been launched with on its own, as Forge computes them: `session`, `mesh`,
# `broker`, `forgeMcp`, `envVars`, `extraVolumeMounts`, `git`, `resources`, ...). The pod-level
# parts of a member's values (nodeSelector, tolerations, affinity, runtimeClassName,
# serviceAccountName, securityContext, the home and sessions volumes and their claims) must be
# the root's; Forge refuses a unit whose members differ. The members' `extraVolumes` belong
# in the root's `extraVolumes` (under a name only that member's `extraVolumeMounts` use).
members: []

# -- Desired Deployment replicas. 0 suspends the pod while preserving
# configured persistent storage.
replicaCount: 1

# The room this session hosts (Skuld's `room` settings). Off by default: an ordinary session
# pays for no collaboration wiring. Forge turns it on for a workflow run's first session, so
# the run's other members show in it as workers.
room:
  # -- Host a room (room.enabled). The session keeps its own agent.
  enabled: false
  # -- Environment of the room's participants (room.environment_id); empty uses mesh.realmId
  environmentId: ""
  # -- Show every member of the mesh realm, not only events tagged with this session
  # (room.realm_room). A workflow run's realm is the run's own.
  realmRoom: false
  # -- The session runs no agent of its own: it only hosts the room (room.routed). A
  # workflow run's room session is one.
  routed: false

# Mesh configuration for session-local agent flocks. Every value below is a key of Skuld's
# `mesh` settings (skuld.config.MeshConfig), rendered into the broker's config file. A value
# left null (or empty) keeps Skuld's own default. Forge sets them per session through the
# pod manager's `session_defaults` (the volundr chart's podManager.kwargs) or a session
# contributor, as it does for every other value of this chart.
mesh:
  # -- Join the flock as a mesh peer (mesh.enabled). Adds the session's mesh tools:
  # mesh_send, mesh_publish and mesh_peers.
  enabled: false
  # -- Mesh transport: nng, nats, in_process or a Sleipnir transport class path (mesh.transport)
  transport: nng
  # -- Container ports to expose for direct mesh peers (not a Skuld setting)
  peerPorts: []
  # -- This peer's id on the mesh (mesh.peer_id). Empty uses the session id: one id for the
  # transport, discovery, the signing certificate and reply routes.
  peerId: ""
  # -- What pod discovery shows of this peer to the realm's other peers (and their rooms):
  # its persona and the topics it consumes and emits, written as the pod's
  # ravn.niuu.world/persona, /consumes and /emits annotations. Forge sets it for a workflow
  # step session from its pinned persona; Skuld's own topics come from the persona itself.
  announce: {}
  # -- Share this session's replies, tool work and step closes with its realm's room
  # (mesh.share_work). Forge sets it for a workflow run's member sessions.
  shareWork: false
  # -- Flock realm the peer announces in and discovers within (mesh.realm_id). Peers in
  # another realm are not seen.
  realmId: ""
  # -- Persona name announced when the session has no pinned persona (mesh.persona).
  # Null keeps `coder`. A pinned persona's id is announced instead.
  persona: null
  # -- What the session is for, announced to peers so they can choose whom to talk to
  # (mesh.role). Empty announces the pinned persona's id.
  role: ""
  # -- What the session does, announced to peers (mesh.description). The pinned persona's
  # own description wins when it has one.
  description: ""
  # -- Capabilities announced to peers (mesh.capabilities). Null keeps Skuld's default.
  capabilities: null
  # -- Tools announced to peers (mesh.tools). Null keeps Skuld's default.
  tools: null
  # -- Topics the session subscribes to (mesh.consumes_event_types). Null keeps
  # `["code.requested"]`. A pinned persona's `consumes` are subscribed in addition.
  consumesEventTypes: null
  # -- Topics mesh_publish may publish (mesh.publish_event_types), in addition to the pinned
  # persona's `produces`. A topic in neither is refused.
  publishEventTypes: null
  # -- Attention hint (0.0-1.0) on events mesh_publish publishes (mesh.published_event_urgency).
  # Null keeps 0.8.
  publishedEventUrgency: null
  # -- With the mesh enabled on nng and no `discoveryAdapters` or `adapters`, discover the
  # session pods of the realm by listing pods (see `nng`). false leaves such a mesh without
  # discovery, which Skuld refuses to start.
  discoverPods: true
  rbac:
    # -- Create the namespaced Role and RoleBinding that let the session's ServiceAccount
    # `get`, `list` and `watch` pods, which `k8s` discovery needs. Created only when the mesh
    # uses `k8s` discovery of this release's namespace (the cluster default, or a
    # `discoveryAdapters` entry naming `k8s` and this namespace). Nothing is cluster-wide.
    # false leaves the grant to you.
    create: true
  # -- NNG transport settings (mesh.nng) when `transport` is nng.
  # With `enabled: true` and nothing else set (no `discoveryAdapters`, no `adapters`) the chart
  # runs the mesh for a cluster: `k8s` discovery of the pods of the realm, a PUB socket on
  # `tcp://0.0.0.0:<port>` announced at the pod's own IP, and the pod labelled and annotated
  # for that discovery. The chart also creates the Role that lets the session's ServiceAccount
  # read pods (`rbac` above), and, when networkPolicy.enabled, the rule that lets session pods
  # reach each other on <port>. Setting `discoveryAdapters`
  # turns all of that off: you then choose the addresses yourself.
  nng:
    # -- Port of the PUB socket in the cluster default above. Null keeps 7480.
    port: null
    # -- Publish/subscribe address (mesh.nng.pub_sub_address). Empty keeps
    # tcp://127.0.0.1:0, or the cluster default above.
    pubSubAddress: ""
    # -- Request/reply address (mesh.nng.req_rep_address)
    reqRepAddress: ""
    # -- Host other machines dial this session at (mesh.nng.advertise_host). Needed when
    # `pubSubAddress` listens on every interface. The cluster default announces the pod IP.
    advertiseHost: ""
    # -- Seconds between re-reads of the discovered peers (mesh.nng.rediscover_interval_s).
    # Null keeps 1.
    rediscoverIntervalS: null
  # -- Mesh adapter entries (mesh.adapters): each has an `adapter` alias or class path and
  # that adapter's own settings. Null keeps none.
  adapters: null
  # -- Discovery adapter entries (mesh.discovery_adapters), same shape as `adapters`:
  # `k8s` (pods of a cluster), `registry` (sessions that share a file system),
  # `static` (a fixed list), `event_bus` (a NATS bus). Null on nng keeps the cluster default
  # described at `nng` above.
  discoveryAdapters: null
  # -- NATS JetStream settings (mesh.nats), as a map of niuu.mesh.config.MeshNatsConfig
  # keys, e.g. `{servers: ["nats://nats:4222"], stream_name: ravn_environment}`.
  nats: {}
  # -- Seconds a mesh request waits for the peer's answer (mesh.rpc_timeout_s). Null keeps 10.
  rpcTimeoutS: null
  # -- Replies the mesh remembers so a retried request is answered once
  # (mesh.rpc_reply_cache_size). Null keeps Skuld's default.
  rpcReplyCacheSize: null
  # -- Largest diff, in bytes, a peer may fetch from this session (mesh.diff_max_bytes). Null
  # keeps 8192.
  diffMaxBytes: null
  # -- Seconds a diff request may take (mesh.diff_timeout_s). Null keeps 10.
  diffTimeoutS: null
  # Proof of who sent each mesh message. On by default and needs no setting: the session asks
  # the Forge that launched it for a certificate with the credential it already holds
  # (forgeMcp.tokenFile; Kubernetes and Flux sessions need Forge's
  # forge_mcp.session_tokens.projection_adapter for that). Every key is optional; null keeps
  # the broker's default. The certificate lifetime is Forge's
  # forge_mcp.mesh_identity.ttl_seconds (default 900 s).
  attestation:
    # -- false runs the mesh unauthenticated: any claimed sender is accepted. Null keeps true.
    required: null
    # -- Fraction of the certificate lifetime after which it is renewed. Null keeps 0.5.
    renewFraction: null
    # -- Fraction of the lifetime between retries after a failed renewal. Null keeps 0.1.
    retryFraction: null
    # -- Seconds a request's signing time may differ from this clock. Null keeps 300.
    clockSkewS: null
    # -- Oldest a published event may be on receipt. Null keeps 3600; must exceed the
    # transport's redelivery window.
    eventMaxAgeS: null

# -- Secret mapping manifest for file-based credential injection.
# Rendered into a ConfigMap and mounted at /run/secrets/manifest.json.
# See containers/skuld/entrypoint.sh for the manifest schema.
secretManifest: {}

# Security context for the pod
securityContext:
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 1000
  # -- Filesystem group ID
  fsGroup: 1000
  # -- When the kubelet re-owns mounted volumes. `Always` walks every file on
  # each pod start, which took over two minutes on a user home of 250k files.
  fsGroupChangePolicy: OnRootMismatch

# Authentication is optional for mini-mode and explicitly trusted deployments.
# Enable only behind a JWT-verifying proxy that strips caller identity headers.
wsAuth:
  authorization:
    adapter: identity.adapters.cedar.CedarAuthorizationAdapter
    kwargs: {}
    secret_kwargs_env: {}
  enforce_ownership: false
  websocket_check_interval: 5
  admin_roles: ["volundr:admin"]
  allow_loopback: false
  # How a missing x-niuu-room-role header resolves. "deployment" (the
  # DEFAULT — unchanged, byte-identical behavior for every existing
  # cluster): this pod's own auth boundary already gates every caller who
  # reaches it, so a missing header means owner, unconditionally, and
  # session_participants invites are refused with 409 for this backend.
  # "proxy" is rendered directly by the process-backend's local launcher
  # (volundr.adapters.outbound.local_process), never by this chart — do not
  # set it here. "remote" asks Forge for the caller's grant on every
  # request and lifts the 409 — Forge's own pod_manager.room_role_source
  # setting renders this automatically per session (see
  # RoomRoleSourceContributor); only set it here directly for a standalone
  # chart install Forge does not manage. REQUIRES enforce_ownership: false
  # (the Helm template fails the render otherwise — see skuld-configmap.yaml
  # — because the ext_authz sidecar's owner/admin-only "start" gate would
  # block every participant before a remote room-role lookup ever ran).
  room_role_source: deployment
  # room_role_remote (the dynamic skuld.room_role_port.RoomRoleResolverPort
  # adapter used when room_role_source is "remote") is deliberately absent
  # here — existing clusters must render byte-identical wsAuth until they
  # opt in. skuld-configmap.yaml renders it ONLY when room_role_source is
  # "remote", defaulting adapter/token_file/volundr_api_url (from
  # volundr.apiUrl below) so a standalone install needs no further values;
  # override wsAuth.room_role_remote.adapter/kwargs/secret_kwargs_env here
  # (or via RoomRoleSourceContributor's per-session values) to change them.

# Live preview (skuld.preview): a port the session listens on opens at
# <port>--<session-id>.<preview domain> through Forge's preview router, which
# forwards to /preview/<port>/ here. Skuld admits only the router's workload
# credential, checked against envoy.jwt.workload's issuer and JWKS (required).
preview:
  # -- Discover the pod's listening ports and serve them to Forge's preview router
  enabled: false
  # -- Seconds between scans of the pod's listening sockets
  portScanIntervalSeconds: 2
  # -- Audience of the router credential (Forge's session_preview.credential_audience)
  routerAudience: "volundr-api"
  # -- Ports never offered as previews. The pod's own infrastructure ports
  # (nginx, broker, Envoy, authz, terminal, mesh) are excluded
  # automatically; 5432 is the devrunner's Postgres.
  excludedPorts: [5432]
  # -- How long nginx keeps an idle preview stream (hot-reload WebSocket, SSE)
  # open. Past it the dev server's client reconnects (Vite reloads the page).
  streamIdleTimeout: "3600s"

# Limit pod ingress to the authenticated gateway, including direct pod-IP traffic.
# Add explicit peer selectors/ports for direct Flokk mesh deployments.
networkPolicy:
  enabled: false
  ingressFrom: []
  extraIngress: []

# Shared identity service: fresh membership, role and credential checks.
# Point at the canonical identity service, never back at this client service.
identityAuthority:
  enabled: false
  url: ""
  timeout: 5
  caFile: ""
