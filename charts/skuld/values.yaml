# Skuld Helm Chart Values
# Claude Code CLI session pod with WebSocket broker and terminal/local-service support

# Global values (can be set by parent chart)
global:
  # -- Global image pull secrets (list of secret names)
  imagePullSecrets: []
  # - ghcr-pull-secret
  image:
    # -- Global image repository override
    repository: ""
    # -- Global image tag override
    tag: ""

# Session configuration (set by Volundr at deployment time)
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown
session:
  # -- Session identifier (UUID, set by Volundr)
  id: ""
  # -- Human-readable session name
  name: ""
  # -- User ID (IDP sub) that owns this session. When set, the broker enforces
  # WebSocket ownership (see skuld ws_auth). Rendered into the broker config.
  ownerId: ""
  # -- Tenant the session belongs to. Rendered into the broker config.
  tenantId: ""
  # -- AI model to use for the session
  model: "claude-sonnet-4-6"
  # -- Reasoning effort passed to transports that support it
  reasoningEffort: ""
  # -- System prompt injected into the LLM context
  systemPrompt: ""
  # -- Initial user message sent when the CLI starts
  initialPrompt: ""

# Container image for the Skuld broker
# Note: repository and tag are updated by CI/CD pipeline
# Default values are for local development
image:
  # -- Skuld broker image repository
  repository: ghcr.io/niuulabs/skuld
  # -- Skuld broker image tag
  tag: "latest"
  # -- Image pull policy
  pullPolicy: Always

# Resource limits for the Skuld broker container
resources:
  requests:
    # -- Broker CPU request
    memory: "256Mi"
    # -- Broker memory request
    cpu: "100m"
  limits:
    # -- Broker memory limit (includes Claude CLI child process)
    memory: "4Gi"
    # -- Broker CPU limit
    cpu: "1"

# Nginx entry point (routes all traffic internally)
# All external traffic enters via nginx on port 8080 and is routed
# to the broker, terminal, and local services based on URL path.
nginx:
  image:
    # -- Nginx image repository
    repository: nginx
    # -- Nginx image tag
    tag: "alpine"
    # -- Nginx image pull policy
    pullPolicy: IfNotPresent
  resources:
    requests:
      # -- Nginx memory request
      memory: "32Mi"
      # -- Nginx CPU request
      cpu: "10m"
    limits:
      # -- Nginx memory limit
      memory: "128Mi"
      # -- Nginx CPU limit
      cpu: "100m"

# Local service testing (devrunner sidecar)
localServices:
  # -- Enable local service management
  enabled: true
  # -- Port range for dynamic services
  portRange:
    # -- Start of dynamic port range
    start: 9001
    # -- End of dynamic port range
    end: 9020
  # -- Terminal (shell over WebSocket)
  terminal:
    # -- Terminal WebSocket port
    port: 7681
    # -- Run the terminal in restricted-shell mode
    restricted: false
    # -- Override allowed commands in restricted mode (comma-separated, empty = use defaults)
    allowedCommands: ""
    # -- Enable debug UI at /debug/ (xterm.js test page)
    debug: false
  # -- Devrunner container configuration
  devrunner:
    image:
      # -- Devrunner image repository
      repository: ghcr.io/niuulabs/devrunner
      # -- Devrunner image tag
      tag: "latest"
      # -- Devrunner image pull policy
      pullPolicy: Always
    resources:
      requests:
        # -- Devrunner memory request
        memory: "512Mi"
        # -- Devrunner CPU request
        cpu: "100m"
      limits:
        # -- Devrunner memory limit
        memory: "4Gi"
        # -- Devrunner CPU limit
        cpu: "2000m"

# Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Single entry point port (nginx)
  port: 8080

# Ingress configuration
ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress routing mode: "host" (hostname-based, default) or "path" (path-prefix, for IP-only access)
  mode: host
  # -- Ingress class name
  className: traefik
  # -- Ingress annotations (controller-specific)
  # Traefik handles WebSocket and streaming automatically.
  # For NGINX, add proxy-read-timeout, proxy-send-timeout, etc.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
  # -- Hostname for the session ingress (set by Volundr, e.g., session-uuid.niuu.world)
  host: ""
  # Path routing configuration (used by nginx internally)
  paths:
    # -- WebSocket path for Skuld broker
    session: /session
    # -- IDE path (catch-all)
    ide: /
  tls:
    # -- Enable TLS
    enabled: true
    # -- TLS secret name (auto-generated from release name if empty)
    secretName: ""

# Shared storage for session workspace data
persistence:
  # -- Enable workspace persistence
  enabled: true
  # -- Use a pod-local emptyDir for the sessions volume instead of the shared
  # existingClaim PVC. Residents and other self-contained sessions don't need
  # the shared sessions PVC but still get a writable workspace.
  emptyDir: false
  # -- Name of an existing PVC to use
  existingClaim: "volundr-sessions"
  # -- Mount path for the sessions PVC
  mountPath: "/volundr/sessions"

# Persistent home directory (shared across all sessions for a user)
# Stores CLI config dirs (.claude/, .codex/, etc.) and shell config.
# Credential files are mounted from a K8s Secret and symlinked into
# $HOME/<destDir>/ so they auto-update when the secret changes (~60s).
homeVolume:
  # -- Enable persistent home volume
  enabled: false
  # -- Name of an existing PVC to use for the home directory
  existingClaim: ""
  # -- Mount path for the home PVC
  mountPath: "/volundr/home"
  credentialFiles:
    # -- Pre-existing K8s secret containing CLI credential files
    secretName: ""
    # -- Subdirectory under mountPath where credential symlinks are placed
    # e.g. ".claude" for Claude Code, ".codex" for OpenAI Codex
    destDir: ".claude"
    # -- Internal mount path for the credentials secret volume
    secretMountPath: "/volundr/secrets/credential-files"

# Git repository to clone (optional, cloned on session start)
# Each session clones into its own workspace: /volundr/sessions/{session-id}/workspace
# Multiple sessions with different repos coexist on the same PVC
git:
  # -- Git repository URL to clone (empty = no clone)
  repoUrl: ""
  # -- Branch to checkout (empty = default branch)
  branch: ""
  # -- Base branch to create feature branch from if it doesn't exist on the remote
  baseBranch: ""
  # Credentials for private repos (HTTPS token auth)
  credentials:
    # -- Name of a Kubernetes secret containing a git token
    secretName: ""
    # -- Key within the secret that holds the token
    tokenKey: "token"
    # -- Username for HTTPS auth (default works with GitHub PATs and deploy tokens)
    username: "x-access-token"
  image:
    # -- Git init container image repository
    repository: alpine/git
    # -- Git init container image tag
    tag: "latest"
    # -- Git init container image pull policy
    pullPolicy: IfNotPresent

# Broker configuration (Skuld application settings)
broker:
  # -- (DEPRECATED) AI CLI backend: "claude" (Claude Code, default) or "codex" (OpenAI Codex).
  # Use broker.transportAdapter instead. Kept for backward compatibility during rollout.
  cliType: claude
  # -- (DEPRECATED) CLI transport mode for Claude: "sdk" (default) or "subprocess".
  # Use broker.transportAdapter instead. Kept for backward compatibility during rollout.
  transport: sdk
  # -- Fully-qualified class path of the transport adapter to use.
  # Replaces broker.cliType + broker.transport with a single, extensible field.
  # ``skuld.transports.sdk_websocket.SdkWebSocketTransport`` is deprecated.
  # Examples:
  #   "skuld.transports.sdk.SDKTransport"                       # Claude Code (default)
  #   "skuld.transports.codex.CodexSubprocessTransport"         # OpenAI Codex
  #   "skuld.transports.grok.GrokACPTransport"                  # xAI Grok Build (ACP / Scaldy)
  transportAdapter: "skuld.transports.sdk.SDKTransport"
  # -- CLI executable used by subprocess-based transports.
  cliBinary: "claude"
  # -- Claude Remote Control permission-mode override. Empty follows skipPermissions.
  remoteControlPermissionMode: ""
  # -- Maximum size, in bytes, accepted by the present-file endpoint.
  maxPresentedFileBytes: 52428800
  # -- Skip tool permission prompts and use full access (Claude bypassPermissions,
  # Codex approvalPolicy=never with danger-full-access)
  skipPermissions: true
  # -- Enable Claude Code experimental Agent Teams (Claude only)
  agentTeams: false

# Volundr API (for token usage reporting back to the control plane)
volundr:
  # -- URL of the Volundr API service (set by session definition).
  # This should be the Envoy-routed API origin, not an internal service bypass.
  apiUrl: ""
  # -- Service identity for internal API calls (x-auth-user-id header)
  serviceUserId: "skuld-broker"
  # -- Tenant ID for internal API calls (x-auth-tenant header)
  serviceTenantId: "default"
  # -- Existing Secret reference for the outbound Volundr service token.
  # Keep empty when workload identity or the normal authenticated path is used.
  externalApiTokenSecret:
    name: ""
    key: "token"

# -- Secrets injected as environment variables into the skuld broker container.
# Each entry maps one key from a Kubernetes Secret to an env var.
# Works for any provider -- no template changes needed for new CLIs.
envSecrets:
  - envVar: ANTHROPIC_API_KEY
    secretName: anthropic-api-key
    secretKey: api-key

# -- Plain environment variables injected into the skuld broker container.
# Use for non-secret configuration like proxy URLs or auth tokens.
envVars:
  # Cluster pods have no ~/.claude login, so Claude transports must keep the
  # injected ANTHROPIC_API_KEY. Host/mini-mode deployments default to the
  # host's claude.ai subscription instead (see skuld.transports.claude_env).
  - name: SKULD__CLAUDE_AUTH
    value: "api_key"
# Example: Anthropic-compatible proxy endpoint (replaces api.baseUrl/authToken)
# - name: ANTHROPIC_BASE_URL
#   value: "https://proxy.example.com"
# - name: ANTHROPIC_AUTH_TOKEN
#   value: "bearer-token"

# Envoy sidecar proxy (JWT validation, header extraction)
envoy:
  # -- Enable Envoy sidecar proxy
  enabled: false
  image:
    # -- Envoy image repository
    repository: envoyproxy/envoy
    # -- Envoy image tag
    tag: "v1.32-latest"
    # -- Envoy image pull policy
    pullPolicy: IfNotPresent
  # -- Envoy listener port (becomes the service target when enabled)
  port: 8444
  # -- Envoy admin interface port (localhost only)
  adminPort: 9901
  # -- Upstream connect timeout
  connectTimeout: "0.25s"
  # -- Upstream request timeout (long for WebSocket sessions)
  upstreamTimeout: "3600s"
  # -- Resource limits for the Envoy sidecar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # -- Header names Envoy sets on upstream requests
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  # JWT authentication (via Keycloak)
  jwt:
    # -- Enable JWT authentication filter
    enabled: false
    # -- JWT issuer URL (Keycloak realm)
    # issuer: "https://keycloak.example.com/realms/volundr"
    issuer: ""
    # -- Allowed JWT audiences
    # audiences:
    #   - skuld
    audiences: []
    # -- JWKS URI for key retrieval
    # jwksUri: "https://keycloak.example.com/realms/volundr/protocol/openid-connect/certs"
    jwksUri: ""
    # -- JWKS fetch timeout
    jwksTimeout: "5s"
    # -- JWKS cache duration in seconds
    jwksCacheDurationSeconds: 300
    # -- JWT claim containing tenant ID
    tenantClaim: "tenant_id"
    # -- JWT claim containing roles
    rolesClaim: "resource_access.volundr.roles"
    # -- Keycloak upstream host
    # keycloakHost: "keycloak.default.svc.cluster.local"
    keycloakHost: ""
    # -- Keycloak upstream port
    keycloakPort: 8080
    # -- Enable TLS for Keycloak upstream
    keycloakTls: false
    # -- Additional JWT claim-to-header mappings
    extraClaimHeaders: []
    workload:
      # -- Enable workload JWT authentication as an additional accepted provider
      enabled: false
      # -- Workload JWT issuer URL
      issuer: ""
      # -- Allowed workload JWT audiences
      audiences: []
      # -- Workload JWT JWKS URI
      jwksUri: ""
      # -- Hostname used by the Envoy JWKS cluster for workload tokens
      jwksHost: ""
      # -- Port used by the Envoy JWKS cluster for workload tokens
      jwksPort: 443
      # -- Enable TLS for the workload JWKS cluster
      jwksTls: true
      # -- JWKS fetch timeout
      jwksTimeout: "5s"
      # -- JWKS cache duration in seconds
      jwksCacheDurationSeconds: 300
      # -- Workload JWT claim containing tenant ID
      tenantClaim: "tenant_id"
      # -- Workload JWT claim containing roles
      rolesClaim: "resource_access.volundr-api.roles"
      # -- Additional workload JWT claim-to-header mappings
      extraClaimHeaders: []
  # -- Extra HTTP filters (inserted before the router filter)
  extraHttpFilters: []
  # -- Extra upstream clusters
  extraClusters: []

# Gateway API routing (managed by this chart, not Volundr)
# When enabled, creates an HTTPRoute + optional SecurityPolicy per session.
# Gateway config is passed from Volundr at session creation time.
gateway:
  # -- Enable Gateway API HTTPRoute for this session
  enabled: false
  # -- Name of the shared Gateway resource
  name: "volundr-gateway"
  # -- Namespace where the shared Gateway lives
  namespace: "volundr-system"
  # -- User ID label for the HTTPRoute (owner of the session)
  userId: ""
  # CORS configuration for cross-origin browser requests
  cors:
    # -- Allowed origins (e.g. ["https://volundr.example.com"])
    allowOrigins:
      - "*"
    # -- Allowed HTTP methods
    allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    # -- Allowed request headers
    allowHeaders:
      - Authorization
      - Content-Type
    # -- Allow credentials (cookies, auth headers)
    allowCredentials: true
  # JWT validation (Envoy SecurityPolicy)
  jwt:
    # -- Enable JWT SecurityPolicy for this session's HTTPRoute
    enabled: false
    # -- JWT issuer URL
    issuer: ""
    # -- Allowed JWT audiences
    audiences: []
    # -- JWKS URI for key retrieval
    jwksUri: ""
    workload:
      # -- Enable workload JWT validation as an additional session-route provider
      enabled: false
      # -- Workload JWT issuer URL
      issuer: ""
      # -- Allowed workload JWT audiences
      audiences: []
      # -- JWKS URI for workload JWT key retrieval
      jwksUri: ""

# Pod configuration
# -- Extra labels applied to session pods (e.g. volundr/owner for PVC isolation)
podLabels: {}
# -- Extra annotations applied to session pods (e.g. for secret injection webhooks)
podAnnotations: {}
# -- Node selector for scheduling
nodeSelector: {}
# -- Tolerations for scheduling
tolerations: []
# -- Affinity rules for scheduling
affinity: {}

# -- Runtime class name for the pod (e.g., "nvidia", "kata", "gvisor")
runtimeClassName: ""

# -- Service account name for the pod (set by secret injection contributor)
serviceAccountName: ""

# -- Additional init containers to add to the session pod.
extraInitContainers: []

# -- Additional sidecar containers to add to the session pod.
extraContainers: []

# -- Extra volumes to add to the pod (e.g., CSI secret volumes)
extraVolumes: []

# -- Extra volume mounts added to skuld and devrunner containers
extraVolumeMounts: []

# -- Desired Deployment replicas. Resident lifecycle control uses 0/1 for
# suspend and resume while preserving configured persistent storage.
replicaCount: 1

# -- Mesh configuration for session-local agent flocks.
mesh:
  enabled: false
  transport: nng
  peerPorts: []

# Mímir memory instances handed to the resident's ravn daemon
# (same shape the ravn node config `mimir.instances` accepts).
mimir:
  # -- Mímir instances mounted by the resident ravn (name/role/url or path)
  instances: []

# First-class resident ravn support: a long-lived room-mode chat agent.
# When enabled, the pod becomes broker (room mode) + one ravn daemon sidecar —
# the same shape the platform's ResidentContributor provisions, but declared
# with a small hand-written values file (gitops-friendly).
resident:
  # -- Deploy this release as a resident ravn (broker room mode + ravn sidecar)
  enabled: false
  # -- Exact collaboration-event redeliveries retained by the room adapter.
  roomDeliveryDedupeMaxEntries: 4096
  # -- Stable environment identity shared by the resident Ravn and its room.
  environmentId: "local"
  # -- Display identity of the resident (e.g. "Muninn"); defaults to persona
  name: ""
  # -- Ravn persona the resident runs as (required when enabled)
  persona: ""
  # -- Route id: path segment for the gateway HTTPRoute (/s/<routeId>) and the
  # session id. MUST be unique per gateway; empty derives
  # "<namespace>-<release>" from the Helm release.
  routeId: ""
  # -- Max concurrent initiative tasks for the resident ravn
  maxConcurrentTasks: 3
  # -- Daily LLM budget cap in USD (float as string, e.g. "100.0"); empty = uncapped
  dailyBudgetUsd: ""
  # -- Ravn llm config dict rendered verbatim into the node config
  llm: {}
  # -- Secrets injected only into the resident Ravn daemon.
  # Uses the same envVar/secretName/secretKey shape as top-level envSecrets.
  envSecrets: []
  # -- Optional heterogeneous flock membership supplied by Volundr.
  flock:
    id: ""
    memberId: ""
    role: ""
    peerId: ""
    # -- Mesh transport selected by the operator-owned resident profile.
    mesh:
      # Example: [{adapter: sleipnir, transport: nats}]
      adapters: []
      # NATS transport settings use the native Ravn mesh.nats contract.
      nats: {}
    discovery:
      # Example: [{adapter: event_bus, transport: nats}]
      adapters: []
  skuld:
    # -- Seconds between attempts when the resident Ravn connects to the broker room.
    reconnectDelaySeconds: 2
    # -- Attempts before giving up on the initial broker room connection.
    maxReconnectAttempts: 60
    # -- Seconds to wait for a launched Volundr session to become running
    # before opening a cross-session observer join.
    sessionReadyTimeoutSeconds: 600
  platform:
    # -- Give the resident platform access (Volundr gateway + workload identity)
    enabled: false
    # -- In-cluster Volundr base URL for the ravn platform gateway
    baseUrl: ""
    # -- Optional workload token exchange URL for the ravn platform gateway.
    # Defaults to volundr.apiUrl + /api/v1/tokens/workload/exchange.
    workloadExchangeUrl: ""
    # -- Per-resident workflow aliases for chat launches through ting_workflow.
    # Example:
    # workflowAliases:
    #   research:
    #     name: Research Campaign
    #     defaults:
    #       gate_auto_forward_after: ""
    workflowAliases: {}
  mimir:
    sourceTrigger:
      # -- Automatically synthesize unprocessed Mímir sources.
      enabled: true
      # -- Seconds between source-trigger polls.
      pollIntervalSeconds: 60
    stalenessTrigger:
      # -- Periodically refresh stale frequently-used Mímir pages.
      enabled: true
      # -- Hours between staleness checks.
      scheduleHours: 6
  # -- Ravn wakefulness trigger configuration. Passed through to ravn.yaml.
  wakefulness:
    enabled: false
  workloadIdentity:
    # -- Audience for the projected serviceAccountToken
    audience: "volundr-api"
    # -- Expiration (seconds) for the projected serviceAccountToken
    expirationSeconds: 1200

# -- Secret mapping manifest for file-based credential injection.
# Rendered into a ConfigMap and mounted at /run/secrets/manifest.json.
# See containers/skuld/entrypoint.sh for the manifest schema.
secretManifest: {}

# Security context for the pod
securityContext:
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 1000
  # -- Filesystem group ID
  fsGroup: 1000
