{{- include "skuld.roomGatewayValidate" . -}}
{{- $room := include "skuld.roomGatewayEnabled" . -}}
{{- $upstream := ternary "local_broker" "local_nginx" (not (empty $room)) -}}
{{- if include "skuld.authEnforced" . }}
{{- if not (and .Values.envoy.jwt.enabled .Values.envoy.jwt.issuer .Values.envoy.jwt.audiences .Values.envoy.jwt.keycloakTls (hasPrefix "https://" .Values.envoy.jwt.jwksUri)) }}
{{- fail "Enforced Skuld sidecar requires a JWT issuer, audiences and verified HTTPS JWKS" }}
{{- end }}
{{- if and .Values.envoy.jwt.workload.enabled (not (and .Values.envoy.jwt.workload.issuer .Values.envoy.jwt.workload.audiences .Values.envoy.jwt.workload.jwksTls (hasPrefix "https://" .Values.envoy.jwt.workload.jwksUri))) }}
{{- fail "Enforced Skuld workload JWTs require issuer, audiences and verified HTTPS JWKS" }}
{{- end }}
{{- end }}
{{- if include "skuld.envoyEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skuld.fullname" . }}-envoy
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoy.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    upgrade_configs:
                      - upgrade_type: websocket
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            {{- if and .Values.wsAuth.enforce_ownership (not $room) }}
                            {{- range list "/health" "/ready" }}
                            - match:
                                path: {{ . | quote }}
                              route:
                                cluster: {{ $upstream }}
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            {{- end }}
                            - match:
                                prefix: "/"
                                headers:
                                  - name: ":method"
                                    string_match:
                                      exact: OPTIONS
                              route:
                                cluster: {{ $upstream }}
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                            {{- end }}
                            {{- if .Values.preview.enabled }}
                            # Live preview: an app's responses and hot-reload
                            # sockets stream for as long as the browser holds them.
                            - match:
                                prefix: "/preview/"
                              route:
                                cluster: {{ $upstream }}
                                timeout: 0s
                                idle_timeout: {{ .Values.preview.streamIdleTimeout }}
                            {{- end }}
                            - match:
                                prefix: "/"
                              route:
                                cluster: {{ $upstream }}
                                timeout: {{ .Values.envoy.upstreamTimeout }}
                    http_filters:
                      {{- if .Values.envoy.jwt.enabled }}
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              function envoy_on_request(handle)
                                {{- range .Values.envoy.headerNames }}
                                handle:headers():remove({{ . | quote }})
                                {{- end }}
                                {{- range .Values.envoy.jwt.extraClaimHeaders }}
                                handle:headers():remove({{ .headerName | quote }})
                                {{- end }}
                                {{- range .Values.envoy.jwt.workload.extraClaimHeaders }}
                                handle:headers():remove({{ .headerName | quote }})
                                {{- end }}
                              end
                      {{- end }}
                      {{- if .Values.envoy.jwt.enabled }}
                      # JWT Authentication filter
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              {{- include "skuld.envoy.keycloakJwtProvider" (dict "root" . "params" true) | nindent 30 }}
                            {{- if .Values.envoy.jwt.workload.enabled }}
                            workload:
                              {{- include "skuld.envoy.workloadJwtProvider" (dict "root" . "params" true) | nindent 30 }}
                            {{- end }}
                            {{- if .Values.preview.enabled }}
                            {{- if not .Values.envoy.jwt.workload.enabled }}
                            {{- fail "preview.enabled with envoy.jwt.enabled needs envoy.jwt.workload.enabled: Envoy verifies the router's workload credential on /preview/" }}
                            {{- end }}
                            workload_preview:
                              {{- include "skuld.envoy.workloadJwtProvider" (dict "root" . "params" false) | nindent 30 }}
                            {{- end }}
                          rules:
                            {{- if .Values.preview.enabled }}
                            # Live preview, first: the router's credential comes from
                            # Authorization only, never the app's own ?token= (see
                            # _envoy_jwt.tpl).
                            - match:
                                prefix: "/preview/"
                              requires:
                                provider_name: workload_preview
                            {{- end }}
                            {{- if not $room }}
                            - match:
                                path: /health
                            - match:
                                path: /ready
                            - match:
                                prefix: "/"
                                headers:
                                  - name: ":method"
                                    exact_match: "OPTIONS"
                            {{- end }}
                            - match:
                                prefix: "/"
                              requires:
                                {{- if .Values.envoy.jwt.workload.enabled }}
                                requires_any:
                                  requirements:
                                    - provider_name: keycloak
                                    - provider_name: workload
                                {{- else }}
                                provider_name: keycloak
                                {{- end }}
                      {{- end }}
                      {{- with .Values.envoy.extraHttpFilters }}
                      {{- toYaml . | nindent 22 }}
                      {{- end }}
                      {{- if include "skuld.authEnforced" . }}
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          grpc_service:
                            envoy_grpc:
                              cluster_name: cedar_authz
                            timeout: {{ include "skuld.extAuthzTimeout" . }}
                          failure_mode_allow: false
                          status_on_error:
                            code: ServiceUnavailable
                          metadata_context_namespaces:
                            - envoy.filters.http.jwt_authn
                      {{- end }}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        {{- if include "skuld.authEnforced" . }}
        - name: cedar_authz
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STATIC
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: cedar_authz
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ .Values.envoy.authorization.port }}
        {{- end }}
        {{- if $room }}
        # Room gateway: no nginx. Envoy fronts the loopback-only broker directly.
        - name: local_broker
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: local_broker
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8081
        {{- else }}
        - name: local_nginx
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: local_nginx
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ .Values.service.port | default 8080 }}
        {{- end }}
        {{- if .Values.envoy.jwt.enabled }}
        - name: keycloak
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: keycloak
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.jwt.keycloakHost | quote }}
                          port_value: {{ .Values.envoy.jwt.keycloakPort }}
          {{- if .Values.envoy.jwt.keycloakTls }}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ .Values.envoy.jwt.keycloakHost | quote }}
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: {{ .Values.envoy.jwt.keycloakCaFile | quote }}
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: {{ .Values.envoy.jwt.keycloakHost | quote }}
          {{- end }}
        {{- if .Values.envoy.jwt.workload.enabled }}
        - name: workload_jwks
          connect_timeout: {{ .Values.envoy.connectTimeout }}
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: workload_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.jwt.workload.jwksHost | quote }}
                          port_value: {{ .Values.envoy.jwt.workload.jwksPort | default 443 }}
          {{- if .Values.envoy.jwt.workload.jwksTls }}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ .Values.envoy.jwt.workload.jwksHost | quote }}
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: {{ .Values.envoy.jwt.workload.jwksCaFile | quote }}
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: {{ .Values.envoy.jwt.workload.jwksHost | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.envoy.extraClusters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{ .Values.envoy.adminPort }}
{{- end }}
