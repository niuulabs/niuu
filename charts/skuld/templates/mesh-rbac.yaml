{{- /*
The permission k8s discovery needs, and no more: the session's ServiceAccount may read the pods of
its own namespace. A Role and RoleBinding (never a ClusterRole), created only when the mesh
lists pods (skuld.meshUsesK8sDiscovery). Shared with the skuld-planner chart by symlink.
*/ -}}
{{- if include "skuld.meshUsesK8sDiscovery" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skuld.fullname" . }}-mesh-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skuld.fullname" . }}-mesh-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "skuld.fullname" . }}-mesh-discovery
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName | default "default" | quote }}
    namespace: {{ .Release.Namespace }}
{{- end }}
