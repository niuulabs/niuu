apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skuld.fullname" . }}-nginx
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 256;
    }

    http {
        log_format safe '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
        access_log /dev/stdout safe;

        # Temp paths writable by non-root
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        # Timeouts for long-running connections (WebSocket)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # File upload support
        client_max_body_size 100m;

        # "upgrade" only on a WebSocket handshake; plain requests keep alive.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        # Upstream definitions - static backends
        upstream broker {
            server 127.0.0.1:{{ .Values.brokerPort | default 8081 }};
        }
        {{- range $i, $m := .Values.members }}

        # Member {{ $i }} of the unit: its own Skuld, in this pod.
        upstream member_{{ $i }} {
            server 127.0.0.1:{{ int $m.port }};
        }
        {{- end }}

        server {
            listen {{ if and .Values.wsAuth.enforce_ownership .Values.envoy.enabled }}127.0.0.1:{{ end }}8080;
            server_name _;

            # Broker: WebSocket session endpoint
            location = {{ .Values.ingress.paths.session }} {
                proxy_pass http://broker{{ .Values.ingress.paths.session }};
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location {{ .Values.ingress.paths.session }}/ {
                proxy_pass http://broker{{ .Values.ingress.paths.session }}/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            {{- if .Values.preview.enabled }}
            # Live preview: Forge's preview router to a session port, through the
            # broker (skuld.preview). Bodies stream unbuffered both ways.
            location /preview/ {
                proxy_pass http://broker;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout {{ .Values.preview.streamIdleTimeout }};
                proxy_send_timeout {{ .Values.preview.streamIdleTimeout }};
                client_max_body_size 0;
            }
            {{- end }}

            # Broker: REST API endpoints
            location = /api {
                return 301 /api/;
            }
            location /api/ {
                proxy_pass http://broker/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # Broker: health and readiness (for probes)
            location /health {
                proxy_pass http://broker/health;
            }

            location /ready {
                proxy_pass http://broker/ready;
            }

            {{- if and .Values.localServices.enabled .Values.localServices.terminal.debug }}
            # Debug terminal UI - serve single page directly at /debug
            location = /debug {
                alias /etc/terminal-debug/index.html;
                default_type text/html;
                add_header Cache-Control "no-cache";
            }
            location = /debug/ {
                return 301 /debug;
            }
            {{- end }}

            {{- if .Values.localServices.enabled }}
            # Terminal: WebSocket PTY with restricted shell
            location = /terminal {
                return 301 /terminal/;
            }
            location /terminal/ {
                proxy_pass http://127.0.0.1:{{ .Values.localServices.terminal.port }}/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            # Dynamic local services - config generated by devrunner
            include {{ .Values.persistence.mountPath }}/{{ include "skuld.sessionId" . }}/workspace/.services/nginx.conf;

            # Service listing fallback when no services configured
            location = /svc {
                return 301 /svc/;
            }
            location /svc/ {
                default_type application/json;
                return 200 '{"services":[],"hint":"use svc start to add services","postgres":"postgresql://127.0.0.1:5432/postgres"}';
            }
            {{- end }}

            {{- range $i, $m := .Values.members }}
            {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9-]*$" (toString $m.id)) }}
            {{- fail (printf "member %d: id %q is not a session id (letters, digits and dashes)" $i (toString $m.id)) }}
            {{- end }}

            # A member of the unit, reached at /m/<its session id>/ (the gateway maps /s/<id>
            # here): its broker, with the same WebSocket upgrade as the session's own.
            location = /m/{{ $m.id }} {
                proxy_pass http://member_{{ $i }}/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            location /m/{{ $m.id }}/ {
                proxy_pass http://member_{{ $i }}/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_request_buffering off;
                client_max_body_size 100m;
            }
            {{- end }}

            # Default catch-all
            location / {
                proxy_pass http://broker/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }
