{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skuld.fullname" . }}
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "skuld.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ if include "skuld.envoyEnabled" . }}{{ .Values.envoy.port }}{{ else }}{{ .Values.service.port }}{{ end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if include "skuld.meshK8sDiscovery" . }}
    # The other sessions of the realm dial this pod's mesh PUB socket.
    - ports:
        - protocol: TCP
          port: {{ include "skuld.meshNngPort" . }}
      from:
        - podSelector:
            matchLabels:
              ravn.niuu.world/realm: {{ .Values.mesh.realmId | quote }}
              ravn.niuu.world/role: agent
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
