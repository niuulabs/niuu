{{- if and .Values.homeVolume.enabled .Values.homeVolume.persistentTmp }}
{{- $id := include "skuld.sessionId" . }}
{{- if not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9._-]*$" $id) }}
{{- fail "persistentTmp requires a non-empty, path-safe session id" }}
{{- end }}
{{- range .Values.extraContainers }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]*$" .name) }}
{{- fail "persistentTmp requires valid Kubernetes container names" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skuld.fullname" . }}
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "skuld.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skuld.labels" . | nindent 8 }}
        {{- if include "skuld.residentEnabled" . }}
        niuu.world/kind: resident
        niuu.world/persona: {{ include "skuld.residentPersona" . | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (include "skuld.residentEnabled" .) (and .Values.wsAuth.enforce_ownership .Values.envoy.enabled) }}
      annotations:
        {{- if and .Values.wsAuth.enforce_ownership .Values.envoy.enabled }}
        checksum/authz: {{ include (print $.Template.BasePath "/authz-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and (include "skuld.residentEnabled" .) (not (hasKey .Values.podAnnotations "niuu.world/resident-name")) }}
        niuu.world/resident-name: {{ include "skuld.residentName" . | quote }}
        {{- end }}
        {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
        {{- if and .Values.git.credentials.tokenFile (hasKey $annotations "vault.hashicorp.com/agent-inject") }}
        {{- $names := list "git-clone" "skuld" "devrunner" }}
        {{- range .Values.extraContainers }}
        {{- $names = append $names .name }}
        {{- end }}
        {{- $existing := splitList "," (index $annotations "vault.hashicorp.com/agent-inject-containers" | default "") }}
        {{- $_ := set $annotations "vault.hashicorp.com/agent-inject-containers" (join "," (uniq (compact (concat $existing $names)))) }}
        {{- end }}
        {{- with $annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.session.name }}
      hostname: {{ .Values.session.name | lower | trunc 63 | trimSuffix "-" | quote }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{- end }}
      # Allow time for chronicle summary generation during graceful shutdown
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- include "skuld.imagePullSecrets" . | nindent 6 }}
      {{- if or .Values.git.repoUrl .Values.homeVolume.enabled .Values.extraInitContainers }}
      initContainers:
        {{- if .Values.homeVolume.enabled }}
        - name: home-setup
          image: "{{ .Values.git.image.repository }}:{{ .Values.git.image.tag }}"
          imagePullPolicy: {{ .Values.git.image.pullPolicy }}
          securityContext:
            # Run as root to create directories on NFS-backed RWX volumes
            # (fsGroup does not reliably set ownership on NFS mounts).
            # Ownership is handed back to the non-root user via chown.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              HOME_DIR="{{ .Values.homeVolume.mountPath }}"
              SECRET_DIR="{{ .Values.homeVolume.credentialFiles.secretMountPath }}"
              DEST_DIR="{{ .Values.homeVolume.credentialFiles.destDir }}"
              CODEX_STATE_DIR="{{ printf "%s/.codex" (include "skuld.workspacePath" .) }}"
              TARGET_UID="{{ .Values.securityContext.runAsUser }}"
              TARGET_GID="{{ .Values.securityContext.fsGroup }}"

              # Create directory structure on the home PVC (idempotent)
              mkdir -p "$HOME_DIR/$DEST_DIR"
              mkdir -p "$HOME_DIR/.config"

              # Ensure the non-root user owns the home directory tree.
              # Only run recursive chown if the root directory doesn't already
              # have the correct ownership — avoids expensive traversal on
              # large home volumes where ownership is already correct.
              CURRENT_OWNER=$(stat -c '%u:%g' "$HOME_DIR" 2>/dev/null || echo "unknown")
              if [ "$CURRENT_OWNER" != "$TARGET_UID:$TARGET_GID" ]; then
                echo "Ownership mismatch ($CURRENT_OWNER != $TARGET_UID:$TARGET_GID), running chown -R"
                chown -R "$TARGET_UID:$TARGET_GID" "$HOME_DIR" 2>/tmp/chown.err || true
                if [ -s /tmp/chown.err ]; then
                  grep -Ev 'Invalid argument|No such file or directory|Stale file handle' /tmp/chown.err >&2 || true
                  if grep -qEv 'Invalid argument|No such file or directory|Stale file handle' /tmp/chown.err; then
                    echo "ERROR: chown encountered unexpected errors" >&2
                    cat /tmp/chown.err >&2
                    exit 1
                  fi
                fi
              else
                echo "Ownership already correct ($CURRENT_OWNER), skipping chown -R"
              fi

              # Symlink each credential file from the K8s secret into $DEST_DIR/
              # Full volume mounts auto-update when the secret changes (~60s),
              # and symlinks transparently resolve to the latest content.
              if [ -d "$SECRET_DIR" ]; then
                for f in "$SECRET_DIR"/*; do
                  [ -f "$f" ] || continue
                  name=$(basename "$f")
                  ln -sf "$SECRET_DIR/$name" "$HOME_DIR/$DEST_DIR/$name"
                done
                echo "Credential files symlinked from secret into $DEST_DIR"
              fi

              # Codex keeps sqlite/log runtime state under CODEX_HOME, which
              # must be session-local to avoid concurrent writers on the
              # shared home PVC. Seed only static auth/config files from the
              # shared home so existing Codex login state remains available.
              if [ "$DEST_DIR" = ".codex" ]; then
                mkdir -p "$CODEX_STATE_DIR"
                chown "$TARGET_UID:$TARGET_GID" "$(dirname "$CODEX_STATE_DIR")" 2>/dev/null || true
                for name in auth.json config.toml version.json models_cache.json; do
                  if [ -f "$HOME_DIR/$DEST_DIR/$name" ]; then
                    cp -f "$HOME_DIR/$DEST_DIR/$name" "$CODEX_STATE_DIR/$name"
                    chown "$TARGET_UID:$TARGET_GID" "$CODEX_STATE_DIR/$name" 2>/dev/null || true
                    chmod 600 "$CODEX_STATE_DIR/$name" 2>/dev/null || true
                  fi
                done
                chown -R "$TARGET_UID:$TARGET_GID" "$CODEX_STATE_DIR" 2>/dev/null || true
                echo "Codex auth/config seeded into session-local CODEX_HOME"
              fi

              echo "Home directory initialized at $HOME_DIR"
          volumeMounts:
            - name: home
              mountPath: {{ .Values.homeVolume.mountPath }}
            {{- if .Values.persistence.enabled }}
            - name: sessions
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.homeVolume.credentialFiles.secretName }}
            - name: credential-files
              mountPath: {{ .Values.homeVolume.credentialFiles.secretMountPath }}
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if and .Values.homeVolume.enabled .Values.homeVolume.persistentTmp }}
        - name: scratch-setup
          image: "{{ .Values.git.image.repository }}:{{ .Values.git.image.tag }}"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 007
              # Kubelet may create subPath directories as root before init runs.
              # Hand back only these directories, never traverse retained files.
              TARGET_OWNER="{{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.fsGroup }}"
              mkdir -p /home/tmp/cache "/home/tmp/sessions/{{ include "skuld.sessionId" . }}"
              chown -h "$TARGET_OWNER" /home/tmp /home/tmp/cache /home/tmp/sessions "/home/tmp/sessions/{{ include "skuld.sessionId" . }}"
              {{- $names := list "skuld" "devrunner" "ravn" }}
              {{- range .Values.extraContainers }}
              {{- $names = append $names .name }}
              {{- end }}
              {{- range $names }}
              mkdir -p "/home/tmp/sessions/{{ include "skuld.sessionId" $ }}/{{ . }}"
              chown -h "$TARGET_OWNER" "/home/tmp/sessions/{{ include "skuld.sessionId" $ }}/{{ . }}"
              chmod 1777 "/home/tmp/sessions/{{ include "skuld.sessionId" $ }}/{{ . }}"
              {{- end }}
          volumeMounts:
            - name: home
              mountPath: /home
        {{- end }}
        {{- if .Values.git.repoUrl }}
        - name: git-clone
          image: "{{ .Values.git.image.repository }}:{{ .Values.git.image.tag }}"
          imagePullPolicy: {{ .Values.git.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export GIT_TERMINAL_PROMPT=0
              WORKSPACE="{{ include "skuld.workspacePath" . }}"
              REPO_URL={{ .Values.git.repoUrl | replace "'" "'\\''" | squote }}
              BRANCH={{ .Values.git.branch | default "main" | replace "'" "'\\''" | squote }}
              BASE_BRANCH={{ .Values.git.baseBranch | default "" | replace "'" "'\\''" | squote }}
              if ! git -C "$WORKSPACE" rev-parse --git-dir >/dev/null 2>&1; then
                mkdir -p "$WORKSPACE"
                git init "$WORKSPACE"
              fi
              if git -C "$WORKSPACE" remote get-url origin >/dev/null 2>&1; then
                git -C "$WORKSPACE" remote set-url origin "$REPO_URL"
              else
                git -C "$WORKSPACE" remote add origin "$REPO_URL"
              fi
              {{- if .Values.git.credentials.tokenFile }}
              # Persist references, never tokens. Every Git process reads the mounted secret.
              test -s {{ .Values.git.credentials.tokenFile | replace "'" "'\\''" | squote }} || {
                echo "Selected Git integration token was not injected" >&2; exit 1;
              }
              git -C "$WORKSPACE" config niuu.gitTokenFile {{ .Values.git.credentials.tokenFile | replace "'" "'\\''" | squote }}
              git -C "$WORKSPACE" config niuu.gitUsername {{ .Values.git.credentials.username | replace "'" "'\\''" | squote }}
              git -C "$WORKSPACE" config credential.helper ''
              git -C "$WORKSPACE" config credential.useHttpPath true
              git -C "$WORKSPACE" config "credential.$REPO_URL.helper" \
                '!f() { [ "$1" = get ] || return 0; token=$(cat "$(git config niuu.gitTokenFile)") || return 1; [ -n "$token" ] || return 1; printf "username=%s\npassword=%s\n" "$(git config niuu.gitUsername)" "$token"; }; f'
              {{- else if .Values.git.credentials.secretName }}
              git -C "$WORKSPACE" config credential.helper \
                '!f() { [ "$1" = get ] || return 0; printf "username=%s\npassword=%s\n" "${GIT_USERNAME:-x-access-token}" "$GIT_TOKEN"; }; f'
              {{- end }}
              {{- if .Values.git.userName }}
              if ! git -C "$WORKSPACE" config user.name >/dev/null; then
                git -C "$WORKSPACE" config user.name {{ .Values.git.userName | replace "'" "'\\''" | squote }}
              fi
              {{- end }}
              {{- if .Values.git.userEmail }}
              if ! git -C "$WORKSPACE" config user.email >/dev/null; then
                git -C "$WORKSPACE" config user.email {{ .Values.git.userEmail | replace "'" "'\\''" | squote }}
              fi
              {{- end }}
              if git -C "$WORKSPACE" rev-parse HEAD >/dev/null 2>&1; then
                echo "Workspace already contains a valid git repository, skipping clone"
              else
                git -C "$WORKSPACE" fetch origin
                if git -C "$WORKSPACE" rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
                  git -C "$WORKSPACE" checkout -B "$BRANCH" "origin/$BRANCH"
                  echo "Checked out existing branch $BRANCH"
                else
                  if [ -n "$BASE_BRANCH" ] && git -C "$WORKSPACE" rev-parse --verify "origin/$BASE_BRANCH" >/dev/null 2>&1; then
                    FALLBACK="$BASE_BRANCH"
                  else
                    FALLBACK=$(git -C "$WORKSPACE" remote show origin | sed -n 's/.*HEAD branch: //p')
                    FALLBACK=${FALLBACK:-main}
                  fi
                  echo "Branch $BRANCH not found on remote, creating from $FALLBACK"
                  git -C "$WORKSPACE" checkout -B "$FALLBACK" "origin/$FALLBACK"
                  git -C "$WORKSPACE" checkout -b "$BRANCH"
                fi
                echo "Repository cloned successfully"
              fi
              mkdir -p "$WORKSPACE/.services"
              touch "$WORKSPACE/.services/nginx.conf"
              echo "Ensured dynamic service nginx config exists"
          {{- if or .Values.homeVolume.enabled (and .Values.git.credentials.secretName (not .Values.git.credentials.tokenFile)) }}
          env:
            {{- if .Values.homeVolume.enabled }}
            - name: HOME
              value: {{ .Values.homeVolume.mountPath | quote }}
            {{- end }}
            {{- if and .Values.git.credentials.secretName (not .Values.git.credentials.tokenFile) }}
            - name: GIT_USERNAME
              value: {{ .Values.git.credentials.username | default "x-access-token" | quote }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.credentials.secretName }}
                  key: {{ .Values.git.credentials.tokenKey | default "token" }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: sessions
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.homeVolume.enabled }}
            - name: home
              mountPath: {{ .Values.homeVolume.mountPath }}
              readOnly: true
            {{- end }}
            {{- range .Values.extraVolumeMounts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- range .Values.extraInitContainers }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      containers:
        # Nginx - single entry point, routes all traffic internally
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ ternary (.Values.envoy.port | int) "http" (and .Values.wsAuth.enforce_ownership .Values.envoy.enabled) }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ ternary (.Values.envoy.port | int) "http" (and .Values.wsAuth.enforce_ownership .Values.envoy.enabled) }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- if and .Values.localServices.enabled .Values.localServices.terminal.debug }}
            - name: terminal-debug
              mountPath: /etc/terminal-debug
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: sessions
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
        # Skuld broker - Claude Code CLI + REST API
        - name: skuld
          image: {{ include "skuld.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: broker
              containerPort: 8081
              protocol: TCP
            {{- range .Values.mesh.peerPorts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if and (include "skuld.residentEnabled" .) (not .Values.mesh.peerPorts) }}
            - name: mesh-pub
              containerPort: 7480
              protocol: TCP
            - name: mesh-rep
              containerPort: 7481
              protocol: TCP
            - name: mesh-hs
              containerPort: 7580
              protocol: TCP
            {{- end }}
          env:
            {{- include "skuld.scratchEnv" . | nindent 12 }}
            - name: SKULD__SESSION__WORKSPACE_DIR
              value: {{ include "skuld.workspacePath" . | quote }}
            {{- if and .Values.volundr.apiUrl (not (include "skuld.residentEnabled" .)) }}
            - name: SKULD__VOLUNDR_API_URL
              value: {{ .Values.volundr.apiUrl | quote }}
            {{- end }}
            - name: SKULD__SERVICE_USER_ID
              value: {{ .Values.volundr.serviceUserId | default "skuld-broker" | quote }}
            - name: SKULD__SERVICE_TENANT_ID
              value: {{ .Values.volundr.serviceTenantId | default "default" | quote }}
            {{- if .Values.volundr.externalApiTokenSecret.name }}
            - name: SKULD__EXTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.volundr.externalApiTokenSecret.name | quote }}
                  key: {{ .Values.volundr.externalApiTokenSecret.key | default "token" | quote }}
            {{- end }}
            {{- if .Values.homeVolume.enabled }}
            - name: HOME
              value: {{ .Values.homeVolume.mountPath | quote }}
            - name: CLAUDE_CONFIG_DIR
              value: "{{ .Values.homeVolume.mountPath }}/{{ .Values.homeVolume.credentialFiles.destDir }}"
            - name: CODEX_HOME
              value: {{ printf "%s/.codex" (include "skuld.workspacePath" .) | quote }}
            {{- end }}
            {{- range .Values.envSecrets }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.envVars }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- include "skuld.gitCredentialEnv" . | nindent 12 }}
            {{- if .Values.session.systemPrompt }}
            - name: SKULD__SESSION__SYSTEM_PROMPT
              value: {{ .Values.session.systemPrompt | quote }}
            {{- end }}
            {{- if .Values.session.initialPrompt }}
            - name: SKULD__SESSION__INITIAL_PROMPT
              value: {{ .Values.session.initialPrompt | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "skuld.scratchMounts" (dict "root" . "container" "skuld") | nindent 12 }}
            - name: skuld-config
              mountPath: /etc/skuld/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: sessions
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.homeVolume.enabled }}
            - name: home
              mountPath: {{ .Values.homeVolume.mountPath }}
            {{- if .Values.homeVolume.credentialFiles.secretName }}
            - name: credential-files
              mountPath: {{ .Values.homeVolume.credentialFiles.secretMountPath }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.secretManifest }}
            - name: secret-manifest
              mountPath: /run/secrets/manifest.json
              subPath: manifest.json
              readOnly: true
            {{- end }}
            {{- if and (include "skuld.residentEnabled" .) .Values.resident.platform.enabled }}
            - name: niuu-workload-identity
              mountPath: /var/run/secrets/niuu-workload
              readOnly: true
            {{- end }}
            {{- range .Values.extraVolumeMounts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- if include "skuld.residentEnabled" . }}
        # Ravn resident daemon — the long-lived room-mode agent behind the broker
        - name: ravn
          image: {{ include "skuld.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          command:
            - python
            - -m
            - ravn
            - daemon
            - --config
            - /etc/ravn/config.yaml
            - --persona
            - {{ include "skuld.residentPersona" . | quote }}
          env:
            {{- include "skuld.scratchEnv" . | nindent 12 }}
            - name: RAVN_PERSONA
              value: {{ include "skuld.residentPersona" . | quote }}
            - name: RAVN_PEER_ID
              value: {{ .Values.resident.flock.peerId | default (printf "flock-%s" (include "skuld.residentPersona" .)) | quote }}
            - name: HOME
              value: /workspace
            - name: RAVN_STATE_DIR
              value: /workspace/.ravn
            {{- range .Values.resident.envSecrets }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
          ports:
            - name: ravn-pub
              containerPort: 7482
              protocol: TCP
            - name: ravn-rep
              containerPort: 7483
              protocol: TCP
            - name: ravn-hs
              containerPort: 7581
              protocol: TCP
            - name: ravn-gw
              containerPort: 7781
              protocol: TCP
          volumeMounts:
            {{- include "skuld.scratchMounts" (dict "root" . "container" "ravn") | nindent 12 }}
            {{- if .Values.persistence.enabled }}
            - name: sessions
              mountPath: /workspace
              subPath: {{ include "skuld.sessionId" . }}/workspace
            {{- end }}
            {{- if .Values.homeVolume.enabled }}
            # /workspace is an emptyDir for residents, so anything ravn writes
            # there dies with the pod. The home claim is the only durable place
            # it can keep episodic memory across restarts.
            - name: home
              mountPath: {{ .Values.homeVolume.mountPath }}
            {{- end }}
            - name: ravn-config
              mountPath: /etc/ravn/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.resident.platform.enabled }}
            - name: niuu-workload-identity
              mountPath: /var/run/secrets/niuu-workload
              readOnly: true
            {{- end }}
        {{- end }}
        {{- range .Values.extraContainers }}
        {{- $container := deepCopy . }}
        {{- if hasPrefix "ravn-" $container.name }}
        {{- if and $.Values.git.credentials.tokenFile $container.command }}
        {{- $loader := list "/bin/sh" "-c" "set -e; if [ -f /run/secrets/env.sh ]; then . /run/secrets/env.sh; fi; exec \"$@\"" "--" }}
        {{- $_ := set $container "command" (concat $loader $container.command) }}
        {{- end }}
        {{- $env := $container.env | default list }}
        {{- $names := dict }}
        {{- range $env }}{{- $_ := set $names .name true }}{{- end }}
        {{- range (include "skuld.gitCredentialEnv" $ | fromYamlArray) }}
        {{- if not (hasKey $names .name) }}{{- $env = append $env . }}{{- end }}
        {{- end }}
        {{- $_ := set $container "env" $env }}
        {{- end }}
        {{- if and $.Values.homeVolume.enabled $.Values.homeVolume.persistentTmp }}
        {{- $scratchMounts := include "skuld.scratchMounts" (dict "root" $ "container" $container.name) | fromYamlArray }}
        {{- $mounts := $container.volumeMounts | default list }}
        {{- range $mounts }}
        {{- if or (eq .mountPath "/tmp") (eq .mountPath "/var/cache/niuu") }}
        {{- fail "persistentTmp conflicts with an extra container scratch mount" }}
        {{- end }}
        {{- end }}
        {{- $_ := set $container "volumeMounts" (concat $mounts $scratchMounts) }}
        {{- $env := $container.env | default list }}
        {{- $names := dict }}
        {{- range $env }}{{- $_ := set $names .name true }}{{- end }}
        {{- range (include "skuld.scratchEnv" $ | fromYamlArray) }}
        {{- if not (hasKey $names .name) }}{{- $env = append $env . }}{{- end }}
        {{- end }}
        {{- $_ := set $container "env" $env }}
        {{- end }}
        {{- if $.Values.git.credentials.tokenFile }}
        {{- $mounts := $container.volumeMounts | default list }}
        {{- $paths := dict }}
        {{- range $mounts }}
        {{- $_ := set $paths .mountPath true }}
        {{- end }}
        {{- range $.Values.extraVolumeMounts }}
        {{- if not (hasKey $paths .mountPath) }}
        {{- $mounts = append $mounts . }}
        {{- $_ := set $paths .mountPath true }}
        {{- end }}
        {{- end }}
        {{- $_ := set $container "volumeMounts" $mounts }}
        {{- end }}
        - {{- toYaml $container | nindent 10 }}
        {{- end }}
        {{- if .Values.localServices.enabled }}
        # Devrunner - minimal runtime for local service testing
        - name: devrunner
          image: "{{ .Values.localServices.devrunner.image.repository }}:{{ if and .Values.global .Values.global.image .Values.global.image.tag }}{{ .Values.global.image.tag }}{{ else }}{{ .Values.localServices.devrunner.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.localServices.devrunner.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          env:
            {{- include "skuld.scratchEnv" . | nindent 12 }}
            - name: SESSION_ID
              value: {{ include "skuld.sessionId" . | quote }}
            - name: SESSION_NAME
              value: {{ .Values.session.name | quote }}
            - name: WORKSPACE_DIR
              value: {{ include "skuld.workspacePath" . | quote }}
            - name: PERSISTENCE_MOUNT_PATH
              value: {{ .Values.persistence.mountPath | quote }}
            - name: TERMINAL_PORT
              value: {{ .Values.localServices.terminal.port | quote }}
            - name: TERMINAL_RESTRICTED
              value: {{ .Values.localServices.terminal.restricted | quote }}
            {{- if .Values.localServices.terminal.allowedCommands }}
            - name: ALLOWED_COMMANDS
              value: {{ .Values.localServices.terminal.allowedCommands | quote }}
            {{- end }}
            {{- if .Values.homeVolume.enabled }}
            - name: HOME
              value: {{ .Values.homeVolume.mountPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.localServices.devrunner.resources | nindent 12 }}
          volumeMounts:
            {{- include "skuld.scratchMounts" (dict "root" . "container" "devrunner") | nindent 12 }}
            {{- if .Values.persistence.enabled }}
            - name: sessions
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.homeVolume.enabled }}
            - name: home
              mountPath: {{ .Values.homeVolume.mountPath }}
            {{- end }}
            {{- if .Values.secretManifest }}
            - name: secret-manifest
              mountPath: /run/secrets/manifest.json
              subPath: manifest.json
              readOnly: true
            {{- end }}
            {{- range .Values.extraVolumeMounts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- if (and .Values.wsAuth.enforce_ownership .Values.envoy.enabled) }}
        - name: cedar-authz
          image: {{ include "skuld.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "identity.authz_main"]
          args: ["--config", "/etc/authorization/authz.yaml"]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; from envoy.service.auth.v3 import external_auth_pb2 as pb, external_auth_pb2_grpc as rpc; channel = grpc.insecure_channel('127.0.0.1:{{ .Values.envoy.authorization.port }}'); assert rpc.AuthorizationStub(channel).Check(pb.CheckRequest(), timeout={{ .Values.envoy.authorization.readinessProbe.timeoutSeconds }}).denied_response.status.code == 401"
            periodSeconds: {{ .Values.envoy.authorization.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.envoy.authorization.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.envoy.authorization.readinessProbe.failureThreshold }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.envoy.authorization.resources | nindent 12 }}
          volumeMounts:
            - name: authz-config
              mountPath: /etc/authorization
              readOnly: true
            {{- with .Values.envoy.authorization.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if .Values.envoy.enabled }}
        # Envoy sidecar - JWT validation and header extraction
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - name: envoy
              containerPort: {{ .Values.envoy.port }}
              protocol: TCP
          {{- with .Values.envoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            {{- with .Values.envoy.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
        {{- end }}
      volumes:
        {{- if and .Values.wsAuth.enforce_ownership .Values.envoy.enabled }}
        - name: authz-config
          configMap:
            name: {{ include "skuld.fullname" . }}-authz
        {{- end }}
        - name: skuld-config
          configMap:
            name: {{ include "skuld.fullname" . }}-config
        - name: nginx-config
          configMap:
            name: {{ include "skuld.fullname" . }}-nginx
        {{- if .Values.envoy.enabled }}
        - name: envoy-config
          configMap:
            name: {{ include "skuld.fullname" . }}-envoy
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: sessions
          {{- if .Values.persistence.emptyDir }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- end }}
        {{- end }}
        {{- if include "skuld.residentEnabled" . }}
        - name: ravn-config
          configMap:
            name: {{ include "skuld.fullname" . }}-ravn-config
        {{- if .Values.resident.platform.enabled }}
        - name: niuu-workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.resident.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.resident.workloadIdentity.expirationSeconds }}
        {{- end }}
        {{- end }}
        {{- if .Values.homeVolume.enabled }}
        - name: home
          persistentVolumeClaim:
            claimName: {{ .Values.homeVolume.existingClaim }}
        {{- if .Values.homeVolume.credentialFiles.secretName }}
        - name: credential-files
          secret:
            secretName: {{ .Values.homeVolume.credentialFiles.secretName }}
        {{- end }}
        {{- end }}
        {{- if and .Values.localServices.enabled .Values.localServices.terminal.debug }}
        - name: terminal-debug
          configMap:
            name: {{ include "skuld.fullname" . }}-terminal-debug
        {{- end }}
        {{- if .Values.secretManifest }}
        - name: secret-manifest
          configMap:
            name: {{ include "skuld.fullname" . }}-secret-manifest
        {{- end }}
        {{- range .Values.extraVolumes }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
