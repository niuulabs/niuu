{{- if include "skuld.residentEnabled" . -}}
{{- $persona := include "skuld.residentPersona" . -}}
{{- $routeId := include "skuld.routeId" . -}}
{{- $residentName := include "skuld.residentName" . -}}
{{- $instances := (.Values.mimir).instances | default list -}}
{{/* Default write mount: first local instance, else the sole instance. */}}
{{- $writeDefault := list -}}
{{- range $instances -}}
{{- if and (not $writeDefault) (eq (.role | default "shared") "local") -}}
{{- $writeDefault = list .name -}}
{{- end -}}
{{- end -}}
{{- if and (not $writeDefault) (eq (len $instances) 1) -}}
{{- $writeDefault = list (index $instances 0).name -}}
{{- end -}}
# Ravn node config for the resident daemon (mirrors the platform's
# ResidentContributor output). Mounted read-only at /etc/ravn/config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skuld.fullname" . }}-ravn-config
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
data:
  config.yaml: |
    persona: {{ $persona | quote }}
    mesh:
      enabled: true
      own_peer_id: {{ .Values.resident.flock.peerId | default (printf "flock-%s" $persona) | quote }}
      {{- if .Values.resident.flock.mesh.adapters }}
      adapters:
        - adapter: sleipnir
          transport: nng
        {{- toYaml .Values.resident.flock.mesh.adapters | nindent 8 }}
      {{- else }}
      adapter: nng
      {{- end }}
      nng:
        pub_sub_address: "tcp://0.0.0.0:7482"
        req_rep_address: "tcp://0.0.0.0:7483"
      {{- with .Values.resident.flock.mesh.nats }}
      nats:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      peers:
        - peer_id: {{ printf "skuld-%s" $routeId | quote }}
    discovery:
      enabled: true
      {{- if .Values.resident.flock.id }}
      realm_id: {{ .Values.resident.flock.id | quote }}
      {{- end }}
      adapters:
        - adapter: static
          peers:
            - peer_id: {{ printf "skuld-%s" $routeId | quote }}
              persona: "Skuld"
              pub_address: "tcp://127.0.0.1:7480"
              rep_address: "tcp://127.0.0.1:7481"
              handshake_port: 7580
              consumes_event_types: []
              emits_event_types:
                - code.changed
            - peer_id: {{ .Values.resident.flock.peerId | default (printf "flock-%s" $persona) | quote }}
              persona: {{ $persona | quote }}
              pub_address: "tcp://127.0.0.1:7482"
              rep_address: "tcp://127.0.0.1:7483"
              handshake_port: 7581
              consumes_event_types: []
              emits_event_types: []
          poll_interval_s: 0
        {{- with .Values.resident.flock.discovery.adapters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    cascade:
      enabled: true
    gateway:
      enabled: true
      channels:
        http:
          enabled: true
          host: "0.0.0.0"
          port: 7781
          resident_hud_enabled: {{ .Values.resident.hudEnabled | default false }}
        {{- if .Values.resident.openclaw.enabled }}
        # Sessions for Volundr's resident sessions API. agent_id "main" is the
        # session-key grammar the controller addresses (agent:main:niuu-<uuid>).
        openclaw:
          enabled: true
          host: "0.0.0.0"
          port: {{ .Values.resident.openclaw.port }}
          token_env: RAVN_OPENCLAW_TOKEN
          agent_id: main
          max_live_sessions: {{ .Values.resident.openclaw.maxSessions }}
          store_path: {{ .Values.resident.openclaw.storePath | quote }}
        {{- end }}
        {{- if .Values.resident.voice.enabled }}
        {{- if not .Values.resident.voice.minters }}
        {{- fail "resident.voice.enabled needs resident.voice.minters: at least one provider whose key file is mounted" }}
        {{- end }}
        {{- if not .Values.session.ownerId }}
        {{- fail "resident.voice.enabled needs session.ownerId: only the resident's owner may call it" }}
        {{- end }}
        # Realtime voice calls; nginx forwards /voice/ here.
        voice:
          enabled: true
          host: "127.0.0.1"
          port: {{ .Values.resident.voice.port }}
          store_path: {{ .Values.resident.voice.storePath | quote }}
          display_name: {{ .Values.resident.voice.displayName | default (include "skuld.residentName" .) | quote }}
          time_zone: {{ .Values.resident.voice.timeZone | quote }}
          owner_id: {{ .Values.session.ownerId | quote }}
          user_id_header: {{ .Values.envoy.headerNames.userId | quote }}
          {{- with .Values.resident.voice.models }}
          models:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          minters:
            {{- toYaml .Values.resident.voice.minters | nindent 12 }}
          {{- if .Values.resident.voice.roomCopy }}
          room_broker_url: "http://127.0.0.1:8081"
          room_participant_id: {{ .Values.resident.flock.peerId | default (printf "flock-%s" $persona) | quote }}
          {{- end }}
        {{- end }}
      {{- if .Values.resident.platform.enabled }}
      platform:
        enabled: true
        base_url: {{ required "resident.platform.baseUrl is required when resident.platform.enabled=true" .Values.resident.platform.baseUrl | quote }}
        # Workload identity (config-first; replaces the legacy
        # NIUU_WORKLOAD_IDENTITY_* env vars on the ravn container).
        workload_token_file: "/var/run/secrets/niuu-workload/token"
        workload_exchange_url: {{ include "skuld.residentWorkloadExchangeUrl" . | quote }}
        {{- with .Values.resident.platform.workflowAliases }}
        workflow_aliases:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resident.platform.a2aAgentCardUrls }}
        a2a_agent_card_urls:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resident.platform.a2aDefaultConnectionId }}
        a2a_default_connection_id: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- $codexAuthAdapter := dig "codexAuth" "adapter" "" .Values.broker }}
    {{- if and .Values.resident.platform.enabled $codexAuthAdapter (ne $codexAuthAdapter "skuld.codex_auth.HostCodexAuthProvider") }}
    # The resident's own Codex transport (a persona on CliTransportExecutor)
    # authenticates through the same broker contract as the skuld container
    # (skuld-configmap codex_auth), using this container's workload identity
    # (gateway.platform above). Without it the transport falls back to the
    # host login in $HOME/.codex, which a resident's own home never has.
    # The broker is the cluster's own Volundr, the one the skuld container
    # calls (volundr_api_url); the token is still exchanged at the platform.
    runtime_executor:
      codex_auth_adapter: {{ $codexAuthAdapter | quote }}
      codex_auth_kwargs: {{ dig "codexAuth" "kwargs" dict .Values.broker | toJson }}
      {{- if .Values.volundr.apiUrl }}
      volundr_api_url: {{ .Values.volundr.apiUrl | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.resident.triggers.enabled }}
    {{- if not .Values.resident.platform.enabled }}
    {{- fail "resident.triggers.enabled requires resident.platform.enabled — a resident with no platform gateway has nothing to poll its triggers from" }}
    {{- end }}
    resident_triggers:
      enabled: true
      poll_interval_seconds: {{ .Values.resident.triggers.pollIntervalSeconds | float64 }}
      max_consecutive_poll_failures: {{ .Values.resident.triggers.maxConsecutivePollFailures }}
    {{- end }}
    {{- if .Values.resident.budget.enabled }}
    {{- if not .Values.resident.platform.enabled }}
    {{- fail "resident.budget.enabled requires resident.platform.enabled — a resident with no platform gateway has nowhere to report spend to" }}
    {{- end }}
    resident_budget:
      adapter: ravn.adapters.resident_budget.PlatformBudgetReporter
      kwargs:
        base_url: {{ .Values.resident.platform.baseUrl | quote }}
        workload_token_file: "/var/run/secrets/niuu-workload/token"
        workload_exchange_url: {{ include "skuld.residentWorkloadExchangeUrl" . | quote }}
    {{- end }}
    initiative:
      enabled: true
      max_concurrent_tasks: {{ .Values.resident.maxConcurrentTasks }}
    {{- if $instances }}
    mimir:
      enabled: true
      instances:
        {{- toYaml $instances | nindent 8 }}
      source_trigger:
        enabled: {{ .Values.resident.mimir.sourceTrigger.enabled }}
        poll_interval_seconds: {{ .Values.resident.mimir.sourceTrigger.pollIntervalSeconds }}
      staleness_trigger:
        enabled: {{ .Values.resident.mimir.stalenessTrigger.enabled }}
        schedule_hours: {{ .Values.resident.mimir.stalenessTrigger.scheduleHours }}
      write_routing:
        rules: []
        {{- if $writeDefault }}
        default:
          {{- toYaml $writeDefault | nindent 10 }}
        {{- else }}
        default: []
        {{- end }}
    {{- end }}
    permission:
      workspace_root: /workspace
    logging:
      level: INFO
    {{- if .Values.resident.dailyBudgetUsd }}
    budget:
      daily_cap_usd: {{ .Values.resident.dailyBudgetUsd | float64 }}
    {{- end }}
    {{- with .Values.resident.llm }}
    llm:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.resident.wakefulness }}
    wakefulness:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    skuld:
      enabled: true
      broker_url: "ws://127.0.0.1:8081/ws/ravn"
      display_name: {{ $residentName | quote }}
      reconnect_delay_seconds: {{ .Values.resident.skuld.reconnectDelaySeconds | default 2 }}
      max_reconnect_attempts: {{ .Values.resident.skuld.maxReconnectAttempts | default 60 }}
      session_ready_timeout_seconds: {{ .Values.resident.skuld.sessionReadyTimeoutSeconds | default 600 }}
    environment:
      id: {{ .Values.resident.environmentId | quote }}
      resident_name: {{ $residentName | quote }}
      {{- if .Values.resident.realm.slug }}
      charter_mimir_page: {{ printf "realms/%s/charter.md" .Values.resident.realm.slug | quote }}
      {{- end }}
    {{- if .Values.resident.stewardshipIntervalSeconds }}
    resident_state:
      stewardship_interval_seconds: {{ .Values.resident.stewardshipIntervalSeconds | float64 }}
    {{- end }}
    {{- if .Values.resident.realm.slug }}
    resident_evolution:
      realm_slug: {{ .Values.resident.realm.slug | quote }}
      realm_api_base_url: {{ .Values.resident.platform.baseUrl | quote }}
    {{- end }}
    {{- with .Values.resident.observability }}
    observability:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.resident.memory }}
    memory:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
