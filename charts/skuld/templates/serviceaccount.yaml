{{/*
A resident's own ServiceAccount gives its projected workload-identity token a
subject unique to THIS resident (system:serviceaccount:<ns>:<name>), instead
of every resident in the namespace sharing the default ServiceAccount's
identity. Völundr sets .Values.serviceAccountName to the same
"resident-<uuid>" name it deploys the release under (see
volundr/adapters/outbound/flux.py _resident_release_name) and the niuu
workload-identity mapping's owner_id_claim_pattern extracts that id back out
server-side — this is the same boundary the trigger poll uses, per-resident.

Gated additionally on resident.serviceAccount.create (default false): a
ServiceAccount can be shared across several resident releases (e.g.
Fleet-managed ones with a stable, non-per-runtime name — a bundle's own
serviceaccount.yaml or another controller already owns that object). This
chart must only create one when FluxPodManager assigns a name unique to THIS
release (resident-<runtime.id>) and says so explicitly — creating one
unconditionally would fail on Helm ownership for a shared name, and
uninstalling any one such release would delete an SA every other resident
still uses. Only rendered for resident releases; ordinary session pods keep
using the namespace default ServiceAccount as before.
*/}}
{{- if and (include "skuld.residentEnabled" .) .Values.serviceAccountName .Values.resident.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName | quote }}
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
# The resident reads its workload-identity token from a dedicated projected
# volume (niuu-workload-identity, mounted at /var/run/secrets/niuu-workload —
# see deployment.yaml), which carries the correctly configured audience
# (resident.workloadIdentity.audience) the exchange's verifier expects. The
# default automounted ServiceAccount token nothing reads, and mounting it
# anyway is an unused credential this pod does not need.
automountServiceAccountToken: false
{{- end }}
