{{- if include "skuld.roomGatewayEnabled" . -}}
{{- include "skuld.roomGatewayValidate" . -}}
{{- $rg := .Values.roomGateway -}}
{{- $dataPath := $rg.dataPath | trimSuffix "/" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skuld.fullname" . }}-config
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Skuld broker configuration for a room gateway (generated by Helm).
    # The broker is only a collaboration room: it owns no CLI agent, reports to
    # no Forge session and listens on loopback, so Envoy (JWT + Cedar ownership)
    # is the only way in.
    host: "127.0.0.1"
    port: 8081

    session:
      id: {{ include "skuld.sessionId" . | quote }}
      name: {{ .Values.session.name | quote }}
      owner_id: {{ .Values.session.ownerId | quote }}
      tenant_id: {{ .Values.session.tenantId | quote }}
      workspace_dir: {{ printf "%s/workspace" $dataPath | quote }}
    persistence_mount_path: {{ $dataPath | quote }}

    event_log_enabled: false
    activity_reporting_enabled: false
    chronicle_watcher_enabled: false
    chronicle_on_stop_enabled: false
    reflex:
      enabled: false
    forge_mcp:
      enabled: false

    room:
      enabled: true
      # The room owns no CLI agent: chat goes to the resident that connects to
      # /ws/ravn/<peer>, never to a Claude/Codex process of the broker's own.
      routed: true
      environment_id: {{ $rg.room.environmentId | quote }}
      default_target_peer_id: {{ $rg.room.defaultTargetPeerId | quote }}
    mesh:
      enabled: false

    telegram:
      {{- if $rg.telegram.enabled }}
      # bot_token and chat_id arrive as SKULD__TELEGRAM__BOT_TOKEN and
      # SKULD__TELEGRAM__CHAT_ID from {{ $rg.telegram.secretName }}.
      enabled: true
      notify_only: {{ $rg.telegram.notifyOnly }}
      topic_mode: {{ $rg.telegram.topicMode | quote }}
      {{- if not (kindIs "invalid" $rg.telegram.messageThreadId) }}
      message_thread_id: {{ $rg.telegram.messageThreadId | int64 }}
      {{- end }}
      {{- else }}
      enabled: false
      {{- end }}
    {{- with $rg.observability }}

    observability:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    ws_auth:
      # Mandatory in this mode: Envoy verifies the JWT, the pod-local Cedar
      # service admits the room's owner (or a tenant administrator), and the
      # broker re-checks the same ownership on every WebSocket.
      enforce_ownership: true
      allow_loopback: false
      room_role_source: deployment
      user_id_header: {{ .Values.envoy.headerNames.userId | quote }}
      tenant_header: {{ .Values.envoy.headerNames.tenant | quote }}
      roles_header: {{ .Values.envoy.headerNames.roles | quote }}
      role_mapping: {{ .Values.envoy.authorization.roleMapping | toJson }}
      {{- toYaml (omit .Values.wsAuth "room_role_remote" "enforce_ownership" "allow_loopback" "room_role_source") | nindent 6 }}
      {{- if .Values.identityAuthority.enabled }}
      identity:
        adapter: identity.adapters.remote.RemoteHeaderAuthenticationAdapter
        kwargs:
          {{- include "skuld.identityAuthorityKwargs" . | nindent 10 }}
      {{- end }}
{{- end }}
