{{- if .Values.gateway.enabled -}}
# Gateway API HTTPRoute for session routing
# Routes traffic from the shared Gateway to this session's services:
#   /s/{session-id}/api       -> skuld (broker)
#   /s/{session-id}/code      -> code-server
#   /s/{session-id}/terminal  -> ttyd
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: session-{{ include "skuld.routeId" . }}
  labels:
    {{- include "skuld.labels" . | nindent 4 }}
    volundr.niuu.io/session: {{ include "skuld.sessionId" . | quote }}
    {{- with .Values.gateway.userId }}
    volundr.niuu.io/user: {{ . | quote }}
    {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  rules:
    # All session traffic — single prefix covers API, WebSocket, code-server, terminal
    - matches:
        - path:
            type: PathPrefix
            value: /s/{{ include "skuld.routeId" . }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            # This Gateway routes the browser straight to the session pod —
            # unlike the mini-mode session proxy (niuu.session_proxy), whose
            # own header-stripping this bypasses entirely. x-auth-* is
            # overwritten by the JWT claimToHeaders extraction in
            # securitypolicy.yaml, but x-niuu-room-role has no JWT claim to
            # overwrite it with, so a client-supplied copy must be removed
            # explicitly here or it would reach the broker's ASGI app
            # trusted (see skuld.broker_api._enforce_room_role, which only
            # checks the header's SHAPE, not who set it).
            remove:
              - {{ .Values.envoy.headerNames.roomRole | quote }}
      backendRefs:
        - name: {{ include "skuld.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
