# Database migrations configuration
migrations:
  # -- Enable database migrations via init container
  enabled: true
  image:
    # -- Migration image repository
    repository: migrate/migrate
    # -- Migration image tag
    tag: "v4.17.0"
    # -- Migration image pull policy
    pullPolicy: IfNotPresent
  # -- Resources for migration init container
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Init containers
initContainers: []

# -- Container lifecycle hooks
lifecycle: {}

# Persona distribution — controls how persona YAML is delivered to workloads.
#
# Three modes:
#
#   mountedVolume (default for cluster deployments)
#     Volundr writes personas to a Kubernetes ConfigMap ("ravn-personas").
#     Workload pods receive the ConfigMap as a read-only volume mount at mountPath.
#     The RBAC Role in rbac-personas.yaml grants volundr write access.
#
#   http
#     Workloads fetch personas at runtime via the volundr REST API.
#     No ConfigMap volume is needed. Workloads authenticate with their
#     projected workload identity and the configured Envoy-facing Volundr URL.
#
#   filesystem (dev / single-node)
#     Workloads use only the bundled built-in personas shipped in the personas package.
#     No volumes, secrets, or RBAC additions required.
#
personaSource:
  # -- Distribution mode: mountedVolume | http | filesystem
  mode: mountedVolume
  # -- ConfigMap name for mountedVolume mode
  configmapName: ravn-personas
  # -- Mount path inside workload containers (mountedVolume mode)
  mountPath: /etc/ravn/personas
  # -- Volundr base URL that workloads call to fetch personas (http mode)
  httpBaseUrl: http://volundr:8080

pat:
  token_issuer_adapter: niuu.adapters.memory_token_issuer.MemoryTokenIssuer
  token_issuer_kwargs: {}
  ttl_days: 365
  issuerSecretName: ""
  issuerSecretKey: client-secret
  service_adapter: niuu.domain.services.pat.PATService
  service_kwargs: {}
  validator_adapter: niuu.domain.services.pat_validator.PATValidator
  validator_kwargs: {}

# Shared identity service: fresh membership, role and credential checks.
# Point at the canonical identity service, never back at this client service.
identityAuthority:
  enabled: false
  url: ""
  timeout: 5
  caFile: ""
