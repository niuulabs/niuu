# Volundr Helm Chart Values
# Self-hosted Claude Code session manager
#
# ── Umbrella Chart Integration ────────────────────────────────────
# When deployed as a subchart of the niuu umbrella chart, the following
# global values are propagated automatically:
#
#   global.image.registry    - Container registry for all images (API + web)
#   global.image.tag         - Image tag override for all images
#   global.imagePullSecrets  - Pull secrets shared across all subcharts
#   global.domain            - Base domain (used for ingress/gateway hostnames)
#
# The chart works identically in standalone and subchart mode.
# All resource names use the fullname helper which adapts to the release name.

# Global values (can be set by parent chart)
global:
  # -- Global image pull secrets (list of secret names)
  imagePullSecrets: []
  # - ghcr-pull-secret
  image:
    # -- Global image registry override (applies to both API and web images)
    registry: ""
    # -- Global image repository override
    repository: ""
    # -- Global image tag override
    tag: ""
  # -- Global base domain (used for ingress hosts and gateway hostname)
  domain: ""
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

# Raw model windows when the native usage stream omits one; unknown models stay unknown.
sessionUsage:
  model_windows:
    claude-opus-5-5: 1000000
    claude-fable-5-1: 1000000
    claude-sonnet-5-5: 1000000
# -- Base domain for auto-generated hostnames (overridden by global.domain)
domain: ""

# -- Number of replicas (ignored if autoscaling is enabled)
replicaCount: 1

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 10

# Image configuration
image:
  # -- Container registry
  registry: ghcr.io
  # -- Image repository
  repository: niuulabs/niuu
  # -- Image tag (defaults to Chart.appVersion)
  tag: ""
  # -- Image pull policy
  pullPolicy: Always

# -- Override container command. Defaults to the unified niuu image running the Volundr API.
command:
  - uvicorn
# -- Additional container args.
args:
  - volundr.main:create_app
  - --factory
  - --host
  - "$(HOST)"
  - --port
  - "$(PORT)"
  - --workers
  - "$(WORKERS)"

# Service Account
serviceAccount:
  # -- Create a service account
  create: true
  # -- Service account name (defaults to fullname)
  name: ""
  # -- Annotations for the service account
  annotations: {}
  # -- Automount API credentials
  automount: true

# RBAC Configuration
rbac:
  # -- Create RBAC resources
  create: true
  # -- Enable cluster-wide RBAC (ClusterRole/ClusterRoleBinding)
  clusterWide: false
  # -- Additional rules for the Role
  extraRules: []
  # -- Additional rules for the ClusterRole
  extraClusterRules: []

# Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 80
  # -- Target port on the container
  targetPort: 8080
  # -- Cluster IP (only for ClusterIP type)
  clusterIP: ""
  # -- Load balancer IP (only for LoadBalancer type)
  loadBalancerIP: ""
  # -- Load balancer source ranges
  loadBalancerSourceRanges: []
  # -- External traffic policy
  externalTrafficPolicy: ""
  # -- Session affinity
  sessionAffinity: ""
  # -- Session affinity config
  sessionAffinityConfig: {}
  # -- Node port (only for NodePort type)
  nodePort: ""
  # -- Service annotations
  annotations: {}
  # -- Additional service ports
  extraPorts: []

# Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name (nginx, traefik, haproxy, etc.)
  className: ""
  # -- Ingress annotations (controller-specific)
  # Examples for different controllers:
  #
  # NGINX:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  #
  # Traefik:
  #   traefik.ingress.kubernetes.io/router.middlewares: default-timeout@kubernetescrd
  #
  # HAProxy:
  #   haproxy.org/timeout-server: "3600s"
  annotations: {}
  # -- Ingress hosts
  # Note: The API is served at /api/v1/* for path-based routing
  # with multiple services on the same domain
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1
          pathType: Prefix
        - path: /api/v1/users
          pathType: Prefix
        - path: /api/v1/niuu
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #   - secretName: volundr-tls
  #     hosts:
  #       - volundr.local

# Storage configuration
storage:
  sessions:
    # -- Enable sessions PVC
    enabled: true
    # -- Storage class for the sessions PVC
    storageClass: longhorn
    # -- Access mode - must be ReadWriteMany for shared access
    accessMode: ReadWriteMany
    # -- Size of the sessions PVC
    size: 1Gi
    # -- Mount path for sessions
    mountPath: /volundr/sessions
  home:
    # -- Enable home PVC (persistent user config across sessions)
    enabled: true
    # -- Storage class for the home PVC
    storageClass: longhorn
    # -- Access mode - must be ReadWriteMany for shared access
    accessMode: ReadWriteMany
    # -- Size of the home PVC (user config is small)
    size: 1Gi
    # -- Mount path inside session pods
    mountPath: /volundr/home
    # -- Workload types that never mount the user's home. With a
    # ReadWriteOnce home, every pod that mounts it must share one node;
    # leaving a workload type out lets it schedule anywhere.
    excludeWorkloadTypes: []

# Tool-result image preview cache (config.preview_cache_dir). The root
# filesystem is read-only, so this needs a writable mount; previews are
# regenerable, so an emptyDir suffices.
previewCache:
  # -- Mount path for the tool-result image preview cache, rendered into
  # config.yaml's preview_cache_dir
  mountPath: /volundr/preview-cache
  # -- Size limit for the preview cache emptyDir volume (leave empty/"" for no limit)
  sizeLimit: 1Gi
  # -- Preview sizes, rendered as config.yaml's tool_result_preview (snake_case keys).
  # Empty keeps the defaults: default_edge 400 (no ?max_edge=), min_edge 320,
  # max_edge 1600. Example: {default_edge: 400, min_edge: 320, max_edge: 2048}
  edges: {}

scratch:
  # -- Size limit for the /tmp emptyDir (the root filesystem is read-only). It holds
  # temporary files such as a resident workspace migration's archive and read-back
  # spools (two copies of a workspace of up to 1Gi). Leave empty/"" for no limit.
  sizeLimit: 4Gi

# Database configuration
database:
  # -- Database name
  name: volundr
  # -- Minimum connection pool size
  minPoolSize: 5
  # -- Maximum connection pool size
  maxPoolSize: 20
  # -- Create a secret for database credentials
  createSecret: false
  # -- Use an existing secret for database credentials (defaults to {fullname}-db)
  existingSecret: ""
  # -- Key in secret containing the username
  userKey: username
  # -- Key in secret containing the password
  passwordKey: password
  # -- Username (only if createSecret is true)
  username: ""
  # -- Password (only if createSecret is true) — MUST be overridden for production
  password: "CHANGE_ME"
  # -- Extra secret data
  extraSecretData: {}
  # -- Secret annotations
  secretAnnotations: {}
  # External database configuration
  external:
    # -- Use external database
    enabled: true
    # -- External database host
    host: postgresql.default.svc.cluster.local
    # -- External database port
    port: 5432

# Pod manager adapter (dynamic adapter pattern)
# Selects how Volundr deploys session pods. The "adapter" key is a
# fully-qualified Python class; all keys under "kwargs" are forwarded
# to the constructor as **kwargs. No code changes needed to switch
# backends — just update this section.
#
# ── Flux example ─────────────────────────────────────────────────
# Creates HelmRelease CRs directly; Flux reconciles them.
#
#   podManager:
#     adapter: "volundr.adapters.outbound.flux.FluxPodManager"
#     kwargs:
#       namespace: "default"
#       chart_name: "skuld"
#       chart_version: "0.1.0"
#       source_ref_kind: "HelmRepository"
#       source_ref_name: "skuld"
#       source_ref_namespace: ""
#       timeout: "5m"
#       interval: "5m"
#       base_domain: "skuld.example.com"
#       chat_scheme: "wss"
#       code_scheme: "https"
#       chat_path: "/session"
#       code_path: "/"
#       session_defaults:              # values passed to the skuld Helm chart
#         session:
#           model: "claude-sonnet-4-6"
#         image:
#           repository: "ghcr.io/niuulabs/skuld"
#           tag: "latest"
#
# ── OpenShell gateway example ─────────────────────────────────────
# Creates OpenShell sandboxes through the gateway API. Auth uses Keycloak
# client credentials; mount OPENSHELL_OIDC_CLIENT_SECRET from an existing
# secret via secretKwargs.
#
#   podManager:
#     adapter: "volundr.adapters.outbound.openshell_gateway.OpenShellGatewayPodManager"
#     kwargs:
#       gateway_endpoint: "openshell.openshell.svc.cluster.local:8080"
#       token_url: "https://keycloak.niuu.world/realms/volundr/protocol/openid-connect/token"
#       client_id: "openshell-volundr-agent"
#       sandbox_image: "ghcr.io/niuulabs/skuld:openshell-codex-openbao-20260709-7"
#       sandbox_command: ["/usr/local/bin/openshell-run-installed-skuld"]
#       sandbox_home: "/sandbox"
#       sandbox_policy:                # OpenShell SandboxPolicy; required for real clients
#         version: 1
#         filesystem:
#           include_workdir: true
#           read_only: ["/bin", "/etc", "/lib", "/opt", "/usr"]
#           read_write: ["/sandbox", "/run/secrets", "/tmp", "/dev/null"]
#         process:
#           run_as_user: sandbox
#           run_as_group: sandbox
#         network_policies: {}
#       credential_token_endpoint: "http://niuu-volundr.volundr.svc.cluster.local/api/v1/internal/openshell/credential-token"
#       volundr_api_url: "http://niuu-volundr.volundr.svc.cluster.local"
#       workload_audience: "volundr-api"
#       workload_roles: ["volundr:developer"]
#       spiffe_jwks_uri: "https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local/keys"
#       spiffe_issuer: "https://spire-spiffe-oidc-discovery-provider.spire.svc.cluster.local"
#       spiffe_audience: "http://niuu-volundr.volundr.svc.cluster.local/api/v1/internal/openshell/credential-token"
#       spiffe_subject_prefix: "spiffe://niuu.world/openshell/sandbox/"
#       spiffe_ca_cert_path: "/etc/spire/ca.crt"
#       service_port: 9200
#       # Labels Völundr puts on residents' workspace claims so the gateway's
#       # resource admission lets sandboxes mount them; match the gateway's
#       # required_labels (these are OpenShell's defaults).
#       sandbox_attachable_labels:
#         openshell.ai/sandbox-attachable: "true"
#         openshell.ai/sandbox-attachable-workspace: "default"
#     secretKwargs:
#       - kwarg: "client_secret"
#         secretName: "openshell-volundr-agent-oidc"
#         secretKey: "OPENSHELL_OIDC_CLIENT_SECRET"
#
# Session provisioning readiness polling
provisioning:
  # -- Maximum time to wait for infrastructure readiness in seconds
  timeoutSeconds: 300.0
  # -- Initial delay before starting readiness polls in seconds
  initialDelaySeconds: 5.0
  # -- Seconds between reads of a starting session's launch stages (pod conditions and events, VM state)
  startupPollSeconds: 2.0

# -- Seconds between realm-detail SSE state checks and idle keepalive comments
realmDetailStreamIntervalSeconds: 15.0

bifrost:
  # -- Required. Base URL of the Bifrost service Volundr reads models from; rendered with tpl
  url: ""
  # -- HTTP timeout for catalog fetches
  timeoutSeconds: 10.0
  # -- Interval between successful model catalog refreshes
  catalogRefreshIntervalSeconds: 60.0
  # -- First delay before retrying a failed catalog load; every failure is retried and logged
  catalogRetryInitialSeconds: 0.1
  # -- Longest delay between retries of a failed catalog load (backoff doubles up to this)
  catalogRetryMaxSeconds: 5.0
  auth:
    # -- Fully-qualified outbound auth adapter class
    adapter: "niuu.adapters.outbound.http_auth.NoAuthHeaderAdapter"
    # -- Kwargs forwarded to the auth adapter constructor
    kwargs: {}
    # -- Secret-backed kwargs forwarded through env indirection
    secretKwargs: []

compute: null

# Bring your own machines: a pool of registered hosts (Linux machines and Macs) that join
# this Forge with one command (Add host, or `niuu remote join`). Turning it on is the whole
# configuration: Forge runs Niuu's built-in host execution, generates its own host SSH key
# under dataDir, pins the release's session images (from image.tag) at startup, and with
# guestMetadata delivers session credentials to the hosts. It replaces podManager and
# compute for this release. See docs/operator/compute-hosts.md.
computeHosts:
  # -- Serve a pool of registered hosts
  enabled: false
  # -- This Forge's https URL as hosts reach it (its ingress): the join command, join.sh
  # and the guest agents' metadata calls go there
  joinUrl: ""
  # -- Compute pool id (also its provider binding)
  poolId: hosts
  # -- The registered-host provider's profile
  profile: host
  # -- How many hosts the pool may hold at once; a host beyond it waits as ready
  maxHosts: 16
  # -- Host platforms that may join: linux, darwin
  platforms: [linux, darwin]
  # -- Forge's own directory for the hosts (its generated SSH key, pinned host keys,
  # session archives); must be on the sessions volume
  dataDir: /volundr/sessions/hosts
  # -- Source networks Forge's SSH key is accepted from on a host (from=); [] accepts any
  allowedSources: []
  # -- What slot sizing leaves for each host itself
  reservedCpu: 2
  reservedMemoryMib: 4096
  # -- Free space on a host's / below which the audit quarantines it
  minFreeDiskMib: 20480
  # -- What one Linux slot may use (null: no limit); slot counts are suggested from these
  slot:
    cpu: 2
    memoryMib: 8192
    pids: 16384
  # -- Session images; empty: <image.registry>/openshell:<image.tag> and
  # <image.registry>/skuld-darwin:<image.tag>, the ones published with this release
  sessionImages:
    linux: ""
    darwin: ""
  # -- ServiceAccount sessions run as, for their projected token volumes
  defaultServiceAccount: ""
  # -- Images a Mac runs natively from its session bundle; empty: secretInjection's
  # guest_agent_image (OpenBao's agent), when set
  nativeImages: []
  # -- Skuld preview.router_auth for live preview on hosts ({adapter, kwargs}); {} is off
  previewRouterAuth: {}

# VM guest metadata endpoint (POST /api/v1/internal/compute/metadata/credentials). A VM
# session's guest agent pulls its ServiceAccount tokens and Forge session credential
# there, authenticated by the guest identity configured under `compute` (an Ed25519
# host-key signature or a SPIFFE JWT-SVID), never by a bearer Keycloak/workload JWT.
guestMetadata:
  # -- Serve the endpoint. Renders the Envoy bypass for exactly that route (JWT and
  # Cedar admission are skipped; the route authenticates the guest itself) and a Role
  # letting Forge request ServiceAccount tokens (serviceaccounts/token create).
  enabled: false
  # -- Namespace of the ServiceAccounts VM sessions run as, where Forge may request
  # their tokens. Must equal the token issuer's `namespace` kwarg. Empty:
  # podManager.kwargs.namespace, else the release namespace.
  serviceAccountNamespace: ""
  # -- Grant the ServiceAccount-token Role without serving the endpoint, for
  # SshPushCredentialDelivery (the controller writes tokens over SSH).
  issueServiceAccountTokens: false
  # -- Let Forge manage SPIRE ClusterStaticEntry registrations for VM guests
  # (SpiffeGuestIdentity); requires spire-controller-manager.
  spiffeRegistration: false

# Host connect endpoint for registered hosts behind NAT (ReverseSshConnector): an OpenSSH
# sidecar in the Forge pod. Each host keeps one `ssh -N -R` to it and forwards a port on
# the pod's loopback to its own sshd, which Forge dials. Its AuthorizedKeysCommand asks
# Forge on a socket in a volume only Forge and the sidecar mount; only keys of
# registered reverse-SSH hosts are admitted, each to listen on its own loopback port and
# nothing else. See docs/operator/compute-hosts.md ("Hosts behind NAT").
hostConnect:
  # -- Run the endpoint. Needs one Forge pod (replicaCount 1, strategy Recreate, no
  # autoscaling) and a namespace that admits a root container (Pod Security baseline):
  # sshd separates privileges per connection.
  enabled: false
  # -- Port sshd listens on in the pod, and the Service's port.
  port: 2222
  # -- The volume Forge and the sidecar share: the key-lookup socket, the connection
  # records and the revoke pipe. Must equal the connector's `runtime_dir` kwarg.
  runtimeDir: /run/niuu-connect
  # -- The account hosts log in as; must equal the connector's `connect_user` kwarg.
  # The image creates it with no password and no shell.
  user: niuu-connect
  # -- Existing Secret with the endpoint's own Ed25519 host key (OpenSSH format). Hosts
  # pin its public half: put that in the connector's `endpoint_host_key` kwarg.
  # Create it once: ssh-keygen -t ed25519 -N '' -f key && kubectl create secret generic
  # <name> --from-file=ssh_host_ed25519_key=key
  hostKeySecret:
    name: ""
    key: ssh_host_ed25519_key
  # -- Bound on one key lookup from sshd to Forge; past it the connection is refused
  # and the host retries.
  keyLookupTimeoutSeconds: 5
  # -- The image's Python, which runs the key command (root-owned, as sshd requires).
  python: /usr/local/bin/python3
  # -- Keepalive from the endpoint: a host silent for interval × countMax is dropped,
  # which frees its port for its reconnect.
  clientAliveIntervalSeconds: 15
  clientAliveCountMax: 3
  # -- Bound on a connection's authentication.
  loginGraceTimeSeconds: 20
  # -- Public-key attempts per connection; a host offers exactly one key.
  maxAuthTries: 2
  resources: {}
  # -- How hosts reach the endpoint: a LoadBalancer Service, or a Gateway TCPRoute to
  # a ClusterIP Service.
  service:
    type: LoadBalancer
    port: 2222
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
  tcpRoute:
    enabled: false
    # -- Gateway listeners (TCP) the route attaches to.
    parentRefs: []
    annotations: {}
  # -- NetworkPolicy ingress to the endpoint (networkPolicy.enabled); empty admits any
  # source, since hosts are wherever their NAT is.
  networkPolicyFrom: []

podManager:
  # -- Explicit contributor backend identity; set vm for VmPodManager
  runtimeBackend: ""
  # -- Fully-qualified class path for the PodManager adapter
  adapter: "volundr.adapters.outbound.flux.FluxPodManager"
  # -- "deployment" (default, unchanged) or "remote" (Kubernetes-only —
  # session_participants invites honoured; requires session pods deployed
  # with wsAuth.enforce_ownership: false). See PodManagerConfig.room_role_source.
  roomRoleSource: "deployment"
  # -- RemoteAuthorizationAdapter's cache TTL when roomRoleSource is "remote"
  roomRoleCacheTtlSeconds: 5.0
  # -- Existing secret containing the backend API token (mounted as POD_MANAGER_TOKEN)
  existingSecret: ""
  # -- Key in secret containing the token
  tokenKey: token
  # -- All kwargs forwarded to the adapter constructor
  kwargs:
    namespace: "default"
    chart_name: "skuld"
    chart_version: "0.1.0"
    source_ref_kind: "HelmRepository"
    source_ref_name: "skuld"
    base_domain: "skuld.example.com"
    chat_scheme: "wss"
    code_scheme: "https"
    chat_path: "/session"
    code_path: "/"
    # -- OpenShell residents (OpenShellGatewayPodManager) get their own workspace
    # PVC: resident-<id>-workspace, mounted at the sandbox workspace
    # (/sandbox/workspace), sized by resident_workspace_size / storage class /
    # access mode and deployment.volumes.workspace per profile. It is created in
    # resident_workspace_namespace, the namespace where the OpenShell gateway runs
    # sandboxes; unset, the chart uses storageAdapter.kwargs.namespace (where
    # OpenShell sessions' claims already live). Set it to "" to keep OpenShell
    # residents' workspaces in their sandboxes only. A resident whose sandbox
    # predates its claim has its workspace copied onto it once, verified, before
    # its old sandbox is removed. These kwargs belong to OpenShellGatewayPodManager:
    # FluxPodManager refuses any resident_* kwarg.
    # resident_workspace_namespace: "openshell-sandboxes"
    # resident_workspace_size: "2Gi"
    # -- Empty means the cluster's default StorageClass
    # resident_storage_class: ""
    # resident_access_mode: "ReadWriteOnce"
    # -- OpenShell: the largest workspace the one-time copy onto a resident's new
    # claim moves (Kubernetes quantity). A larger one is not migrated: the
    # resident keeps running on its old sandbox with a WorkspaceMigration /
    # WorkspaceTooLarge condition.
    # resident_workspace_migration_max_size: "1Gi"
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  # Each entry: { kwarg: "name", secretName: "k8s-secret", secretKey: "key" }
  secretKwargs: []

# OpenBao oauthapp owns Codex subscription renewal. The broker delivers only
# access tokens and account metadata from the configured OAuth credential store.
codexCredentialBroker:
  adapter: "volundr.adapters.outbound.codex_credential_broker.OpenBaoCodexCredentialBroker"
  kwargs: {}
  secretKwargs: []

# Trusted login runner is independent of the selected session pod manager.
# Configure KubernetesLoginRunner with kwargs.image (a pinned Skuld image) and
# kwargs.namespace (a dedicated login namespace) for Codex and Claude sign-in.
credentialEnrollmentRunner:
  adapter: "volundr.adapters.outbound.credential_enrollment_runner.UnsupportedCredentialEnrollmentRunner"
  kwargs: {}
  secretKwargs: []

# Operator-approved resident deployment profiles for this target. Profiles are
# hidden from the API until explicitly configured and enabled; backend-specific
# deployment details remain server-side.
residentRuntimeProfiles: []
# - id: nemoclaw-openshell
#   enabled: true
#   displayName: NemoClaw (OpenShell)
#   description: NVIDIA OpenClaw resident in an OpenShell sandbox
#   backend: openshell
#   engine: openclaw   # openclaw or hermes; the ravn engine was removed and is refused
#   # OpenShell sandboxes cannot be suspended: do not list runtime.suspend
#   capabilities: [chat, runtime.restart, logs, usage]
#   defaultModel: claude-sonnet-4-6
#   # Engine compatibility policy; only IDs currently enabled in Bifrost are exposed.
#   allowedModels: [claude-sonnet-4-6]
#   catalogVendors: [anthropic]
#   modelPrefix: ""
#   labels: [resident, openclaw]
#   deployment:
#     values:
#       openshell:
#         processMode: replace
#         service: {name: openclaw, port: 18789}
#         processes:
#           - name: openclaw
#             command: [openclaw, gateway, run, --bind, lan, --auth, token, --port, "18789"]
#             files:
#               /sandbox/workspace/.openclaw/openclaw.json: "<the gateway's JSON config>"

# Additional resident backend adapters. A PodManager that also implements the
# resident controller port is registered automatically and should not be repeated.
residentRuntimeControllers: []
# - adapter: volundr.adapters.outbound.openshell_gateway.OpenShellGatewayPodManager
#   kwargs: {}
#   secretKwargs: []

# Engine-protocol adapters behind resident runtime backends.
residentRuntimeSessionControllers: []
# - adapter: volundr.adapters.outbound.openclaw_gateway.OpenClawResidentSessionController
#   runtimeBackend: openshell
#   optional: false
#   kwargs: {}
#   secretKwargs: []

# -- Seconds between resident HelmRelease/Deployment reconciliation passes
residentRuntimeReconciliationIntervalSeconds: 10.0

# -- Public origin under which residents answer A2A
# (/api/v1/forge/resident-runtimes/{id}/a2a, Agent Card at .../a2a/.well-known/agent-card.json),
# usually the Guild that proxies this target. Empty publishes no resident Agent Cards.
residentA2APublicBaseUrl: ""

# -- Seconds an A2A SendMessage waits for a resident's reply before returning the task WORKING
residentA2AReplyTimeoutSeconds: 45

# Sleipnir is the transport for cross-runtime flock RPC and platform events.
sleipnir:
  enabled: false
  adapter: sleipnir.adapters.in_process.InProcessBus
  kwargs: {}
  secretKwargs: []

# Forge session notifications: the feed, automatic reply_ready notifications, the
# delivery outbox dispatcher and external sinks. Rendered verbatim as config.yaml's
# `notifications:` section (snake_case keys; see NotificationsConfig). Empty keeps the
# defaults: feed on, reply_ready off, dispatcher on (idle until an owner rule selects a
# sink), no configured sinks. Telegram rules deliver through the owner's Telegram
# integration and need no entry here. Sink secrets come from env vars named in
# `secret_kwargs_env`; mount them with `extraEnv` (secretKeyRef). Example:
#   notifications:
#     public_web_url: https://forge.example.com     # deep links in messages
#     reply_ready: {body_chars: 400}
#     dispatcher:
#       max_attempts: 8
#       default_rate_limit: {max_count: 60, window_seconds: 3600}
#     images: {allow_private_networks: false, thumbnail_max_side: 320}
#     sinks:
#       - name: ops-webhook
#         label: Ops webhook
#         adapter: niuu.adapters.notifications.webhook.WebhookNotificationSink
#         url: https://hooks.example.com/forge
#         secret_kwargs_env: {secret: FORGE_OPS_WEBHOOK_SECRET}
#   extraEnv:
#     - name: FORGE_OPS_WEBHOOK_SECRET
#       valueFrom: {secretKeyRef: {name: forge-notification-sinks, key: ops-webhook-secret}}
#
notifications: {}

# Artifact publications (F1) and their burst notices (F1n): every claude.ai Artifact
# publish, present-file, notify artifact link and report_artifact is recorded at log
# ingest and served at /api/v1/forge/artifact-publications and /artifact-bursts.
# Rendered verbatim as config.yaml's `artifacts:` section (snake_case keys; see
# ArtifactsConfig). Empty keeps the defaults: on, one notice per live burst after a
# 120 s hold (needs notifications), 30 min burst window, no start-up backfill. Example:
#   artifacts:
#     hold_seconds: 120
#     burst_window_seconds: 1800
#     backfill_on_start: false
artifacts: {}

# Durable presented files (F2): Forge keeps its own copy of every file a session
# presents, so it still opens after the session stops and after Forge restarts.
# Rendered as `presented_files:` with the Postgres store: the bytes go on the volume
# below, which every Forge replica mounts; the record of each copy and the quota live
# in Forge's database, so any number of replicas (and a rolling update's two pods)
# share one quota. Session brokers upload with their session credential, so enabling
# this also needs session credentials delivered to session pods
# (`sessionCredentialProjection`, which is on wherever session credentials are, unless
# the pod manager delivers it itself as OpenShell does; session credentials are on
# wherever Forge has a signing key: workloadIdentity with signingKey.existingSecret,
# or forgeMcp.session_tokens.signing_key_file). The chart refuses to render without
# them. See docs/operator/artifact-publications.md ("Presented files on a
# cluster").
presentedFiles:
  # -- Keep Forge's own copy of every presented file
  enabled: false
  # -- Total bytes of copies Forge keeps (required when enabled). Bounded by the
  # volume: Forge refuses to start when the volume's free space cannot hold it. A copy
  # that would pass it is refused (HTTP 507) and counted; nothing is evicted.
  maxTotalBytes: null
  # -- Largest single copy (keep equal to the Skuld chart's broker.maxPresentedFileBytes)
  maxBytes: 52428800
  # -- Absolute origin presented-file links name, e.g. https://forge.example.com. Empty
  # keeps the relative route (/api/v1/forge/sessions/<id>/files/presented/<file>),
  # which clients open on the origin they already talk to.
  publicBaseUrl: ""
  # -- What controls access to publicBaseUrl: authenticated (an https origin behind
  # Envoy's OIDC check; Forge refuses it with the allow-all identity adapter) or
  # tailnet (a *.ts.net name or Tailscale address)
  publicAccess: authenticated
  # -- Where the volume is mounted in the Forge container
  mountPath: /volundr/presented-files
  persistence:
    # -- Use this existing PVC instead of creating one
    existingClaim: ""
    # -- Storage class of the created PVC (empty: the cluster default)
    storageClass: ""
    # -- ReadWriteMany, or ReadWriteOnce only with rollout.colocate (every Forge pod on one node)
    accessMode: ReadWriteMany
    # -- Size of the created PVC; maxTotalBytes must fit in it
    size: 10Gi

# Delivers each session's scoped Forge credential (forge_session) into its pod: Forge
# writes one Secret per session in `namespace` and mounts it read-only into the
# session pod, and the broker reads it at start. Only the file path enters the
# HelmRelease values; the token never does. Renders
# forge_mcp.session_tokens.projection_adapter (KubernetesExecutionCredentialProjection)
# and a Role granting Forge Secret get/create/patch/delete in that namespace only.
# Session pods need it to ask Forge for their mesh certificate, so it is on wherever
# Forge mints session credentials (see forgeMcp below) and its pod manager is Flux or
# DirectK8s; the OpenShell and local-process pod managers deliver the credential
# themselves and need none.
sessionCredentialProjection:
  # -- null follows session credentials (on where they are, for the Flux and DirectK8s
  # pod managers). false runs session pods without a Forge credential, so a session
  # whose mesh needs a certificate cannot start; true forces it for any pod manager
  # (and the chart refuses it while session credentials are off). The presented-files
  # store needs it.
  enabled: null
  # -- Namespace of the session pods (empty: podManager.kwargs.namespace)
  namespace: ""
  # -- Where the credential directory is mounted in the session pod
  mountPath: /var/run/secrets/niuu-forge-session

# How this Forge names itself (GET /api/v1/forge/instance, the host of its artifact
# publications and of the session status card). Empty: projects.instance_id names it.
# Rendered as `host_identity:` (see HostIdentityConfig). Example:
#   hostIdentity: {host: thor, tailnet_name: thor.tailnet-name.ts.net}
hostIdentity: {}

# Push to the devices owners register (POST /api/v1/forge/devices), and the
# needs-input push. `adapter` + `kwargs` build the channel push sinks deliver through
# (the default only logs). With `enabled`, every session that needs its owner is
# pushed through the notification outbox: each owner who registers a device gets a
# "Needs-input pushes" rule targeting the `attentionSink` sink, which the chart adds
# to notifications.sinks (a PushNotificationSink) unless one by that name is already
# configured there. Needs notifications enabled (the default). Example (APNs):
#   push:
#     enabled: true
#     adapter: volundr.adapters.outbound.push_channels.ApnsNotificationChannel
#     kwargs: {team_id: ABCDE12345, key_id: KEY1234567, bundle_id: com.niuu.forge}
#     secretKwargs:
#       - {kwarg: private_key, secretName: forge-apns, secretKey: private-key.p8}
push:
  # -- Push every session that needs its owner, through the notification outbox
  enabled: false
  # -- The notifications sink the per-owner "Needs-input pushes" rule targets
  attentionSink: push
  # -- Fully-qualified NotificationChannel class path
  adapter: volundr.adapters.outbound.push_channels.LoggingNotificationChannel
  # -- Channel constructor kwargs (e.g. bundle_id)
  kwargs: {}
  # -- Kept for values that set it; there is one registry. Each app install is the
  # owner's push-device integration (they see and switch it off there), every token
  # of it (alert, Live Activity, push-to-start, widget) in the credential store, and
  # device_tokens keeps only the gateway's state (no token). `postgres` is refused:
  # Forge moves the tokens device_tokens still holds into the credential store at start.
  deviceRegistry: auto
  # -- Secret kwargs from K8s Secrets, each { kwarg, secretName, secretKey }
  secretKwargs: []
  # The push sink the chart adds for `attentionSink` when `enabled`
  sink:
    # -- Label shown when owners pick a sink for a rule
    label: Forge app push
    # -- Longest push body (APNs caps the whole payload at 4 KB)
    maxBodyChars: 280
  # -- APNs key for the push gateway, rendered verbatim as `push.apns` (snake_case keys;
  # see ApnsConfig). The .p8 key is a file: mount it from a Secret and name its path.
  # e.g. {team_id: ABCDE12345, key_id: KEY1234567, bundle_id: com.example.app,
  #       private_key_path: /etc/volundr/apns/AuthKey_KEY1234567.p8}
  apns: {}
  # -- The Guild push gateway, rendered verbatim as `push.gateway` (snake_case keys; see
  # PushGatewayConfig). One node of a Guild runs it: it holds the APNs key and pushes
  # for every node's notifications, every owner and every org (alerts, Live Activity,
  # widgets, background). It replaces the per-node adapter and the needs-input rule on
  # every node of the Guild: a node that still pushes its own alerts is reported and
  # its alerts are left to it. It also needs:
  #   - the Guild registry entry of this node with `config.push_gateway: true` (and no
  #     other node's), so the Guild sends Live Activity and widget tokens here;
  #   - `guild.instanceId` (this node's registry id);
  #   - on an authenticated Guild, `reader_auth`: a workload credential with the
  #     forge:notifications:deliver scope, which this node's workload-identity mapping
  #     must list in `privileged_scopes`. Leave `stream_enabled` off with it: the scope
  #     admits the feed and the registry only.
  # See docs/operator/forge-notifications.md ("Apple push"). e.g.
  #   {enabled: true, guild_url: "https://guild.example.com",
  #    public_api_url: "https://forge.example.com", origin_label: Forge,
  #    reader_auth: {adapter: niuu.adapters.outbound.http_auth.WorkloadIdentityBearerTokenAuthAdapter,
  #                  kwargs: {exchange_url: "https://guild.example.com/api/v1/tokens/workload/exchange",
  #                           token_file: /var/run/secrets/niuu-workload/token,
  #                           audiences: [volundr-api], scopes: [forge:notifications:deliver]}}}
  gateway: {}

# Forge MCP session credentials and the Forge-hosted MCP endpoint. Rendered verbatim
# as config.yaml's `forge_mcp:` section (snake_case keys; see ForgeMcpConfig). Empty
# keeps the defaults (no default grants, HTTP endpoint on with no browser origins),
# except session_tokens.enabled: unless set here it is true wherever Forge has a
# signing key it can keep: workloadIdentity enabled with signingKey.existingSecret, or
# session_tokens.signing_key_file set to a path on a persistent volume you mount
# (extraVolumes, extraVolumeMounts). Forge's default key file is under the home
# directory, which the read-only root filesystem rules out, and a key kept only in the
# pod would be lost with it and invalidate every running session's credential. Without
# a key they stay off by default, and `session_tokens.enabled: true` without one fails
# the render. `session_tokens.enabled: false` turns them off wherever a key exists
# (sessions then have no Forge credential, so no mesh certificate). The local process
# pod manager delivers session credentials itself; Flux and Kubernetes session pods
# get them through `sessionCredentialProjection`, which follows. See
# docs/operator/forge-mcp.md. Example:
#   forgeMcp:
#     default_grants: []
#     role_grants: {coordinator: [lifecycle, message], worker: [message]}   # the default; {} for none
#     session_tokens: {ttl_seconds: 604800}
#     mesh_identity: {ttl_seconds: 900}   # the default; see below
#     http: {allowed_origins: ["https://forge.example.com"]}
# `mesh_identity` is the certificate Forge issues to a session's mesh peer
# (POST /api/v1/forge/sessions/{id}/mesh-identity) so other peers can verify who sent a
# message. It is signed with the session-credential key, so it is on exactly where
# session_tokens are (with them off no certificates are issued); `ttl_seconds` (default 900) bounds how long a leaked or stale
# certificate is believed (peers renew at half of it). Forge also publishes a signed
# "session stopped" revocation on its Sleipnir bus when `sleipnir` is enabled; without
# a bus the ttl is the only bound, and the revocation reaches session pods only over a
# networked `sleipnir.adapter` (the in-process default stays inside Forge's own pod).
# Whether the mesh proves who sends what is `mesh.attestation.required` below, not a setting here.
forgeMcp: {}

# One decision about proof of who sent each mesh message, for Forge's own signers (residents,
# revocation notices) and the sessions Forge launches (the local and Flux pod managers carry it
# into the Skuld `mesh` settings; a different value set there fails startup). On by default and
# needs no setting. `required: false` runs the mesh unauthenticated: Forge logs that once at
# startup and reports it on /health. The other keys (renew_fraction, retry_fraction,
# clock_skew_s, event_max_age_s) tune the proof; see niuu.mesh.config.MeshAttestationConfig.
mesh:
  attestation:
    # -- false runs the mesh unauthenticated. Null keeps true.
    required: null
    # -- Fraction of the certificate lifetime after which a peer renews it. Null keeps 0.5.
    renew_fraction: null
    # -- Fraction of the lifetime between retries after a failed renewal. Null keeps 0.1.
    retry_fraction: null
    # -- Seconds a request's signing time may differ from the receiver's clock. Null keeps 300.
    clock_skew_s: null
    # -- Oldest a published event may be on receipt. Null keeps 3600.
    event_max_age_s: null

# Chronicle configuration
chronicle:
  # -- Auto-create chronicle when a session stops
  autoCreateOnStop: true
  # -- Model used for generating session summaries
  summaryModel: "claude-haiku-4-5-20251001"
  # -- Max tokens for summary generation
  summaryMaxTokens: 2000
  # -- Retention period in days (0 = keep forever)
  retentionDays: 0

# System launch catalog preloaded by config.
launchSpecs:
  - name: standard-claude
    description: "Default Claude Code session with modest resources."
    isDefault: true
    sessionDefinition: skuldClaude
    workloadType: session
    model: "claude-sonnet-4-6"
    cliTool: claude
    resourceConfig:
      cpu: "1"
      memory: "2Gi"
  - name: standard-codex
    description: "Default Codex session for OpenAI-backed coding work."
    sessionDefinition: skuldCodex
    workloadType: session
    model: "gpt-5.6-terra"
    cliTool: codex
    resourceConfig:
      cpu: "1"
      memory: "2Gi"

# Git provider configuration
# Provider-neutral delivery uses deployment-pinned adapters, identities and policy.
# Configure signing material through secret_kwargs_env, never inline Helm values.
delivery:
  enabled: false
  authenticator:
    adapter: ""
    kwargs: {}
    secret_kwargs_env: {}
  workstreams:
    adapter: ""
    kwargs: {}
  authorizer:
    adapter: ""
    kwargs: {}
  forge:
    adapter: volundr.adapters.outbound.user_delivery_forge.UserDeliveryForgeProvider
    kwargs: {}
  producer_id: forge-service
  trusted_producers: []
  policies: {}

git:
  # -- Validate repositories on session creation
  validateOnCreate: true
  # GitHub configuration
  github:
    # -- Enable GitHub provider (creates default github.com instance)
    enabled: true
    # -- Existing secret containing GitHub token (key: token)
    existingSecret: ""
    # -- Key in secret containing the token
    tokenKey: token
    # -- Additional GitHub instances (for GitHub Enterprise, etc.)
    # instances:
    #   - name: GitHub Enterprise
    #     baseUrl: https://github.company.com/api/v3
    #     # Token from existingSecret above, or specify per-instance secret:
    #     existingSecret: github-enterprise-secret
    #     tokenKey: token
    #     # Organizations to list repos from (GET /repos endpoint)
    #     orgs:
    #       - engineering
    #       - platform
    instances: []
  # GitLab configuration
  gitlab:
    # -- Enable GitLab provider (creates default gitlab.com instance)
    enabled: false
    # -- Existing secret containing GitLab token (key: token)
    existingSecret: ""
    # -- Key in secret containing the token
    tokenKey: token
    # -- Additional GitLab instances (for self-hosted GitLab, etc.)
    # instances:
    #   - name: Internal GitLab
    #     baseUrl: https://git.company.com
    #     existingSecret: gitlab-internal-secret
    #     tokenKey: token
    #     # Groups to list repos from (GET /repos endpoint)
    #     orgs:
    #       - platform
    #       - infra
    instances: []
  # Image build provenance (volundr_git verify_image_provenance): the platform
  # fetches a repository's GitHub build attestations and verifies them with
  # Sigstore, so residents never reach GitHub's attestation storage themselves.
  provenance:
    # -- Verify image provenance. Needs the `provenance` extra in the image (the
    # niuu image has it) and egress to tuf-repo-cdn.sigstore.dev for the trust
    # root; false answers the endpoint with 503.
    enabled: true
    # -- Seconds allowed to download an attestation bundle from the Git host's
    # storage; a slower download fails the request with a 502.
    bundleFetchTimeoutSeconds: 30
    # -- Verifier constructor kwargs (`issuer`, `workflow_paths`, optional
    # `trusted_root_file`). Empty keeps the defaults (GitHub Actions issuer;
    # reusable-container-build.yaml and dev.yaml as the signing workflows).
    # Setting any key replaces ALL defaults, so restate `issuer` and `workflow_paths`.
    kwargs: {}
  # Git workflow configuration (PR-based development)
  workflow:
    # -- Auto-create branches for new sessions
    autoBranch: true
    # -- Branch name prefix for session branches
    branchPrefix: "volundr/session"
    # -- Protect main/master from direct commits
    protectMain: true
    # -- Default merge method (merge, squash, rebase)
    defaultMergeMethod: "squash"
    # -- Confidence threshold for auto-merge (0.0-1.0)
    autoMergeThreshold: 0.9
    # -- Confidence threshold for notify-then-merge (0.0-1.0)
    notifyMergeThreshold: 0.6

# Envoy sidecar proxy (JWT validation, header extraction)
envoy:
  # -- Envoy sidecar container securityContext. Set a field to null to drop it (for example runAsUser: null where an
  # admission policy rejects an explicit UID).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL
  # -- Enable Envoy sidecar proxy
  enabled: false
  image:
    # -- Envoy image repository
    repository: envoyproxy/envoy
    # -- Envoy image tag
    tag: "v1.32-latest"
    # -- Envoy image pull policy
    pullPolicy: IfNotPresent
  # -- Envoy listener port (becomes the service target when enabled)
  port: 8443
  # -- Envoy admin interface port (localhost only)
  adminPort: 9901
  # -- Upstream connect timeout
  connectTimeout: "0.25s"
  # -- Upstream request timeout
  upstreamTimeout: "60s"
  # -- Resource limits for the Envoy sidecar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # -- Header names Envoy sets on upstream requests
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
    # A client-supplied copy must never reach the pod: only the session
    # proxy (niuu.session_proxy) is trusted to stamp this, from a verified
    # session_participants grant (see the room-scoped Cedar actions).
    roomRole: x-niuu-room-role
  # JWT authentication (via Keycloak)
  # Uncomment and configure to enable JWT validation
  jwt:
    # -- Enable JWT authentication filter
    enabled: false
    # -- JWT issuer URL (Keycloak realm)
    # issuer: "https://keycloak.example.com/realms/volundr"
    issuer: ""
    # -- Allowed JWT audiences
    # audiences:
    #   - volundr
    audiences: []
    # -- JWKS URI for key retrieval
    # jwksUri: "https://keycloak.example.com/realms/volundr/protocol/openid-connect/certs"
    jwksUri: ""
    # -- JWKS fetch timeout
    jwksTimeout: "5s"
    # -- JWKS cache duration in seconds
    jwksCacheDurationSeconds: 300
    # -- JWT claim containing tenant ID
    tenantClaim: "tenant_id"
    # -- JWT claim containing roles (supports nested via dot notation)
    rolesClaim: "resource_access.volundr.roles"
    # -- Keycloak upstream host (for JWKS fetching)
    # keycloakHost: "keycloak.default.svc.cluster.local"
    keycloakHost: ""
    # -- Keycloak upstream port
    keycloakPort: 8080
    # -- Enable TLS for Keycloak upstream
    keycloakTls: false
    # -- CA bundle used to verify the JWKS server when TLS is enabled
    keycloakCaFile: "/etc/ssl/certs/ca-certificates.crt"
    # -- Additional JWT claim-to-header mappings
    # extraClaimHeaders:
    #   - headerName: x-auth-display-name
    #     claimName: preferred_username
    extraClaimHeaders: []
    # -- Path prefixes that bypass JWT validation (no auth required)
    # Rules are evaluated in order; matching prefixes skip the JWT check.
    bypassPrefixes:
      - /api/v1/integrations/oauth/callback
      - /api/v1/integrations/oauth/mcp/callback
      - /api/v1/integrations/oauth/mcp/client-metadata
      # A project team's app install returns here (Forge owns team installs).
      - /api/v1/forge/integrations/oauth/callback
      - /api/v1/identity/auth/config
      - /api/v1/tokens/workload/exchange
      - /api/v1/tokens/workload/jwks
      - /health
      - /api/v1/forge/health
    # -- Additional JWT provider for short-lived Niuu workload tokens.
    # When enabled, Envoy accepts either Keycloak user tokens or workload tokens.
    workload:
      enabled: false
      issuer: ""
      audiences: []
      # Defaults to the app-local workload JWKS endpoint when empty.
      jwksUri: ""
      # Empty host uses the pod-local exchange; remote JWKS require verified TLS.
      jwksHost: ""
      jwksPort: 443
      jwksTls: true
      jwksCaFile: /etc/ssl/certs/ca-certificates.crt
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.volundr.roles"
      extraClaimHeaders: []
  # -- Extra HTTP filters (inserted before the router filter)
  extraHttpFilters: []
  # -- Extra upstream clusters
  extraClusters: []
  # -- Additional volumes mounted into Envoy, for example a private JWKS CA
  extraVolumeMounts: []
  # Cedar admission runs after JWT verification, on a pod-local gRPC listener.
  # Also configure authorization.adapter and identity.adapter for production.
  authorization:
    # Optional central identity/PAT revocation check before gateway admission.
    # Use identity.adapters.remote.RemoteHeaderAuthenticationAdapter with HTTPS authority_url.
    identity: null
    enabled: false
    port: 9002
    # -- Envoy's budget for the authorization decision. When identityAuthority is
    # enabled, identityAuthority.timeout is added so the identity lookup fits.
    timeout: "1s"
    shutdownGraceSeconds: 5
    # -- Mount deployment-managed custom policy/schema volumes, when configured
    extraVolumeMounts: []
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # First matching route wins. Scoped credentials cannot use routes without
    # a required_scope, even when their owner would otherwise have access.
    routes:
      - path: /api/v1/identity/me
        methods: [GET]
        required_scope: identity:self
      - path: /api/v1/forge/sessions
        methods: [POST]
        required_scope: "forge:session:create"
      - path: /api/v1/forge/sessions/{session_id}/participants/role
        path_template: true
        methods: [GET]
        required_scope: "forge:session:room-role"
      # A resident rings its owner's phone (the Guild push gateway's node; 404 elsewhere).
      - path: /api/v1/forge/push/call
        methods: [POST]
        required_scope: "forge:push:call"
      - path: /api/v1/forge
        prefix: true
        methods: [GET, HEAD, POST, PUT, PATCH, DELETE]
      - path: /s
        prefix: true
        methods: [GET]

# The Guild this Forge belongs to, and this Forge's entry in that Guild's instance
# registry (the Guild's niuu.instances seed or GET /api/v1/niuu/targets/volundr).
# Served at GET /api/v1/forge/guild and stamped on every notification, so a client
# that talks to this node directly can find the Guild feed and its own place in
# it. Empty url: this Forge belongs to no Guild (the route answers 404).
guild:
  # -- Public origin of the Guild, e.g. https://yggdrasil.niuu.world
  url: ""
  # -- This Forge's instance id in that Guild (required with url)
  instanceId: ""
  # -- This Forge's instance name in that Guild (required with url)
  instanceName: ""
  # -- This Forge's instance slug in that Guild (required with url)
  instanceSlug: ""

workloadIdentity:
  enabled: false
  issuer: ""
  audiences:
    - volundr-api
  tokenTtlSeconds: 900
  keyId: niuu-workload
  signingKey:
    existingSecret: ""
    key: private-key.pem
  # -- Raw niuu WorkloadIdentityVerifierConfig entries (name/adapter/kwargs).
  # Any mapping naming a `verifier:` that has no matching entry here never
  # matches — the exchange fails loud with "Verifier not configured: <name>"
  # rather than silently admitting nobody (niuu.domain.services.workload_identity
  # .WorkloadIdentityService.exchange). For example, a mapping with
  # `verifier: "kubernetes"` needs a corresponding entry:
  #   verifiers:
  #     - name: kubernetes
  #       adapter: "niuu.adapters.workload_identity.jwt.JwtWorkloadIdentityVerifier"
  #       kwargs:
  #         issuer: "https://kubernetes.default.svc"       # cluster-specific
  #         jwks_uri: "https://kubernetes.default.svc/openid/v1/jwks"
  #         audiences: []  # must match the aud claim the workload's token carries
  # An operator must supply the cluster's real issuer/jwks_uri/audiences —
  # this chart cannot guess them, and getting `audiences` wrong fails
  # verification the same loud way, not silently.
  verifiers: []
  # -- Mappings (raw niuu WorkloadIdentityMappingConfig objects).
  mappings: []

workflowExecutionCredentials:
  enabled: false
  projectionAdapter: "volundr.adapters.outbound.execution_credential_k8s.KubernetesExecutionCredentialProjection"
  # Merged over the default `namespace: <release namespace>`. The chart's RBAC
  # only grants Secret create/patch/delete in the release namespace. If you set
  # `projectionKwargs.namespace` to another namespace you must create a Role
  # (secrets: get, create, patch, delete) and RoleBinding for the Volundr
  # ServiceAccount in that namespace yourself; the chart never grants this
  # cluster-wide.
  projectionKwargs: {}
  projectionSecretKwargsEnv: {}
  refreshIntervalSeconds: 300
  admissionRoles:
    - volundr:developer

# Identity adapter (dynamic adapter pattern)
# Switch between identity/authentication backends by changing the adapter class.
# user_repository is always injected at runtime — do not add it to kwargs.
#
# ── Envoy trusted headers (production) ─────────────────────────
#   identity:
#     adapter: "volundr.adapters.outbound.identity.EnvoyHeaderIdentityAdapter"
#     kwargs:
#       user_id_header: "x-auth-user-id"
#       email_header: "x-auth-email"
#       tenant_header: "x-auth-tenant"
#       roles_header: "x-auth-roles"
#
# Storage adapter (dynamic adapter pattern)
# Controls how session/home PVCs are created and deleted.
# The in-memory adapter generates PVC names without creating K8s resources.
#
# ── Kubernetes PVC ─────────────────────────────────────────────
#   storageAdapter:
#     adapter: "volundr.adapters.outbound.k8s_storage_adapter.K8sStorageAdapter"
#     kwargs:
#       namespace: "skuld"
#       home_storage_class: "longhorn"
#       workspace_storage_class: "longhorn"
#       home_size_gb: 64
#       workspace_size_gb: 20
#
storageAdapter:
  # -- Fully-qualified class path for the StoragePort adapter
  adapter: "volundr.adapters.outbound.k8s_storage.InMemoryStorageAdapter"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []

# Resource provider (dynamic adapter pattern)
# Discovers cluster resources, validates requests, and translates
# user-friendly specs to K8s-native primitives (requests/limits,
# nodeSelector, tolerations, runtimeClassName).
#
# ── Kubernetes (device-plugin) ─────────────────────────────────
#   resourceProvider:
#     adapter: "volundr.adapters.outbound.k8s_resource_provider.K8sResourceProvider"
#     kwargs:
#       namespace: "volundr-sessions"
#
resourceProvider:
  # -- Fully-qualified class path for the ResourceProvider adapter
  adapter: "volundr.adapters.outbound.static_resource_provider.StaticResourceProvider"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []

identity:
  # -- Fully-qualified class path for the IdentityPort adapter
  adapter: "volundr.adapters.outbound.identity.AllowAllIdentityAdapter"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []
  # -- Role mapping from IDP claim roles to Volundr roles
  roleMapping:
    admin: "volundr:admin"
    developer: "volundr:developer"
    viewer: "volundr:viewer"

# Authorization adapter (dynamic adapter pattern)
# Switch between authorization backends by changing the adapter class.
#
# ── Simple role-based ──────────────────────────────────────────
#   authorization:
#     adapter: "volundr.adapters.outbound.authorization.SimpleRoleAuthorizationAdapter"
#     kwargs: {}
#
# Production deployments enforce authorization via Cedar at the Envoy layer,
# not through this per-request adapter.
#
authorization:
  # -- Fully-qualified class path for the AuthorizationPort adapter
  adapter: "volundr.adapters.outbound.authorization.AllowAllAuthorizationAdapter"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []

# Credential store adapter (dynamic adapter pattern)
# Switch between secret management backends by changing the adapter class.
#
# ── Vault/OpenBao ──────────────────────────────────────────────
#   credentialStore:
#     adapter: "niuu.adapters.openbao_credential_store.OpenBaoCredentialStore"
#     kwargs:
#       url: "http://openbao:8200"
#       mount_path: "volundr"
#       auth_method: "token"
#       token: ""
#
# OAuth renewal: see docs/operations/openbao-oauth.md. Use
# niuu.adapters.openbao_oauth_credential_store.OpenBaoOAuthCredentialStore
# with oauth_mount_path/oauth_servers, plus oauth_mount_path on secretInjection.
#
# ── Infisical ──────────────────────────────────────────────────
#   credentialStore:
#     adapter: "niuu.adapters.infisical_credential_store.InfisicalCredentialStore"
#     kwargs:
#       site_url: "https://app.infisical.com"
#       client_id: ""
#       client_secret: ""
#       project_id: ""
#
credentialStore:
  # -- Fully-qualified class path for the CredentialStorePort adapter
  adapter: "niuu.adapters.memory_credential_store.MemoryCredentialStore"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []

# ── Secret Injection ─────────────────────────────────────────
# Controls how secrets (e.g. Infisical CSI volumes) are injected
# into session pods. The in-memory adapter is a no-op for development.
#
# ── Infisical Agent Injector ─────────────────────────────────
#   secretInjection:
#     adapter: >-
#       volundr.adapters.outbound.infisical_secret_injection
#       .InfisicalAgentInjectionAdapter
#     kwargs:
#       infisical_url: "https://infisical.example.com"
#
# ── OpenBao Agent Injector ───────────────────────────────────
#   secretInjection:
#     adapter: >-
#       volundr.adapters.outbound.openbao_secret_injection
#       .OpenBaoAgentInjectionAdapter
#     kwargs:
#       openbao_url: "https://openbao.ymir.niuu.world"
#       namespace: "skuld"
#       mount_path: "volundr"
#       auth_path: "jwt-example"
#       audience: "https://kubernetes.default.svc.cluster.local"
#
secretInjection:
  # -- Fully-qualified class path for the SecretInjectionPort adapter
  adapter: "volundr.adapters.outbound.memory_secret_injection.InMemorySecretInjectionAdapter"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []

# ── Gateway ──────────────────────────────────────────────────
# Controls how session HTTPRoute/SecurityPolicy resources are
# configured in Kubernetes Gateway API. The in-memory adapter
# returns static config without touching Kubernetes.
#
# ── K8s Gateway API ──────────────────────────────────────────
#   gateway:
#     adapter: "volundr.adapters.outbound.k8s_gateway.K8sGatewayAdapter"
#     kwargs:
#       namespace: "volundr"               # namespace where sessions run
#       gateway_name: "volundr-gateway"     # must match sessionGateway.name
#       gateway_namespace: "volundr"        # must match release namespace
#       gateway_domain: "sessions.example.com"
#       issuer_url: "https://idp.example.com"
#       audience: "volundr"
#       jwks_uri: "https://idp.example.com/.well-known/jwks"
#
gateway:
  # -- Fully-qualified class path for the GatewayPort adapter
  adapter: "volundr.adapters.outbound.k8s_gateway.InMemoryGatewayAdapter"
  # -- All kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs from K8s Secrets, merged into kwargs at runtime
  secretKwargs: []

# Session contributor pipeline (dynamic adapter pattern)
# Controls how session specs are assembled before submission to the
# pod manager. Each contributor wraps a single port/adapter and
# contributes Helm values or pod spec additions.
#
# Contributors run sequentially in config order. Cleanup runs in
# reverse order on stop/delete.
#
# Each entry has:
#   adapter  – fully-qualified Python class path
#   kwargs   – forwarded to the constructor as **kwargs (ports are
#              injected automatically by the factory)
#
sessionContributors:
  - adapter: "volundr.adapters.outbound.contributors.core.CoreSessionContributor"
    kwargs:
      ingress_enabled: true
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.launch_spec.LaunchSpecContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.prompt.PromptContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.git.GitContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.integrations.IntegrationContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.storage.StorageContributor"
    kwargs:
      home_enabled: true
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.gateway.GatewayContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.resource.ResourceContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.isolation.IsolationContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.secrets.SecretInjectionContributor"
    kwargs: {}
    secretKwargs: []
  - adapter: "volundr.adapters.outbound.contributors.secrets.SecretsContributor"
    kwargs: {}
    secretKwargs: []

# ── Session Gateway (Kubernetes Gateway API resource) ──────
# The shared Gateway that all session HTTPRoutes attach to.
# Requires Envoy Gateway controller + GatewayClass deployed
# in the cluster (see NIU-120).
#
# cert-manager: annotate with cluster-issuer to auto-provision TLS.
# external-dns: watches Gateway resources and creates DNS records
#   from the listener hostname automatically.
sessionGateway:
  # -- Enable the shared Gateway resource
  enabled: false
  # -- Gateway resource name (defaults to {fullname}-gateway)
  name: ""
  # -- GatewayClass to use (Envoy Gateway default: "eg")
  gatewayClassName: "eg"
  # -- Hostname for the HTTPS listener (defaults to sessions.{domain})
  # external-dns creates a DNS record for this hostname automatically
  hostname: ""
  # -- cert-manager ClusterIssuer name for TLS certificate provisioning
  certIssuer: "letsencrypt-prod"
  # -- TLS secret name (defaults to "{name}-tls" if not set)
  tlsSecretName: ""
  # -- Which namespaces can attach HTTPRoutes to this Gateway
  # "All" = any namespace, "Same" = only the Gateway's namespace,
  # "Selector" = use namespaceSelector (not yet supported here)
  allowedRouteNamespaces: "All"
  # -- Enable HTTP listener with 301 redirect to HTTPS
  httpRedirect: true
  # -- Extra annotations on the Gateway resource
  annotations: {}

# Live preview: <port>--<session-id>.<domain> opens a port a session listens on,
# on its own origin, for the session's owner only (niuu.preview_proxy). Needs
# workloadIdentity (the router's credential to each session's Skuld), session
# pods with skuld's preview.enabled, a wildcard DNS record for *.<domain>
# pointing at the session gateway, and the OIDC client below.
sessionPreview:
  # -- Serve live previews through the session gateway
  enabled: false
  # -- Preview domain (defaults to preview.{domain}); the listener serves *.<domain>
  domain: ""
  # -- TLS secret for the *.<domain> listener (defaults to "{gateway name}-preview-tls");
  # cert-manager issues it through sessionGateway.certIssuer, which must solve DNS-01
  tlsSecretName: ""
  # -- How long an idle preview stream (hot-reload WebSocket, SSE) stays open at
  # Forge's Envoy. Past it the dev server's client reconnects.
  streamIdleTimeout: "3600s"
  # -- Lifetime of the router credential minted per forwarded request
  credentialTtlSeconds: 60
  # -- Audience of the router credential; session pods' Skuld verifies it
  credentialAudience: "volundr-api"
  # Sign-in on the preview domain: Envoy Gateway runs the OIDC code flow for
  # every preview host, with its session cookies scoped to the preview domain
  # (never the platform's parent domain), and forwards the access token to
  # Forge, whose Envoy verifies it like any other request.
  oidc:
    # -- OIDC issuer (the realm Forge's Envoy trusts)
    issuer: ""
    # -- Confidential client for the preview domain; its access tokens must
    # carry an audience Forge's Envoy accepts
    clientId: ""
    # -- Secret (in this namespace) holding the client secret under key "client-secret"
    clientSecretName: ""
    # -- Host the provider redirects back to (defaults to auth.<domain>); one
    # registered redirect URI, https://<host>/oauth2/callback, serves every preview
    callbackHost: ""
    # -- Scopes requested at sign-in
    scopes: ["openid", "profile", "email"]
    # -- Path on any preview host that signs out of the preview domain
    logoutPath: "/.niuu/preview/logout"

# Auth discovery (public endpoint for CLI auto-configuration)
authDiscovery:
  # -- OIDC issuer URL for CLI auth discovery (falls back to gateway issuer if empty)
  issuer: ""
  # -- OIDC client ID for CLI clients
  cliClientId: "volundr-cli"
  # -- OIDC scopes
  scopes: "openid profile email"

# Auth secrets (PAT signing key, etc.)
auth:
  # -- Create a K8s Secret for auth-related keys (disable if using an existing secret)
  createSecret: true
  # -- Symmetric signing key for PAT JWTs (overridden in production via values/sealed-secrets)
  patSigningKey: ""

# OAuth integration configuration
oauth:
  # -- Legacy refresh loop; ignored outside mini-mode. OpenBao owns production renewal.
  miniModeRefreshEnabled: true
  # -- Base URL for OAuth redirect callbacks (e.g. https://volundr.example.com)
  redirectBaseUrl: ""
  mcpRequestTimeoutSeconds: 15
  mcpStateTtlSeconds: 600
  # -- Hostnames of your own MCP servers and their OAuth issuers allowed to resolve
  # to private addresses (exact names or "*.domain" suffixes, e.g. "*.asgard.niuu.world").
  # Every other MCP host must resolve to public addresses.
  mcpInternalHosts: []
  # -- Per-integration OAuth client credentials
  # clients:
  #   linear:
  #     clientId: ""
  #     clientSecret: ""
  clients: {}

# Application configuration
config:
  # Project checkout roots are paths mounted in the Forge API container.
  projects:
    enabled: true
    instance_id: ""
    workspace_adapter: volundr.adapters.outbound.project_workspace.GitProjectWorkspace
    workspace_kwargs: {}
    context_bytes: 8192
    git_timeout_seconds: 15
    dispatch_wait_seconds: 30
    dispatch_poll_seconds: 0.05
  conversationRecentMaxTurns: 15
  conversationRecentMaxBytes: 262144
  # -- First durable event-log window (frames) for a `?tail=N` conversation read
  conversationTailInitialFrames: 2000
  # -- Factor by which that window widens until it holds more than N turns
  conversationTailGrowth: 2
  # -- Timeout (seconds) for the runtime-version health probe against a session's runtime
  runtimeHealthTimeoutSeconds: 3.0
  # -- Log level (debug, info, warning, error)
  logLevel: info
  # -- Log format (json, text)
  logFormat: json
  # -- OpenTelemetry trace/metric export. Empty (the default) means
  # unconfigured — observability.enabled defaults to false, which is a
  # decision, not a degraded fallback. Set fields to match
  # niuu.domain.observability.ObservabilityConfig, e.g.:
  #   enabled: true
  #   trace_endpoint: "http://otel-collector.observability:4317"
  #   metric_endpoint: "http://otel-collector.observability:4318/v1/metrics"
  #   log_endpoint: "http://otel-collector.observability:4318/v1/logs"
  observability: {}
  # -- Host to bind to
  host: "0.0.0.0"
  # -- Internal shared-host address injected into local Skuld brokers
  serverHost: "127.0.0.1"
  # -- Browser-reachable shared-host address used in local session endpoints
  serverPublicHost: "127.0.0.1"
  # -- Internal OpenShell gateway used for server-side session proxying
  openshellInternalGatewayUrl: "http://openshell.openshell.svc.cluster.local:8080"
  # -- Number of uvicorn workers. Keep at 1 with the development in-memory credential store.
  workers: 1
  # -- Session timeout in seconds
  sessionTimeout: "3600"
  # -- Maximum sessions per user
  maxSessionsPerUser: "5"
  cors:
    # -- Allowed browser origins for cross-origin API requests
    allowedOrigins:
      - "*"
    # -- Whether credentialed CORS requests are allowed
    allowCredentials: true
  # -- Extra configuration values
  extra: {}

# Existing secrets (created via External Secrets)
# These secrets must exist before installing the chart
existingSecrets:
  # -- Name of the secret containing Anthropic API credentials
  # Expected keys: ANTHROPIC_API_KEY, optionally ANTHROPIC_BASE_URL
  anthropic: volundr-anthropic-api

# -- Fallback session definition when none is specified in the request
defaultDefinition: "skuldClaude"

# Session definition templates
# These define session types for workload instantiation
sessionDefinitions:
  # Skuld-Claude session definition (Claude Code with embedded VS Code editor)
  skuldClaude:
    # -- Enable skuld-claude session definition
    enabled: true
    # -- Human-readable name shown in the UI
    displayName: "Claude Code"
    # -- Short description for the session picker
    description: "Claude Code in the full session workspace: chat, terminal, diffs, files and MCP tools. The usual choice for Claude."
    # -- Default model for this definition (empty = use server default)
    defaultModel: "claude-sonnet-4-6"
    # -- Labels for agent routing - only agents with matching labels will load this
    labels:
      - session
    # -- Model providers this runtime accepts (empty = provider-neutral)
    compatibleProviders:
      - anthropic
      # a model server you run yourself, through the model gateway
      - local
    # -- Whether this session definition is active
    active: true

    # Helm chart configuration (references the shared skuld chart)
    helm:
      # -- Chart name
      chart: skuld
      # -- Helm repository URL (supports oci:// for OCI registries)
      # Note: updated by CI/CD pipeline with actual version
      repo: "oci://ghcr.io/niuulabs/charts"
      # -- Name of HelmRepository or OCIRepository CR in cluster (for Flux)
      repoName: ""
      # -- Chart version constraint
      version: "0.1.0"

    # Default values for sessions (can be overridden by task_args at submission)
    defaults:
      session:
        # -- Default Claude model
        model: "claude-sonnet-4-6"

      broker:
        # -- AI CLI backend: "claude" (Claude Code)
        cliType: claude
        # -- Claude Agent SDK transport (preferred default).
        transport: sdk
        # -- Fully-qualified transport adapter class path
        transportAdapter: "skuld.transports.sdk.SDKTransport"
        # -- Skip tool permission prompts (--dangerously-skip-permissions)
        skipPermissions: true
        # -- Enable Claude Code experimental Agent Teams
        agentTeams: false

      # Note: repository and tag are updated by CI/CD pipeline
      image:
        # -- Session image repository
        repository: ghcr.io/niuulabs/skuld
        # -- Session image tag
        tag: "latest"

      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"

      # -- Image pull secrets for session pods
      imagePullSecrets:
        - ghcr-pull-secret

      ingress:
        # -- Ingress class name for sessions (nginx, traefik, etc.)
        className: ""
        # -- Controller-specific annotations for WebSocket support
        # Configure based on your ingress controller
        annotations: {}
        tls:
          enabled: false
          # -- TLS wildcard secret name for session ingress
          secretName: "skuld-wildcard-tls"

      # -- Git credential secret for session pods to clone repositories
      git:
        credentials:
          # -- K8s secret name containing git credentials (mounted in session pod)
          secretName: github-token

      localServices:
        terminal:
          # -- Enable terminal debug UI in session pods
          debug: false

      persistence:
        # -- Mount path for session data
        mountPath: "/volundr/sessions"

      homeVolume:
        # -- Enable persistent home directory in session pods
        enabled: true
        # -- Mount path for the home PVC
        mountPath: "/volundr/home"
        credentialFiles:
          # -- Pre-existing K8s secret containing Claude credential files
          # Keys in the secret become files mounted at the secret mount path.
          # These are symlinked into $HOME/<destDir>/ so they auto-update when
          # the secret changes (~60s kubelet sync).
          secretName: "claude-credentials"
          # -- Subdirectory under mountPath where credential symlinks are placed
          destDir: ".claude"
          # -- Internal mount path for the credentials secret
          secretMountPath: "/volundr/secrets/credential-files"

      # Secrets injected as env vars into the skuld broker container.
      envSecrets:
        - envVar: ANTHROPIC_API_KEY
          secretName: anthropic-api-key
          secretKey: api-key

      # Plain env vars injected into the skuld broker container.
      envVars: []

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # -- Runtime class name for session pods (e.g., "nvidia", "kata", "gvisor")
      runtimeClassName: ""

  # Skuld-Claude Interactive session definition (Claude Code REPL in tmux).
  # This runtime uses the interactive subscription path and captures tmux pane
  # output/events instead of the Agent SDK stream-json protocol.
  skuldClaudeInteractive:
    # -- Enable skuld-claude-interactive session definition
    enabled: true
    # -- Human-readable name shown in the UI
    displayName: "Claude Code Interactive"
    # -- Short description for the session picker
    description: "Claude Code as the plain interactive terminal you know from your own machine: slash commands, permission prompts and agent teams. Pick this when you want the CLI itself rather than the chat workspace."
    # -- Default model for this definition (empty = use server default)
    defaultModel: "claude-sonnet-4-6"
    # -- Labels for agent routing
    labels:
      - session
      - interactive
    # -- Model providers this runtime accepts
    compatibleProviders:
      - anthropic
      # a model server you run yourself, through the model gateway
      - local
    # -- Whether this session definition is active
    active: true

    # Helm chart configuration (references the shared skuld chart)
    helm:
      # -- Chart name
      chart: skuld
      # -- Helm repository URL (supports oci:// for OCI registries)
      repo: "oci://ghcr.io/niuulabs/charts"
      # -- Name of HelmRepository or OCIRepository CR in cluster
      repoName: ""
      # -- Chart version constraint
      version: "0.1.0"

    defaults:
      session:
        # -- Default Claude model
        model: "claude-sonnet-4-6"

      broker:
        # -- AI CLI backend: "claude" (Claude Code)
        cliType: claude
        # -- Interactive tmux transport (real TTY; supports built-in slash commands)
        transport: tmux-interactive
        # -- Fully-qualified transport adapter class path
        transportAdapter: "skuld.transports.tmux_interactive.TmuxInteractiveTransport"
        # -- Skip tool permission prompts (--dangerously-skip-permissions)
        skipPermissions: true
        # -- Enable Claude Code experimental Agent Teams
        agentTeams: true

      image:
        # -- Session image repository
        repository: ghcr.io/niuulabs/skuld
        # -- Session image tag
        tag: "latest"

      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"

      # -- Image pull secrets for session pods
      imagePullSecrets:
        - ghcr-pull-secret

      ingress:
        # -- Ingress class name for sessions
        className: ""
        # -- Controller-specific annotations for WebSocket support
        annotations: {}
        tls:
          # -- Enable TLS for session ingress
          enabled: false
          # -- TLS wildcard secret name for session ingress
          secretName: "skuld-wildcard-tls"

      # -- Git credential secret for session pods to clone repositories
      git:
        credentials:
          # -- K8s secret name containing git credentials
          secretName: github-token

      localServices:
        terminal:
          # -- Enable terminal debug UI in session pods
          debug: false

      persistence:
        # -- Mount path for session data
        mountPath: "/volundr/sessions"

      homeVolume:
        # -- Enable persistent home directory in session pods
        enabled: true
        # -- Mount path for the home PVC
        mountPath: "/volundr/home"
        credentialFiles:
          # -- Pre-existing K8s secret containing Claude credential files
          secretName: "claude-credentials"
          # -- Subdirectory under mountPath where credential symlinks are placed
          destDir: ".claude"
          # -- Internal mount path for the credentials secret
          secretMountPath: "/volundr/secrets/credential-files"

      # Secrets injected as env vars into the skuld broker container.
      envSecrets:
        - envVar: ANTHROPIC_API_KEY
          secretName: anthropic-api-key
          secretKey: api-key

      # Plain env vars injected into the skuld broker container.
      envVars: []

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # -- Runtime class name for session pods (e.g., "nvidia", "kata", "gvisor")
      runtimeClassName: ""

  # Skuld-Codex session definition (OpenAI Codex)
  # Uses the merged skuld image (ships both Claude Code and Codex CLIs).
  skuldCodex:
    # -- Enable skuld-codex session definition (disabled by default)
    enabled: false
    # -- Human-readable name shown in the UI
    displayName: "OpenAI Codex"
    # -- Short description for the session picker
    description: "OpenAI's Codex coding agent with streaming chat and tools. The usual choice for OpenAI."
    # -- Default model for this definition (empty = use Codex default based on subscription)
    defaultModel: ""
    # -- Labels for agent routing
    labels:
      - session
    # -- Model providers this runtime accepts (empty = provider-neutral)
    compatibleProviders:
      - openai
      # a model server you run yourself, through the model gateway
      - local
    # -- Whether this session definition is active
    active: true

    # Helm chart configuration (same chart as skuld-claude)
    helm:
      chart: skuld
      repo: "oci://ghcr.io/niuulabs/charts"
      repoName: ""
      version: "0.1.0"

    defaults:
      session:
        # -- Default Codex model (empty = let Codex pick based on subscription)
        model: ""

      broker:
        # -- AI CLI backend: "codex-ws" uses the app-server WebSocket protocol
        # -- which supports session resume, interrupt, streaming, and approvals.
        # -- Use "codex" for the legacy one-subprocess-per-message transport.
        cliType: codex-ws
        # -- Fully-qualified transport adapter class path
        transportAdapter: "skuld.transports.codex_ws.CodexWebSocketTransport"
        # -- Skip prompts and use approvalPolicy=never with danger-full-access
        skipPermissions: true
        agentTeams: false

      image:
        repository: ghcr.io/niuulabs/skuld
        tag: "latest"

      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"

      imagePullSecrets:
        - ghcr-pull-secret

      ingress:
        className: ""
        annotations: {}
        tls:
          enabled: false
          secretName: "skuld-wildcard-tls"

      git:
        credentials:
          secretName: github-token

      localServices:
        terminal:
          debug: false

      persistence:
        mountPath: "/volundr/sessions"

      homeVolume:
        enabled: true
        mountPath: "/volundr/home"
        credentialFiles:
          # Codex subscription credentials are supplied access-only by the
          # central broker; auth.json is never projected into the session.
          secretName: ""
          # -- Codex stores config under .codex/
          destDir: ".codex"
          secretMountPath: "/volundr/secrets/credential-files"

      # Subscription sessions do not use a static OpenAI API key.
      envSecrets: []

      # Plain env vars injected into the skuld broker container.
      envVars: []

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      runtimeClassName: ""

  # Skuld-OpenCode session definition (OpenCode — model-neutral)
  # Supports Claude, OpenAI, Gemini, Ollama, and other providers.
  skuldOpenCode:
    # -- Enable skuld-opencode session definition (disabled by default)
    enabled: false
    # -- Human-readable name shown in the UI
    displayName: "OpenCode"
    # -- Short description for the session picker
    description: "OpenCode, an open-source coding agent that works with any connected provider or a local model."
    # -- Default model for this definition (empty = use OpenCode default)
    defaultModel: ""
    # -- Labels for agent routing
    labels:
      - session
    # -- Model providers this runtime accepts ([] = provider-neutral, accepts any)
    compatibleProviders: []
    # -- Whether this session definition is active
    active: true

    # Helm chart configuration (same chart as skuld-claude)
    helm:
      chart: skuld
      repo: "oci://ghcr.io/niuulabs/charts"
      repoName: ""
      version: "0.1.0"

    defaults:
      session:
        # -- Default OpenCode model (empty = let OpenCode pick)
        model: ""

      broker:
        # -- AI CLI backend: "opencode" uses HTTP REST + SSE protocol
        cliType: opencode
        # -- Fully-qualified transport adapter class path
        transportAdapter: "skuld.transports.opencode.OpenCodeHttpTransport"
        # -- Skip tool permission prompts
        skipPermissions: true
        agentTeams: false

      image:
        repository: ghcr.io/niuulabs/skuld
        tag: "latest"

      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"

      imagePullSecrets:
        - ghcr-pull-secret

      ingress:
        className: ""
        annotations: {}
        tls:
          enabled: false
          secretName: "skuld-wildcard-tls"

      persistence:
        mountPath: "/volundr/sessions"

      homeVolume:
        enabled: true
        mountPath: "/volundr/home"

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      runtimeClassName: ""

  # Skuld-DeepSeek-Harness session definition (dsh — SDK JSON-RPC runtime)
  # The Skuld image must include the deepseek-harness-runtime-bin package
  # (or set broker.dsh.runtimeBin to a dsh-jsonrpc-agent executable).
  skuldDeepSeekHarness:
    # -- Enable skuld-deepseek-harness session definition
    enabled: true
    # -- Human-readable name shown in the UI
    displayName: "DeepSeek Harness"
    # -- Short description for the session picker
    description: "DeepSeek's Harness coding agent (dsh) with streaming chat and tools."
    # -- Default model for this definition
    defaultModel: "deepseek-v4-flash"
    # -- Labels for agent routing
    labels:
      - session
      - dsh
    # -- Model providers this runtime accepts
    compatibleProviders:
      - deepseek
    # -- Whether this session definition is active
    active: true

    # Helm chart configuration (same chart as skuld-claude)
    helm:
      chart: skuld
      repo: "oci://ghcr.io/niuulabs/charts"
      repoName: ""
      version: "0.1.0"

    defaults:
      session:
        # -- Default dsh model
        model: "deepseek-v4-flash"

      broker:
        # -- AI CLI backend: "dsh" uses the SDK JSON-RPC stdio protocol
        cliType: dsh
        # -- Fully-qualified transport adapter class path
        transportAdapter: "skuld.transports.dsh.DshJsonRpcTransport"
        # -- Skip tool permission prompts (dsh composition auto-approves)
        skipPermissions: true
        agentTeams: false
        dsh:
          # -- dsh-jsonrpc-agent executable (empty = bundled runtime-bin package)
          runtimeBin: ""
          # -- Cordis composition file (empty = bundled default composition)
          cordisConfig: ""
          # -- OpenAI-compatible chat-completions base URL (empty = DeepSeek API)
          baseUrl: ""
          # -- Provider route registered by the runtime composition
          provider: "deepseek-official"
          # -- Max seconds to wait for a turn to reach idle
          promptTimeoutS: 600

      image:
        repository: ghcr.io/niuulabs/skuld
        tag: "latest"

      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"

      imagePullSecrets:
        - ghcr-pull-secret

      ingress:
        className: ""
        annotations: {}
        tls:
          enabled: false
          secretName: "skuld-wildcard-tls"

      persistence:
        mountPath: "/volundr/sessions"

      homeVolume:
        enabled: true
        mountPath: "/volundr/home"

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      runtimeClassName: ""

  # Skuld-Reviewer session definition (lightweight LLM reviewer — no IDE)
  skuldReviewer:
    # -- Enable skuld-reviewer session definition
    enabled: true
    # -- Labels for agent routing
    labels:
      - reviewer
    # -- Whether this session definition is active
    active: true

    # Helm chart configuration (uses skuld-planner — lightweight broker)
    helm:
      chart: skuld-planner
      repo: "oci://ghcr.io/niuulabs/charts"
      repoName: ""
      version: "0.1.0"

    defaults:
      session:
        # -- Default model for reviewer sessions
        model: "claude-opus-4-6"

      resources:
        requests:
          cpu: "250m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"

# Web UI (optional standalone frontend)
web:
  # -- Pod-level security context. Set a field to null to drop it (for example runAsUser: null where an
  # admission policy rejects an explicit UID).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL
  # -- Enable the Volundr web UI component
  enabled: false

  # -- Number of web replicas
  replicaCount: 1

  # -- Annotations to apply to the Volundr web UI pod template
  podAnnotations: {}

  image:
    # -- Web UI image registry
    registry: ghcr.io
    # -- Web UI image repository
    repository: niuulabs/niuu-web
    # -- Web UI image tag (defaults to Chart.appVersion)
    tag: ""
    # -- Web UI image pull policy
    pullPolicy: Always

  service:
    # -- Web UI service type
    type: ClusterIP
    # -- Web UI service port
    port: 80

  ingress:
    # -- Enable web UI ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    # Aligns with Volundr API ingress (same domain, different path)
    hosts:
      - host: volundr.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS
    tls: []

  # Runtime configuration injected via configmap
  config:
    # -- Backend API base URL (auto-wired to in-cluster service if empty)
    apiBaseUrl: ""
    # OIDC configuration (enables login flow in the web UI)
    oidc:
      # -- OIDC provider discovery URL (e.g., https://keycloak.example.com/realms/volundr)
      # Leave empty to disable OIDC (allow-all / dev mode)
      authority: ""
      # -- OIDC client ID
      clientId: ""
      # -- Redirect URI after login (defaults to web UI origin)
      redirectUri: ""
      # -- Redirect URI after logout (defaults to web UI origin)
      postLogoutRedirectUri: ""
      # -- OIDC scopes
      scope: "openid profile email"

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Next-generation web UI (optional standalone frontend)
webNext:
  # -- Pod-level security context. Set a field to null to drop it (for example runAsUser: null where an
  # admission policy rejects an explicit UID).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL
  # -- Enable the composable Niuu web UI component
  enabled: false

  # -- Number of web-next replicas
  replicaCount: 1

  # -- Annotations to apply to the composable Niuu web UI pod template
  podAnnotations: {}

  image:
    # -- Web UI image registry
    registry: ghcr.io
    # -- Web UI image repository
    repository: niuulabs/niuu-web
    # -- Web UI image tag (defaults to Chart.appVersion)
    tag: ""
    # -- Web UI image pull policy
    pullPolicy: Always

  service:
    # -- Web UI service type
    type: ClusterIP
    # -- Web UI service port
    port: 80

  ingress:
    # -- Enable web-next ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: niuu.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS
    tls: []

  config:
    # -- Public origin used to render absolute same-origin service URLs
    publicOrigin: "https://niuu.example.com"
    # -- Public session gateway origin used for /s/{sessionId}/... traffic
    sessionOrigin: ""
    theme: "niuu"
    plugins:
      login:
        enabled: true
        order: 0
      credentials:
        enabled: true
        order: 1
      integrations:
        enabled: true
        order: 2
      bifrost:
        enabled: true
        order: 3
      volundr:
        enabled: true
        order: 4
      ting:
        enabled: true
        order: 5
      mimir:
        enabled: true
        order: 6
      ravn:
        enabled: true
        order: 7
      observatory:
        enabled: true
        order: 8
      settings:
        enabled: true
        order: 9
    auth:
      issuer: ""
      clientId: ""
    # -- Optional service URL overrides keyed by plugin-sdk service id.
    # `forge.scope: node` scopes the UI to the one Forge node at `forge.baseUrl`
    # (hosts, sessions, metrics and resources of that node only, which names its
    # own Guild registry entry at GET /api/v1/forge/guild). The default, `guild`,
    # expects the Guild's Forge facade and covers every registered Forge.
    services: {}

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Resource limits (API backend)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Probes
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- Path for liveness probe
  path: /health
  # -- Scheme for liveness probe
  scheme: HTTP
  # -- Initial delay seconds
  initialDelaySeconds: 10
  # -- Period seconds
  periodSeconds: 30
  # -- Timeout seconds
  timeoutSeconds: 10
  # -- Success threshold
  successThreshold: 1
  # -- Failure threshold
  failureThreshold: 3

readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- Path for readiness probe
  path: /health
  # -- Scheme for readiness probe
  scheme: HTTP
  # -- Initial delay seconds
  initialDelaySeconds: 5
  # -- Period seconds
  periodSeconds: 10
  # -- Timeout seconds
  timeoutSeconds: 5
  # -- Success threshold
  successThreshold: 1
  # -- Failure threshold
  failureThreshold: 3

startupProbe:
  # -- Enable startup probe
  enabled: false
  # -- Path for startup probe
  path: /health
  # -- Scheme for startup probe
  scheme: HTTP
  # -- Initial delay seconds
  initialDelaySeconds: 5
  # -- Period seconds
  periodSeconds: 5
  # -- Timeout seconds
  timeoutSeconds: 5
  # -- Success threshold
  successThreshold: 1
  # -- Failure threshold
  failureThreshold: 30

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  # Only when the volume's root does not already belong to fsGroup: a recursive change on
  # every start makes Forge's private files group-readable (its generated host SSH key,
  # which OpenSSH and Forge then refuse) and slows mounting a large sessions volume.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Autoscaling configuration
autoscaling:
  # -- Enable horizontal pod autoscaling
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: ""
  # -- Custom metrics for autoscaling
  customMetrics: []
  # -- Scaling behavior configuration
  behavior: {}

# Pod Disruption Budget
podDisruptionBudget:
  # -- Enable PodDisruptionBudget
  enabled: false
  # -- Minimum available pods
  minAvailable: 1
  # -- Maximum unavailable pods
  maxUnavailable: ""
  # -- Unhealthy pod eviction policy
  unhealthyPodEvictionPolicy: ""

# Kyverno policies
kyverno:
  pvcIsolation:
    # -- Deploy the PVC isolation ClusterPolicy (requires Kyverno >= 1.9)
    enabled: false

# Network Policy
networkPolicy:
  # -- Enable NetworkPolicy
  enabled: false
  # -- Custom ingress from selectors
  ingressFrom: []
  # -- Database pod selector for egress
  databasePodSelector: {}
  # -- Extra ingress rules
  extraIngress: []
  # -- Extra egress rules
  extraEgress: []

# Deployment strategy. Rolling: the new pod is ready before the old one stops,
# so a rollout never takes the API down. (Recreate stopped Völundr first and
# every request during the restart got a 503 — a resident's delivery launch
# failed this way.) A ReadWriteOnce sessions volume attaches to one node but
# can be shared by pods on it; rollout.colocate keeps the surge pod there.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

rollout:
  # -- Schedule a rolling update's new pod on the node already running Völundr,
  # so a ReadWriteOnce sessions volume can mount on both during the overlap. If
  # that node has no room the rollout waits, with the old pod still serving.
  colocate: true
  # -- Seconds a terminating pod keeps serving while its endpoints are removed,
  # so in-flight and just-routed requests finish. Must stay below
  # terminationGracePeriodSeconds.
  drainSeconds: 10

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Pod annotations
podAnnotations: {}

# -- Pod labels
podLabels: {}

# -- Deployment annotations
deploymentAnnotations: {}

# -- Priority class name
priorityClassName: ""

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 30

# -- DNS configuration
dnsConfig: {}

# -- DNS policy
dnsPolicy: ""

# -- Extra environment variables
extraEnv: []

# -- Environment variables from secrets/configmaps
envFrom: []

# -- Extra volume mounts
extraVolumeMounts: []

# -- Extra volumes
extraVolumes: []

# -- Sidecar containers
sidecars: []

# Integration catalog (deployment-level configuration)
