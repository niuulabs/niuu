{{- if .Values.migrations.enabled }}
{{- /*
  The SQL is read from migrations/, a symlink to the repository's single source
  of truth (see .claude/rules/migrations.md); helm package follows it, so the
  published chart carries the files. Never paste migration SQL into this file.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "volundr.fullname" . }}-migrations
  labels:
    {{- include "volundr.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "migrations/*.{sql,json}" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
