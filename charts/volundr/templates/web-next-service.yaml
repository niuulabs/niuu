{{- if .Values.webNext.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "volundr.webNext.fullname" . }}
  labels:
    {{- include "volundr.webNext.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webNext.service.type }}
  ports:
    - port: {{ .Values.webNext.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "volundr.webNext.selectorLabels" . | nindent 4 }}
{{- end }}
