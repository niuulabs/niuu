{{- if .Values.webNext.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "volundr.webNext.fullname" . }}
  labels:
    {{- include "volundr.webNext.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "theme": {{ .Values.webNext.config.theme | quote }},
      "plugins":
{{ toPrettyJson .Values.webNext.config.plugins | nindent 8 }},
      "services": {
        "identity": { "mode": "http", "baseUrl": "/api/v1" },
        "credentials": { "mode": "http", "baseUrl": "/api/v1/credentials" },
        "integrations": { "mode": "http", "baseUrl": "/api/v1/integrations" },
        "features": { "mode": "http", "baseUrl": "/api/v1" },
        "tracker": { "mode": "http", "baseUrl": "/api/v1" },
        "audit": { "mode": "http", "baseUrl": "/api/v1" },
        "mimir": { "mode": "http", "baseUrl": "/api/v1/mimir" },
        "bifrost": { "mode": "http", "baseUrl": "/api/v1/bifrost" },
        "ravn": { "mode": "http", "baseUrl": "/api/v1/ravn" },
        "ravn.personas": { "mode": "http", "baseUrl": "/api/v1/ravn/personas" },
        "forge": { "mode": "http", "baseUrl": "/api/v1/forge" },
        "forge.pty": { "mode": "ws", "wsUrl": "/s/{sessionId}/session" },
        "ting": { "mode": "http", "baseUrl": "/api/v1/ting" },
        "filesystem": { "mode": "http", "baseUrl": "/" }
      },
      "auth": {
        {{- if .Values.webNext.config.auth.issuer }}
        "issuer": {{ .Values.webNext.config.auth.issuer | quote }}
        {{- if .Values.webNext.config.auth.clientId }},
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
        {{- else if .Values.webNext.config.auth.clientId }}
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
      }
    }
  config.live.json: |
    {
      "theme": {{ .Values.webNext.config.theme | quote }},
      "plugins":
{{ toPrettyJson .Values.webNext.config.plugins | nindent 8 }},
      "services": {
        "identity": { "mode": "http", "baseUrl": "/api/v1" },
        "credentials": { "mode": "http", "baseUrl": "/api/v1/credentials" },
        "integrations": { "mode": "http", "baseUrl": "/api/v1/integrations" },
        "features": { "mode": "http", "baseUrl": "/api/v1" },
        "tracker": { "mode": "http", "baseUrl": "/api/v1" },
        "audit": { "mode": "http", "baseUrl": "/api/v1" },
        "mimir": { "mode": "http", "baseUrl": "/api/v1/mimir" },
        "bifrost": { "mode": "http", "baseUrl": "/api/v1/bifrost" },
        "ravn": { "mode": "http", "baseUrl": "/api/v1/ravn" },
        "ravn.personas": { "mode": "http", "baseUrl": "/api/v1/ravn/personas" },
        "forge": { "mode": "http", "baseUrl": "/api/v1/forge" },
        "forge.pty": { "mode": "ws", "wsUrl": "/s/{sessionId}/session" },
        "ting": { "mode": "http", "baseUrl": "/api/v1/ting" },
        "filesystem": { "mode": "http", "baseUrl": "/" }
      },
      "auth": {
        {{- if .Values.webNext.config.auth.issuer }}
        "issuer": {{ .Values.webNext.config.auth.issuer | quote }}
        {{- if .Values.webNext.config.auth.clientId }},
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
        {{- else if .Values.webNext.config.auth.clientId }}
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
      }
    }
{{- end }}
