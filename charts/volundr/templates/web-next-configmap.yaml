{{- if .Values.webNext.enabled }}
{{- $defaultServices := dict
  "identity" (dict "mode" "http" "baseUrl" "/api/v1")
  "credentials" (dict "mode" "http" "baseUrl" "/api/v1/credentials")
  "integrations" (dict "mode" "http" "baseUrl" "/api/v1/integrations")
  "features" (dict "mode" "http" "baseUrl" "/api/v1")
  "tracker" (dict "mode" "http" "baseUrl" "/api/v1")
  "audit" (dict "mode" "http" "baseUrl" "/api/v1")
  "mimir" (dict "mode" "http" "baseUrl" "/api/v1/mimir")
  "observatory" (dict "mode" "http" "baseUrl" "/api/v1/observatory")
  "bifrost" (dict "mode" "http" "baseUrl" "/api/v1/bifrost")
  "ravn" (dict "mode" "http" "baseUrl" "/api/v1/ravn")
  "ravn.personas" (dict "mode" "http" "baseUrl" "/api/v1/ravn/personas")
  "forge" (dict "mode" "http" "baseUrl" "/api/v1/forge")
  "forge.pty" (dict "mode" "ws" "wsUrl" "/s/{sessionId}/session")
  "ting" (dict "mode" "http" "baseUrl" "/api/v1/ting")
  "filesystem" (dict "mode" "http" "baseUrl" "/")
}}
{{- $services := mergeOverwrite (deepCopy $defaultServices) (.Values.webNext.config.services | default dict) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "volundr.webNext.fullname" . }}
  labels:
    {{- include "volundr.webNext.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "theme": {{ .Values.webNext.config.theme | quote }},
      "plugins":
{{ toPrettyJson .Values.webNext.config.plugins | nindent 8 }},
      "services":
{{ toPrettyJson $services | nindent 8 }},
      "auth": {
        {{- if .Values.webNext.config.auth.issuer }}
        "issuer": {{ .Values.webNext.config.auth.issuer | quote }}
        {{- if .Values.webNext.config.auth.clientId }},
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
        {{- else if .Values.webNext.config.auth.clientId }}
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
      }
    }
  config.live.json: |
    {
      "theme": {{ .Values.webNext.config.theme | quote }},
      "plugins":
{{ toPrettyJson .Values.webNext.config.plugins | nindent 8 }},
      "services":
{{ toPrettyJson $services | nindent 8 }},
      "auth": {
        {{- if .Values.webNext.config.auth.issuer }}
        "issuer": {{ .Values.webNext.config.auth.issuer | quote }}
        {{- if .Values.webNext.config.auth.clientId }},
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
        {{- else if .Values.webNext.config.auth.clientId }}
        "clientId": {{ .Values.webNext.config.auth.clientId | quote }}
        {{- end }}
      }
    }
{{- end }}
