# Guild — shared instance registry and aggregation service

replicaCount: 1
revisionHistoryLimit: 10

image:
  registry: ghcr.io/niuulabs
  repository: niuu
  tag: ""
  pullPolicy: IfNotPresent

command:
  - python
  - -m
  - guild.main
args: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8084
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1/niuu/instances
          pathType: Prefix
        - path: /api/v1/niuu/targets
          pathType: Prefix
        - path: /api/v1/forge
          pathType: Prefix
        - path: /api/v1/niuu/observatory
          pathType: Prefix
  tls: []

config:
  logLevel: "info"
  logFormat: "json"
  host: "0.0.0.0"
  port: 8084
  cors:
    allowedOrigins:
      - "*"
    allowCredentials: true
  extra: {}

database:
  name: guild
  minPoolSize: 5
  maxPoolSize: 20
  createSecret: false
  existingSecret: ""
  userKey: username
  passwordKey: password
  username: ""
  password: "CHANGE_ME"
  extraSecretData: {}
  secretAnnotations: {}
  external:
    enabled: true
    host: postgresql.default.svc.cluster.local
    port: 5432

# Database migrations configuration
migrations:
  # -- Enable Guild schema migrations via init container
  enabled: true
  image:
    # -- Migration image repository
    repository: migrate/migrate
    # -- Migration image tag
    tag: "v4.17.0"
    # -- Migration image pull policy
    pullPolicy: IfNotPresent
  # -- Resources for the migration init container
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

envoy:
  enabled: false
  image:
    repository: envoyproxy/envoy
    tag: "v1.32-latest"
    pullPolicy: IfNotPresent
  port: 8443
  adminPort: 9901
  connectTimeout: "0.25s"
  upstreamTimeout: "60s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  jwt:
    enabled: false
    issuer: ""
    audiences: []
    jwksUri: ""
    jwksTimeout: "5s"
    jwksCacheDurationSeconds: 300
    tenantClaim: "tenant_id"
    rolesClaim: "resource_access.volundr-api.roles"
    keycloakHost: ""
    keycloakPort: 8080
    keycloakTls: false
    extraClaimHeaders: []
    bypassPrefixes:
      - /api/v1/tokens/workload/jwks
      - /health
    workload:
      enabled: false
      issuer: ""
      audiences: []
      jwksUri: ""
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.volundr-api.roles"
      extraClaimHeaders: []
  extraHttpFilters: []
  extraClusters: []

workloadIdentity:
  enabled: false
  issuer: ""
  audiences:
    - volundr-api
  tokenTtlSeconds: 900
  keyId: niuu-workload
  signingKey:
    existingSecret: ""
    key: private-key.pem
  verifiers: []
  mappings: []

# -- Init containers
initContainers: []

registry:
  instances: []
  catalog: []

livenessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

# -- Guild-to-Observatory Agent Directory fan-out and validation settings.
directory:
  instanceId: ""
  cardTimeoutSeconds: 4.0
  cardCacheTtlSeconds: 300.0
  localMaxConcurrency: 8
  guildTimeoutSeconds: 5.0
  guildMaxConcurrency: 8
  signatureAlgorithms:
    - ES256
    - ES384
    - RS256
    - RS384
    - PS256
    - EdDSA
  # -- Card origins explicitly trusted to receive forwarded caller authentication.
  authenticatedCardOrigins: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
extraEnv: []
extraVolumeMounts: []
extraVolumes: []

global:
  imagePullSecrets: []
  image:
    registry: ""
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown
