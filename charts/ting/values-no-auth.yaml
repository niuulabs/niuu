# Explicitly disable authentication/authorization in a trusted deployment.
auth:
  allowAnonymousDev: true
authorization:
  adapter: identity.adapters.authorization.AllowAllAuthorizationAdapter
envoy:
  authorization:
    enabled: false
  jwt:
    enabled: false

pat:
  service_adapter: niuu.domain.services.pat.PATService
  service_kwargs:
    require_scopes: false
  validator_adapter: niuu.domain.services.pat_validator.PATValidator
  validator_kwargs: {}

identityAuthority:
  enabled: false
