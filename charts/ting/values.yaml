# Ting — saga coordinator
# https://github.com/niuulabs/volundr

replicaCount: 1
revisionHistoryLimit: 10

image:
  registry: ghcr.io/niuulabs
  repository: niuu
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

# -- Override container command. Defaults to the unified niuu image running the Ting API.
command:
  - python
  - -m
  - ting
# -- Additional container args.
args: []

nameOverride: ""
fullnameOverride: ""

# -- Pod-level securityContext. fsGroup matches the unified niuu image's
# runtime user (65532, non-root — see containers/niuu/Dockerfile) so a
# freshly provisioned workflowPersistence block volume is group-writable
# on single-node (ReadWriteOnce) storage; without this, the filesystem
# workflow catalog refuses to start on a root-owned mount.
# fsGroupChangePolicy: OnRootMismatch skips the recursive chown once
# ownership already matches, instead of doing it on every pod restart.
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

# -- Deployment update strategy override. Leave empty (the default) to let
# the chart choose: RollingUpdate (Kubernetes' own default, unset here) for
# ReadWriteMany or persistence-disabled installs, and an automatic
# `{type: Recreate}` whenever workflowPersistence.accessModes is
# ReadWriteOnce or ReadWriteOncePod — a surge pod cannot attach the same
# block volume, so RollingUpdate would deadlock. Set this only to force a
# specific strategy explicitly; on a ReadWriteOnce/ReadWriteOncePod volume,
# only `{type: Recreate}` is accepted (the chart fails the render otherwise).
strategy: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8081
  annotations: {}

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name (nginx, traefik, haproxy, etc.)
  className: ""
  # -- Ingress annotations (controller-specific)
  annotations: {}
  # -- Ingress hosts
  # Note: Ting API is served at /api/v1/ting/* — these defaults ensure the
  # chart works out of the box without users needing to know the route prefix.
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1/ting
          pathType: Prefix
  # -- TLS configuration
  tls: []

config:
  logLevel: "info"
  logFormat: "json"
  # -- OpenTelemetry trace/metric export for Ting's own process (distinct
  # from dispatch.flock.observability below, which is for the Ravn/Skuld
  # flock nodes Ting launches). Empty (the default) means unconfigured —
  # observability.enabled defaults to false, a decision, not a fallback.
  # Fields match niuu.domain.observability.ObservabilityConfig.
  observability: {}
  host: "0.0.0.0"
  port: 8081
  workers: 2
  # -- Browser-facing Niuu origin used in notification links
  publicOrigin: ""
  cors:
    # -- Allowed browser origins for cross-origin API requests
    allowedOrigins:
      - "*"
    # -- Whether credentialed CORS requests are allowed
    allowCredentials: true
  extra: {}

# Session activity watcher — per-cluster Volundr SSE subscriptions
watcher:
  # -- Seconds to wait before reconnecting after a clean SSE stream close,
  # and between owner sync cycles.
  reconnectDelay: 5.0
  # -- Initial per-cluster backoff delay (seconds) after an SSE subscription
  # failure, before reconnectBackoffMultiplier is applied.
  reconnectInitialDelay: 2.0
  # -- Ceiling (seconds) for a failing cluster's per-cluster backoff delay.
  reconnectMaxDelay: 120.0
  # -- Multiplier applied to a failing cluster's backoff delay after each
  # consecutive failure.
  reconnectBackoffMultiplier: 2.0
  # -- Fraction (0-1) randomly subtracted from each computed backoff delay
  # to avoid synchronized reconnect storms across clusters.
  reconnectJitter: 0.2
  # -- Seconds a connection must stay open before it counts as healthy
  # enough to reset a cluster's backoff, even if it drops without ever
  # seeing an event (e.g. a cluster that legitimately has no sessions).
  reconnectStableAfterSeconds: 30.0

# Dispatcher configuration
dispatch:
  flock:
    # -- Additional config deep-merged into every dynamically launched Ravn node.
    ravnConfig: {}
    # -- Shared OTEL exporter settings; runtime service names stay ravn and skuld.
    observability: {}

  # -- In-process (single-turn) dispatch configuration.
  # Controls the LLM used by the RavnDispatcher when running the
  # decomposer persona inline (no mesh, no pod).
  # When llmConfig is empty, falls back to dispatch.flock.llmConfig.
  #
  # Example — force opus for all in-process calls:
  #   inProcess:
  #     llmConfig:
  #       model: claude-opus-4-6
  #       max_tokens: 8192
  inProcess:
    llmConfig: {}

  # -- Default system prompt injected into every dispatched session
  defaultSystemPrompt: |
    You are a senior software engineer working on the Niuu platform.

    ## Workflow
    - You are working on a branch created from the feature branch specified in the task.
    - Create a new branch from the feature branch for your work.
    - When done, commit your changes and create a pull request against the feature branch (NOT main).
    - Ensure CI passes — all tests green, linting clean, coverage above 85%.
    - **You MUST NOT stop or exit the session until the PR is created AND all CI checks are green.**
    - If CI fails, investigate the failure, fix it, push again, and wait for CI to pass.

    ## Linear Ticket Management (via Linear MCP Server)
    You have access to the Linear MCP server tools. Use them to keep tickets in sync:
    - **When starting work**: Use the Linear MCP tools to set the linked ticket status to "In Progress".
    - **When PR is created**: Use the Linear MCP tools to:
      1. Add a comment on the ticket with a summary of the changes and a link to the PR.
      2. Set the ticket status to "In Review".
    - If you cannot update the ticket via MCP, note it in the PR description but do NOT let it block your work.

    ## Mandatory Exit Criteria
    The session must NOT exit until ALL of the following are true:
    1. A pull request has been created against the feature branch.
    2. All CI checks on the PR are green (tests, lint, coverage).
    3. The Linear ticket has been updated to "In Review" with a comment summarizing the work.
    If any of these are not met, keep working until they are.

    ## Code Style
    - Use early returns, no nested conditionals, no single-line else.
    - No magic numbers — use config with sensible defaults.
    - No inline styles, no Tailwind — CSS Modules with design tokens only.
    - Use --color-brand for primary UI elements, never hardcode colors.
    - Python 3.12+: use X | None, match statements, raw SQL with asyncpg (no ORM).
    - Conventional commits: feat|fix|refactor(scope): description

    ## Architecture
    - Hexagonal architecture: ports (interfaces) → adapters (implementations).
    - Ting, Volundr, and Niuu are separate modules — never cross-import between Ting and Volundr.
    - Shared code goes in the niuu module.
    - Dynamic adapter pattern: config specifies class path, kwargs forwarded.
    - No backwards-compatibility shims — just change the code.

    ## Testing
    - 85% coverage minimum for both backend and frontend.
    - Test against ports, mock infrastructure.
    - Run ruff check + ruff format before committing.
    - Zero warnings in pytest.
  # -- Default LLM model for dispatched sessions
  defaultModel: "claude-sonnet-4-6"
  # -- Template for the initial prompt sent to coding sessions.
  # Available placeholders: {identifier}, {title}, {description},
  # {repo}, {feature_branch}, {run_branch}.
  # Leave empty to use the built-in default from config.py.
  dispatchPromptTemplate: ""

# Planner configuration
planner:
  # -- System prompt for interactive planning sessions.
  # Placeholders: {repo}, {base_branch}, {spec}. Leave empty for built-in default.
  plannerSystemPrompt: ""
  # -- Prompt injected when the user clicks "Finalize Plan". Leave empty for built-in default.
  finalizePrompt: ""

# A2A protocol surface (agent card + task endpoint)
a2a:
  # -- Agent name advertised on the A2A agent card. Leave empty for built-in default.
  agentName: ""
  # -- Agent description advertised on the A2A agent card. Leave empty for built-in default.
  agentDescription: ""
  # -- Cache-Control max-age for the served agent card. Leave empty for built-in default.
  cardMaxAgeSeconds: ""
  # -- Lease duration for idempotent A2A workflow launch reservations.
  launchLeaseSeconds: 60
  # -- Artifacts at or under this size (chars) inline on A2A tasks. Leave empty for built-in default.
  inlineArtifactMaxChars: ""
  # -- Extra artifact filenames probed beyond the .md page listing. Leave empty for built-in default.
  extraArtifactFiles: []
  # -- Public origin for interface URLs on the card. Leave empty to use the request base URL.
  publicBaseUrl: ""
  # -- Dynamic auth adapter used for outbound A2A push callbacks.
  pushAuth:
    adapter: "niuu.adapters.outbound.http_auth.NoAuthHeaderAdapter"
    kwargs: {}

workflowExecution:
  # Domain-neutral fan-out/join, durable waits, and the Ravn A2A gateway.
  enabled: false
  gatewayAdapter: ravn.adapters.child_task_a2a.ConfiguredRavnChildTaskA2AGateway
  gatewayKwargs: {}
  # Gateway admission roles on Ting-issued exact-scope workload credentials.
  admissionRoles:
    - volundr:developer
  waitRepositoryAdapter: ting.adapters.postgres_workflow_waits.PostgresWorkflowWaitRepository
  waitRepositoryKwargs: {}
  # Generic wait condition observers, each `{condition_type, adapter, ...kwargs}`; see
  # WorkflowExecutionConfig.wait_observers for the constructor-injection rules. The
  # code delivery specialization's own forge.* observers live under delivery.waitObservers
  # below and are only registered when delivery.enabled.
  waitObservers:
    - condition_type: timer
      adapter: ting.adapters.timer_wait_observer.TimerWaitObserver
  workerId: ting-workflow-execution
  launchClaimLimit: 4
  reconcileLimit: 100
  leaseSeconds: 60
  reconcileIntervalSeconds: 5
  defaultBudgetUnits: 100
  defaultDeadlineSeconds: 86400
  listPageSize: 50
  maxChildReconcileFailures: 5
  maxWaitFailures: 5
  maxParentStopFailures: 5
  # Code delivery specialization: its own repository, router, and Forge/review
  # wiring, layered over the generic execution ledger above. Requires enabled.
  delivery:
    # Code delivery on top of the generic blocks. Requires
    # workflowExecution.enabled, workload identity, and configured Ravn A2A and
    # Forge delivery/evidence adapters, including reviewAuthenticatorAdapter.
    enabled: false
    # forge.* wait condition observers, registered only when delivery is enabled.
    waitObservers:
      - condition_type: forge.checks
        adapter: ting.delivery.wait_observers.ForgeChecksWaitObserver
      - condition_type: forge.merge
        adapter: ting.delivery.wait_observers.ForgeMergeWaitObserver
    # Dynamic `EvidenceAuthenticator` used to sign server-derived reviewer receipts.
    reviewAuthenticatorAdapter: ""
    reviewAuthenticatorKwargs: {}
    reviewAuthenticatorSecretKwargsEnv: {}
    reviewProducers:
      code: developer-code-reviewer
      security: developer-security-reviewer
      adversarial: developer-adversarial-reviewer
    integrationReviewProducer: developer-integration-verifier
    evidencePolicyId: developer-workstream
    integrationPolicyId: developer-integration

database:
  name: ting
  existingSecret: ""
  createSecret: false
  username: ""
  # MUST be overridden for production
  password: "CHANGE_ME"
  userKey: "username"
  passwordKey: "password"
  minPoolSize: 2
  maxPoolSize: 10
  external:
    enabled: false
    host: ""
    port: 5432

# Workflow definition storage. PostgreSQL remains the explicit rollback mode.
# File-backed storage and persistence are enabled by default. Existing installations
# must run the workflow migration command before cutover.
workflowRepository:
  adapter: "ting.adapters.filesystem_workflows.FilesystemWorkflowRepository"
  seedBundled: false
  # Extra adapter constructor kwargs. The filesystem adapter defaults to
  # catalog_path=/data/ting/workflows and create_directory=true; other
  # adapters receive exactly what is set here.
  kwargs: {}

workflowImport:
  maxUploadBytes: 4194304
  maxExpandedBytes: 16777216
  maxEntries: 128

workflowPersistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  # Existing PVCs' accessModes are immutable — changing this default would
  # break upgrades of installs already running on it. Single-node
  # (ReadWriteOnce/ReadWriteOncePod) block storage is supported and detected
  # automatically (see `strategy` above); set it explicitly for a new install
  # on storage that cannot do ReadWriteMany, such as most single-node CSI
  # drivers (e.g. Harvester). replicaCount > 1 (or autoscaling.enabled)
  # requires ReadWriteMany here — e.g. NFS, with the export owned by uid
  # 65532 and attribute/lookup caching disabled, since kubelet does not
  # apply podSecurityContext.fsGroup to NFS mounts — the chart fails the
  # render otherwise. This also governs existingClaim: accessModes is read
  # as the operator's statement about what that claim supports.
  accessModes:
    - ReadWriteMany
  size: 1Gi
  annotations: {}

# Opt-in, automated database-to-file workflow catalog cutover: an init
# container that runs `python -m ting.migrate_workflows --apply
# --skip-if-migrated` ahead of the main container, after the golang-migrate
# schema migration. Safe to leave enabled indefinitely — --skip-if-migrated
# makes every start after the first a no-op. Safe with replicaCount > 1 too:
# concurrent init containers serialize on the catalog's own cutover lock
# (FilesystemWorkflowRepository.cutover_lock), so exactly one migrates and
# the rest see its result and skip. See docs/operator/workflow-catalog.md
# for the two-phase GitOps rollout this is meant to be turned on for.
workflowMigration:
  # -- Run the migration init container on every pod start.
  applyOnStart: false
  # -- Database name on the configured PostgreSQL host holding the persona
  # registry rows referenced by workflows being migrated (--persona-database).
  # Reuses Ting's own database.username/password secret against this other
  # database name on the same PostgreSQL host -- not a separate credential.
  personaDatabase: volundr
  # -- Pass --replace-divergent-bundled: preserve database system rows that
  # diverge from their packaged definition under their existing identity,
  # instead of failing the migration.
  replaceDivergentBundled: false
  resources: {}

# Envoy sidecar proxy (JWT validation, header extraction)
envoy:
  # -- Enable Envoy sidecar proxy
  enabled: false
  image:
    # -- Envoy image repository
    repository: envoyproxy/envoy
    # -- Envoy image tag
    tag: "v1.32-latest"
    # -- Envoy image pull policy
    pullPolicy: IfNotPresent
  # -- Envoy listener port (becomes the service target when enabled)
  port: 8443
  # -- Envoy admin interface port (localhost only)
  adminPort: 9901
  # -- Upstream connect timeout
  connectTimeout: "0.25s"
  # -- Upstream request timeout
  upstreamTimeout: "60s"
  # -- Resource limits for the Envoy sidecar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # -- Header names Envoy sets on upstream requests
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  # JWT authentication (via Keycloak)
  jwt:
    # -- Enable JWT authentication filter
    enabled: false
    # -- JWT issuer URL (Keycloak realm)
    issuer: ""
    # -- Allowed JWT audiences
    audiences: []
    # -- JWKS URI for key retrieval
    jwksUri: ""
    # -- JWKS fetch timeout
    jwksTimeout: "5s"
    # -- JWKS cache duration in seconds
    jwksCacheDurationSeconds: 300
    # -- JWT claim containing tenant ID
    tenantClaim: "tenant_id"
    # -- JWT claim containing roles
    rolesClaim: "resource_access.ting.roles"
    # -- Keycloak upstream host (for JWKS fetching)
    keycloakHost: ""
    # -- Keycloak upstream port
    keycloakPort: 8080
    # -- Enable TLS for Keycloak upstream
    keycloakTls: false
    keycloakCaFile: /etc/ssl/certs/ca-certificates.crt
    # -- Additional JWT claim-to-header mappings
    extraClaimHeaders: []
    # -- Path prefixes that bypass JWT validation
    bypassPrefixes:
      - /api/v1/tokens/workload/exchange
      - /api/v1/tokens/workload/jwks
      - /health
      - /api/v1/ting/health
    # -- Additional JWT provider for short-lived Niuu workload tokens.
    # When enabled, Envoy accepts either Keycloak user tokens or workload tokens.
    workload:
      enabled: false
      issuer: ""
      audiences: []
      jwksUri: ""
      jwksTimeout: "5s"
      jwksCacheDurationSeconds: 300
      tenantClaim: "tenant_id"
      rolesClaim: "resource_access.ting.roles"
      extraClaimHeaders: []
      jwksHost: ""
      jwksPort: 443
      jwksTls: true
      jwksCaFile: /etc/ssl/certs/ca-certificates.crt
  # -- Extra HTTP filters (inserted before the router filter)
  extraVolumeMounts: []
  authorization:
    # Optional central identity/PAT revocation check before gateway admission.
    # Use identity.adapters.remote.RemoteHeaderAuthenticationAdapter with HTTPS authority_url.
    identity: null
    enabled: false
    port: 9002
    timeout: 1s
    shutdownGraceSeconds: 5
    extraVolumeMounts: []
    readinessProbe:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    routes:
    - path: /api/v1/ting/workflows/{workflow_id}/launch
      path_template: true
      methods:
      - POST
      required_scope: ting:workflow:launch
    - path: /api/v1/ting
      prefix: true
      methods:
      - GET
      - HEAD
      - POST
      - PUT
      - PATCH
      - DELETE
    - path: /api/v1/tokens
      prefix: true
      methods:
      - GET
      - POST
      - DELETE
    roleMapping:
      admin: volundr:admin
      developer: volundr:developer
      viewer: volundr:viewer
  extraHttpFilters: []
  # -- Extra upstream clusters
  extraClusters: []

workloadIdentity:
  enabled: false
  issuer: ""
  audiences:
    - volundr-api
  tokenTtlSeconds: 900
  keyId: niuu-workload
  signingKey:
    existingSecret: ""
    key: private-key.pem
  verifiers: []
  mappings: []

# Flock flow configuration — reusable named persona compositions
flockFlows:
  # -- Enable flock flow ConfigMap and RBAC
  enabled: false
  # -- Fully-qualified adapter class path
  adapter: "ting.adapters.flows.config.ConfigFlockFlowProvider"
  # -- Extra kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Predefined flows (rendered into the ConfigMap)
  flows: []
  #   - name: code-review-flow
  #     description: "Standard code review with coordinator + reviewer"
  #     personas:
  #       - name: coordinator
  #       - name: reviewer
  #     mesh_transport: nng
  #     max_concurrent_tasks: 3

credentialStore:
  # -- Fully-qualified class path for the credential store adapter
  adapter: "niuu.adapters.memory_credential_store.MemoryCredentialStore"
  # -- Extra kwargs forwarded to the adapter constructor
  kwargs: {}
  # -- Secret kwargs: each entry injects a K8s secret value as an env var
  # Example:
  #   - kwarg: client_id
  #     secretName: infisical-auth
  #     secretKey: client-id
  secretKwargs: []

sharedIntegrations:
  # -- Shared database on the configured PostgreSQL host; mutually exclusive with baseUrl
  databaseName: ""
  auth:
    adapter: niuu.adapters.outbound.http_auth.NoAuthHeaderAdapter
    kwargs: {}
  # -- Internal base URL for niuu-shared integration APIs
  baseUrl: ""
  # -- HTTP timeout for shared integration requests
  timeoutSeconds: 30.0

auth:
  adapter: identity.adapters.identity.EnvoyHeaderAuthenticationAdapter
  kwargs: {}
  # -- Allow requests without identity only in explicitly trusted deployments
  allowAnonymousDev: false
  defaultUserId: dev-user
  defaultTenantId: ""
  # -- Symmetric signing key for PAT JWTs (same key Envoy uses for validation)
  patSigningKey: ""
  # -- Default PAT lifetime in days
  patTtlDays: 365

volundr:
  url: "http://volundr:8000"
  auth:
    adapter: "niuu.adapters.outbound.http_auth.NoAuthHeaderAdapter"
    kwargs: {}
    secretKwargs: []

guildRegistry:
  baseUrl: ""
  timeoutSeconds: 30.0
  auth:
    adapter: "niuu.adapters.outbound.http_auth.NoAuthHeaderAdapter"
    kwargs: {}
    secretKwargs: []

migrations:
  enabled: true
  image:
    repository: migrate/migrate
    tag: "v4.18.3"
    pullPolicy: IfNotPresent
  resources: {}

livenessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
extraEnv: []
extraVolumeMounts: []
extraVolumes: []

global:
  imagePullSecrets: []
  image:
    registry: ""
  niuu:
    # -- Deployment cluster label used by Guild/Observatory discovery.
    cluster: unknown

authorization:
  adapter: "identity.adapters.cedar.CedarAuthorizationAdapter"
  kwargs: {}
  secret_kwargs_env: {}

pat:
  token_issuer_adapter: niuu.adapters.memory_token_issuer.MemoryTokenIssuer
  token_issuer_kwargs: {}
  ttl_days: 365
  issuerSecretName: ""
  issuerSecretKey: client-secret
  service_adapter: niuu.domain.services.pat.PATService
  service_kwargs: {}
  validator_adapter: niuu.domain.services.pat_validator.PATValidator
  validator_kwargs: {}

# Shared identity service: fresh membership, role and credential checks.
# Point at the canonical identity service, never back at this client service.
identityAuthority:
  enabled: false
  url: ""
  timeout: 5
  caFile: ""
