{{- $filesystemWorkflowAdapter := "ting.adapters.filesystem_workflows.FilesystemWorkflowRepository" -}}
{{- if and (eq .Values.workflowRepository.adapter $filesystemWorkflowAdapter) (not .Values.workflowPersistence.enabled) -}}
{{- fail "workflowPersistence.enabled must be true when the filesystem workflow repository is selected" -}}
{{- end -}}
{{- if and (eq .Values.workflowRepository.adapter $filesystemWorkflowAdapter) .Values.workflowRepository.seedBundled -}}
{{- fail "workflowRepository.seedBundled must be false for the filesystem workflow repository" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ting.fullname" . }}
  labels:
    {{- include "ting.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | default "info" | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | default "json" | quote }}
  HOST: {{ .Values.config.host | default "0.0.0.0" | quote }}
  PORT: {{ .Values.service.targetPort | default 8000 | quote }}
  WORKERS: {{ .Values.config.workers | default 2 | quote }}
  {{- with .Values.config.extra }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

  CERBOS__URL: {{ .Values.cerbos.url | default "http://localhost:3592" | quote }}

  config.yaml: |
    # Ting configuration (generated by Helm)

    logging:
      level: {{ .Values.config.logLevel | default "info" | quote }}
      format: {{ .Values.config.logFormat | default "json" | quote }}

    notification:
      public_origin: {{ .Values.config.publicOrigin | default "" | quote }}

    cors:
      allowed_origins:
        {{- range .Values.config.cors.allowedOrigins }}
        - {{ . | quote }}
        {{- end }}
      allow_credentials: {{ .Values.config.cors.allowCredentials | default true }}
      allow_methods:
        - "*"
      allow_headers:
        - "*"

    database:
      min_pool_size: {{ .Values.database.minPoolSize | default 2 }}
      max_pool_size: {{ .Values.database.maxPoolSize | default 10 }}

    workflow_repository:
      adapter: {{ .Values.workflowRepository.adapter | quote }}
      seed_bundled: {{ .Values.workflowRepository.seedBundled }}
      {{- if eq .Values.workflowRepository.adapter $filesystemWorkflowAdapter }}
      kwargs: {{ mergeOverwrite (dict "catalog_path" "/data/ting/workflows") (.Values.workflowRepository.kwargs | default dict) | toJson }}
      {{- else }}
      kwargs: {{ .Values.workflowRepository.kwargs | default dict | toJson }}
      {{- end }}

    workflow_import:
      max_upload_bytes: {{ printf "%.0f" (.Values.workflowImport.maxUploadBytes | float64) }}
      max_expanded_bytes: {{ printf "%.0f" (.Values.workflowImport.maxExpandedBytes | float64) }}
      max_entries: {{ printf "%.0f" (.Values.workflowImport.maxEntries | float64) }}

    volundr:
      url: {{ .Values.volundr.url | quote }}
      auth:
        adapter: {{ .Values.volundr.auth.adapter | quote }}
        kwargs: {{ .Values.volundr.auth.kwargs | default dict | toJson }}
        {{- if .Values.volundr.auth.secretKwargs }}
        secret_kwargs_env:
          {{- range .Values.volundr.auth.secretKwargs }}
          {{ .kwarg }}: VOLUNDR_AUTH_SK_{{ .kwarg | upper }}
          {{- end }}
        {{- else }}
        secret_kwargs_env: {}
        {{- end }}

    guild_registry:
      base_url: {{ .Values.guildRegistry.baseUrl | quote }}
      timeout_seconds: {{ .Values.guildRegistry.timeoutSeconds | default 30.0 }}
      auth:
        adapter: {{ .Values.guildRegistry.auth.adapter | quote }}
        kwargs: {{ .Values.guildRegistry.auth.kwargs | default dict | toJson }}
        {{- if .Values.guildRegistry.auth.secretKwargs }}
        secret_kwargs_env:
          {{- range .Values.guildRegistry.auth.secretKwargs }}
          {{ .kwarg }}: GUILD_REGISTRY_AUTH_SK_{{ .kwarg | upper }}
          {{- end }}
        {{- else }}
        secret_kwargs_env: {}
        {{- end }}

    authorization:
      {{- toYaml .Values.authorization | nindent 6 }}

    {{- if .Values.pat }}
    pat:
      {{- $pat := deepCopy .Values.pat }}
      {{- if .Values.identityAuthority.enabled }}
      {{- $_ := set $pat "service_adapter" "niuu.adapters.remote_pats.RemotePATService" }}
      {{- $_ := set $pat "service_kwargs" (include "ting.identityAuthorityKwargs" . | fromYaml) }}
      {{- $_ := set $pat "validator_adapter" "niuu.adapters.remote_pats.RemotePATValidator" }}
      {{- $_ := set $pat "validator_kwargs" (include "ting.identityAuthorityKwargs" . | fromYaml) }}
      {{- end }}
      {{- toYaml $pat | nindent 6 }}
    {{- end }}

    dispatch:
      default_system_prompt: {{ .Values.dispatch.defaultSystemPrompt | quote }}
      default_model: {{ .Values.dispatch.defaultModel | quote }}
      {{- if .Values.dispatch.dispatchPromptTemplate }}
      dispatch_prompt_template: {{ .Values.dispatch.dispatchPromptTemplate | quote }}
      {{- end }}
      {{- if and .Values.dispatch.inProcess .Values.dispatch.inProcess.llmConfig }}
      in_process:
        llm_config: {{ .Values.dispatch.inProcess.llmConfig | toJson }}
      {{- end }}
      {{- if .Values.dispatch.flock }}
      flock:
        enabled: {{ .Values.dispatch.flock.enabled | default false }}
        {{- if .Values.dispatch.flock.ravnConfig }}
        ravn_config: {{ .Values.dispatch.flock.ravnConfig | toJson }}
        {{- end }}
        {{- if .Values.dispatch.flock.observability }}
        observability: {{ .Values.dispatch.flock.observability | toJson }}
        {{- end }}
      {{- end }}

    {{- if and .Values.planner (or .Values.planner.plannerSystemPrompt .Values.planner.finalizePrompt) }}
    planner:
      {{- if .Values.planner.plannerSystemPrompt }}
      planner_system_prompt: {{ .Values.planner.plannerSystemPrompt | quote }}
      {{- end }}
      {{- if .Values.planner.finalizePrompt }}
      finalize_prompt: {{ .Values.planner.finalizePrompt | quote }}
      {{- end }}
    {{- end }}

    {{- if or .Values.a2a.agentName .Values.a2a.agentDescription .Values.a2a.cardMaxAgeSeconds .Values.a2a.launchLeaseSeconds .Values.a2a.inlineArtifactMaxChars .Values.a2a.extraArtifactFiles .Values.a2a.publicBaseUrl .Values.a2a.pushAuth.adapter }}
    a2a:
      {{- if .Values.a2a.agentName }}
      agent_name: {{ .Values.a2a.agentName | quote }}
      {{- end }}
      {{- if .Values.a2a.agentDescription }}
      agent_description: {{ .Values.a2a.agentDescription | quote }}
      {{- end }}
      {{- if .Values.a2a.cardMaxAgeSeconds }}
      card_max_age_seconds: {{ .Values.a2a.cardMaxAgeSeconds }}
      {{- end }}
      launch_lease_seconds: {{ .Values.a2a.launchLeaseSeconds }}
      {{- if .Values.a2a.inlineArtifactMaxChars }}
      inline_artifact_max_chars: {{ .Values.a2a.inlineArtifactMaxChars }}
      {{- end }}
      {{- if .Values.a2a.extraArtifactFiles }}
      extra_artifact_files: {{ .Values.a2a.extraArtifactFiles | toJson }}
      {{- end }}
      {{- if .Values.a2a.publicBaseUrl }}
      public_base_url: {{ .Values.a2a.publicBaseUrl | quote }}
      {{- end }}
      push_auth:
        adapter: {{ .Values.a2a.pushAuth.adapter | quote }}
        kwargs:
          {{- toYaml .Values.a2a.pushAuth.kwargs | nindent 10 }}
    {{- end }}

    developer_execution:
      enabled: {{ .Values.developerExecution.enabled }}
      gateway_adapter: {{ .Values.developerExecution.gatewayAdapter | quote }}
      gateway_kwargs: {{ .Values.developerExecution.gatewayKwargs | default dict | toJson }}
      admission_roles: {{ .Values.developerExecution.admissionRoles | toJson }}
      delivery_wait_repository_adapter: {{ .Values.developerExecution.deliveryWaitRepositoryAdapter | quote }}
      delivery_wait_repository_kwargs: {{ .Values.developerExecution.deliveryWaitRepositoryKwargs | default dict | toJson }}
      delivery_wait_observer_adapter: {{ .Values.developerExecution.deliveryWaitObserverAdapter | quote }}
      delivery_wait_observer_kwargs: {{ .Values.developerExecution.deliveryWaitObserverKwargs | default dict | toJson }}
      review_authenticator_adapter: {{ .Values.developerExecution.reviewAuthenticatorAdapter | default "" | quote }}
      review_authenticator_kwargs: {{ .Values.developerExecution.reviewAuthenticatorKwargs | default dict | toJson }}
      review_authenticator_secret_kwargs_env: {{ .Values.developerExecution.reviewAuthenticatorSecretKwargsEnv | default dict | toJson }}
      review_producers: {{ .Values.developerExecution.reviewProducers | default dict | toJson }}
      integration_review_producer: {{ .Values.developerExecution.integrationReviewProducer | quote }}
      worker_id: {{ .Values.developerExecution.workerId | quote }}
      launch_claim_limit: {{ .Values.developerExecution.launchClaimLimit }}
      reconcile_limit: {{ .Values.developerExecution.reconcileLimit }}
      lease_seconds: {{ .Values.developerExecution.leaseSeconds }}
      reconcile_interval_seconds: {{ .Values.developerExecution.reconcileIntervalSeconds }}
      default_budget_units: {{ .Values.developerExecution.defaultBudgetUnits }}
      default_deadline_seconds: {{ .Values.developerExecution.defaultDeadlineSeconds }}
      list_page_size: {{ .Values.developerExecution.listPageSize }}
      evidence_policy_id: {{ .Values.developerExecution.evidencePolicyId | quote }}
      integration_policy_id: {{ .Values.developerExecution.integrationPolicyId | quote }}

    cerbos:
      url: {{ .Values.cerbos.url | default "http://localhost:3592" | quote }}

    auth:
      {{- if .Values.identityAuthority.enabled }}
      adapter: identity.adapters.remote.RemoteHeaderAuthenticationAdapter
      kwargs:
        {{- include "ting.identityAuthorityKwargs" . | nindent 8 }}
      {{- else }}
      adapter: {{ .Values.auth.adapter | quote }}
      kwargs: {{ .Values.auth.kwargs | toJson }}
      {{- end }}
      allow_anonymous_dev: {{ .Values.auth.allowAnonymousDev }}
      default_user_id: {{ .Values.auth.defaultUserId | quote }}
      default_tenant_id: {{ .Values.auth.defaultTenantId | quote }}
      pat_ttl_days: {{ .Values.auth.patTtlDays | default 365 }}

    workload_identity:
      enabled: {{ .Values.workloadIdentity.enabled | default false }}
      issuer: {{ .Values.workloadIdentity.issuer | default "" | quote }}
      {{- if .Values.workloadIdentity.audiences }}
      audiences:
        {{- range .Values.workloadIdentity.audiences }}
        - {{ . | quote }}
        {{- end }}
      {{- else }}
      audiences: []
      {{- end }}
      token_ttl_seconds: {{ .Values.workloadIdentity.tokenTtlSeconds | default 900 }}
      key_id: {{ .Values.workloadIdentity.keyId | default "niuu-workload" | quote }}
      signing_key_env: "NIUU_WORKLOAD_IDENTITY_SIGNING_KEY"
      {{- if .Values.workloadIdentity.verifiers }}
      verifiers:
        {{- toYaml .Values.workloadIdentity.verifiers | nindent 8 }}
      {{- else }}
      verifiers: []
      {{- end }}
      {{- if .Values.workloadIdentity.mappings }}
      mappings:
        {{- toYaml .Values.workloadIdentity.mappings | nindent 8 }}
      {{- else }}
      mappings: []
      {{- end }}

    credential_store:
      adapter: {{ .Values.credentialStore.adapter | quote }}
      kwargs: {{ .Values.credentialStore.kwargs | toJson }}
      {{- if .Values.credentialStore.secretKwargs }}
      secret_kwargs_env:
        {{- range .Values.credentialStore.secretKwargs }}
        {{ .kwarg }}: CREDENTIAL_STORE_SK_{{ .kwarg | upper }}
        {{- end }}
      {{- else }}
      secret_kwargs_env: {}
      {{- end }}

    shared_integrations:
      database_name: {{ .Values.sharedIntegrations.databaseName | default "" | quote }}
      auth:
        {{- toYaml .Values.sharedIntegrations.auth | nindent 8 }}
      base_url: {{ .Values.sharedIntegrations.baseUrl | quote }}
      timeout_seconds: {{ .Values.sharedIntegrations.timeoutSeconds | default 30.0 }}
