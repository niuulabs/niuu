    ALTER TABLE runs ADD COLUMN IF NOT EXISTS url TEXT NOT NULL DEFAULT '';

  000020_saga_feature_branch.down.sql: |
    ALTER TABLE sagas DROP COLUMN IF EXISTS feature_branch;

  000020_saga_feature_branch.up.sql: |
    -- Add feature_branch column to sagas (used by dispatch to set working branch)
