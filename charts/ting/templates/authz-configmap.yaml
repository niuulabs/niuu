{{- if .Values.envoy.authorization.enabled }}
{{- if not (and .Values.envoy.enabled .Values.envoy.jwt.enabled) }}
{{- fail "Cedar gateway authorization requires Envoy and JWT verification" }}
{{- end }}
{{- if not .Values.envoy.jwt.audiences }}
{{- fail "Cedar gateway authorization requires explicit JWT audiences" }}
{{- end }}
{{- if not (and .Values.envoy.jwt.keycloakTls (hasPrefix "https://" .Values.envoy.jwt.jwksUri)) }}
{{- fail "Cedar gateway authorization requires HTTPS JWKS with certificate verification" }}
{{- end }}
{{- if and .Values.envoy.jwt.workload.enabled (not .Values.envoy.jwt.workload.audiences) }}
{{- fail "Cedar gateway authorization requires explicit workload JWT audiences" }}
{{- end }}
{{- if has .Values.authorization.adapter (list "volundr.adapters.outbound.authorization.AllowAllAuthorizationAdapter" "identity.adapters.authorization.AllowAllAuthorizationAdapter") }}
{{- fail "Cedar gateway authorization requires a resource authorization adapter; allow-all is unsafe" }}
{{- end }}
{{- if .Values.auth.allowAnonymousDev }}
{{- fail "Cedar gateway requires auth.allowAnonymousDev=false" }}
{{- end }}
{{- if and .Values.envoy.jwt.workload.enabled .Values.envoy.jwt.workload.jwksUri }}
{{- if not (and .Values.envoy.jwt.workload.jwksHost .Values.envoy.jwt.workload.jwksTls (hasPrefix "https://" .Values.envoy.jwt.workload.jwksUri)) }}
{{- fail "Remote workload JWKS requires an explicit host and HTTPS with certificate verification; leave URI empty for pod-local keys" }}
{{- end }}
{{- end }}
{{- if and .Values.envoy.jwt.workload.enabled .Values.envoy.jwt.workload.jwksHost (not .Values.envoy.jwt.workload.jwksUri) }}
{{- fail "Remote workload JWKS requires an explicit HTTPS URI" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ting.fullname" . }}-authz
  labels:
    {{- include "ting.labels" . | nindent 4 }}
data:
  authz.yaml: |
    port: {{ .Values.envoy.authorization.port }}
    shutdown_grace_seconds: {{ .Values.envoy.authorization.shutdownGraceSeconds }}
    adapter: {{ .Values.authorization.adapter | quote }}
    kwargs:
      {{- toYaml .Values.authorization.kwargs | nindent 6 }}
    role_mapping:
      {{- toYaml .Values.envoy.authorization.roleMapping | nindent 6 }}
    providers:
      - issuer: {{ .Values.envoy.jwt.issuer | quote }}
        audiences: {{ .Values.envoy.jwt.audiences | toJson }}
        tenant_claim: {{ .Values.envoy.jwt.tenantClaim | quote }}
        roles_claim: {{ .Values.envoy.jwt.rolesClaim | quote }}
      {{- if .Values.envoy.jwt.workload.enabled }}
      - issuer: {{ .Values.envoy.jwt.workload.issuer | quote }}
        audiences: {{ .Values.envoy.jwt.workload.audiences | toJson }}
        tenant_claim: {{ .Values.envoy.jwt.workload.tenantClaim | quote }}
        roles_claim: {{ .Values.envoy.jwt.workload.rolesClaim | quote }}
      {{- end }}
    routes:
      {{- toYaml .Values.envoy.authorization.routes | nindent 6 }}
{{- end }}
