{{- $filesystemWorkflowAdapter := "ting.adapters.filesystem_workflows.FilesystemWorkflowRepository" -}}
{{- $rwoAccessModes := list "ReadWriteOnce" "ReadWriteOncePod" -}}
{{- $isRwoVolume := false -}}
{{- $hasRwxAccessMode := false -}}
{{- if .Values.workflowPersistence.enabled -}}
  {{- range .Values.workflowPersistence.accessModes -}}
    {{- if has . $rwoAccessModes -}}
      {{- $isRwoVolume = true -}}
    {{- end -}}
    {{- if eq . "ReadWriteMany" -}}
      {{- $hasRwxAccessMode = true -}}
    {{- end -}}
  {{- end -}}
  {{- if and (not $hasRwxAccessMode) (or (gt (.Values.replicaCount | int) 1) .Values.autoscaling.enabled) -}}
    {{- fail "workflowPersistence.accessModes does not include ReadWriteMany, so replicaCount must be 1 and autoscaling.enabled must be false -- a volume that isn't ReadWriteMany cannot be attached by more than one pod at a time. This also applies when workflowPersistence.existingClaim is set: accessModes is the operator's statement about what that claim supports. Use ReadWriteMany storage for multiple replicas, or set replicaCount: 1 and autoscaling.enabled: false." -}}
  {{- end -}}
{{- end -}}
{{- $explicitStrategy := .Values.strategy | default dict -}}
{{- $explicitStrategyType := "" -}}
{{- if $explicitStrategy -}}
  {{- $explicitStrategyType = $explicitStrategy.type | default "" -}}
{{- end -}}
{{- $effectiveStrategyType := "" -}}
{{- if $explicitStrategy -}}
  {{- if and $isRwoVolume (ne $explicitStrategyType "Recreate") -}}
    {{- fail (printf "strategy.type must be Recreate when workflowPersistence.accessModes is ReadWriteOnce/ReadWriteOncePod (got %q) — RollingUpdate would surge a second pod that cannot attach the same block volume. Use ReadWriteMany storage, or set strategy.type: Recreate." $explicitStrategyType) -}}
  {{- end -}}
  {{- $effectiveStrategyType = $explicitStrategyType -}}
{{- else if $isRwoVolume -}}
  {{- $effectiveStrategyType = "Recreate" -}}
{{- end -}}
{{- if .Values.workflowMigration.applyOnStart -}}
  {{- if ne .Values.workflowRepository.adapter $filesystemWorkflowAdapter -}}
    {{- fail "workflowMigration.applyOnStart requires workflowRepository.adapter to be ting.adapters.filesystem_workflows.FilesystemWorkflowRepository." -}}
  {{- end -}}
  {{- if not .Values.workflowPersistence.enabled -}}
    {{- fail "workflowMigration.applyOnStart requires workflowPersistence.enabled: true." -}}
  {{- end -}}
  {{- if ne $effectiveStrategyType "Recreate" -}}
    {{- fail "workflowMigration.applyOnStart requires the Recreate deployment strategy (automatic when workflowPersistence.accessModes is ReadWriteOnce/ReadWriteOncePod, or set strategy.type: Recreate explicitly) so no old Ting pod can still be writing workflow definitions while the migration runs. replicaCount can be > 1 under Recreate on ReadWriteMany storage -- concurrent migration init containers serialize on ting.migrate_workflows --skip-if-migrated's own catalog lock." -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ting.fullname" . }}
  labels:
    {{- include "ting.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  {{- if $explicitStrategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- else if $isRwoVolume }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "ting.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "ting.checksumAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ting.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "ting.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ting.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "ting.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8000 }}
              protocol: TCP
          env:
            - name: HOST
              value: {{ ternary "127.0.0.1" (.Values.config.host | default "0.0.0.0") .Values.envoy.authorization.enabled | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | default 8081 | quote }}
            - name: WORKERS
              value: {{ .Values.config.workers | default 2 | quote }}
            - name: DATABASE__HOST
              value: {{ include "ting.databaseHost" . | quote }}
            - name: DATABASE__PORT
              value: {{ include "ting.databasePort" . | quote }}
            - name: DATABASE__NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ting.databaseSecretName" . }}
                  key: {{ .Values.database.userKey | default "username" }}
            - name: DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ting.databaseSecretName" . }}
                  key: {{ .Values.database.passwordKey | default "password" }}
            - name: VOLUNDR_URL
              value: {{ .Values.volundr.url | quote }}
            {{- range .Values.volundr.auth.secretKwargs }}
            - name: VOLUNDR_AUTH_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- if and .Values.pat .Values.pat.issuerSecretName }}
            - name: PAT__TOKEN_ISSUER_KWARGS__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pat.issuerSecretName }}
                  key: {{ .Values.pat.issuerSecretKey | default "client-secret" }}
            {{- end }}
            {{- if and .Values.workloadIdentity .Values.workloadIdentity.signingKey.existingSecret }}
            - name: NIUU_WORKLOAD_IDENTITY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workloadIdentity.signingKey.existingSecret }}
                  key: {{ .Values.workloadIdentity.signingKey.key | default "private-key.pem" }}
            {{- end }}
            {{- range .Values.credentialStore.secretKwargs }}
            - name: CREDENTIAL_STORE_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.guildRegistry.auth.secretKwargs }}
            - name: GUILD_REGISTRY_AUTH_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path | default "/health" }}
              port: {{ ternary (.Values.envoy.port | int) "http" .Values.envoy.authorization.enabled }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path | default "/health" }}
              port: {{ ternary (.Values.envoy.port | int) "http" .Values.envoy.authorization.enabled }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path | default "/health" }}
              port: {{ ternary (.Values.envoy.port | int) "http" .Values.envoy.authorization.enabled }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 30 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/ting
              readOnly: true
            {{- if .Values.workflowPersistence.enabled }}
            - name: workflow-catalog
              mountPath: /data/ting/workflows
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.envoy.authorization.enabled }}
        - name: cedar-authz
          image: {{ include "ting.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "identity.authz_main"]
          args: ["--config", "/etc/authorization/authz.yaml"]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; from envoy.service.auth.v3 import external_auth_pb2 as pb, external_auth_pb2_grpc as rpc; channel = grpc.insecure_channel('127.0.0.1:{{ .Values.envoy.authorization.port }}'); assert rpc.AuthorizationStub(channel).Check(pb.CheckRequest(), timeout={{ .Values.envoy.authorization.readinessProbe.timeoutSeconds }}).denied_response.status.code == 401"
            periodSeconds: {{ .Values.envoy.authorization.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.envoy.authorization.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.envoy.authorization.readinessProbe.failureThreshold }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.envoy.authorization.resources | nindent 12 }}
          volumeMounts:
            - name: authz-config
              mountPath: /etc/authorization
              readOnly: true
            {{- with .Values.envoy.authorization.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if .Values.envoy.enabled }}
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: envoy
              containerPort: {{ .Values.envoy.port }}
              protocol: TCP
          {{- with .Values.envoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            {{- with .Values.envoy.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
        {{- end }}
      {{- if or .Values.migrations.enabled .Values.workflowMigration.applyOnStart }}
      initContainers:
        {{- if .Values.migrations.enabled }}
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args:
            - "-path=/migrations"
            - "-database=postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
            - "up"
          env:
            - name: DATABASE_HOST
              value: {{ include "ting.databaseHost" . | quote }}
            - name: DATABASE_PORT
              value: {{ include "ting.databasePort" . | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ting.databaseSecretName" . }}
                  key: {{ .Values.database.userKey | default "username" }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ting.databaseSecretName" . }}
                  key: {{ .Values.database.passwordKey | default "password" }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
        {{- end }}
        {{- if .Values.workflowMigration.applyOnStart }}
        - name: workflow-catalog-migrate
          image: {{ include "ting.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - ting.migrate_workflows
          args:
            - "--catalog-path=/data/ting/workflows"
            - "--apply"
            - "--skip-if-migrated"
            - "--persona-database={{ .Values.workflowMigration.personaDatabase }}"
            {{- if .Values.workflowMigration.replaceDivergentBundled }}
            - "--replace-divergent-bundled"
            {{- end }}
          env:
            - name: DATABASE__HOST
              value: {{ include "ting.databaseHost" . | quote }}
            - name: DATABASE__PORT
              value: {{ include "ting.databasePort" . | quote }}
            - name: DATABASE__NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ting.databaseSecretName" . }}
                  key: {{ .Values.database.userKey | default "username" }}
            - name: DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ting.databaseSecretName" . }}
                  key: {{ .Values.database.passwordKey | default "password" }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.workflowMigration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/ting
              readOnly: true
            - name: workflow-catalog
              mountPath: /data/ting/workflows
        {{- end }}
      {{- end }}
      volumes:
        {{- if .Values.envoy.authorization.enabled }}
        - name: authz-config
          configMap:
            name: {{ include "ting.fullname" . }}-authz
        {{- end }}
        - name: config
          configMap:
            name: {{ include "ting.fullname" . }}
        {{- if .Values.workflowPersistence.enabled }}
        - name: workflow-catalog
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workflows" (include "ting.fullname" .)) .Values.workflowPersistence.existingClaim }}
        {{- end }}
        {{- if .Values.envoy.enabled }}
        - name: envoy-config
          configMap:
            name: {{ include "ting.fullname" . }}-envoy
        {{- end }}
        {{- if .Values.migrations.enabled }}
        - name: migrations
          configMap:
            name: {{ include "ting.fullname" . }}-migrations
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
