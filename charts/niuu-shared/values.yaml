# Niuu — shared platform services
# https://github.com/niuulabs/volundr

replicaCount: 1
revisionHistoryLimit: 10

image:
  registry: ghcr.io/niuulabs
  repository: niuu
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8082
  annotations: {}

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name (nginx, traefik, haproxy, etc.)
  className: ""
  # -- Ingress annotations (controller-specific)
  annotations: {}
  # -- Ingress hosts
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1/niuu
          pathType: Prefix
  # -- TLS configuration
  tls: []

config:
  logLevel: "info"
  logFormat: "json"
  host: "0.0.0.0"
  port: 8082
  cors:
    # -- Allowed browser origins for cross-origin API requests
    allowedOrigins:
      - "*"
    # -- Whether credentialed CORS requests are allowed
    allowCredentials: true
  extra: {}

# Git provider configuration
git:
  github:
    enabled: false
    instances: []
    # -- Existing K8s secret with the default GitHub token
    existingSecret: ""
    # -- Key in existingSecret containing the token
    tokenKey: "token"
  gitlab:
    enabled: false
    instances: []
    # -- Existing K8s secret with the default GitLab token
    existingSecret: ""
    # -- Key in existingSecret containing the token
    tokenKey: "token"

database:
  name: volundr
  minPoolSize: 5
  maxPoolSize: 20
  createSecret: false
  existingSecret: ""
  userKey: username
  passwordKey: password
  username: ""
  password: "CHANGE_ME"
  extraSecretData: {}
  secretAnnotations: {}
  external:
    enabled: true
    host: postgresql.default.svc.cluster.local
    port: 5432

storageAdapter:
  adapter: "volundr.adapters.outbound.k8s_storage.InMemoryStorageAdapter"
  kwargs: {}
  secretKwargs: []

identity:
  adapter: "volundr.adapters.outbound.identity.AllowAllIdentityAdapter"
  kwargs: {}
  secretKwargs: []
  roleMapping:
    admin: "volundr:admin"
    developer: "volundr:developer"
    viewer: "volundr:viewer"

authDiscovery:
  issuer: ""
  cliClientId: "volundr-cli"
  scopes: "openid profile email"

gateway:
  adapter: "volundr.adapters.outbound.k8s_gateway.InMemoryGatewayAdapter"
  kwargs: {}
  secretKwargs: []

envoy:
  enabled: false
  image:
    repository: envoyproxy/envoy
    tag: "v1.32-latest"
    pullPolicy: IfNotPresent
  port: 8443
  adminPort: 9901
  connectTimeout: "0.25s"
  upstreamTimeout: "60s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  headerNames:
    userId: x-auth-user-id
    email: x-auth-email
    tenant: x-auth-tenant
    roles: x-auth-roles
  jwt:
    enabled: false
    issuer: ""
    audiences: []
    jwksUri: ""
    jwksTimeout: "5s"
    jwksCacheDurationSeconds: 300
    tenantClaim: "tenant_id"
    rolesClaim: "resource_access.volundr-api.roles"
    keycloakHost: ""
    keycloakPort: 8080
    keycloakTls: false
    extraClaimHeaders: []
    bypassPrefixes:
      - /api/v1/identity/auth/config
      - /health
  extraHttpFilters: []
  extraClusters: []

pat:
  token_issuer_adapter: "niuu.adapters.memory_token_issuer.MemoryTokenIssuer"
  token_issuer_kwargs: {}
  ttl_days: 365
  issuerSecretName: ""
  issuerSecretKey: "client-secret"

livenessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
extraEnv: []
extraVolumeMounts: []
extraVolumes: []

global:
  imagePullSecrets: []
  image:
    registry: ""
