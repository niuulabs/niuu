{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "niuu-shared.fullname" . }}-migrations
  labels:
    {{- include "niuu-shared.labels" . | nindent 4 }}
data:
  000001_pgcrypto.up.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

  000001_pgcrypto.down.sql: |
    SELECT 1;

  000010_project_mappings.up.sql: |
    CREATE TABLE IF NOT EXISTS project_mappings (
        id              UUID PRIMARY KEY,
        repo_url        VARCHAR(500) NOT NULL,
        project_id      VARCHAR(255) NOT NULL,
        project_name    VARCHAR(255) NOT NULL DEFAULT '',
        created_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()
    );

    CREATE UNIQUE INDEX IF NOT EXISTS idx_project_mappings_repo_url
        ON project_mappings(repo_url);
    CREATE INDEX IF NOT EXISTS idx_project_mappings_project_id
        ON project_mappings(project_id);

  000010_project_mappings.down.sql: |
    DROP INDEX IF EXISTS idx_project_mappings_project_id;
    DROP INDEX IF EXISTS idx_project_mappings_repo_url;
    DROP TABLE IF EXISTS project_mappings;

  000012_tenant_hierarchy.up.sql: |
    CREATE TABLE IF NOT EXISTS tenants (
        id              TEXT PRIMARY KEY,
        path            TEXT NOT NULL UNIQUE,
        name            TEXT NOT NULL,
        parent_id       TEXT REFERENCES tenants(id),
        tier            TEXT NOT NULL DEFAULT 'developer',
        max_sessions    INT NOT NULL DEFAULT 5,
        max_storage_gb  INT NOT NULL DEFAULT 50,
        created_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_tenants_path ON tenants(path);
    CREATE INDEX IF NOT EXISTS idx_tenants_parent_id ON tenants(parent_id);

    CREATE TABLE IF NOT EXISTS users (
        id              TEXT PRIMARY KEY,
        email           TEXT NOT NULL,
        display_name    TEXT NOT NULL DEFAULT '',
        status          TEXT NOT NULL DEFAULT 'active',
        home_pvc        TEXT,
        created_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
        updated_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()
    );

    CREATE UNIQUE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_users_status ON users(status);

    CREATE TABLE IF NOT EXISTS tenant_memberships (
        user_id         TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        tenant_id       TEXT NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        role            TEXT NOT NULL DEFAULT 'volundr:developer',
        granted_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
        PRIMARY KEY (user_id, tenant_id)
    );

    CREATE INDEX IF NOT EXISTS idx_tenant_memberships_tenant_id ON tenant_memberships(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_tenant_memberships_user_id ON tenant_memberships(user_id);

  000012_tenant_hierarchy.down.sql: |
    DROP INDEX IF EXISTS idx_tenant_memberships_user_id;
    DROP INDEX IF EXISTS idx_tenant_memberships_tenant_id;
    DROP TABLE IF EXISTS tenant_memberships;
    DROP INDEX IF EXISTS idx_users_status;
    DROP INDEX IF EXISTS idx_users_email;
    DROP TABLE IF EXISTS users;
    DROP INDEX IF EXISTS idx_tenants_parent_id;
    DROP INDEX IF EXISTS idx_tenants_path;
    DROP TABLE IF EXISTS tenants;

  000013_credential_metadata.up.sql: |
    CREATE TABLE IF NOT EXISTS credential_metadata (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name VARCHAR(253) NOT NULL,
        secret_type VARCHAR(50) NOT NULL,
        keys TEXT[] NOT NULL DEFAULT '{}',
        metadata JSONB NOT NULL DEFAULT '{}',
        owner_id VARCHAR(255) NOT NULL,
        owner_type VARCHAR(50) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        UNIQUE(owner_type, owner_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_credential_metadata_owner
        ON credential_metadata(owner_type, owner_id);

  000013_credential_metadata.down.sql: |
    DROP INDEX IF EXISTS idx_credential_metadata_owner;
    DROP TABLE IF EXISTS credential_metadata;

  000014_integration_connections.up.sql: |
    CREATE TABLE IF NOT EXISTS integration_connections (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        owner_id VARCHAR(255) NOT NULL,
        integration_type VARCHAR(50) NOT NULL,
        adapter VARCHAR(500) NOT NULL,
        credential_name VARCHAR(253) NOT NULL,
        slug VARCHAR(100) NOT NULL DEFAULT '',
        config JSONB NOT NULL DEFAULT '{}',
        enabled BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_integration_connections_owner
        ON integration_connections(owner_id, integration_type);

  000014_integration_connections.down.sql: |
    DROP INDEX IF EXISTS idx_integration_connections_owner;
    DROP TABLE IF EXISTS integration_connections;

  000020_feature_toggles.up.sql: |
    CREATE TABLE IF NOT EXISTS feature_toggles (
        feature_key     TEXT PRIMARY KEY,
        enabled         BOOLEAN NOT NULL DEFAULT true,
        updated_at      TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS user_feature_preferences (
        user_id         TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        feature_key     TEXT NOT NULL,
        visible         BOOLEAN NOT NULL DEFAULT true,
        sort_order      INT NOT NULL DEFAULT 0,
        PRIMARY KEY (user_id, feature_key)
    );

    CREATE INDEX IF NOT EXISTS idx_user_feature_prefs_user
        ON user_feature_preferences(user_id);

  000020_feature_toggles.down.sql: |
    DROP INDEX IF EXISTS idx_user_feature_prefs_user;
    DROP TABLE IF EXISTS user_feature_preferences;
    DROP TABLE IF EXISTS feature_toggles;

  000021_personal_access_tokens.up.sql: |
    CREATE TABLE IF NOT EXISTS personal_access_tokens (
        id           UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        owner_id     TEXT        NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        name         TEXT        NOT NULL,
        token_hash   TEXT        NOT NULL,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        expires_at   TIMESTAMPTZ,
        last_used_at TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_pats_owner_id ON personal_access_tokens(owner_id);

  000021_personal_access_tokens.down.sql: |
    DROP INDEX IF EXISTS idx_pats_owner_id;
    DROP TABLE IF EXISTS personal_access_tokens;

  000022_pat_unique_owner_name.up.sql: |
    CREATE UNIQUE INDEX IF NOT EXISTS idx_pats_owner_name
        ON personal_access_tokens(owner_id, name);

  000022_pat_unique_owner_name.down.sql: |
    DROP INDEX IF EXISTS idx_pats_owner_name;

  000034_ravn_personas.up.sql: |
    CREATE TABLE IF NOT EXISTS ravn_personas (
        owner_id TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        name VARCHAR(128) NOT NULL,
        config_json JSONB NOT NULL DEFAULT '{}'::jsonb,
        runtime_config_json JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
        PRIMARY KEY (owner_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_ravn_personas_owner_updated
        ON ravn_personas(owner_id, updated_at DESC);

  000034_ravn_personas.down.sql: |
    DROP INDEX IF EXISTS idx_ravn_personas_owner_updated;
    DROP TABLE IF EXISTS ravn_personas;
  000048_odin_review_queue.up.sql: |
    -- Central ODIN review queue: every decision awaiting (or carrying) an
    -- operator verdict, with the full ReviewItem envelope as JSONB.
    CREATE TABLE IF NOT EXISTS odin_review_items (
        item_id        TEXT PRIMARY KEY,
        kind           TEXT NOT NULL,
        status         TEXT NOT NULL,
        environment_id TEXT NOT NULL DEFAULT '',
        valkyrie_id    TEXT NOT NULL DEFAULT '',
        requested_at   TIMESTAMPTZ NOT NULL,
        payload        JSONB NOT NULL,
        updated_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_odin_review_items_status
        ON odin_review_items(status, requested_at DESC);

    CREATE INDEX IF NOT EXISTS idx_odin_review_items_environment
        ON odin_review_items(environment_id, status);
  000048_odin_review_queue.down.sql: |
    DROP INDEX IF EXISTS idx_odin_review_items_environment;
    DROP INDEX IF EXISTS idx_odin_review_items_status;
    DROP TABLE IF EXISTS odin_review_items;

  000049_valkyrie_history.up.sql: |
    CREATE TABLE IF NOT EXISTS valkyrie_decisions (
        decision_id TEXT PRIMARY KEY,
        environment_id TEXT NOT NULL DEFAULT '',
        valkyrie_id TEXT NOT NULL DEFAULT '',
        operational_state TEXT NOT NULL DEFAULT '',
        tier TEXT NOT NULL DEFAULT '',
        action_authority TEXT NOT NULL DEFAULT '',
        confidence DOUBLE PRECISION NOT NULL DEFAULT 0,
        correlation_id TEXT NOT NULL DEFAULT '',
        outcome TEXT NOT NULL DEFAULT '',
        review_item_id TEXT NOT NULL DEFAULT '',
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        decided_at TIMESTAMPTZ NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_valkyrie_decisions_env_decided
        ON valkyrie_decisions (environment_id, decided_at DESC);
    CREATE INDEX IF NOT EXISTS idx_valkyrie_decisions_correlation
        ON valkyrie_decisions (correlation_id);

    CREATE TABLE IF NOT EXISTS valkyrie_actions (
        event_id TEXT PRIMARY KEY,
        action_id TEXT NOT NULL DEFAULT '',
        environment_id TEXT NOT NULL DEFAULT '',
        valkyrie_id TEXT NOT NULL DEFAULT '',
        status TEXT NOT NULL DEFAULT '',
        correlation_id TEXT NOT NULL DEFAULT '',
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        observed_at TIMESTAMPTZ NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_valkyrie_actions_correlation
        ON valkyrie_actions (correlation_id);
    CREATE INDEX IF NOT EXISTS idx_valkyrie_actions_env_observed
        ON valkyrie_actions (environment_id, observed_at DESC);

    CREATE TABLE IF NOT EXISTS valkyrie_signals (
        signal_id TEXT PRIMARY KEY,
        environment_id TEXT NOT NULL DEFAULT '',
        severity TEXT NOT NULL DEFAULT 'info',
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        received_at TIMESTAMPTZ NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_valkyrie_signals_env_received
        ON valkyrie_signals (environment_id, received_at DESC);
    CREATE INDEX IF NOT EXISTS idx_valkyrie_signals_severity
        ON valkyrie_signals (severity, received_at DESC);

  000049_valkyrie_history.down.sql: |
    DROP TABLE IF EXISTS valkyrie_signals;
    DROP TABLE IF EXISTS valkyrie_actions;
    DROP TABLE IF EXISTS valkyrie_decisions;
{{- end }}
