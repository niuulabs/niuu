apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "niuu-shared.fullname" . }}
  labels:
    {{- include "niuu-shared.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "niuu-shared.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "niuu-shared.checksumAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "niuu-shared.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "niuu-shared.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "niuu-shared.serviceAccountName" . }}
      {{- if or .Values.migrations.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.migrations.enabled }}
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args:
            - "-path=/migrations"
            - "-database=postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
            - "up"
          env:
            - name: DATABASE_HOST
              value: {{ include "niuu-shared.databaseHost" . | quote }}
            - name: DATABASE_PORT
              value: {{ include "niuu-shared.databasePort" . | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "niuu-shared.databaseSecretName" . }}
                  key: {{ .Values.database.userKey | default "username" }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "niuu-shared.databaseSecretName" . }}
                  key: {{ .Values.database.passwordKey | default "password" }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "niuu-shared.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8082 }}
              protocol: TCP
          env:
            - name: NIUU_CONFIG
              value: "/etc/niuu/config.yaml"
            - name: DATABASE__HOST
              value: {{ include "niuu-shared.databaseHost" . | quote }}
            - name: DATABASE__PORT
              value: {{ include "niuu-shared.databasePort" . | quote }}
            - name: DATABASE__NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "niuu-shared.databaseSecretName" . }}
                  key: {{ .Values.database.userKey | default "username" }}
            - name: DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "niuu-shared.databaseSecretName" . }}
                  key: {{ .Values.database.passwordKey | default "password" }}
            {{- if and .Values.pat .Values.pat.issuerSecretName }}
            - name: PAT__TOKEN_ISSUER_KWARGS__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pat.issuerSecretName }}
                  key: {{ .Values.pat.issuerSecretKey | default "client-secret" }}
            {{- end }}
            {{- if and .Values.workloadIdentity .Values.workloadIdentity.signingKey.existingSecret }}
            - name: NIUU_WORKLOAD_IDENTITY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workloadIdentity.signingKey.existingSecret }}
                  key: {{ .Values.workloadIdentity.signingKey.key | default "private-key.pem" }}
            {{- end }}
            {{- if .Values.git.github.existingSecret }}
            - name: GIT__GITHUB__TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.github.existingSecret }}
                  key: {{ .Values.git.github.tokenKey | default "token" }}
            {{- end }}
            {{- if .Values.git.gitlab.existingSecret }}
            - name: GIT__GITLAB__TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.gitlab.existingSecret }}
                  key: {{ .Values.git.gitlab.tokenKey | default "token" }}
            {{- end }}
            {{- range $i, $inst := .Values.git.github.instances }}
            {{- if $inst.existingSecret }}
            - name: GIT_GITHUB_INSTANCE_{{ $i }}_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $inst.existingSecret }}
                  key: {{ $inst.tokenKey | default "token" }}
            {{- end }}
            {{- end }}
            {{- range $i, $inst := .Values.git.gitlab.instances }}
            {{- if $inst.existingSecret }}
            - name: GIT_GITLAB_INSTANCE_{{ $i }}_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $inst.existingSecret }}
                  key: {{ $inst.tokenKey | default "token" }}
            {{- end }}
            {{- end }}
            {{- range .Values.storageAdapter.secretKwargs }}
            - name: STORAGE_ADAPTER_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.identity.secretKwargs }}
            - name: IDENTITY_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.gateway.secretKwargs }}
            - name: GATEWAY_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.credentialEnrollmentRunner.secretKwargs }}
            - name: CREDENTIAL_ENROLLMENT_RUNNER_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- range .Values.credentialStore.secretKwargs }}
            - name: CREDENTIAL_STORE_SK_{{ .kwarg | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 3 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | default 3 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 30 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/niuu
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.envoy.enabled }}
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: envoy
              containerPort: {{ .Values.envoy.port }}
              protocol: TCP
          {{- with .Values.envoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.envoy.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "niuu-shared.fullname" . }}
        {{- if .Values.migrations.enabled }}
        - name: migrations
          configMap:
            name: {{ include "niuu-shared.fullname" . }}-migrations
        {{- end }}
        {{- if .Values.envoy.enabled }}
        - name: envoy-config
          configMap:
            name: {{ include "niuu-shared.fullname" . }}-envoy
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
