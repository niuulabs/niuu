# Niuu AI Platform — umbrella chart values
#
# Global values propagate to all subcharts:
#   global.image.registry    → volundr.image, volundr.web.image, tyr.image
#   global.image.tag         → all image tags
#   global.imagePullSecrets  → all pod specs
#   global.domain            → ingress/gateway hostname generation

global:
  imagePullSecrets: []
  image:
    registry: ghcr.io/niuulabs
  domain: niuu.world
  # Available AI models — propagated to both Tyr and Volundr
  aiModels:
    - id: "claude-opus-4-7"
      name: "Opus 4.7"
      provider: "anthropic"
      costPerMillionTokens: 15.00
    - id: "claude-opus-4-6"
      name: "Opus 4.6"
      provider: "anthropic"
      costPerMillionTokens: 15.00
    - id: "claude-opus-4-5-20251101"
      name: "Opus 4.5"
      provider: "anthropic"
      costPerMillionTokens: 15.00
    - id: "claude-sonnet-4-6"
      name: "Sonnet 4.6"
      provider: "anthropic"
      costPerMillionTokens: 3.00
    - id: "claude-haiku-4-5-20251001"
      name: "Haiku 4.5"
      provider: "anthropic"
      costPerMillionTokens: 1.00
    - id: "gpt-5.5"
      name: "GPT-5.5"
      provider: "openai"
      costPerMillionTokens: 10.00
    - id: "gpt-5.4"
      name: "GPT-5.4"
      provider: "openai"
      costPerMillionTokens: 5.00

ingress:
  enabled: false
  className: ""
  annotations: {}
  routeSets:
    api:
      - path: /api/v1/volundr
        service: volundr
      - path: /api/v1/forge
        service: volundr
      - path: /api/v1/users
        service: volundr
      - path: /api/v1/tokens
        service: volundr
      - path: /api/v1/identity
        service: volundr
      - path: /api/v1/integrations
        service: volundr
      - path: /api/v1/features
        service: volundr
      - path: /api/v1/credentials
        service: volundr
      - path: /api/v1/audit
        service: volundr
      - path: /audit
        service: volundr
      - path: /api/v1/webhooks
        service: volundr
      - path: /api/v1/tracker/status
        service: volundr
      - path: /api/v1/tracker/issues
        service: volundr
      - path: /api/v1/tracker/repo-mappings
        service: volundr
      - path: /api/v1/tyr
        service: tyr
      - path: /api/v1/tracker/projects
        service: tyr
      - path: /api/v1/tracker/import
        service: tyr
      - path: /api/v1/niuu
        service: niuu-shared
      - path: /mimir
        service: mimir-shared
      - path: /mcp
        service: mimir-shared
  hosts:
    - host: api.example.com
      routeSets:
        - api
  tls: []
  # Example web UI hosts routed through the same umbrella ingress:
  # hosts:
  #   - host: old.volundr.example.com
  #     routeSets:
  #       - api
  #     routes:
  #       - path: /
  #         service: volundr-web
  #   - host: new.volundr.example.com
  #     routeSets:
  #       - api
  #     routes:
  #       - path: /
  #         service: volundr-web-next

volundr:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true
  web:
    ingress:
      enabled: false
    config:
      apiBaseUrl: "/api/v1/volundr"
  webNext:
    ingress:
      enabled: false

tyr:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true

niuu-shared:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true

bifrost:
  enabled: true

# Mímir — shared ODIN-wide instance (always enabled)
mimir-shared:
  enabled: true
  config:
    name: "shared"
    role: "shared"
    announceUrl: ""
    categories: []
  persistence:
    size: 50Gi
  ingress:
    enabled: false
    host: ""

# Mímir — Kanuck Valley Models domain instance (disabled by default, opt-in per cluster)
mimir-kanuck:
  enabled: false
  config:
    name: "kanuck"
    role: "domain"
    announceUrl: ""
    categories: ["kanuck"]
  persistence:
    size: 10Gi
  ingress:
    enabled: false
    host: ""

# Mímir — research domain instance (disabled by default)
mimir-research:
  enabled: false
  config:
    name: "research"
    role: "domain"
    announceUrl: ""
    categories: ["research"]
  persistence:
    size: 10Gi
  ingress:
    enabled: false
    host: ""
