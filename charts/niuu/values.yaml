# Niuu AI Platform — umbrella chart values
#
# Global values propagate to all subcharts:
#   global.image.registry    → volundr.image, volundr.web.image, ting.image
#   global.image.tag         → all image tags
#   global.imagePullSecrets  → all pod specs
#   global.domain            → ingress/gateway hostname generation

global:
  imagePullSecrets: []
  image:
    registry: ghcr.io/niuulabs
  domain: niuu.world

ingress:
  enabled: false
  className: ""
  annotations: {}
  routeSets:
    api:
      - path: /api/v1/niuu/instances
        service: guild
      - path: /api/v1/niuu/targets
        service: guild
      - path: /api/v1/niuu/volundr
        service: guild
      - path: /api/v1/niuu/observatory
        service: guild
      - path: /api/v1/tokens
        service: niuu-shared
      - path: /api/v1/identity
        service: niuu-shared
      - path: /api/v1/features
        service: niuu-shared
      - path: /api/v1/personas
        service: niuu-shared
      - path: /api/v1/ravn/personas
        service: niuu-shared
      - path: /api/v1/mimir/mcp
        service: mimir-shared
      - path: /api/v1/mimir
        service: mimir-shared
      - path: /api/v1/bifrost
        service: bifrost
      - path: /api/v1/ravn
        service: ravn
      - path: /api/v1/forge
        service: volundr
      - path: /api/v1/users
        service: volundr
      - path: /api/v1/integrations
        service: volundr
      - path: /api/v1/credentials
        service: volundr
      - path: /api/v1/observatory
        service: observatory
      - path: /api/v1/audit
        service: volundr
      - path: /audit
        service: volundr
      - path: /api/v1/webhooks
        service: volundr
      - path: /api/v1/tracker/status
        service: volundr
      - path: /api/v1/tracker/issues
        service: volundr
      - path: /api/v1/tracker/repo-mappings
        service: volundr
      - path: /api/v1/ting
        service: ting
      - path: /api/v1/tracker/projects
        service: ting
      - path: /api/v1/tracker/import
        service: ting
      - path: /api/v1/niuu/repos
        service: niuu-shared
      - path: /api/v1
        service: volundr
      - path: /mimir
        service: mimir-shared
      - path: /mcp
        service: mimir-shared
  hosts:
    - host: api.example.com
      routeSets:
        - api
  tls: []
  # Example web UI hosts routed through the same umbrella ingress:
  # hosts:
  #   - host: old.volundr.example.com
  #     routeSets:
  #       - api
  #     routes:
  #       - path: /
  #         service: volundr-web
  #   - host: new.volundr.example.com
  #     routeSets:
  #       - api
  #     routes:
  #       - path: /
  #         service: volundr-web-next

volundr:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true
  web:
    ingress:
      enabled: false
    config:
      apiBaseUrl: "/api/v1/forge"
  webNext:
    ingress:
      enabled: false

ting:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true

niuu-shared:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true

guild:
  enabled: true
  ingress:
    enabled: false
  config:
    cors:
      allowedOrigins:
        - "*"
      allowCredentials: true
  database:
    name: volundr
    existingSecret: volundr-postgres-app
    userKey: username
    passwordKey: password
    external:
      enabled: true
      host: volundr-postgres-rw
      port: 5432

bifrost:
  enabled: true

ravn:
  enabled: true
  command:
    - ravn-api
  persistence:
    enabled: false

observatory:
  enabled: true
  ingress:
    enabled: false
  database:
    name: volundr
    existingSecret: volundr-postgres-app
    userKey: username
    passwordKey: password
    external:
      enabled: true
      host: volundr-postgres-rw
      port: 5432
  guild:
    url: ""

# Mímir — shared ODIN-wide instance (always enabled)
mimir-shared:
  enabled: true
  config:
    name: "shared"
    role: "shared"
    announceUrl: ""
    categories: []
  persistence:
    size: 50Gi
  ingress:
    enabled: false
    host: ""

# Mímir — Kanuck Valley Models domain instance (disabled by default, opt-in per cluster)
mimir-kanuck:
  enabled: false
  config:
    name: "kanuck"
    role: "domain"
    announceUrl: ""
    categories: ["kanuck"]
  persistence:
    size: 10Gi
  ingress:
    enabled: false
    host: ""

# Mímir — research domain instance (disabled by default)
mimir-research:
  enabled: false
  config:
    name: "research"
    role: "domain"
    announceUrl: ""
    categories: ["research"]
  persistence:
    size: 10Gi
  ingress:
    enabled: false
    host: ""
