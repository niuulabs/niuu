---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  resource: run
  version: default
  importDerivedRoles:
    - volundr_roles

  rules:
    # Owners can approve, reject, and retry their runs
    - actions: ["approve", "reject", "retry"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - owner

    # Owners and tenant members can read and list runs
    - actions: ["read", "list"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - owner
        - tenant_member
