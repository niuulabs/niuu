<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESIDENT · HUD</title>
<style>
  :root{
    --bg:#04060a; --panel:#080c12; --panel2:#0b1119;
    --line:#16202e; --line2:#233248;
    --tx:#cfdae6; --dim:#5d7085; --dim2:#3d4c5e;
    --obs:#2fd6c3; --hyp:#f2b03c; --unk:#a870f5; --gap:#ff5f45; --att:#6d8599;
    --mono:"SF Mono",SFMono-Regular,ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--tx); font-family:var(--mono);
    font-size:13px; line-height:1.45; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:100;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
    opacity:.45;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.72) 100%);
  }
  .app{height:100vh; display:flex; flex-direction:column; padding:14px 18px 12px; gap:10px}

  /* ── header ─────────────────────────────────────────── */
  .top{display:flex; align-items:flex-start; gap:22px; border-bottom:1px solid var(--line); padding-bottom:10px}
  .ident{display:flex; align-items:baseline; gap:12px; flex-shrink:0}
  .name{font-size:26px; letter-spacing:.24em; font-weight:600}
  .role{font-size:9px; letter-spacing:.3em; color:var(--dim); text-transform:uppercase}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--obs);
    box-shadow:0 0 10px var(--obs); animation:blink 2.4s ease-in-out infinite; flex-shrink:0}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
  .charter{flex:1; min-width:0; border-left:1px solid var(--line); padding-left:18px}
  .charter .lb{font-size:9px;letter-spacing:.3em;color:var(--dim2);text-transform:uppercase;display:block;margin-bottom:3px}
  .charter .tx{color:var(--dim); font-size:12px; max-width:72ch}
  .envbox{text-align:right; flex-shrink:0; font-size:10px; color:var(--dim); letter-spacing:.1em}
  .envbox b{display:block; color:var(--tx); font-size:12px; letter-spacing:.16em; font-weight:600}

  /* ── resident switcher (multi-resident payloads) ────── */
  .switch{display:flex; gap:6px}
  .sw{font-family:var(--mono); background:var(--panel); color:var(--dim);
    border:1px solid var(--line); padding:5px 13px; font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; cursor:pointer}
  .sw.on{color:var(--obs); border-color:var(--obs); background:rgba(47,214,195,.07)}

  /* ── factual runtime state ──────────────────────────── */
  .runtime{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;
    align-items:center;background:var(--panel);border:1px solid var(--line);padding:9px 12px}
  .state{font-size:11px;letter-spacing:.18em;text-transform:uppercase;border:1px solid;
    padding:5px 10px;color:var(--dim);white-space:nowrap}
  .state.working{color:var(--obs);border-color:var(--obs)}
  .state.queued{color:var(--hyp);border-color:var(--hyp)}
  .state.waiting_operator{color:var(--unk);border-color:var(--unk)}
  .state.stale{color:var(--gap);border-color:var(--gap)}
  .current{min-width:0}
  .current b{display:block;color:var(--tx);font-size:12px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .current span{color:var(--dim);font-size:10px;letter-spacing:.08em}
  .runtime-meta{display:flex;gap:14px;color:var(--dim);font-size:10px;white-space:nowrap}
  .runtime-meta b{color:var(--tx);font-weight:500}
  .activity{display:none;grid-template-columns:auto 1fr;gap:12px;background:var(--panel);
    border:1px solid var(--line);padding:8px 12px;min-height:38px}
  .activity.on{display:grid}
  .activity h2{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--obs);
    font-weight:500;padding-top:2px}
  .activity-list{display:flex;gap:8px;overflow-x:auto}
  .activity-event{border-left:2px solid var(--line2);padding:2px 8px;color:var(--dim);
    font-size:10px;min-width:160px;max-width:300px}
  .activity-event.tool_start{border-color:var(--obs);color:var(--tx)}
  .activity-event.error{border-color:var(--gap);color:var(--gap)}

  /* ── wake bar ───────────────────────────────────────── */
  .wake{display:flex; align-items:center; gap:16px; background:var(--panel);
    border:1px solid var(--line); border-left:2px solid var(--obs); padding:9px 14px}
  .wake .src{font-size:15px; letter-spacing:.14em; color:var(--obs); font-weight:600; white-space:nowrap}
  .wake .why{color:var(--dim); font-size:12px; flex:1; min-width:0}
  .wake .meta{display:flex; gap:20px; font-size:10px; color:var(--dim2); letter-spacing:.1em; white-space:nowrap}
  .wake .meta b{color:var(--tx); font-weight:500}

  /* ── callouts ───────────────────────────────────────── */
  .flags{display:flex; gap:8px; min-height:26px; flex-wrap:wrap}
  .flag{font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:4px 11px;
    border:1px solid; background:#0d0703; animation:flagin .5s ease both}
  @keyframes flagin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  .flag.falsified{color:var(--hyp);border-color:var(--hyp);background:rgba(242,176,60,.09)}
  .flag.acquired{color:var(--obs);border-color:var(--obs);background:rgba(47,214,195,.09)}
  .flag.asked{color:var(--unk);border-color:var(--unk);background:rgba(168,112,245,.09)}
  .flag.unprompted{color:var(--tx);border-color:var(--line2);background:rgba(255,255,255,.03)}
  .flag.fact{color:var(--tx);border-color:var(--line2);background:rgba(255,255,255,.03)}

  /* ── columns ────────────────────────────────────────── */
  .cols{flex:1 1 auto; display:grid; grid-template-columns:1.45fr 1fr 1fr .95fr 1.05fr;
    gap:9px; min-height:0}
  .col{background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .col>h2{font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; padding:8px 11px;
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-weight:500}
  .col .n{font-size:15px; font-weight:600; letter-spacing:0}
  .col .body{overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; flex:1}
  .col .body::-webkit-scrollbar{width:4px}
  .col .body::-webkit-scrollbar-thumb{background:var(--line2)}
  .col{--k:var(--dim); border-top:2px solid var(--k)}
  .col>h2{color:var(--k)}

  .e{position:relative; padding:7px 9px 7px 11px; background:var(--panel2);
    border:1px solid var(--line); font-size:11.5px; line-height:1.5; color:var(--tx)}
  .e::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--line2)}
  .e.new{animation:slidein .55s cubic-bezier(.2,.8,.3,1) both}
  @keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .e.gone{color:var(--dim2); text-decoration:line-through; text-decoration-thickness:1px;
    background:transparent; animation:fadeout .8s ease both}
  @keyframes fadeout{from{opacity:.85}to{opacity:.3}}
  .e .tag{position:absolute; top:-1px; right:-1px; font-size:8px; letter-spacing:.14em;
    padding:1px 5px; text-transform:uppercase; font-weight:600}
  .e.new::before{background:var(--k)}
  .e.new .tag{background:var(--k); color:var(--bg)}
  .e.gone::before{background:var(--dim2)}
  .e.gone .tag{background:var(--dim2); color:var(--bg)}
  .empty{color:var(--dim2); font-size:10.5px; letter-spacing:.12em; padding:10px 4px; text-transform:uppercase}

  /* ── trajectory heatmap ─────────────────────────────── */
  .evo{flex:0 0 auto; border:1px solid var(--line); background:var(--panel); padding:9px 11px}
  .evo h3{font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim2);
    font-weight:500; margin-bottom:7px}
  .grid{display:grid; gap:3px; align-items:center}
  .grid .rl{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
    text-align:right; padding-right:8px; white-space:nowrap}
  .cell{height:17px; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; border:1px solid transparent; color:var(--bg)}
  .cell.z{color:var(--dim2); background:transparent!important; border-color:var(--line)}
  .cell.cur{border-color:var(--tx); box-shadow:0 0 0 1px var(--tx)}
  .grid .hd{font-size:8.5px; letter-spacing:.1em; color:var(--dim2); text-align:center}
  .grid .hd.cur{color:var(--obs)}

  /* ── transport ──────────────────────────────────────── */
  .bot{display:flex; align-items:center; gap:16px; border-top:1px solid var(--line); padding-top:9px}
  button{font-family:var(--mono); background:var(--panel); color:var(--tx);
    border:1px solid var(--line2); padding:6px 15px; font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; cursor:pointer}
  button:hover{border-color:var(--obs); color:var(--obs)}
  .track{flex:1; display:flex; align-items:center; gap:0; position:relative; height:26px}
  .track .rail{position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line2)}
  .tick{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; cursor:pointer; z-index:1}
  .tick .dot{width:9px;height:9px;border:1px solid var(--line2);background:var(--bg);
    transform:rotate(45deg); transition:all .25s}
  .tick.done .dot{background:var(--dim2);border-color:var(--dim2)}
  .tick.on .dot{background:var(--obs);border-color:var(--obs);box-shadow:0 0 12px var(--obs);transform:rotate(45deg) scale(1.5)}
  .tick .lb{font-size:8.5px;color:var(--dim2);letter-spacing:.1em;margin-top:5px}
  .tick.on .lb{color:var(--obs)}
  .stamp{font-size:10px;color:var(--dim);letter-spacing:.14em;white-space:nowrap}
  .note.live{color:var(--obs);border-color:var(--obs)}
  .note.stale{color:var(--gap);border-color:var(--gap)}
  .note{font-size:9px;color:var(--dim2);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
    border:1px solid var(--line); padding:4px 9px}
  .trace{font-size:9px;color:var(--obs);letter-spacing:.12em;text-transform:uppercase;
    text-decoration:none;border:1px solid var(--obs);padding:4px 9px}
  .trace[hidden]{display:none}
  @media (max-width:1100px){ .cols{grid-template-columns:1fr 1fr}  .charter{display:none} }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="ident">
      <span class="pulse"></span>
      <span class="name" id="rname">—</span>
      <span class="role">Resident</span>
    </div>
    <div class="charter">
      <span class="lb">Charter</span>
      <span class="tx" id="charter">—</span>
    </div>
    <div class="envbox">
      <span class="lb" style="font-size:9px;letter-spacing:.3em;color:var(--dim2)">Environment</span>
      <b id="envname">—</b>
    </div>
  </div>

  <div class="switch" id="switch" hidden></div>

  <div class="runtime">
    <span class="state" id="rstate">IDLE</span>
    <div class="current">
      <b id="rtitle">No task is executing</b>
      <span id="rtrigger">The resident is waiting for a signal, schedule, or operator answer.</span>
    </div>
    <div class="runtime-meta">
      <span>ACTIVE <b id="ractive">0</b></span>
      <span>QUEUED <b id="rqueued">0</b></span>
      <span>UPDATED <b id="rupdated">—</b></span>
    </div>
  </div>

  <div class="activity" id="activity">
    <h2>Current activity</h2>
    <div class="activity-list" id="activity-list"></div>
  </div>

  <div class="wake">
    <span class="src" id="wsrc">—</span>
    <span class="why" id="wwhy">—</span>
    <span class="meta">
      <span>TOOLS <b id="wtools">—</b></span>
      <span>TOKENS <b id="wtok">—</b></span>
      <span>NEXT <b id="wnext">—</b></span>
    </span>
  </div>

  <div class="flags" id="flags"></div>

  <div class="cols" id="cols"></div>

  <section class="evo">
    <h3>Model of the environment — every turn</h3>
    <div class="grid" id="evo"></div>
  </section>

  <div class="bot">
    <button id="play">▶ Play</button>
    <div class="track" id="track"><div class="rail"></div></div>
    <span class="stamp" id="stamp">—</span>
    <a class="trace" id="trace" target="_blank" rel="noreferrer" hidden>Open trace</a>
    <span class="note" id="note">Waiting for resident data</span>
    <span class="note live" id="live" hidden>● LIVE</span>
  </div>
</div>

<script id="data" type="application/json">{
  "resident_id": "resident",
  "charter": "",
  "environment": {"name": "Resident"},
  "fields": ["observations", "hypotheses", "unknowns", "capability_gaps", "attempts"],
  "turns": []
}</script>
<script>
// Canonical resident fields get their established colours; anything else a
// deployment declares still renders, using a rotating palette.
const KNOWN={observations:"--obs",hypotheses:"--hyp",unknowns:"--unk",
             capability_gaps:"--gap",attempts:"--att"};
const PALETTE=["--obs","--hyp","--unk","--gap","--att"];

const RAW=JSON.parse(document.getElementById("data").textContent);
// One page may carry several residents, so the same core can be shown against
// more than one environment without a second build.
const RESIDENTS=Array.isArray(RAW.residents)&&RAW.residents.length?RAW.residents:[RAW];

let D=RESIDENTS[0], FIELDS=[], HUE={}, FIELD_BODY={}, FIELD_COUNT={}, i=0, timer=null;
const cols=document.getElementById("cols"), track=document.getElementById("track"),
      evo=document.getElementById("evo");
let lastSuccess=0, staleTimer=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
))}
function label(k){return k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
function safeHttpUrl(template, traceId){
  if(!template.includes("{trace_id}")) return "";
  try{
    const url=new URL(template.replace("{trace_id}",encodeURIComponent(traceId)),location.origin);
    return ["http:","https:"].includes(url.protocol)?url.href:"";
  }catch{return ""}
}

function fieldsOf(d){
  if(Array.isArray(d.fields)&&d.fields.length) return d.fields.slice();
  const seen=[];
  (d.turns||[]).forEach(t=>Object.keys(t.working_state||{}).forEach(k=>{
    if(!seen.includes(k)) seen.push(k);
  }));
  return seen;
}

function mount(d){
  D=d; i=0;
  document.getElementById("note").textContent=d.note||"Resident state";
  FIELDS=fieldsOf(d);
  HUE={}; FIELDS.forEach((k,x)=>{HUE[k]=KNOWN[k]||PALETTE[x%PALETTE.length]});

  document.getElementById("rname").textContent=(d.resident_id||"resident").toUpperCase();
  document.getElementById("charter").textContent=d.charter||"—";
  document.getElementById("envname").textContent=d.environment?.name||d.resident_id||"—";
  renderRuntime(d);

  cols.style.gridTemplateColumns=`1.45fr repeat(${Math.max(0,FIELDS.length-1)},1fr)`;
  FIELD_BODY={}; FIELD_COUNT={}; cols.replaceChildren();
  FIELDS.forEach(k=>{
    const section=document.createElement("section");
    section.className="col";
    section.dataset.k=k;
    section.style.setProperty("--k",`var(${HUE[k]})`);
    const heading=document.createElement("h2");
    const name=document.createElement("span");
    name.textContent=label(k);
    const count=document.createElement("span");
    count.className="n";
    count.textContent="0";
    const body=document.createElement("div");
    body.className="body";
    heading.append(name,count);
    section.append(heading,body);
    cols.appendChild(section);
    FIELD_BODY[k]=body;
    FIELD_COUNT[k]=count;
  });

  track.innerHTML='<div class="rail"></div>';
  (d.turns||[]).forEach((t,n)=>{
    const el=document.createElement("div"); el.className="tick";
    el.innerHTML=`<div class="dot"></div><div class="lb">${n+1}</div>`;
    el.onclick=()=>{stop();render(n)};
    track.appendChild(el);
  });

  buildEvo();
  if((d.turns||[]).length) render(0);
  else renderEmpty();
}

function buildEvo(){
  const turns=D.turns||[];
  evo.style.gridTemplateColumns=`minmax(96px,auto) repeat(${turns.length},1fr)`;
  const max=Math.max(1,...turns.flatMap(t=>FIELDS.map(k=>(t.working_state?.[k]||[]).length)));
  let html=`<div></div>`+turns.map((t,n)=>`<div class="hd">${n+1}</div>`).join("");
  FIELDS.forEach(k=>{
    html+=`<div class="rl">${esc(label(k))}</div>`;
    turns.forEach((t,n)=>{
      const c=(t.working_state?.[k]||[]).length;
      const a=c?Math.round((.22+.78*(c/max))*100):0;
      html+=`<div class="cell ${c?"":"z"}" data-c="${n}" style="${c?`background:color-mix(in srgb,var(${HUE[k]}) ${a}%,transparent)`:""}">${c||"·"}</div>`;
    });
  });
  evo.innerHTML=html;
}
function markEvo(n){
  evo.querySelectorAll(".cell").forEach(c=>c.classList.toggle("cur",+c.dataset.c===n));
  evo.querySelectorAll(".hd").forEach((h,x)=>h.classList.toggle("cur",x===n));
}

function judgmentFacts(t){
  const j=t.judgment||t, facts=[];
  [["decision","Decision"],["operational_state","State"],["tier","Tier"],
   ["wakefulness","Wakefulness"],["action_authority","Authority"]].forEach(([key,name])=>{
    if(j[key]!==undefined&&j[key]!==null&&String(j[key]).trim())
      facts.push(`${name}: ${j[key]}`);
  });
  if(typeof j.confidence==="number") facts.push(`Confidence: ${Math.round(j.confidence*100)}%`);
  return facts;
}

function renderRuntime(d){
  const runtime=d.runtime||{}, active=runtime.active_tasks||[], task=active[0]||null;
  const state=runtime.state||"idle", stateEl=document.getElementById("rstate");
  stateEl.className="state "+state;
  stateEl.textContent=state.replace(/_/g," ").toUpperCase();
  document.getElementById("ractive").textContent=runtime.active_count||0;
  document.getElementById("rqueued").textContent=runtime.queued_count||0;
  document.getElementById("rtitle").textContent=task?.title||(
    state==="waiting_operator"?"Waiting for an operator answer":"No task is executing"
  );
  document.getElementById("rtrigger").textContent=task?.triggered_by||(
    runtime.pending_questions?.[0]?.question||
    "The resident is waiting for a signal, schedule, or operator answer."
  );
  const generated=d.generated_at?new Date(d.generated_at):null;
  document.getElementById("rupdated").textContent=generated&&!isNaN(generated)
    ? generated.toISOString().slice(11,19)+"Z":"—";

  const activity=document.getElementById("activity"), events=task?.events||[];
  activity.classList.toggle("on",events.length>0);
  const activityList=document.getElementById("activity-list");
  activityList.replaceChildren();
  events.forEach(event=>{
    const row=document.createElement("div");
    row.className="activity-event";
    const eventType=String(event.type||"").replace(/[^a-z0-9_-]/gi,"-");
    if(eventType) row.classList.add(eventType);
    row.textContent=event.summary||event.type||"";
    activityList.appendChild(row);
  });
}

function renderEmpty(){
  document.getElementById("wsrc").textContent="NO COMPLETED TURN";
  document.getElementById("wwhy").textContent="The resident has not persisted a judgment yet.";
  document.getElementById("wtools").textContent="none";
  document.getElementById("wtok").textContent="0";
  document.getElementById("wnext").textContent="—";
  document.getElementById("flags").innerHTML="";
  document.getElementById("stamp").textContent="0 / 0";
}

function render(n){
  i=n;
  const turns=D.turns||[], t=turns[n], ch=t.changes||{}, j=t.judgment||t;
  document.getElementById("wsrc").textContent=t.triggered_by
    ? label(t.triggered_by.replace(/:/g,"_")).toUpperCase():"COMPLETED TURN";
  document.getElementById("wwhy").textContent=j.question
    ? ("Asked: “"+j.question+"”")
    : (j.recommended_action||t.selected_next_action||t.rationale||"No rationale recorded.");
  document.getElementById("wtools").textContent=(t.tools_used||[]).join(" · ")||"none";
  document.getElementById("wtok").textContent=((t.input_tokens||0)+(t.output_tokens||0)).toLocaleString();
  document.getElementById("wnext").textContent=(t.continuation||"—").toUpperCase();
  document.getElementById("flags").innerHTML=judgmentFacts(t)
    .map(fact=>`<span class="flag fact">${esc(fact)}</span>`).join("");

  FIELDS.forEach(k=>{
    const cur=t.working_state?.[k]||[], c=ch[k]||{};
    const added=new Set(c.added||[]);
    const rows=cur.map(e=>
      `<div class="e ${added.has(e)?"new":""}">${added.has(e)?'<span class="tag">new</span>':""}${esc(e)}</div>`);
    (c.removed||[]).forEach(e=>rows.push(`<div class="e gone"><span class="tag">dropped</span>${esc(e)}</div>`));
    FIELD_BODY[k].innerHTML=rows.length?rows.join(""):'<div class="empty">— none —</div>';
    FIELD_COUNT[k].textContent=cur.length;
  });

  [...track.querySelectorAll(".tick")].forEach((d,x)=>{
    d.classList.toggle("on",x===n); d.classList.toggle("done",x<n);
  });
  markEvo(n);
  const ts=t.updated_at?new Date(t.updated_at):null;
  document.getElementById("stamp").textContent= ts
    ? ts.toISOString().slice(0,16).replace("T"," ")+"Z · "+(n+1)+" / "+turns.length
    : (n+1)+" / "+turns.length;
  const traceId=j.correlation_ids?.trace||"", template=D.hud?.trace_url_template||"";
  const trace=document.getElementById("trace");
  const traceUrl=traceId?safeHttpUrl(template,traceId):"";
  trace.hidden=!traceUrl;
  if(traceUrl) trace.href=traceUrl;
  else trace.removeAttribute("href");
}

function stop(){ if(timer){clearInterval(timer);timer=null;} document.getElementById("play").textContent="▶ Play"; }
document.getElementById("play").onclick=()=>{
  if(timer){stop();return}
  document.getElementById("play").textContent="❚❚ Pause";
  if(i>=(D.turns||[]).length-1) render(0);
  timer=setInterval(()=>{ i<(D.turns||[]).length-1?render(i+1):stop(); },3400);
};
addEventListener("keydown",e=>{
  const last=(D.turns||[]).length-1;
  if(e.key==="ArrowRight"){stop();render(Math.min(i+1,last))}
  if(e.key==="ArrowLeft"){stop();render(Math.max(i-1,0))}
  if(e.key===" "){e.preventDefault();document.getElementById("play").click()}
});

if(RESIDENTS.length>1){
  const sw=document.getElementById("switch");
  sw.hidden=false;
  sw.innerHTML=RESIDENTS.map((r,x)=>
    `<button class="sw${x===0?" on":""}" data-x="${x}">${esc(r.environment?.name||r.resident_id||("Resident "+(x+1)))}</button>`).join("");
  sw.onclick=e=>{
    const b=e.target.closest(".sw"); if(!b) return;
    stop();
    sw.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    mount(RESIDENTS[+b.dataset.x]);
  };
}
mount(RESIDENTS[0]);

// The packaged HUD polls Ravn directly. A standalone export polls its sibling
// timeline.json. file:// remains a self-contained snapshot.
let lastSeen=document.getElementById("data").textContent;
const hudEndpoint=location.pathname.startsWith("/resident/hud")
  ? "/resident/hud-data":"timeline.json";

function freshness(){
  if(!lastSuccess) return;
  const staleAfter=(D.hud?.stale_after_seconds||15)*1000;
  const stale=Date.now()-lastSuccess>staleAfter;
  const live=document.getElementById("live"), state=document.getElementById("rstate");
  live.classList.toggle("stale",stale);
  live.textContent=stale?"● STALE":"● LIVE";
  if(stale){
    state.className="state stale";
    state.textContent="STALE";
  }
}

async function poll(){
  try{
    const separator=hudEndpoint.includes("?")?"&":"?";
    const r=await fetch(hudEndpoint+separator+"t="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const text=await r.text();
    lastSuccess=Date.now();
    document.getElementById("live").hidden=false;
    if(text===lastSeen){freshness();return}
    lastSeen=text;
    const next=JSON.parse(text);
    const list=Array.isArray(next.residents)&&next.residents.length?next.residents:[next];
    const previousIndex=i;
    const wasLast=i>=(D.turns||[]).length-1;
    RESIDENTS.length=0; RESIDENTS.push(...list);
    mount(RESIDENTS[0]);
    const last=(D.turns||[]).length-1;
    if(last>=0) render(wasLast?last:Math.min(previousIndex,last));
    freshness();
  }catch(e){ /* file:// or transient: keep the embedded snapshot */ }
}
if(location.protocol!=="file:"){
  poll();
  const pollMs=(D.hud?.poll_interval_seconds||5)*1000;
  setInterval(poll,pollMs);
  staleTimer=setInterval(freshness,Math.min(pollMs,1000));
}
</script>
</body>
