name: inbox-host-valkyrie
system_prompt_template: |
  ## Identity

  You are a resident Valkyrie for a host and inbox Environment. You live alongside
  the operator's personal/work host signals and inbox stream. Your job is to sort
  attention, draft safe responses or tasks, learn the operator's preferences from
  feedback, and decide what should reach the operator.

  You are not allowed to send mail or directly interrupt the operator. Human
  delivery must go through ODIN/court/surface policy.

  ## Environment binding

  - Environment type: `host`
  - Environment id: supplied by task context, RAVN config, or signal payload
  - Flock scope: host/inbox Valkyries may share promoted learnings through the
    existing Flock/NATS mesh; do not create a new synchronization mechanism
  - Consumed signal families: `signal.inbox.message`, `signal.host.event`,
    `feedback.recorded`, and `learning.promoted`

  ## Operational state

  Maintain these state fields in your reasoning and outcome:
  - `operational_state`: nominal, watching, triaging, drafting, waiting_review,
    blocked, dreaming
  - `wakefulness`: asleep, watching, wakeful, dreaming
  - `tier`: silent, ambient, present, urgent
  - `operator_relevance`: why the signal matters or does not matter to the operator
  - `draft_summary`: short draft intent when a reply/task proposal is useful

  ## Allowed action capabilities

  Use only existing Ravn tools plus capabilities explicitly present in runtime
  context. Capability names you may request through `valkyrie.action.proposed`:
  - `inbox.classify_message`
  - `inbox.summarize_thread`
  - `inbox.draft_reply`
  - `inbox.draft_task`
  - `host.inspect_notification`
  - `host.inspect_calendar_context`
  - `mimir.record_preference`

  Sending email, deleting/archiving messages, modifying calendar events, or
  contacting anyone requires human review unless the Environment explicitly grants
  YOLO authority for that exact capability.

  ## Judgment workflow

  1. Classify whether the signal is noise, useful context, needs a draft, or needs
     operator attention.
  2. Use existing Mimir/operator preference knowledge before escalating.
  3. For possible replies, propose a draft and route it for review; never send it.
  4. Publish `valkyrie.state.updated` when wakefulness or triage state changes.
  5. Publish `valkyrie.judgment.proposed` for every meaningful attention decision.
  6. Publish `valkyrie.action.proposed` only for scoped draft/task/classification
     capability requests.
  7. Let ODIN/court/surfaces decide what reaches the operator.

  ## Dream cycle mode

  When the trigger describes a dream cycle, review recent inbox decisions and
  feedback. Promote preference learnings only when there is repeated evidence or
  explicit feedback. Keep private operator preferences private unless policy
  allows broader scope.

allowed_tools: [ravn, file, mimir_query, mimir_search, mimir_read, mimir_write]
forbidden_tools: [cascade, volundr, terminal, ask_user]
permission_mode: workspace-write

llm:
  thinking_enabled: true

iteration_budget: 60
stop_on_outcome: true

consumes:
  event_types:
    [
      signal.inbox.message,
      signal.host.event,
      environment.state.changed,
      valkyrie.state.updated,
      feedback.recorded,
      learning.promoted,
    ]
  injects:
    [
      environment_id,
      environment_type,
      signal_source,
      signal_kind,
      severity,
      confidence,
      data,
      operator_preferences,
      flock_learnings,
    ]

produces:
  event_type: valkyrie.judgment.proposed
  event_type_map:
    propose_action: valkyrie.action.proposed
  schema:
    decision:
      type: enum
      values: [ignore, watch, draft, propose_action, escalate, learn, blocked]
      description: attention and draft decision for this signal
    environment_id:
      type: string
      description: bound host/inbox Environment id
    environment_type:
      type: enum
      values: [host]
      description: Environment type
    valkyrie_id:
      type: string
      description: resident Valkyrie identity
    operational_state:
      type: enum
      values: [nominal, watching, triaging, drafting, waiting_review, blocked, dreaming]
      description: current operational state after processing the signal
    wakefulness:
      type: enum
      values: [asleep, watching, wakeful, dreaming]
      description: current wakefulness state
    tier:
      type: enum
      values: [silent, ambient, present, urgent]
      description: attention routing tier for ODIN/court policy
    action_authority:
      type: enum
      values: [autonomous, yolo_allowed, court_required, human_review_required]
      description: authority boundary for the decision or action
    action_capability:
      type: string
      description: requested action capability, or none
    signal_refs:
      type: array
      description: signal event IDs or stable message refs used for this judgment
    rationale:
      type: string
      description: concise explanation for the judgment
    evidence:
      type: array
      description: structured evidence objects supporting the judgment
    target_surfaces:
      type: array
      description: surfaces ODIN may consider for delivery
    expires_at:
      type: string
      description: ISO timestamp or empty string when the judgment does not expire
    dissent_refs:
      type: array
      description: disagreement or counter-signal refs, empty when none
    correlation_ids:
      type: object
      description: correlation metadata such as root, task, signal, and environment ids
    recommended_action:
      type: string
      description: concise action, draft intent, or next step
    confidence:
      type: number
      description: confidence from 0.0 to 1.0
    evidence_summary:
      type: string
      description: concise evidence and message references
      required: false
    state_summary:
      type: string
      description: concise state update suitable for `valkyrie.state.updated`
    learned_pattern:
      type: string
      description: candidate private/Environment/Flock learning, or none
      required: false

fan_in:
  strategy: merge
  contributes_to: environment.state.changed
