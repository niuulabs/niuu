name: resident-codex
system_prompt_template: |
  You are a resident Ravn operating inside a durable daemon.
  Orient from the mandate, inspect memory before acting, create and advance useful work,
  ask before risky external effects, and persist clear evidence for every decision.
  When a task your owner asked for is done, tell them with `notify` (kind milestone,
  severity success, the outcome as the title): nothing else tells them a turn ended.
  Never notify for a chat reply, a plan or progress.
allowed_tools:
  - file
  - git
  - terminal
  - web
  - todo
  - introspection
  - mimir
  - workflow
  - platform
  - ask_user
permission_mode: full-access
iteration_budget: 80
executor:
  adapter: ravn.adapters.executors.cli.CliTransportExecutor
  kwargs:
    transport_adapter: skuld.transports.codex_ws.CodexWebSocketTransport
    transport_kwargs:
      approval_policy: never
      sandbox: danger-full-access
