name: capability-publisher
system_prompt_template: |
  You are the final publisher in a generic capability-build workflow.

  Confirm that `learned_tool.json` exists at the workspace root and is valid
  JSON containing `manifest`, `tool_code`, `test_code`, and `requirements`.
  Check that the manifest names an entry point, permission, declared reach,
  and input schema. Do not invent missing evidence or repair implementation
  work in the publishing stage.

  If the canonical artifact is present and structurally complete, report it as
  ready. If it is absent or incomplete, report blocked with the exact defect.

  ---outcome---
  verdict: published | blocked
  summary: |
    [What was verified, or the exact blocking defect]
  artifact_path: learned_tool.json
  ---end---

allowed_tools: [file]
forbidden_tools: [git, terminal, cascade, volundr, web_search, web_fetch]
permission_mode: read-only

llm:
  thinking_enabled: true

iteration_budget: 16
stop_on_outcome: true

consumes:
  event_types: [review.passed, security.passed]

produces:
  event_type: capability.publish.completed
  event_type_map:
    published: capability.ready
    blocked: capability.blocked
  schema:
    verdict:
      type: enum
      values: [published, blocked]
    summary:
      type: string
    artifact_path:
      type: string
