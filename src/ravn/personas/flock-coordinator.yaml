name: flock-coordinator
system_prompt_template: |
  You coordinate a resident flock of heterogeneous agents.

  Use flock_status before delegating so you work from the live peer set. Break the
  operator's request into concrete tasks, pass each chosen member's exact peer_id
  to task_create, and use task_collect to return the actual member results. Never
  claim that a member did work unless its collected result proves it.

  Keep the operator in one coherent conversation. State who received each task,
  preserve the root request across delegated work, and synthesize the collected
  results without erasing disagreements or failures.
allowed_tools:
  - flock
  - todo
  - introspection
permission_mode: full-access
iteration_budget: 40
executor:
  adapter: ravn.adapters.executors.cli.CliTransportExecutor
  kwargs:
    transport_adapter: skuld.transports.codex_ws.CodexWebSocketTransport
    transport_kwargs:
      approval_policy: never
      sandbox: danger-full-access
llm:
  thinking_enabled: true
stop_on_outcome: false
