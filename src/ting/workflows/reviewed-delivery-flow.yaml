schema_version: 1
id: 7c1f7d52-6a0e-5f0a-9d3e-2b7d9a4e8c11
name: Reviewed Delivery Flow
description: Tracker-driven developer workflow that implements a ticket, iterates through agent
  review, then waits for a person to approve the merge before it merges the branch and publishes a
  durable delivery record.
version: 1.0.0
persona_dependencies:
  closer:
    id: closer
    revision: content-a17b9bad186e3987
    digest: sha256:a17b9bad186e3987634529f87c739cc81402dcdb4e6e478845a74a50590d3d9f
    path: personas/closer.yaml
  coder:
    id: coder
    revision: content-f32c566d84bbb188
    digest: sha256:f32c566d84bbb18825d4743eafa5b34d3a536be1d4678945c2581070903451d1
    path: personas/coder.yaml
  publisher:
    id: publisher
    revision: content-95c29aa319a5c310
    digest: sha256:95c29aa319a5c31039fd9c0cfd71a2d017fef3260b4ab30c12e73606e2fe4098
    path: personas/publisher.yaml
  reviewer:
    id: reviewer
    revision: content-15cb459d3cdecf21
    digest: sha256:15cb459d3cdecf210f15b2f3dbbd731d016e038704bf6e53ee7df8033806a9f5
    path: personas/reviewer.yaml
graph:
  board:
    version: 1
    columns:
    - id: building
      title: Building
      nodes:
      - delivery-implement
      - delivery-review
    - id: code-review
      title: Code review
      gate: delivery-code-gate
      review: code
    - id: merging
      title: Merging
      nodes:
      - delivery-close
      - delivery-publish
  nodes:
  - id: delivery-request
    kind: trigger
    label: Start tracker delivery
    source: tracker delivery
    dispatchEvent: delivery.requested
    position:
      x: 96
      y: 280
  - id: delivery-memory
    kind: resource
    label: Delivery Memory
    resourceType: mimir
    bindingMode: registry
    registryEntryId: mimir-yggdrasil
    url: https://mimir.yggdrasil.niuu.world/api/v1
    authRef: workload:mimir
    role: shared
    categories:
    - delivery
    - tracker
    - review
    position:
      x: 352
      y: 520
  - id: delivery-implement
    kind: stage
    label: Implement tracker ticket
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: coder
      budget: 40
      model: gpt-5.6-terra
      consumesEventTypes:
      - delivery.requested
      - review.changes_requested
    position:
      x: 352
      y: 280
  - id: delivery-review
    kind: stage
    label: Review implementation
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: reviewer
      budget: 24
      model: gpt-5.6-terra
      consumesEventTypes:
      - code.changed
    position:
      x: 704
      y: 280
  - id: delivery-code-gate
    kind: gate
    label: Code review
    condition: Merging lands the change on the target branch and closes the ticket.
    mode: human_approval
    pendingBehavior: help_needed
    approvalEvent: merge.approved
    changesRequestedEvent: review.changes_requested
    instructions: Read the pull request against the ticket. Approve only a change you are willing to
      merge. Otherwise request changes with specifics, and the coder continues in this same run.
    position:
      x: 1056
      y: 480
  - id: delivery-close
    kind: stage
    label: Merge and close ticket
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: closer
      budget: 20
      model: gpt-5.6-terra
      consumesEventTypes:
      - merge.approved
    position:
      x: 1056
      y: 280
  - id: delivery-publish
    kind: stage
    label: Publish delivery record
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: publisher
      budget: 16
      model: gpt-5.6-terra
      consumesEventTypes:
      - delivery.merged
    position:
      x: 1408
      y: 280
  - id: delivery-blocked
    kind: gate
    label: Delivery blocked
    condition: Review the coder's stated reason, correct the ticket, then re-commission the delivery.
    mode: human_approval
    pendingBehavior: help_needed
    instructions: The requested change could not be completed as written. Review the implementation outcome and update the ticket before re-commissioning.
    position:
      x: 704
      y: 480
  - id: delivery-complete
    kind: end
    label: Delivery complete
    joinMode: all
    completionEvent: delivery.completed
    position:
      x: 1760
      y: 280
  edges:
  - id: edge-delivery-request-to-implement
    source: delivery-request
    target: delivery-implement
    label: delivery.requested -> delivery.requested
  - id: edge-delivery-implement-to-review
    source: delivery-implement
    target: delivery-review
    label: code.changed -> code.changed
  - id: edge-delivery-implement-to-blocked
    source: delivery-implement
    target: delivery-blocked
    label: code.blocked -> code.blocked
  - id: edge-delivery-review-to-implement
    source: delivery-review
    target: delivery-implement
    label: review.changes_requested -> review.changes_requested
  - id: edge-delivery-review-to-gate
    source: delivery-review
    target: delivery-code-gate
    label: review.passed -> review.passed
  - id: edge-delivery-gate-to-implement
    source: delivery-code-gate
    target: delivery-implement
    label: review.changes_requested -> review.changes_requested
  - id: edge-delivery-gate-to-close
    source: delivery-code-gate
    target: delivery-close
    label: merge.approved -> merge.approved
  - id: edge-delivery-close-to-publish
    source: delivery-close
    target: delivery-publish
    label: delivery.merged -> delivery.merged
  - id: edge-delivery-publish-to-end
    source: delivery-publish
    target: delivery-complete
    label: delivery.completed -> delivery.completed
  resourceBindings:
  - id: binding-delivery-memory
    resourceNodeId: delivery-memory
    targetType: workflow
    targetId: reviewed-delivery-flow
    access: read_write
    writePrefixes:
    - deliveries/
    readPriority: 1
