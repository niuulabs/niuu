schema_version: 1
id: 7b46fab6-5793-4033-a9bf-5129d630b5ce
name: Memory compile
description: Reads the new sources of a project's memory and brings the pages they concern up to date,
  citing each source on the page's timeline. It only adds, so nothing is retired or removed, and a write
  the project's rules turn into a proposal is reported as one. Ting starts it after an import brought
  new sources, with their ids in the launch context.
