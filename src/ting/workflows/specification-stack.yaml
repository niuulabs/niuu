    target: spec-srd
    label: spec.prd.approved -> spec.prd.approved
  - id: edge-srd-to-review
    source: spec-srd
    target: spec-srd-review
    label: spec.srd.drafted -> spec.srd.drafted
  - id: edge-srd-review-to-srd
    source: spec-srd-review
    target: spec-srd
    label: spec.srd.changes_requested -> spec.srd.changes_requested
    rework: true
  - id: edge-srd-review-to-gate
    source: spec-srd-review
    target: spec-srd-gate
    label: spec.srd.ready_for_gate -> spec.srd.ready_for_gate
  - id: edge-srd-gate-to-srd
    source: spec-srd-gate
    target: spec-srd
    label: spec.srd.changes_requested -> spec.srd.changes_requested
    rework: true
  - id: edge-srd-gate-to-sdd
    source: spec-srd-gate
    target: spec-sdd
    label: spec.srd.approved -> spec.srd.approved
  - id: edge-sdd-to-review
    source: spec-sdd
    target: spec-sdd-review
    label: spec.sdd.drafted -> spec.sdd.drafted
  - id: edge-sdd-review-to-sdd
    source: spec-sdd-review
    target: spec-sdd
    label: spec.sdd.changes_requested -> spec.sdd.changes_requested
    rework: true
  - id: edge-sdd-review-to-gate
    source: spec-sdd-review
    target: spec-sdd-gate
    label: spec.sdd.ready_for_gate -> spec.sdd.ready_for_gate
  - id: edge-sdd-gate-to-sdd
    source: spec-sdd-gate
    target: spec-sdd
    label: spec.sdd.changes_requested -> spec.sdd.changes_requested
    rework: true
  - id: edge-sdd-gate-to-breakdown
    source: spec-sdd-gate
    target: spec-breakdown
    label: spec.sdd.approved -> spec.sdd.approved
  - id: edge-breakdown-to-review
    source: spec-breakdown
    target: spec-breakdown-review
    label: spec.breakdown.drafted -> spec.breakdown.drafted
  - id: edge-breakdown-review-to-breakdown
    source: spec-breakdown-review
    target: spec-breakdown
    label: spec.breakdown.changes_requested -> spec.breakdown.changes_requested
    rework: true
  - id: edge-breakdown-review-to-gate
    source: spec-breakdown-review
    target: spec-breakdown-gate
    label: spec.breakdown.ready_for_gate -> spec.breakdown.ready_for_gate
  - id: edge-breakdown-gate-to-breakdown
    source: spec-breakdown-gate
    target: spec-breakdown
    label: spec.breakdown.changes_requested -> spec.breakdown.changes_requested
    rework: true
  - id: edge-breakdown-gate-to-publish
    source: spec-breakdown-gate
    target: spec-publish
