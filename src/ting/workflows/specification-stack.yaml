    kind: resource
    label: Specification Memory
    resourceType: mimir
    bindingMode: registry
    registryEntryId: mimir-yggdrasil
    url: https://mimir.yggdrasil.niuu.world/api/v1
    authRef: integration:volundr
    role: shared
    categories:
    - specifications
    - product
    - design
    - planning
    position:
      x: 320
      y: 624
  - id: spec-frame
    kind: stage
    label: Frame initiative
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-framer
      budget: 18
      model: gpt-5.5
      consumesEventTypes:
      - spec.requested
    position:
      x: 320
      y: 344
  - id: spec-prd
    kind: stage
    label: Draft PRD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-prd-author
      budget: 24
      model: gpt-5.5
