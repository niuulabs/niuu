graph:
  nodes:
  - id: spec-request
    kind: trigger
    label: Start specification stack
    source: user specification request
    dispatchEvent: spec.requested
    position:
      x: 96
      y: 344
  - id: spec-memory
    kind: resource
    label: Specification Memory
    resourceType: mimir
    bindingMode: registry
    registryEntryId: mimir-yggdrasil
    url: https://mimir.yggdrasil.niuu.world/api/v1
    authRef: workload:mimir
    role: shared
    categories:
    - specifications
    - product
    - design
    - planning
    position:
      x: 320
      y: 624
  - id: spec-frame
    kind: stage
    label: Frame initiative
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-framer
      budget: 18
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.requested
    position:
      x: 320
      y: 344
  - id: spec-prd
    kind: stage
    label: Draft PRD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-prd-author
      budget: 24
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.framed
      - spec.prd.changes_requested
    position:
      x: 608
      y: 344
  - id: spec-prd-review
    kind: stage
    label: Review PRD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-prd-critic
      budget: 18
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.prd.drafted
    position:
      x: 896
      y: 232
  - id: spec-prd-gate
    kind: gate
    label: PRD approval gate
    condition: Review the PRD and decide whether it is strong enough to unlock SRD drafting.
    mode: human_approval
    pendingBehavior: help_needed
    approvalEvent: spec.prd.approved
    changesRequestedEvent: spec.prd.changes_requested
    instructions: Review the PRD, approve it if it is strong enough to unlock SRD drafting, or request
      changes with clear feedback.
    autoForwardAfter: 30m
    position:
      x: 896
      y: 456
  - id: spec-srd
    kind: stage
    label: Draft SRD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-srd-author
      budget: 22
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.prd.approved
      - spec.srd.changes_requested
    position:
      x: 1184
      y: 344
  - id: spec-srd-review
    kind: stage
    label: Review SRD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-srd-critic
      budget: 18
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.srd.drafted
    position:
      x: 1472
      y: 232
  - id: spec-srd-gate
    kind: gate
    label: SRD approval gate
    condition: Review the SRD and decide whether the system requirements are complete and unambiguous
      enough to unlock design work.
    mode: human_approval
    pendingBehavior: help_needed
    approvalEvent: spec.srd.approved
    changesRequestedEvent: spec.srd.changes_requested
    instructions: Review the SRD, approve it if the system requirements are complete and unambiguous enough
      to unlock design work, or request changes with clear feedback.
    autoForwardAfter: 30m
    position:
      x: 1472
      y: 456
  - id: spec-sdd
    kind: stage
    label: Draft SDD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-sdd-author
      budget: 24
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.srd.approved
      - spec.sdd.changes_requested
    position:
      x: 1760
      y: 344
  - id: spec-sdd-review
    kind: stage
    label: Review SDD
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-sdd-critic
      budget: 18
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.sdd.drafted
    position:
      x: 2048
      y: 232
  - id: spec-sdd-gate
    kind: gate
    label: SDD approval gate
    condition: Review the SDD and decide whether the proposed design is coherent, realistic, and ready
      for breakdown planning.
    mode: human_approval
    pendingBehavior: help_needed
    approvalEvent: spec.sdd.approved
    changesRequestedEvent: spec.sdd.changes_requested
    instructions: Review the SDD, approve it if the design is coherent, realistic, and ready for breakdown
      planning, or request changes with clear feedback.
    autoForwardAfter: 30m
    position:
      x: 2048
      y: 456
  - id: spec-breakdown
    kind: stage
    label: Draft breakdown
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-breakdown-planner
      budget: 22
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.sdd.approved
      - spec.breakdown.changes_requested
    position:
      x: 2336
      y: 344
  - id: spec-breakdown-review
    kind: stage
    label: Review breakdown
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-breakdown-critic
      budget: 16
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.breakdown.drafted
    position:
      x: 2624
      y: 232
  - id: spec-breakdown-gate
    kind: gate
    label: Breakdown approval gate
    condition: Review the implementation breakdown and decide whether the plan is actionable enough to
      publish.
    mode: human_approval
    pendingBehavior: help_needed
    approvalEvent: spec.breakdown.approved
    changesRequestedEvent: spec.breakdown.changes_requested
    instructions: Review the implementation breakdown, approve it if the plan is actionable enough to
      publish, or request changes with clear feedback.
    autoForwardAfter: 30m
    position:
      x: 2624
      y: 456
  - id: spec-publish
    kind: stage
    label: Publish specification pack
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: specification-publisher
      budget: 16
      model: gpt-5.6-terra
      consumesEventTypes:
      - spec.breakdown.approved
    position:
      x: 2912
      y: 344
  - id: spec-complete
    kind: end
    label: Specification stack complete
    joinMode: all
    completionEvent: spec.completed
    position:
      x: 3200
      y: 344
