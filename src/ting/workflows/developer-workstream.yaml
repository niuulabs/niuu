schema_version: 2
id: 98133eab-cd89-44d1-b32d-26c82f99dddc
name: Developer Workstream
description: Implement one isolated work order, run trusted verification, and independently review its immutable candidate.
version: 1.0.4
persona_dependencies:
  developer-coordinator:
    id: developer-coordinator
    revision: content-e6faaaa4df0ac645
    digest: sha256:e6faaaa4df0ac645976592ca088c754488aea9ab175b7d5931e3c2d6e4a43d92
    path: personas/developer-coordinator.yaml
  developer-coder:
    id: developer-coder
    revision: content-f8e1c97f569a8b7a
    digest: sha256:f8e1c97f569a8b7a60a22afa051be9e372dbc057ee6ede1bb79e312c8d56c6e3
    path: personas/developer-coder.yaml
  developer-code-reviewer:
    id: developer-code-reviewer
    revision: content-6525672a4d75c73d
    digest: sha256:6525672a4d75c73d1572729c8ad6ff47430a927c744837e626f2becc75113e58
    path: personas/developer-code-reviewer.yaml
  developer-security-reviewer:
    id: developer-security-reviewer
    revision: content-7370f763a417201d
    digest: sha256:7370f763a417201da02cec847aec46a855b239dd9a3cf98ec51240073cc61071
    path: personas/developer-security-reviewer.yaml
  developer-adversarial-reviewer:
    id: developer-adversarial-reviewer
    revision: content-dea473451b4e6053
    digest: sha256:dea473451b4e6053771d73915ff92b9239986670947849d6533a6b3d59e532ab
    path: personas/developer-adversarial-reviewer.yaml
workflow_dependencies: {}
graph:
  executionContract: developer-workstream/v1
  # Ravn-validated (not part of the workflow schema's toolActions, which
  # requires a non-empty action list per tool): tools fully removed for every
  # persona running this child graph, regardless of what their own document's
  # allowed_tools grants. The parent-only durable execution and publish tools
  # have no place inside an isolated work order.
  disabledTools:
    - workflow_execution_expand
    - workflow_execution_reconcile
    - workflow_execution_retry
    - workflow_execution_cancel
    - workflow_execution_message
    - delivery_complete
    - delivery_record_integration
    - workflow_execution_wait
    - delivery_expand_workstreams
    - delivery_forge
    - delivery_evidence
  toolActions:
    delivery_workspace: [verify]
  reviewAttestation:
    version: 1
    scope: workstream
    eventType: developer.review.completed
    roles:
      code: developer-code-reviewer
      security: developer-security-reviewer
      adversarial: developer-adversarial-reviewer
  nodes:
    - id: workstream-request
      kind: trigger
      label: Begin isolated work order
      source: developer execution
      dispatchEvent: developer.workstream.requested
    - id: workstream-code
      kind: stage
      label: Implement current attempt
      executionMode: sequential
      joinMode: any
      stageMembers:
        - personaId: developer-coder
          model: gpt-5.6-terra
          budget: 40
          consumesEventTypes: [developer.workstream.requested, developer.workstream.repair_requested]
    - id: workstream-verify
      kind: stage
      label: Request trusted verification for immutable candidate
      executionMode: sequential
      joinMode: any
      stageMembers:
        - personaId: developer-coordinator
          model: gpt-5.6-terra
          budget: 12
          consumesEventTypes: [developer.candidate.produced]
    - id: workstream-reviews
      kind: stage
      label: Independently review verified candidate
      executionMode: parallel
      joinMode: all
      stageMembers:
        - personaId: developer-code-reviewer
          model: gpt-5.6-terra
          budget: 24
          consumesEventTypes: [developer.candidate.verified]
        - personaId: developer-security-reviewer
          model: gpt-5.6-terra
          budget: 24
          consumesEventTypes: [developer.candidate.verified]
        - personaId: developer-adversarial-reviewer
          model: gpt-5.6-terra
          budget: 24
          consumesEventTypes: [developer.candidate.verified]
    - id: workstream-acceptance
      kind: stage
      label: Assemble the attempt-bound result
      description: >-
        Emit the structured child result only after the runtime has joined explicit passing
        verdicts from all three reviewers for this candidate. Do not call delivery_evidence for
        review receipts here: Ting derives and signs them from authenticated peer outcomes after
        terminal delivery, then performs the authoritative acceptance check.
      executionMode: sequential
      joinMode: all
      reviewVerdictPolicy:
        eventType: developer.review.completed
        passOutcomes: [developer.workstream.completed]
        failOutcomes: [developer.workstream.repair_requested]
        bindingFields: [attempt_id, candidate_sha, candidate_tree]
      stageMembers:
        - personaId: developer-coordinator
          model: gpt-5.6-terra
          budget: 12
          consumesEventTypes: [developer.review.completed]
    - id: workstream-complete
      kind: end
      label: Workstream evidence accepted
      joinMode: all
      passingVerdicts: [accept]
      completionEvent: developer.workstream.completed
  edges:
    - {id: workstream-request-code, source: workstream-request, target: workstream-code, label: developer.workstream.requested -> developer.workstream.requested}
    - {id: workstream-code-verify, source: workstream-code, target: workstream-verify, label: developer.candidate.produced -> developer.candidate.produced}
    - {id: workstream-verify-review, source: workstream-verify, target: workstream-reviews, label: developer.candidate.verified -> developer.candidate.verified}
    - {id: workstream-verify-repair, source: workstream-verify, target: workstream-code, label: developer.workstream.repair_requested -> developer.workstream.repair_requested, rework: true}
    - {id: workstream-review-acceptance, source: workstream-reviews, target: workstream-acceptance, label: developer.review.completed -> developer.review.completed}
    - {id: workstream-acceptance-repair, source: workstream-acceptance, target: workstream-code, label: developer.workstream.repair_requested -> developer.workstream.repair_requested, rework: true}
    - {id: workstream-acceptance-complete, source: workstream-acceptance, target: workstream-complete, label: developer.workstream.completed -> developer.workstream.completed}
