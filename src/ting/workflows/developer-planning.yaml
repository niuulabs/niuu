schema_version: 2
id: 195d5026-7adb-4ce7-97ee-fb1e18ea4c3a
name: Developer Planning
description: Investigate a delivery request and produce an exact-revision plan approved by three independent reviewers.
version: 1.1.3
persona_dependencies:
  developer-analyst:
    id: developer-analyst
    revision: content-c575cf2f63f6018a
    digest: sha256:c575cf2f63f6018a7f14ecc0ac6624cb0ebdc86267d286ee1dd239bdba26c660
    path: personas/developer-analyst.yaml
  developer-architecture-reviewer:
    id: developer-architecture-reviewer
    revision: content-9190d6f95c775651
    digest: sha256:9190d6f95c775651c268bce8b4b976dcc3acf01a1f87e13bc03e6f5ebf206fec
    path: personas/developer-architecture-reviewer.yaml
  developer-correctness-reviewer:
    id: developer-correctness-reviewer
    revision: content-ec8a65772b8651eb
    digest: sha256:ec8a65772b8651ebc1465788d1f2af30ddccdb5766420c8783744296caa6188d
    path: personas/developer-correctness-reviewer.yaml
  developer-security-plan-reviewer:
    id: developer-security-plan-reviewer
    revision: content-4245e23222e919e8
    digest: sha256:4245e23222e919e802fd29086bfe8397d0dc1cd1bb54424ac1b9f73989bc9fcb
    path: personas/developer-security-plan-reviewer.yaml
workflow_dependencies: {}
graph:
  executionContract: developer-planning/v1
  reviewAttestation:
    version: 1
    scope: planning
    eventType: plan.review.completed
    roles:
      architecture: developer-architecture-reviewer
      correctness: developer-correctness-reviewer
      security: developer-security-plan-reviewer
  nodes:
    - id: planning-request
      kind: trigger
      label: Investigate delivery request
      source: developer delivery
      dispatchEvent: delivery.requested
    - id: planning-analysis
      kind: stage
      label: Investigate and maintain the canonical plan
      executionMode: sequential
      joinMode: any
      reviewVerdictPolicy:
        eventType: plan.review.completed
        passOutcomes: [developer.plan.approved]
        failOutcomes: [developer.plan.revised]
        bindingFields: [plan_revision]
      stageMembers:
        - personaId: developer-analyst
          model: gpt-5.6-terra
          budget: 32
          consumesEventTypes: [delivery.requested, plan.review.completed]
    - id: planning-reviews
      kind: stage
      label: Independently review the current plan revision
      executionMode: parallel
      joinMode: all
      stageMembers:
        - personaId: developer-architecture-reviewer
          model: gpt-5.6-terra
          budget: 20
          consumesEventTypes: [developer.plan.revised]
        - personaId: developer-correctness-reviewer
          model: gpt-5.6-terra
          budget: 20
          consumesEventTypes: [developer.plan.revised]
        - personaId: developer-security-plan-reviewer
          model: gpt-5.6-terra
          budget: 20
          consumesEventTypes: [developer.plan.revised]
    - id: planning-complete
      kind: end
      label: Exact plan revision approved
      joinMode: all
      passingVerdicts: [approved]
      completionEvent: developer.plan.approved
  edges:
    - {id: planning-request-analysis, source: planning-request, target: planning-analysis, label: delivery.requested -> delivery.requested}
    - {id: planning-analysis-review, source: planning-analysis, target: planning-reviews, label: developer.plan.revised -> developer.plan.revised}
    - {id: planning-review-revise, source: planning-reviews, target: planning-analysis, label: plan.review.completed -> plan.review.completed, rework: true}
    - {id: planning-analysis-complete, source: planning-analysis, target: planning-complete, label: developer.plan.approved -> developer.plan.approved}
