    revision: sha256:9f6df9e3d598ae1386ad0150c167b5c6012c0e5e63f2409edf515c57175943b4
    digest: sha256:9f6df9e3d598ae1386ad0150c167b5c6012c0e5e63f2409edf515c57175943b4
    path: workflows/developer-planning.yaml
  integration:
    id: f776d181-ed63-4e3a-b5c4-7b128e4d2094
    revision: sha256:c45e1ace907cff8f47b9c610713398f3ce03c77502c943e85696edb8ca7bf532
    digest: sha256:c45e1ace907cff8f47b9c610713398f3ce03c77502c943e85696edb8ca7bf532
