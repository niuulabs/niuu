schema_version: 1
id: 3f444455-6b63-53c2-b057-3205345a56da
name: Tracker Delivery Flow
description: Tracker-driven developer workflow that implements a ticket, iterates through code review,
  updates the tracker, merges the branch, and publishes a durable delivery record.
version: 1.0.3
persona_dependencies:
  closer:
    id: closer
    revision: content-3dc003f5f15ba286
    digest: sha256:3dc003f5f15ba286ae768decfafb572170708c1f3fa6426aff6749943be1c482
    path: personas/closer.yaml
  coder:
    id: coder
    revision: content-6137847046c82615
    digest: sha256:6137847046c82615d9bdac877ae09158b99c8f8fa911eb5b186e4e5d27086231
    path: personas/coder.yaml
  publisher:
    id: publisher
    revision: content-67506974bc809d07
    digest: sha256:67506974bc809d079e06439eeb130898309794e5de4337d116242b478649d936
    path: personas/publisher.yaml
  reviewer:
    id: reviewer
    revision: content-4a234835de48b091
    digest: sha256:4a234835de48b091473706c0200ee61c57ebc972329af80a1736b543b7bdb7dd
    path: personas/reviewer.yaml
graph:
  nodes:
  - id: delivery-request
    kind: trigger
    label: Start tracker delivery
    source: tracker delivery
    dispatchEvent: delivery.requested
    position:
      x: 96
      y: 280
  - id: delivery-memory
    kind: resource
    label: Delivery Memory
    resourceType: mimir
    bindingMode: registry
    registryEntryId: mimir-yggdrasil
    url: https://mimir.yggdrasil.niuu.world/api/v1
    authRef: workload:mimir
    role: shared
    categories:
    - delivery
    - tracker
    - review
    position:
      x: 352
      y: 520
  - id: delivery-implement
    kind: stage
    label: Implement tracker ticket
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: coder
      budget: 40
      model: gpt-5.6-terra
      consumesEventTypes:
      - delivery.requested
      - review.changes_requested
    position:
      x: 352
      y: 280
  - id: delivery-review
    kind: stage
    label: Review implementation
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: reviewer
      budget: 24
      model: gpt-5.6-terra
      consumesEventTypes:
      - code.changed
    position:
      x: 704
      y: 280
  - id: delivery-close
    kind: stage
    label: Merge and close ticket
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: closer
      budget: 20
      model: gpt-5.6-terra
      consumesEventTypes:
      - review.passed
    position:
      x: 1056
      y: 280
  - id: delivery-publish
    kind: stage
    label: Publish delivery record
    executionMode: sequential
    joinMode: any
    stageMembers:
    - personaId: publisher
      budget: 16
      model: gpt-5.6-terra
      consumesEventTypes:
      - delivery.merged
    position:
      x: 1408
      y: 280
  - id: delivery-blocked
    kind: gate
    label: Delivery blocked
    condition: Review the coder's stated reason and correct the ticket, then send the delivery back to the coder.
    mode: human_approval
    pendingBehavior: help_needed
    approvalEvent: review.changes_requested
    changesRequestedEvent: review.changes_requested
    instructions: The requested change could not be completed as written. Review the implementation outcome and update the ticket, then answer to send the delivery back to the coder for another attempt.
    position:
      x: 704
      y: 480
  - id: delivery-complete
    kind: end
    label: Delivery complete
    joinMode: all
    completionEvent: delivery.completed
    position:
      x: 1760
      y: 280
  edges:
  - id: edge-delivery-request-to-implement
    source: delivery-request
    target: delivery-implement
    label: delivery.requested -> delivery.requested
  - id: edge-delivery-implement-to-review
    source: delivery-implement
    target: delivery-review
    label: code.changed -> code.changed
  - id: edge-delivery-implement-to-blocked
    source: delivery-implement
    target: delivery-blocked
    label: code.blocked -> code.blocked
  - id: edge-delivery-blocked-to-implement
    source: delivery-blocked
    target: delivery-implement
    label: review.changes_requested -> review.changes_requested
    rework: true
    maxIterations: 5
  - id: edge-delivery-review-to-implement
    source: delivery-review
    target: delivery-implement
    label: review.changes_requested -> review.changes_requested
    rework: true
    maxIterations: 3
  - id: edge-delivery-review-to-close
    source: delivery-review
    target: delivery-close
    label: review.passed -> review.passed
  - id: edge-delivery-close-to-publish
    source: delivery-close
    target: delivery-publish
    label: delivery.merged -> delivery.merged
  - id: edge-delivery-publish-to-end
    source: delivery-publish
    target: delivery-complete
    label: delivery.completed -> delivery.completed
  resourceBindings:
  - id: binding-delivery-memory
    resourceNodeId: delivery-memory
    targetType: workflow
    targetId: tracker-delivery-flow
    access: read_write
    writePrefixes:
    - deliveries/
    readPriority: 1
