- name: Ting Run Flow + Security + Memory Curation
  description: Ting to Volundr ravn_flock workflow with parallel review, security, post-mortem ingest, and visible Mimir curation.
  version: 1.0.0
  graph:
    nodes:
      - id: dispatch-root
        kind: trigger
        label: Dispatch run
        source: ting dispatch
        dispatchEvent: code.requested
        position:
          x: 96
          y: 264
      - id: run-coder
        kind: stage
        label: Implement code
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: coder
            budget: 40
            model: gpt-5.5
        position:
          x: 320
          y: 264
      - id: run-reviewer
        kind: stage
        label: Review changes
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: reviewer
            budget: 25
            model: gpt-5.5
        position:
          x: 560
          y: 160
      - id: run-security
        kind: stage
        label: Security review
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: security-auditor
            budget: 25
            model: gpt-5.5
        position:
          x: 560
          y: 352
      - id: run-memory
        kind: resource
        label: Shared Mimir Memory
        resourceType: mimir
        bindingMode: registry
        registryEntryId: tmp-mimir-test
        path: /tmp/mimir-test
        role: shared
        categories: [memory, postmortem]
        position:
          x: 560
          y: 488
      - id: run-postmortem
        kind: stage
        label: Capture post-mortem
        executionMode: sequential
        joinMode: all
        stageMembers:
          - personaId: postmortem-analyst
            budget: 18
            model: gpt-5.5
        position:
          x: 816
          y: 232
      - id: run-memory-curator
        kind: stage
        label: Curate shared memory
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: mimir-memory-curator
            budget: 20
            model: gpt-5.5
            consumesEventTypes: [mimir.source.ingested]
            eventFilters:
              mount_names: tmp-mimir-test
        position:
          x: 1064
          y: 232
      - id: run-complete
        kind: end
        label: Run complete
        joinMode: all
        completionEvent: ravn.task.completed
        position:
          x: 1320
          y: 232
    edges:
      - id: edge-dispatch-to-coder
        source: dispatch-root
        target: run-coder
        label: code.requested -> code.requested
      - id: edge-coder-to-reviewer
        source: run-coder
        target: run-reviewer
        label: code.changed -> code.changed
      - id: edge-coder-to-security
        source: run-coder
        target: run-security
        label: code.changed -> code.changed
      - id: edge-reviewer-to-coder
        source: run-reviewer
        target: run-coder
        label: review.changes_requested -> review.changes_requested
      - id: edge-security-to-coder
        source: run-security
        target: run-coder
        label: security.changes_requested -> security.changes_requested
      - id: edge-reviewer-to-postmortem
        source: run-reviewer
        target: run-postmortem
        label: review.completed -> review.completed
      - id: edge-security-to-postmortem
        source: run-security
        target: run-postmortem
        label: security.completed -> security.completed
      - id: edge-postmortem-to-memory-curator
        source: run-postmortem
        target: run-memory-curator
        label: mimir.source.ingested -> mimir.source.ingested
      - id: edge-memory-curator-to-end
        source: run-memory-curator
        target: run-complete
        label: mimir.curated -> mimir.curated
    resourceBindings:
      - id: binding-memory-workflow
        resourceNodeId: run-memory
        targetType: workflow
        targetId: ting-run-flow-security-memory-curation
        access: read_write
        writePrefixes: [postmortems/]
        readPriority: 1
- name: Research Campaign
  description: Flexible deep-research workflow that frames a question, explores the evidence deeply, challenges the thesis, and distills durable memory into Mimir.
  version: 1.0.0
  graph:
    nodes:
      - id: research-request
        kind: trigger
        label: Start research campaign
        source: user research
        dispatchEvent: research.requested
        position:
          x: 96
          y: 280
      - id: research-memory
        kind: resource
        label: Research Memory
        resourceType: mimir
        bindingMode: registry
        registryEntryId: tmp-mimir
        path: /tmp/mimir
        role: shared
        categories: [research, memory, sources]
        position:
          x: 320
          y: 520
      - id: research-frame
        kind: stage
        label: Frame the inquiry
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: research-framer
            budget: 16
            model: gpt-5.5
            consumesEventTypes: [research.requested]
        position:
          x: 320
          y: 280
      - id: research-explore
        kind: stage
        label: Explore the evidence
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: research-explorer
            budget: 16
            model: gpt-5.5
            consumesEventTypes: [research.framed]
        position:
          x: 608
          y: 280
      - id: research-challenge
        kind: stage
        label: Challenge the thesis
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: research-skeptic
            budget: 14
            model: gpt-5.5
            consumesEventTypes: [research.explored]
        position:
          x: 928
          y: 280
      - id: research-synthesis
        kind: stage
        label: Synthesize the research
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: research-synthesist
            budget: 16
            model: gpt-5.5
            consumesEventTypes: [research.challenged]
        position:
          x: 1216
          y: 280
      - id: research-curation
        kind: stage
        label: Curate learnings and follow-ups
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: research-curator
            budget: 12
            model: gpt-5.5
            consumesEventTypes: [research.synthesized]
        position:
          x: 1504
          y: 280
      - id: research-publish
        kind: stage
        label: Publish to Mimir
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: research-publisher
            budget: 10
            model: gpt-5.5
            consumesEventTypes: [research.curated]
        position:
          x: 1792
          y: 280
      - id: research-complete
        kind: end
        label: Research complete
        joinMode: all
        completionEvent: research.completed
        position:
          x: 2080
          y: 280
    edges:
      - id: edge-research-request-to-frame
        source: research-request
        target: research-frame
        label: research.requested -> research.requested
      - id: edge-frame-to-explore
        source: research-frame
        target: research-explore
        label: research.framed -> research.framed
      - id: edge-explore-to-challenge
        source: research-explore
        target: research-challenge
        label: research.explored -> research.explored
      - id: edge-challenge-to-synthesis
        source: research-challenge
        target: research-synthesis
        label: research.challenged -> research.challenged
      - id: edge-synthesis-to-curation
        source: research-synthesis
        target: research-curation
        label: research.synthesized -> research.synthesized
      - id: edge-curation-to-publish
        source: research-curation
        target: research-publish
        label: research.curated -> research.curated
      - id: edge-publish-to-end
        source: research-publish
        target: research-complete
        label: research.completed -> research.completed
    resourceBindings:
      - id: binding-research-memory
        resourceNodeId: research-memory
        targetType: workflow
        targetId: research-campaign
        access: read_write
        writePrefixes: [research/, learnings/, followups/]
        readPriority: 1
