  graph:
    nodes:
      - id: dispatch-root
        kind: trigger
        label: Dispatch raid
        source: tyr dispatch
        dispatchEvent: code.requested
        position:
          x: 96
          y: 248
      - id: raid-coder
        kind: stage
        label: Implement code
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: coder
            budget: 40
            model: claude-sonnet-4-6
        position:
          x: 320
          y: 248
      - id: raid-reviewer
        kind: stage
        label: Review changes
        executionMode: sequential
        joinMode: any
