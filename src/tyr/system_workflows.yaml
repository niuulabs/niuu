- name: Research Council
  description: Repo-less LLM council workflow with two independent seats, anonymous review, and final durable research publication.
  version: 1.0.0
  graph:
    nodes:
      - id: research-request
        kind: trigger
        label: Start research council
        source: user research
        dispatchEvent: research.requested
        position:
          x: 96
          y: 248
      - id: research-scratch
        kind: resource
        label: Council Scratch Board
        resourceType: mimir
        bindingMode: ephemeral_local
        role: local
        categories: [research, council, scratch]
        position:
          x: 304
          y: 520
      - id: research-memory
        kind: resource
        label: Permanent Research Memory
        resourceType: mimir
        bindingMode: registry
        registryEntryId: tmp-mimir-test
        path: /tmp/mimir-test
        role: shared
        categories: [research, memory]
        position:
          x: 560
          y: 520
      - id: chair-brief
        kind: stage
        label: Brief the council
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: council-chair
            budget: 18
            model: claude-sonnet-4-6
            consumesEventTypes: [research.requested]
        position:
          x: 304
          y: 248
      - id: member-a-opinion
        kind: stage
        label: Seat A first opinion
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: council-member-a
            budget: 16
            model: claude-sonnet-4-6
            consumesEventTypes: [council.briefed]
        position:
          x: 560
          y: 160
      - id: member-b-opinion
        kind: stage
        label: Seat B first opinion
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: council-member-b
            budget: 16
            model: gpt-5.5
            consumesEventTypes: [council.briefed]
        position:
          x: 560
          y: 336
      - id: chair-review-packet
        kind: stage
        label: Build anonymized review packet
        executionMode: sequential
        joinMode: all
        stageMembers:
          - personaId: council-chair
            budget: 18
            model: claude-sonnet-4-6
            consumesEventTypes:
              - council.a.opinion.submitted
              - council.b.opinion.submitted
        position:
          x: 816
          y: 248
      - id: member-a-review
        kind: stage
        label: Seat A review packet
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: council-member-a
            budget: 16
            model: claude-sonnet-4-6
            consumesEventTypes: [council.review.requested]
        position:
          x: 1072
          y: 160
      - id: member-b-review
        kind: stage
        label: Seat B review packet
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: council-member-b
            budget: 16
            model: gpt-5.5
            consumesEventTypes: [council.review.requested]
        position:
          x: 1072
          y: 336
      - id: chair-synthesis
        kind: stage
        label: Synthesize final decision
        executionMode: sequential
        joinMode: all
        stageMembers:
          - personaId: council-chair
            budget: 18
            model: claude-sonnet-4-6
            consumesEventTypes:
              - council.a.review.submitted
              - council.b.review.submitted
        position:
          x: 1328
          y: 248
      - id: research-complete
        kind: end
        label: Research complete
        joinMode: all
        completionEvent: research.completed
        position:
          x: 1584
          y: 248
    edges:
      - id: edge-research-request-to-chair
        source: research-request
        target: chair-brief
        label: research.requested -> research.requested
      - id: edge-chair-to-seat-a
        source: chair-brief
        target: member-a-opinion
        label: council.briefed -> council.briefed
      - id: edge-chair-to-seat-b
        source: chair-brief
        target: member-b-opinion
        label: council.briefed -> council.briefed
      - id: edge-seat-a-opinion-to-chair
        source: member-a-opinion
        target: chair-review-packet
        label: council.a.opinion.submitted -> council.a.opinion.submitted
      - id: edge-seat-b-opinion-to-chair
        source: member-b-opinion
        target: chair-review-packet
        label: council.b.opinion.submitted -> council.b.opinion.submitted
      - id: edge-chair-packet-to-seat-a
        source: chair-review-packet
        target: member-a-review
        label: council.review.requested -> council.review.requested
      - id: edge-chair-packet-to-seat-b
        source: chair-review-packet
        target: member-b-review
        label: council.review.requested -> council.review.requested
      - id: edge-seat-a-review-to-chair
        source: member-a-review
        target: chair-synthesis
        label: council.a.review.submitted -> council.a.review.submitted
      - id: edge-seat-b-review-to-chair
        source: member-b-review
        target: chair-synthesis
        label: council.b.review.submitted -> council.b.review.submitted
      - id: edge-chair-synthesis-to-end
        source: chair-synthesis
        target: research-complete
        label: research.completed -> research.completed
    resourceBindings:
      - id: binding-research-scratch
        resourceNodeId: research-scratch
        targetType: workflow
        targetId: research-council
        access: read_write
        writePrefixes: [council/]
        readPriority: 1
      - id: binding-research-memory
        resourceNodeId: research-memory
        targetType: workflow
        targetId: research-council
        access: read_write
        writePrefixes: [research/]
        readPriority: 2
