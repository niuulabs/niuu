- name: Tyr Raid Flow
  description: Default Tyr to Volundr ravn_flock workflow using the legacy Volundr personas.
  version: 1.0.0
  graph:
    nodes:
      - id: dispatch-root
        kind: trigger
        label: Dispatch raid
        source: tyr dispatch
        dispatchEvent: code.requested
        position:
          x: 96
          y: 144
      - id: raid-coder
        kind: stage
        label: Implement code
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: coder
            budget: 40
            model: claude-sonnet-4-6
        position:
          x: 336
          y: 144
      - id: raid-reviewer
        kind: stage
        label: Review changes
        executionMode: sequential
        joinMode: any
        stageMembers:
          - personaId: reviewer
            budget: 25
            model: claude-sonnet-4-6
        position:
          x: 576
          y: 144
      - id: raid-complete
        kind: end
        label: Raid complete
        joinMode: all
        completionEvent: ravn.task.completed
        completionRules:
          requireGitCommit: true
          requireGitPush: true
        position:
          x: 816
          y: 152
    edges:
      - id: edge-dispatch-to-coder
        source: dispatch-root
        target: raid-coder
        label: code.requested -> code.requested
      - id: edge-coder-to-reviewer
        source: raid-coder
        target: raid-reviewer
        label: code.changed -> code.changed
      - id: edge-reviewer-to-coder
        source: raid-reviewer
        target: raid-coder
        label: review.changes_requested -> review.changes_requested
      - id: edge-reviewer-to-end
        source: raid-reviewer
        target: raid-complete
        label: review.completed -> review.completed
