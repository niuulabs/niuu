site_name: Niuu
site_description: Self-hosted platform for AI coding sessions, workflows, memory, and LLM operations
site_url: https://niuulabs.github.io/volundr/
repo_url: https://github.com/niuulabs/volundr
repo_name: niuulabs/volundr

docs_dir: docs/site

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font: false
  logo: images/logo-knot.svg
  favicon: images/logo-knot.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
    - header.autohide

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started:
      - Introduction: get-started/introduction.md
      - Install: get-started/install.md
      - First local stack: get-started/first-local-stack.md
      - First AI workspace: get-started/first-ai-workspace.md
      - Configure your project: get-started/configure-project.md
      - From small to autonomous:
          - Overview: get-started/path-from-small-to-autonomous.md
          - 1. One local platform: get-started/one-local-platform.md
          - 2. One workspace session: get-started/one-workspace-session.md
          - 3. Model routing: get-started/model-routing-step.md
          - 4. Durable memory: get-started/durable-memory.md
          - 5. Workflows and teams: get-started/workflows-and-teams-step.md
          - 6. Direct and resident assistants: get-started/direct-and-resident-assistants.md
          - 7. Shared discovery and topology: get-started/shared-discovery-and-topology.md
          - 8. Kubernetes and GitOps: get-started/kubernetes-and-gitops-step.md
  - Concepts:
      - Platform model: concepts/platform-model.md
      - Sessions and workspaces: concepts/sessions-and-workspaces.md
      - Workflows and teams: concepts/workflows-and-teams.md
      - Agents and personas: concepts/agents-and-personas.md
      - Memory and knowledge: concepts/memory-and-knowledge.md
      - Model routing: concepts/model-routing.md
      - Git and review flow: concepts/git-and-review-flow.md
  - Reference:
      - CLI:
          - Overview: reference/cli.md
          - niuu: reference/cli-niuu.md
          - ravn: reference/cli-ravn.md
      - Web UI: reference/web-ui.md
      - Configuration: reference/configuration.md
      - API: reference/api.md
      - Helm charts: reference/helm-charts.md
      - Sessions: reference/sessions.md
      - Credentials and secrets: reference/credentials-and-secrets.md
      - Identity: reference/identity.md
      - Integrations: reference/integrations.md
      - Events: reference/events.md
  - Operations:
      - Local development: operations/local-development.md
      - OpenShell runtime: operations/openshell-runtime.md
      - Kubernetes deployment: operations/kubernetes-deployment.md
      - Production checklist: operations/production-checklist.md
      - Migrations: operations/migrations.md
      - Observability: operations/observability.md
      - Security and permissions: operations/security-and-permissions.md
  - Troubleshooting:
      - FAQ: troubleshooting/faq.md
      - Common issues: troubleshooting/common-issues.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
