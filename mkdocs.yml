site_name: Niuu
site_description: A place where intelligent systems do real work. Composable building blocks for agents, workflows and autonomous work, with the tools and models you already use.
site_url: https://docs.niuu.cloud/
repo_url: https://github.com/niuulabs/niuu
repo_name: niuulabs/niuu

docs_dir: docs/site

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font: false
  logo: images/niuu-mark.svg
  favicon: images/niuu-favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
    - header.autohide

extra_css:
  - stylesheets/niuu.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/home.js

nav:
  - Home: index.md
  - Documentation: overview.md
  - Start here:
      - What is Niuu?: get-started/introduction.md
      - Install: get-started/install.md
      - Your first working session: get-started/first-local-stack.md
      - Work on a repository: get-started/configure-project.md
      - Choose your next step: get-started/path-from-small-to-autonomous.md
  - Guides:
      - Inspect model routing: get-started/model-routing-step.md
      - Ingest and retrieve knowledge: get-started/durable-memory.md
      - Inspect workflows and runs: get-started/workflows-and-teams-step.md
      - Discovery and topology: get-started/shared-discovery-and-topology.md
      - Build a review for a workflow: get-started/build-a-review.md
  - Architecture:
      - Overview: architecture/index.md
      - Stack map:
          - Services and channels: architecture/stack/services.md
          - One request end to end: architecture/stack/request-flow.md
          - Product and implementation names: architecture/stack/names.md
      - Design principles:
          - Overview: architecture/design/index.md
          - Layers and boundaries: architecture/design/layers.md
          - Config and adapters: architecture/design/config-and-adapters.md
          - Fail loud: architecture/design/fail-loud.md
      - Forge:
          - Overview: architecture/forge/index.md
          - Where sessions run: architecture/forge/where-sessions-run.md
          - Workspaces and projects: architecture/forge/workspaces-and-projects.md
          - State and history: architecture/forge/state-and-history.md
      - Skuld:
          - Overview: architecture/skuld/index.md
          - Runtimes: architecture/skuld/runtimes.md
          - Message path: architecture/skuld/message-path.md
          - Channels and tools: architecture/skuld/channels-and-tools.md
      - Workflows:
          - Overview: architecture/workflows/index.md
          - Runs, gates and reviews: architecture/workflows/runs.md
          - Trackers and projects: architecture/workflows/trackers-and-projects.md
          - Personas: architecture/workflows/personas.md
      - Security:
          - Trust model: architecture/security/index.md
          - Credentials: architecture/security/credentials.md
          - Machine identities: architecture/security/machine-identities.md
          - Isolation and secrets: architecture/security/isolation-and-secrets.md
      - Communication:
          - Overview: architecture/communication/index.md
          - Sleipnir events: architecture/communication/sleipnir.md
          - Collaboration rooms: architecture/communication/rooms.md
          - Mesh and A2A: architecture/communication/mesh-and-a2a.md
      - Models:
          - Overview: architecture/models/index.md
          - Catalog: architecture/models/catalog.md
          - Connections: architecture/models/connections.md
          - Routing: architecture/models/routing.md
      - Memory:
          - Overview: architecture/memory/index.md
          - Retrieval: architecture/memory/retrieval.md
          - Mounts and tenants: architecture/memory/mounts-and-tenants.md
          - Agent access: architecture/memory/agent-access.md
      - Deployment modes:
          - Overview: architecture/deployment/index.md
          - Single host: architecture/deployment/single-host.md
          - Joined machines: architecture/deployment/joined-machines.md
          - Kubernetes: architecture/deployment/kubernetes.md
  - Understand Niuu:
      - Architecture and composability: concepts/platform-model.md
      - Toward an operating system: concepts/operating-system.md
      - Sessions and workspaces: concepts/sessions-and-workspaces.md
      - Agents, personas, and residents: concepts/agents-and-personas.md
      - Workflows and teams: concepts/workflows-and-teams.md
      - Memory and knowledge: concepts/memory-and-knowledge.md
      - Models and routing: concepts/model-routing.md
      - Review agent changes: concepts/git-and-review-flow.md
  - Operate:
      - Local development: operations/local-development.md
      - Single-host Docker mode: operations/docker-mode.md
      - Kubernetes deployment: operations/kubernetes-deployment.md
      - OpenShell runtime: operations/openshell-runtime.md
      - Integration credentials and MCP: operations/integrations-and-mcp.md
      - Identity and execution boundaries: operations/security-and-permissions.md
      - Diagnose an operation: operations/observability.md
      - Migrations and upgrades: operations/migrations.md
      - Accept a shared deployment: operations/production-checklist.md
      - Quick-start verification: operations/quickstart-verification.md
  - Reference:
      - Command-line tools: reference/cli.md
      - Niuu commands: reference/cli-niuu.md
      - Configuration: reference/configuration.md
      - HTTP API: reference/api.md
      - Session lifecycle API: reference/sessions.md
      - Web interface: reference/web-ui.md
      - Credentials and secrets: reference/credentials-and-secrets.md
      - Identity: reference/identity.md
      - Integrations: reference/integrations.md
      - Events and streams: reference/events.md
      - Helm charts: reference/helm-charts.md
  - Troubleshooting:
      - Fix a failed launch: troubleshooting/common-issues.md
      - Frequently asked questions: troubleshooting/faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
