coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 2%
    patch:
      default:
        target: 75%
        threshold: 5%
comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: true
flags:
  backend:
    paths:
      - src/
    carryforward: true
  web:
    paths:
      - web-next/
    carryforward: true
