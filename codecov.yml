coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%
ignore:
  - ".github/**"
  - "charts/**"
  - "containers/**"
  - "docs/**"
comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: true
flags:
  backend:
    paths:
      - src/
    carryforward: true
  web:
    paths:
      - web-next/
    carryforward: true
