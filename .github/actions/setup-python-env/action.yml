name: Set up Python + uv
description: Install uv, Python, and project dependencies with cached wheels.
inputs:
  uv-version:
    description: uv version to install
    required: false
    default: "0.11.2"
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  extras:
    description: uv sync extras flag(s) (e.g. "--all-extras --dev" or "--extra test --extra nats")
    required: false
    default: "--frozen --all-extras --dev"
runs:
  using: composite
  steps:
    # The cache key must include the extras: the first job to finish saves the
    # key, so a lean install (lint) would otherwise publish a near-empty cache
    # that every full install then restores and cannot overwrite.
    - name: Derive cache suffix from extras
      id: cache-suffix
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: echo "value=$(printf '%s|%s' "$EXTRAS" "$PYTHON_VERSION" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-suffix: ${{ steps.cache-suffix.outputs.value }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync ${{ inputs.extras }}
