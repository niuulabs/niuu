# Reusable: build multi-arch container images and publish manifest tags.
#
# Splits into three jobs:
#   1. build   — per (container × platform), pushes <image>:<tag-prefix>-<platform>
#   2. manifest — one job; for each container creates multi-arch manifests
#      pointing at the per-platform tags for every entry in `manifest-tags`
#      (the platforms in `manifest-platforms`, by default `platforms`).
#      Skipped when `publish-manifests` is false: dev.yaml builds in parallel
#      with its tests and publishes the dev manifests itself once both pass.
#   3. attest  — per container, signed GitHub build provenance for the manifest
#      list digest the first `manifest-tags` entry resolves to (see below).
#      Runs whenever manifests are published.
#
# Provenance: buildx's own in-manifest provenance stays off (`provenance:
# false` on build-push-action); the attestation is GitHub's, made by
# actions/attest-build-provenance and stored in GitHub's attestation API, which
# is what the platform's `volundr_git verify_image_provenance` reads. Its
# signing identity is this file's `attest` job: the OIDC `job_workflow_ref` of a
# job in a reusable workflow is the reusable workflow, whichever workflow called
# it. The platform pins that path (`git.provenance.kwargs.workflow_paths`, default
# in `niuu.config.DEFAULT_PROVENANCE_WORKFLOW_PATHS`); renaming or moving this
# file means changing both in the same change.
#
# Every caller must grant `id-token: write` and `attestations: write` (and
# `packages: write`), even when it publishes no manifests: a caller caps a
# reusable workflow's permissions when the workflow is loaded, not when a job
# runs, so a call missing them fails to start.
#
# The tag scheme (prefix + manifest list) is deliberately caller-controlled —
# PR/feature/dev callers all need different tagging.
name: Reusable — Container Build

on:
  workflow_call:
    inputs:
      containers:
        description: JSON array of container names (e.g. '["volundr","skuld"]').
        type: string
        required: true
      platforms:
        description: JSON array of platforms. Default amd64+arm64.
        type: string
        default: '["amd64","arm64"]'
      tag-prefix:
        description: Per-platform tags are `<tag-prefix>-<platform>`.
        type: string
        required: true
      manifest-tags:
        description: Space-separated list of manifest tags to create from the per-platform images.
        type: string
        required: true
      manifest-platforms:
        description: >-
          JSON array of the platforms each manifest lists, when it differs from
          `platforms`: a caller that builds the platforms in separate calls
          publishes the manifests from the last one, naming every platform.
          Empty means `platforms`.
        type: string
        default: ""
      publish-manifests:
        description: >-
          Create the `manifest-tags` manifests after the builds. False pushes
          only the per-platform `<tag-prefix>-<platform>` images and leaves the
          manifests to the caller (manifest-tags is then ignored).
        type: boolean
        default: true
      build-args:
        description: Newline-separated build args to pass to docker/build-push-action.
        type: string
        default: ""
      labels:
        description: Newline-separated OCI labels.
        type: string
        default: ""
      registry:
        description: Container registry.
        type: string
        default: ghcr.io
      push:
        description: >-
          Push per-platform images, write the registry cache, and publish
          manifests. False only builds the images: PRs from forks get a
          read-only GITHUB_TOKEN and cannot write to the registry.
        type: boolean
        default: true
      cache-write:
        description: >-
          Export the BuildKit layer cache to <image>:buildcache-<platform>.
          Only the integration branch should write; every caller reads it.
        type: boolean
        default: false
      cache-scope:
        description: >-
          Optional private cache, read and written at
          <image>:<cache-scope>-buildcache-<platform> in addition to reading the
          integration branch's. PR builds pass pr-<number>: later pushes to the
          same PR reuse its own layers (a changed lockfile, a rebuilt web bundle)
          without overwriting the integration branch's cache. Scoped builds also
          read and write <image>:pr-shared-buildcache-<platform>, the most recent
          scoped build of any PR — BuildKit cannot wildcard cache refs, so "any
          PR's cache" has to be one tag. The pr- prefix lets
          cleanup-containers.yaml collect both.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: "Build ${{ matrix.container }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}
        platform: ${{ fromJson(inputs.platforms) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-hosted runners are discarded after the job, so removing the
      # builder at the end only delays the job (about 17 s per build).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the OS package refresh date
        id: os-refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./containers/${{ matrix.container }}/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ inputs.tag-prefix }}-${{ matrix.platform }}
          build-args: |
            ${{ inputs.build-args }}
            OS_PACKAGES_REFRESH=${{ steps.os-refresh.outputs.date }}
          labels: |
            ${{ inputs.labels }}
            org.opencontainers.image.licenses=${{ matrix.container == 'gbrain' && 'MIT' || 'Apache-2.0' }}
          # Registry-backed layer cache. The GitHub Actions cache is capped at
          # 10 GB per repository; sixteen mode=max scopes overflowed it and
          # evicted each other, so builds ran cold. The registry has no cap.
          cache-from: |
            type=registry,ref=${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.container }}:buildcache-${{ matrix.platform }}
            ${{ inputs.cache-scope != '' && format('type=registry,ref={0}/{1}/{2}:pr-shared-buildcache-{3}', inputs.registry, github.repository_owner, matrix.container, matrix.platform) || '' }}
            ${{ inputs.cache-scope != '' && format('type=registry,ref={0}/{1}/{2}:{3}-buildcache-{4}', inputs.registry, github.repository_owner, matrix.container, inputs.cache-scope, matrix.platform) || '' }}
          cache-to: |
            ${{ inputs.push && inputs.cache-write && format('type=registry,ref={0}/{1}/{2}:buildcache-{3},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', inputs.registry, github.repository_owner, matrix.container, matrix.platform) || '' }}
            ${{ inputs.push && inputs.cache-scope != '' && format('type=registry,ref={0}/{1}/{2}:{3}-buildcache-{4},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', inputs.registry, github.repository_owner, matrix.container, inputs.cache-scope, matrix.platform) || '' }}
            ${{ inputs.push && inputs.cache-scope != '' && format('type=registry,ref={0}/{1}/{2}:pr-shared-buildcache-{3},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', inputs.registry, github.repository_owner, matrix.container, matrix.platform) || '' }}
          platforms: linux/${{ matrix.platform }}
          provenance: false

  # One job for every container: publishing a manifest is seconds of registry
  # API calls, so a runner per container spent longer booting than working.
  manifest:
    name: "Manifests"
    needs: build
    if: inputs.push && inputs.publish-manifests
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        env:
          IMAGE_BASE: ${{ inputs.registry }}/${{ github.repository_owner }}
          CONTAINERS: ${{ inputs.containers }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          PLATFORMS: ${{ inputs.manifest-platforms != '' && inputs.manifest-platforms || inputs.platforms }}
          MANIFEST_TAGS: ${{ inputs.manifest-tags }}
        run: |
          set -euo pipefail

          retry_manifest_publish() {
            local manifest_tag="$1"
            local max_attempts=5
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              docker manifest rm "${IMAGE}:${manifest_tag}" >/dev/null 2>&1 || true

              if docker manifest create "${IMAGE}:${manifest_tag}" "${SOURCES[@]}" \
                && docker manifest push "${IMAGE}:${manifest_tag}"; then
                return 0
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Manifest publish failed after ${max_attempts} attempts: ${IMAGE}:${manifest_tag}" >&2
                return 1
              fi

              local sleep_seconds=$((attempt * 5))
              echo "Manifest publish attempt ${attempt}/${max_attempts} failed for ${IMAGE}:${manifest_tag}; retrying in ${sleep_seconds}s" >&2
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
            done
          }

          for container in $(echo "${CONTAINERS}" | jq -r '.[]'); do
            IMAGE="${IMAGE_BASE}/${container}"

            # Collect per-platform source tags
            SOURCES=()
            for plat in $(echo "${PLATFORMS}" | jq -r '.[]'); do
              SOURCES+=("${IMAGE}:${TAG_PREFIX}-${plat}")
            done
            echo "Source images: ${SOURCES[*]}"

            for tag in ${MANIFEST_TAGS}; do
              echo "::group::manifest ${IMAGE}:${tag}"
              retry_manifest_publish "${tag}"
              echo "::endgroup::"
            done
          done

  # One job per container: the attest action takes a single subject, and
  # push-to-registry needs the fully-qualified image name of that subject. The
  # jobs only read a digest and sign it, so they are short and run in parallel.
  # A failed attestation fails the run: an image the platform cannot verify is
  # not a published image.
  attest:
    name: "Attest ${{ matrix.container }}"
    needs: manifest
    if: inputs.push && inputs.publish-manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/attest-container-image
          sparse-checkout-cone-mode: false

      # Every `manifest-tags` entry points at the same manifest list, so the
      # first one names the digest to attest.
      - name: Pick the manifest tag
        id: tag
        env:
          MANIFEST_TAGS: ${{ inputs.manifest-tags }}
        run: |
          set -euo pipefail
          read -r first _ <<< "${MANIFEST_TAGS}"
          if [ -z "${first:-}" ]; then
            echo "::error title=attest::manifest-tags is empty but publish-manifests is true"
            exit 1
          fi
          echo "value=${first}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: ./.github/actions/attest-container-image
        with:
          registry: ${{ inputs.registry }}
          image: ${{ github.repository_owner }}/${{ matrix.container }}
          tag: ${{ steps.tag.outputs.value }}
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
