name: Niuu binary benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-cli-build.yaml

  timings:
    name: Build and startup comparison
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-build-*
          path: binary-results
      - name: Compare build and startup times
        run: python3 scripts/measure_binary_build.py --summary binary-results >> "$GITHUB_STEP_SUMMARY"
