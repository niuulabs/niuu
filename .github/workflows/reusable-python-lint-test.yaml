# Reusable: Python lint + unit-test matrix (forge + extracted services, ting, ravn).
# Called by ci.yaml and dev.yaml. Coverage uploaded to Codecov per package.
name: Reusable — Python Lint + Test

on:
  workflow_call:
    inputs:
      skip-lint:
        description: Set true to skip the ruff lint/format job.
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: "Python: Lint"
    if: ${{ !inputs.skip-lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ruff needs no project dependencies; the dev group alone avoids
      # installing every extra (torch included) to run a two-second lint.
      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: "--frozen --only-group dev"

      - name: Run ruff linting
        run: uv run --no-sync ruff check --output-format=github src/ tests/

      - name: Check ruff formatting
        run: |
          output="$(uv run --no-sync ruff format --check src/ tests/ 2>&1)" || {
            printf '%s\n' "$output"
            printf '%s\n' "$output" | sed -n 's/^Would reformat: //p' | while IFS= read -r file; do
              echo "::error file=${file}::Ruff formatting required"
            done
            diff_output="$(uv run --no-sync ruff format --diff src/ tests/ 2>&1 || true)"
            diff_output="${diff_output//'%'/'%25'}"
            diff_output="${diff_output//$'\n'/'%0A'}"
            diff_output="${diff_output//$'\r'/'%0D'}"
            echo "::error title=Ruff formatting diff::${diff_output}"
            exit 1
          }

  test:
    name: "Python: Test ${{ matrix.pkg.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: Ting
            flag: backend-ting
            paths: "tests/test_ting"
            cov: "--cov=src/ting"
          - name: Ravn
            flag: backend-ravn
            # src/ravn/tui/ excluded via [tool.coverage.run] omit in pyproject.toml —
            # Textual widgets need a real terminal and cannot run under plain pytest.
            paths: "tests/ravn tests/test_ravn"
            cov: "--cov=src/ravn"
          - name: Bifrost
            flag: backend-bifrost
            paths: "tests/test_bifrost"
            cov: "--cov=src/bifrost"
          - name: Sleipnir
            flag: backend-sleipnir
            paths: "tests/test_sleipnir"
            cov: "--cov=src/sleipnir"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run tests with coverage
        run: |
          set -o pipefail
          set +e
          output_file="$(mktemp)"
          # loadfile keeps each test module on one worker, so module-scoped
          # fixtures and per-file state behave as they do serially.
          uv run pytest ${{ matrix.pkg.paths }} -v --tb=short \
            -n auto --dist loadfile \
            --override-ini="addopts=" \
            -m 'not integration and not broker and not kind_integration and not live_cli' \
            ${{ matrix.pkg.cov }} \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure_summary="$(grep -E '^(FAILED|ERROR) ' "$output_file" | tail -n 60 || true)"
            failure_tail="$(tail -n 20 "$output_file")"
            failure_output="${failure_summary}"$'\n'"${failure_tail}"
            failure_output="${failure_output//'%'/'%25'}"
            failure_output="${failure_output//$'\n'/'%0A'}"
            failure_output="${failure_output//$'\r'/'%0D'}"
            echo "::error title=Python test failure (${{ matrix.pkg.name }})::${failure_output}"
          fi
          exit "$status"

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: ${{ matrix.pkg.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # The Volundr selection is ~10k tests: about five minutes on one runner even
  # under xdist. It runs as four file-balanced shards (tests/conftest.py
  # --shard); the "Python: Test Volundr" job below combines their coverage and
  # owns the 85% gate, keeping the required check name.
  test-volundr-shard:
    name: "Python: Test Volundr shard ${{ matrix.shard }}/4"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Set up Helm for chart rendering tests
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Run test shard
        run: |
          set -o pipefail
          set +e
          output_file="$(mktemp)"
          uv run pytest tests/ \
            --ignore=tests/test_ting \
            --ignore=tests/test_ravn \
            --ignore=tests/ravn \
            --ignore=tests/test_bifrost \
            --ignore=tests/test_sleipnir \
            --ignore=tests/integration \
            -v --tb=short \
            -n auto --dist loadfile \
            --shard=${{ matrix.shard }}/4 \
            --override-ini="addopts=" \
            -m 'not integration and not broker and not kind_integration and not live_cli' \
            --cov=src/audit --cov=src/volundr --cov=src/cli --cov=src/credentials \
            --cov=src/features --cov=src/identity --cov=src/integrations --cov=src/niuu \
            --cov=src/tracker --cov=src/skuld --cov=src/mimir \
            --cov-report= 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure_summary="$(grep -E '^(FAILED|ERROR) ' "$output_file" | tail -n 60 || true)"
            failure_tail="$(tail -n 20 "$output_file")"
            failure_output="${failure_summary}"$'\n'"${failure_tail}"
            failure_output="${failure_output//'%'/'%25'}"
            failure_output="${failure_output//$'\n'/'%0A'}"
            failure_output="${failure_output//$'\r'/'%0D'}"
            echo "::error title=Python test failure (Volundr shard ${{ matrix.shard }})::${failure_output}"
          fi
          exit "$status"

      - name: Upload shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: volundr-coverage-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test-volundr:
    name: "Python: Test Volundr"
    needs: test-volundr-shard
    # always(): a job skipped because a shard failed would report "skipped",
    # which branch rules accept as passing. Run and fail instead.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Require every shard to have passed
        if: needs.test-volundr-shard.result != 'success'
        run: |
          echo "::error title=Python test failure (Volundr)::test shards finished with result '${{ needs.test-volundr-shard.result }}'"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # coverage arrives with pytest-cov in the dev group; combining needs the
      # sources on disk, not the project's dependencies.
      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: "--frozen --only-group dev"

      - name: Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: volundr-coverage-*
          path: coverage-shards
          merge-multiple: true

      - name: Combine coverage and enforce 85%
        run: |
          uv run --no-sync coverage combine coverage-shards/
          uv run --no-sync coverage xml -q
          uv run --no-sync coverage report --show-missing --fail-under=85

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: backend-volundr
          token: ${{ secrets.CODECOV_TOKEN }}

  # Mímir retrieval-quality eval (NIU-1055/NIU-1057). HARD GATE: fails when
  # overall P@5 regresses more than the threshold vs the committed baseline
  # (tests/test_mimir/evals/baseline.json). Improvements should refresh the
  # baseline via `python -m mimir eval --json --out tests/test_mimir/evals/baseline.json`.
  mimir-eval:
    name: "Mímir: Retrieval eval (gated)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run golden-set eval vs committed baseline (FTS-only)
        run: |
          uv run python -m mimir eval \
            --against tests/test_mimir/evals/baseline.json \
            --fail-on-regression | tee eval-report.txt
          {
            echo "## Mímir retrieval eval (FTS-only, gated vs baseline)"
            echo '```'
            cat eval-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
