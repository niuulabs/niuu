# Reusable: Python lint + unit-test matrix (forge + extracted services, ting, ravn).
# Called by ci.yaml and dev.yaml. Coverage uploaded to Codecov per package.
name: Reusable — Python Lint + Test

on:
  workflow_call:
    inputs:
      skip-lint:
        description: Set true to skip the ruff lint/format job.
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: "Python: Lint"
    if: ${{ !inputs.skip-lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run ruff linting
        run: uv run ruff check --output-format=github src/ tests/

      - name: Check ruff formatting
        run: |
          output="$(uv run ruff format --check src/ tests/ 2>&1)" || {
            printf '%s\n' "$output"
            printf '%s\n' "$output" | sed -n 's/^Would reformat: //p' | while IFS= read -r file; do
              echo "::error file=${file}::Ruff formatting required"
            done
            diff_output="$(uv run ruff format --diff src/ tests/ 2>&1 || true)"
            diff_output="${diff_output//'%'/'%25'}"
            diff_output="${diff_output//$'\n'/'%0A'}"
            diff_output="${diff_output//$'\r'/'%0D'}"
            echo "::error title=Ruff formatting diff::${diff_output}"
            exit 1
          }

  test:
    name: "Python: Test ${{ matrix.pkg.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - name: Volundr
            flag: backend-volundr
            paths: >-
              tests/
              --ignore=tests/test_ting
              --ignore=tests/test_ravn
              --ignore=tests/ravn
              --ignore=tests/test_bifrost
              --ignore=tests/test_sleipnir
              --ignore=tests/integration
            cov: "--cov=src/audit --cov=src/volundr --cov=src/cli --cov=src/credentials --cov=src/features --cov=src/identity --cov=src/integrations --cov=src/niuu --cov=src/tracker --cov=src/skuld --cov=src/mimir"
          - name: Ting
            flag: backend-ting
            paths: "tests/test_ting"
            cov: "--cov=src/ting"
          - name: Ravn
            flag: backend-ravn
            # src/ravn/tui/ excluded via [tool.coverage.run] omit in pyproject.toml —
            # Textual widgets need a real terminal and cannot run under plain pytest.
            paths: "tests/ravn tests/test_ravn"
            cov: "--cov=src/ravn"
          - name: Bifrost
            flag: backend-bifrost
            paths: "tests/test_bifrost"
            cov: "--cov=src/bifrost"
          - name: Sleipnir
            flag: backend-sleipnir
            paths: "tests/test_sleipnir"
            cov: "--cov=src/sleipnir"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run tests with coverage
        run: |
          set -o pipefail
          set +e
          output_file="$(mktemp)"
          uv run pytest ${{ matrix.pkg.paths }} -v --tb=short \
            --override-ini="addopts=" \
            ${{ matrix.pkg.cov }} \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure_summary="$(grep -E '^(FAILED|ERROR) ' "$output_file" | tail -n 60 || true)"
            failure_tail="$(tail -n 20 "$output_file")"
            failure_output="${failure_summary}"$'\n'"${failure_tail}"
            failure_output="${failure_output//'%'/'%25'}"
            failure_output="${failure_output//$'\n'/'%0A'}"
            failure_output="${failure_output//$'\r'/'%0D'}"
            echo "::error title=Python test failure (${{ matrix.pkg.name }})::${failure_output}"
          fi
          exit "$status"

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: ${{ matrix.pkg.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Mímir retrieval-quality eval (NIU-1055/NIU-1057). HARD GATE: fails when
  # overall P@5 regresses more than the threshold vs the committed baseline
  # (tests/test_mimir/evals/baseline.json). Improvements should refresh the
  # baseline via `python -m mimir eval --json --out tests/test_mimir/evals/baseline.json`.
  mimir-eval:
    name: "Mímir: Retrieval eval (gated)"
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run golden-set eval vs committed baseline (FTS-only)
        run: |
          uv run python -m mimir eval \
            --against tests/test_mimir/evals/baseline.json \
            --fail-on-regression | tee eval-report.txt
          {
            echo "## Mímir retrieval eval (FTS-only, gated vs baseline)"
            echo '```'
            cat eval-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
