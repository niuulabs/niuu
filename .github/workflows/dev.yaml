# Runs on every push to dev:
# 1. Full test suite (lint, unit tests, integration tests, e2e, web-next tests, helm lint)
# 2. Builds all container images with "dev" + "dev-<sha>" tags
# 3. Determines next version from conventional commits and creates a v*-dev.N prerelease tag
# 4. Packages Helm charts with the dev version
# 5. Builds CLI binaries (uploaded as artifacts, no GitHub Release)
#
# The dev prerelease tags (v*-dev.N) are skipped by release.yaml so they
# never create a production GitHub Release.
name: Dev

on:
  push:
    branches: [dev]

permissions: read-all

env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

concurrency:
  group: dev-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python — lint + unit tests. Delegated to reusable workflow.
  # Includes volundr, ting, AND ravn — previously ravn was missing here.
  # ---------------------------------------------------------------------------
  python:
    name: Python
    uses: ./.github/workflows/reusable-python-lint-test.yaml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Python integration tests (real PostgreSQL)
  # ---------------------------------------------------------------------------
  python-integration-test-volundr:
    name: "Python: Integration Test Volundr"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volundr_test
          POSTGRES_PASSWORD: volundr_test
          POSTGRES_DB: volundr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: volundr_test
          TEST_DATABASE_PASSWORD: volundr_test
          TEST_DATABASE_NAME: volundr_test
        run: |
          uv run pytest tests/integration/volundr/ -v --tb=short -m integration \
            --override-ini="addopts="

  python-integration-test-ting:
    name: "Python: Integration Test Ting"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volundr_test
          POSTGRES_PASSWORD: volundr_test
          POSTGRES_DB: volundr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: volundr_test
          TEST_DATABASE_PASSWORD: volundr_test
          TEST_DATABASE_NAME: volundr_test
        run: |
          uv run pytest tests/integration/ting/ -v --tb=short -m integration \
            --override-ini="addopts="

  # ---------------------------------------------------------------------------
  # End-to-end tests (Playwright against real backend + frontend)
  # ---------------------------------------------------------------------------
  e2e-test:
    name: "E2E: Playwright"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volundr_test
          POSTGRES_PASSWORD: volundr_test
          POSTGRES_DB: volundr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U volundr_test -d volundr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Playwright temporarily disabled
        run: echo "Skipping Playwright until visual baselines are stabilized."

  # ---------------------------------------------------------------------------
  # web-next — lint + unit tests. Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  web-next:
    name: web-next
    uses: ./.github/workflows/reusable-web-next-lint-test.yaml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Helm lint. Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    uses: ./.github/workflows/reusable-helm-lint.yaml

  # ---------------------------------------------------------------------------
  # Containers — build multi-arch (amd64 + arm64) for the published containers.
  # Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  containers:
    name: Containers
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yaml
    with:
      containers: '["agent","skuld","devrunner","volundr-web","niuu-web","niuu"]'
      platforms: '["amd64","arm64"]'
      tag-prefix: ${{ github.sha }}
      manifest-tags: "dev dev-${{ github.sha }}"
      build-args: |
        APP_VERSION=dev-${{ github.sha }}
      labels: |
        org.opencontainers.image.title=niuu
        org.opencontainers.image.licenses=Apache-2.0
        org.opencontainers.image.vendor=Niuu Labs
        org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Security — container vulnerability scanning. Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  scan:
    name: Scan
    needs: containers
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/reusable-container-scan.yaml
    with:
      containers: '["agent","skuld","devrunner","volundr-web","niuu-web","niuu"]'
      tag: dev

  # ---------------------------------------------------------------------------
  # Version tagging — prerelease dev tags
  # ---------------------------------------------------------------------------
  tag:
    name: Determine Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      should_release: ${{ steps.version.outputs.should_release }}
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version bump
        id: version
        run: |
          # Get the last production (non-prerelease) tag
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -v -- '-' | head -1 || true)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          LAST_VERSION=${LAST_TAG#v}

          # Get all commit messages since last production tag
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMIT_MSGS=$(git log --pretty=%B HEAD)
          else
            COMMIT_MSGS=$(git log --pretty=%B ${LAST_TAG}..HEAD)
          fi

          echo "Last production version: $LAST_VERSION"

          # Determine version bump type from conventional commits
          VERSION_TYPE="none"
          if echo "$COMMIT_MSGS" | grep -qiE "^feat(\(.+\))?!:|^BREAKING CHANGE:"; then
            VERSION_TYPE="major"
          elif echo "$COMMIT_MSGS" | grep -qiE "^(feat|refactor)(\(.+\))?:"; then
            VERSION_TYPE="minor"
          elif echo "$COMMIT_MSGS" | grep -qiE "^(fix|style)(\(.+\))?:"; then
            VERSION_TYPE="patch"
          fi

          echo "Version bump type: $VERSION_TYPE"

          if [ "$VERSION_TYPE" = "none" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Calculate next version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          case $VERSION_TYPE in
            major) NEW_BASE="$((MAJOR + 1)).0.0" ;;
            minor) NEW_BASE="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_BASE="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          # Count existing dev tags for this base version to determine N
          DEV_COUNT=$(git tag -l "v${NEW_BASE}-dev.*" | wc -l | tr -d ' ')
          DEV_N=$((DEV_COUNT + 1))
          NEW_VERSION="${NEW_BASE}-dev.${DEV_N}"

          echo "New dev version: $NEW_VERSION"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Dev release v${VERSION}"
          git push origin "v${VERSION}"

  # ---------------------------------------------------------------------------
  # Helm charts — dev versions
  # ---------------------------------------------------------------------------
  build-charts:
    name: Build Helm Charts
    needs: [tag]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.14.0

      - name: Update chart versions
        run: |
          VERSION="${{ needs.tag.outputs.version }}"

          for CHART in agent bifrost ravn skuld volundr ting niuu-shared niuu skuld-planner; do
            sed -i "s/^version:.*/version: $VERSION/" "charts/${CHART}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" "charts/${CHART}/Chart.yaml"
          done

      - name: Package Helm charts
        run: |
          helm package charts/bifrost -d .helm-packages/
          helm package charts/agent -d .helm-packages/
          helm package charts/ravn -d .helm-packages/
          helm package charts/skuld -d .helm-packages/
          helm package charts/skuld-planner -d .helm-packages/
          helm package charts/volundr -d .helm-packages/
          helm package charts/ting -d .helm-packages/
          helm package charts/niuu-shared -d .helm-packages/
          rm -f charts/niuu/Chart.lock
          helm dependency update charts/niuu
          helm package charts/niuu -d .helm-packages/

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm charts to OCI registry
        run: |
          helm push .helm-packages/agent-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/bifrost-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/ravn-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/skuld-[0-9]*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/skuld-planner-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/volundr-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/ting-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/niuu-shared-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/niuu-[0-9]*.tgz ${{ env.CHART_REPO }}

  # ---------------------------------------------------------------------------
  # Shared CLI assets — build once, reuse in packaging jobs
  # ---------------------------------------------------------------------------
  build-cli-web-assets:
    name: Build CLI Web Assets
    needs: [tag]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Build web assets for embedded CLI
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web-next
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          rm -rf src/cli/web/dist
          mkdir -p src/cli/web
          cp -r web-next/apps/niuu/dist src/cli/web/dist

      - name: Upload CLI web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-web-dist
          path: src/cli/web/dist
          retention-days: 7

  build-cli-pginstall:
    name: "Build Embedded PostgreSQL (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [tag]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore PostgreSQL bundle cache
        id: pg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: build/pginstall
          key: pginstall-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('src/niuu/pg_versions.py', 'scripts/build_postgres.sh') }}

      - name: Load PostgreSQL versions
        id: pg-versions
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          namespace = {}
          exec(open("src/niuu/pg_versions.py", encoding="utf-8").read(), namespace)
          print(f"postgres_version={namespace['POSTGRES_VERSION']}")
          print(f"pgvector_version={namespace['PGVECTOR_VERSION']}")
          PY

      - name: Build embedded PostgreSQL bundle
        if: steps.pg-cache.outputs.cache-hit != 'true'
        env:
          POSTGRES_VERSION: ${{ steps.pg-versions.outputs.postgres_version }}
          PGVECTOR_VERSION: ${{ steps.pg-versions.outputs.pgvector_version }}
          INSTALL_PREFIX: build/pginstall
        run: scripts/build_postgres.sh

      - name: Upload embedded PostgreSQL bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pginstall-${{ matrix.os }}-${{ matrix.arch }}
          path: build/pginstall
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CLI binaries (Python/Nuitka) — build only, no GitHub Release
  # ---------------------------------------------------------------------------
  build-cli:
    name: "Build CLI (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [tag, build-cli-web-assets, build-cli-pginstall]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Linux ARM64 Nuitka toolchain
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "LDFLAGS=-fuse-ld=lld"
          } >> "$GITHUB_ENV"

      - name: Download CLI web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-web-dist
          path: src/cli/web

      - name: Download embedded PostgreSQL bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pginstall-${{ matrix.os }}-${{ matrix.arch }}
          path: build

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: "--python 3.12 --extra cli --extra dev"

      - name: Build
        run: make copy-migrations build-cli

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: niuu-dev-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/niuu-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 14

  build-ravn:
    name: "Build Ravn (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [tag]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Linux ARM64 Nuitka toolchain
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "LDFLAGS=-fuse-ld=lld"
          } >> "$GITHUB_ENV"

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: "--python 3.12 --extra cli --extra dev"

      - name: Build
        run: make build-ravn

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ravn-dev-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/ravn-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 14
