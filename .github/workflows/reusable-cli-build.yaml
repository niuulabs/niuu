name: Package Niuu executables

on:
  workflow_call:
    secrets:
      NIUU_QUICKSTART_CLAUDE_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Shared CLI assets — build once, reuse in packaging jobs
  # ---------------------------------------------------------------------------
  build-cli-web-assets:
    name: Build CLI Web Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Build web assets for embedded CLI
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web-next
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          rm -rf src/cli/web/dist
          mkdir -p src/cli/web
          cp -r web-next/apps/niuu/dist src/cli/web/dist

      - name: Upload CLI web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-web-dist
          overwrite: true
          path: src/cli/web/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # CLI binaries
  # ---------------------------------------------------------------------------
  build-cli:
    name: "Build CLI (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [build-cli-web-assets]
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: "3.12"
      UV_FROZEN: "true"
      PYAPP_INSTALL_DIR_NIUU: ${{ github.workspace }}/.build-cache/niuu-runtime
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CLI web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cli-web-dist
          path: web-next/apps/niuu/dist

      - name: Verify CLI web assets
        run: test -f web-next/apps/niuu/dist/index.html

      - name: Restore PostgreSQL bundle cache
        id: pg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: build/pginstall
          key: pginstall-v2-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('src/niuu/pg_versions.py', 'scripts/build_postgres.sh') }}

      - name: Load PostgreSQL versions
        id: pg-versions
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          namespace = {}
          exec(open("src/niuu/pg_versions.py", encoding="utf-8").read(), namespace)
          print(f"postgres_version={namespace['POSTGRES_VERSION']}")
          print(f"pgvector_version={namespace['PGVECTOR_VERSION']}")
          PY

      - name: Install PostgreSQL extension build dependencies
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install openssl@3 pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config
          fi

      - name: Build embedded PostgreSQL bundle
        if: steps.pg-cache.outputs.cache-hit != 'true'
        env:
          POSTGRES_VERSION: ${{ steps.pg-versions.outputs.postgres_version }}
          PGVECTOR_VERSION: ${{ steps.pg-versions.outputs.pgvector_version }}
          INSTALL_PREFIX: build/pginstall
        run: scripts/build_postgres.sh

      - name: Save PostgreSQL bundle before compilation
        if: steps.pg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: build/pginstall
          key: ${{ steps.pg-cache.outputs.cache-primary-key }}

      - name: Install payload tools
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install zstd
          else
            sudo apt-get update
            sudo apt-get install -y patchelf zstd
          fi

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: --frozen --extra cli --no-dev

      - name: Identify launcher toolchain
        id: toolchain
        run: |
          mkdir -p dist/timings
          {
            rustc --version
            cargo --version
            cc --version
            if [ "$RUNNER_OS" = "macOS" ]; then xcrun --show-sdk-version; fi
          } > dist/toolchain.txt
          echo "digest=$(shasum -a 256 dist/toolchain.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          uv run --frozen --no-dev python --version >> dist/toolchain.txt
          zstd --version >> dist/toolchain.txt
          cat dist/toolchain.txt

      - name: Restore Rust dependencies
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            .build-cache/pyapp-target
            ~/.cargo/registry
            ~/.cargo/git
          key: pyapp-deps-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.toolchain.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pyapp-deps-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.toolchain.outputs.digest }}-

      - name: Package and time the single executable
        id: compile
        env:
          BUILD_TARGET: ${{ matrix.os }}-${{ matrix.arch }}
          COMPILER_CACHE_MATCH: ${{ steps.compiler-cache.outputs.cache-matched-key }}
          POSTGRES_CACHE_HIT: ${{ steps.pg-cache.outputs.cache-hit }}
        run: uv run --frozen --no-dev python scripts/measure_binary_build.py -- make build-cli-bin

      - name: Measure first and warm startup; verify niuu subcommands
        run: uv run --frozen --no-dev python scripts/measure_binary_build.py --startup dist/niuu-${{ matrix.os }}-${{ matrix.arch }}

      - name: Save Rust dependencies
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            .build-cache/pyapp-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Set up Node.js for the real agent runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the quick-start Claude CLI
        run: |
          npm ci --prefix containers/volundr/npm-tools
          echo "$GITHUB_WORKSPACE/containers/volundr/npm-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify quick start against the packaged executable
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run --frozen --no-dev python scripts/check_quickstart.py --niuu dist/niuu-${{ matrix.os }}-${{ matrix.arch }} --timings-output dist/timings/platform.json

      - name: Verify live quick-start inference when credentials are configured
        env:
          TMPDIR: ${{ runner.temp }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.NIUU_QUICKSTART_CLAUDE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            uv run --frozen --no-dev python scripts/check_quickstart.py \
              --niuu dist/niuu-${{ matrix.os }}-${{ matrix.arch }} --live
            echo "Live quick-start inference passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live inference NOT TESTED: configure NIUU_QUICKSTART_CLAUDE_TOKEN to enable it. Runtime startup and shutdown were tested separately." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain quick-start platform logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
          path: ${{ runner.temp }}/niuu-quickstart-*/platform.log
          if-no-files-found: warn

      - name: Upload artifact
        if: always() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: niuu-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
          compression-level: 0
          path: dist/niuu-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

      - name: Summarize build and startup measurements
        if: always()
        run: python3 scripts/measure_binary_build.py --summary dist/timings >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-build-${{ matrix.os }}-${{ matrix.arch }}
          overwrite: true
          path: |
            dist/timings/
            dist/toolchain.txt
            dist/launcher-timing.html
          if-no-files-found: warn
