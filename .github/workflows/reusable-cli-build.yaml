name: Compile Niuu binaries

on:
  workflow_call:
    secrets:
      NIUU_QUICKSTART_CLAUDE_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Shared CLI assets — build once, reuse in packaging jobs
  # ---------------------------------------------------------------------------
  build-cli-web-assets:
    name: Build CLI Web Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Build web assets for embedded CLI
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web-next
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          rm -rf src/cli/web/dist
          mkdir -p src/cli/web
          cp -r web-next/apps/niuu/dist src/cli/web/dist

      - name: Upload CLI web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-web-dist
          path: src/cli/web/dist

  # ---------------------------------------------------------------------------
  # CLI binaries
  # ---------------------------------------------------------------------------
  build-cli:
    name: "Build CLI (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [build-cli-web-assets]
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: "3.12"
      UV_FROZEN: "true"
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.build-cache/nuitka
      CCACHE_DIR: ${{ github.workspace }}/.build-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      NIUU_NUITKA_EXTRA_ARGS: --assume-yes-for-downloads --report=dist/compilation-report.xml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CLI web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cli-web-dist
          path: web-next/apps/niuu/dist

      - name: Verify CLI web assets
        run: test -f web-next/apps/niuu/dist/index.html

      - name: Restore PostgreSQL bundle cache
        id: pg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: build/pginstall
          key: pginstall-v2-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('src/niuu/pg_versions.py', 'scripts/build_postgres.sh') }}

      - name: Load PostgreSQL versions
        id: pg-versions
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          namespace = {}
          exec(open("src/niuu/pg_versions.py", encoding="utf-8").read(), namespace)
          print(f"postgres_version={namespace['POSTGRES_VERSION']}")
          print(f"pgvector_version={namespace['PGVECTOR_VERSION']}")
          PY

      - name: Install PostgreSQL extension build dependencies
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install openssl@3 pkg-config
          else
            sudo apt-get update
            sudo apt-get install -y libssl-dev pkg-config
          fi

      - name: Build embedded PostgreSQL bundle
        if: steps.pg-cache.outputs.cache-hit != 'true'
        env:
          POSTGRES_VERSION: ${{ steps.pg-versions.outputs.postgres_version }}
          PGVECTOR_VERSION: ${{ steps.pg-versions.outputs.pgvector_version }}
          INSTALL_PREFIX: build/pginstall
        run: scripts/build_postgres.sh

      - name: Install compiler cache
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

      - name: Install Linux ARM64 Nuitka toolchain
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "LDFLAGS=-fuse-ld=lld"
          } >> "$GITHUB_ENV"

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: --frozen --extra cli --extra dev

      - name: Identify compiler cache
        id: toolchain
        shell: bash
        run: |
          mkdir -p dist/timings
          {
            uv run --frozen python -c 'import sys; from importlib.metadata import version; print(sys.version); print("Nuitka", version("nuitka"))'
            "${CC:-cc}" --version
            ccache --version
            if [ "$RUNNER_OS" = "macOS" ]; then xcrun --show-sdk-version; fi
          } > dist/toolchain.txt
          cat dist/toolchain.txt
          echo "digest=$(shasum -a 256 dist/toolchain.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Nuitka and C compiler caches
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: .build-cache
          # Caches are immutable: a new key saves newly compiled objects every run.
          key: nuitka-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('uv.lock', 'src/cli/build.py', 'src/cli/*.yml', 'scripts/postgres_nuitka_plugin.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('uv.lock', 'src/cli/build.py', 'src/cli/*.yml', 'scripts/postgres_nuitka_plugin.py') }}-
            nuitka-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.toolchain.outputs.digest }}-

      - name: Compile and time the onefile binary
        id: compile
        env:
          BUILD_TARGET: ${{ matrix.os }}-${{ matrix.arch }}
          COMPILER_CACHE_MATCH: ${{ steps.compiler-cache.outputs.cache-matched-key }}
          POSTGRES_CACHE_HIT: ${{ steps.pg-cache.outputs.cache-hit }}
        shell: bash
        run: |
          ccache --zero-stats
          uv run --frozen python scripts/measure_compilation.py -- make build-cli-bin

      - name: Record compiler cache statistics
        if: always() && steps.compile.outcome != 'skipped'
        shell: bash
        run: |
          ccache --show-stats | tee dist/ccache-stats.txt
          ccache --print-stats > dist/ccache-stats.tsv
          {
            python3 scripts/measure_compilation.py --summary dist/timings
            echo '```text'
            cat dist/ccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save updated compiler caches
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: .build-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compilation-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/timings/
            dist/toolchain.txt
            dist/ccache-stats.*
            dist/compilation-report.xml
          if-no-files-found: warn

      - name: Set up Node.js for the real agent runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the quick-start Claude CLI
        run: |
          npm ci --prefix containers/volundr/npm-tools
          echo "$GITHUB_WORKSPACE/containers/volundr/npm-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify quick start against the compiled binary
        run: uv run python scripts/check_quickstart.py --niuu dist/niuu-${{ matrix.os }}-${{ matrix.arch }}

      - name: Verify live quick-start inference when credentials are configured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.NIUU_QUICKSTART_CLAUDE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            uv run python scripts/check_quickstart.py \
              --niuu dist/niuu-${{ matrix.os }}-${{ matrix.arch }} --live
            echo "Live quick-start inference passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live inference NOT TESTED: configure NIUU_QUICKSTART_CLAUDE_TOKEN to enable it. Runtime startup and shutdown were tested separately." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: niuu-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/niuu-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

