# Reusable: run Grype against container images and upload SARIF.
# Called by ci.yaml and dev.yaml after container manifests are published.
name: Reusable — Container Scan

on:
  workflow_call:
    inputs:
      containers:
        description: JSON array of container names to scan.
        type: string
        required: true
      tag:
        description: Tag to scan (same across all containers).
        type: string
        required: true
      registry:
        description: Container registry.
        type: string
        default: ghcr.io
      grype-version:
        type: string
        default: "0.87.0"

jobs:
  scan:
    name: "Scan: ${{ matrix.container }}"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        env:
          GRYPE_VERSION: ${{ inputs.grype-version }}
        run: |
          set -euo pipefail

          install_grype() {
            curl --retry 5 --retry-all-errors --retry-delay 2 -sSfL \
              https://raw.githubusercontent.com/anchore/grype/247f5d72abf2131aa37f3164a98495c121b29029/install.sh \
              | sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"
          }

          for attempt in 1 2 3; do
            if install_grype; then
              grype version
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 5))
          done

          grype version

      - name: Scan container with Grype
        run: |
          grype "${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ inputs.tag }}" \
            --only-fixed \
            --fail-on critical \
            -o sarif > "grype-${{ matrix.container }}.sarif"

      - name: Detect Grype results
        id: sarif
        if: always()
        run: |
          if [ -f "grype-${{ matrix.container }}.sarif" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always() && steps.sarif.outputs.present == 'true'
        with:
          sarif_file: grype-${{ matrix.container }}.sarif
          category: grype-${{ matrix.container }}
