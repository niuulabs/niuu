# Reusable: run Grype against container images and upload SARIF.
# Called by ci.yaml and dev.yaml after container manifests are published.
name: Reusable — Container Scan

on:
  workflow_call:
    inputs:
      containers:
        description: JSON array of container names to scan.
        type: string
        required: true
      tag:
        description: Tag to scan (same across all containers).
        type: string
        required: true
      registry:
        description: Container registry.
        type: string
        default: ghcr.io
      grype-version:
        type: string
        default: "0.118.0"

permissions:
  contents: read

jobs:
  scan:
    name: "Scan: ${{ matrix.container }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Grype
        env:
          GRYPE_VERSION: ${{ inputs.grype-version }}
        run: |
          set -euo pipefail

          install_grype() {
            curl --retry 5 --retry-all-errors --retry-delay 2 -sSfL \
              https://raw.githubusercontent.com/anchore/grype/247f5d72abf2131aa37f3164a98495c121b29029/install.sh \
              | sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"
          }

          for attempt in 1 2 3; do
            if install_grype; then
              grype version
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 5))
          done

          grype version

      - name: Scan container with Grype
        env:
          IMAGE: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ inputs.tag }}
          CONTAINER: ${{ matrix.container }}
        run: bash containers/python-security/scan.sh "$IMAGE" "$CONTAINER"

      - name: Preserve scan and backport evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-evidence-${{ matrix.container }}
          path: |
            grype-${{ matrix.container }}-*.json
            python-security-${{ matrix.container }}*.json
          retention-days: 30

      - name: Detect Grype results
        id: sarif
        if: always()
        run: |
          if [ -f "grype-${{ matrix.container }}.sarif" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && steps.sarif.outputs.present == 'true'
        with:
          sarif_file: grype-${{ matrix.container }}.sarif
          category: grype-${{ matrix.container }}
