# Reusable: web-next/ lint and vitest.
# Called by ci.yaml when web-next/ changed.
name: Reusable — web-next Lint + Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: "web-next: Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No package build: ESLint is untyped and Prettier reads sources only.
      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: |
          output="$(pnpm format:check 2>&1)" || {
            printf '%s\n' "$output"
            files="$(pnpm exec prettier --list-different \
              "**/*.{ts,tsx,js,jsx,css,md,json,yaml,yml}" 2>&1 || true)"
            printf '%s\n' "$files" | while IFS= read -r file; do
              echo "::error file=${file}::Prettier formatting required"
            done
            files="${files//'%'/'%25'}"
            files="${files//$'\n'/'%0A'}"
            files="${files//$'\r'/'%0D'}"
            echo "::error title=Prettier files::${files}"
            pnpm exec prettier --write \
              "**/*.{ts,tsx,js,jsx,css,md,json,yaml,yml}" >/dev/null
            diff_output="$(git diff -- .)"
            diff_output="${diff_output//'%'/'%25'}"
            diff_output="${diff_output//$'\n'/'%0A'}"
            diff_output="${diff_output//$'\r'/'%0D'}"
            echo "::error title=Prettier diff::${diff_output}"
            exit 1
          }

  typecheck:
    name: "web-next: Typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No package build: tsconfig.base.json maps every @niuulabs/* import to
      # its src entry, so tsc never reads dist/. Package builds are still proven
      # by the consumer E2E job and the container images.
      - name: Typecheck
        run: pnpm typecheck

  test-shard:
    name: "web-next: Test shard ${{ matrix.shard }}/3"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Disables the per-process coverage gate; see vitest.config.ts.
      VITEST_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No package build: vitest.config.ts aliases every @niuulabs/* package to
      # its src/index.ts, so the suite never reads dist/.
      - name: Run test shard
        run: >-
          pnpm exec vitest run --coverage
          --reporter=default --reporter=blob
          --shard=${{ matrix.shard }}/3

      - name: Upload shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-next-vitest-blob-${{ matrix.shard }}
          path: web-next/.vitest/blob/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Keeps the required check name. Merges the shard reports and enforces the
  # 85% coverage gate on the combined result.
  test:
    name: "web-next: Test"
    needs: test-shard
    # always(): a job skipped because a shard failed would report "skipped",
    # which branch rules accept as passing. Run and fail instead.
    if: always()
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require every shard to have passed
        if: needs.test-shard.result != 'success'
        working-directory: .
        run: |
          echo "::error title=Web test failure::test shards finished with result '${{ needs.test-shard.result }}'"
          exit 1

      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: web-next-vitest-blob-*
          path: web-next/.vitest/blob
          merge-multiple: true

      - name: Merge reports and enforce coverage (fail under 85%)
        run: |
          set -o pipefail
          set +e
          output_file="$(mktemp)"
          pnpm exec vitest run --merge-reports --coverage 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure_output="$(grep -E 'All files|ERROR: Coverage' "$output_file" || true)"
            if [[ -f coverage/lcov.info ]]; then
              set +o pipefail
              branch_output="$(awk -F: '
                /^SF:/ { file = substr($0, 4) }
                /^BRF:/ { total = $2 }
                /^BRH:/ {
                  covered = $2
                  if (total > 0) printf "%.2f%% (%d/%d) %s\n", 100 * covered / total, covered, total, file
                }
              ' coverage/lcov.info | sort -n | head -n 20)"
              set -o pipefail
              failure_output+=$'\nLowest per-file branch coverage:\n'
              failure_output+="$branch_output"
            fi
            failure_output+=$'\n'
            failure_output+="$(tail -n 25 "$output_file")"
            failure_output="${failure_output//'%'/'%25'}"
            failure_output="${failure_output//$'\n'/'%0A'}"
            failure_output="${failure_output//$'\r'/'%0D'}"
            echo "::error title=Web test failure::${failure_output}"
          fi
          exit "$status"

      - name: Upload coverage to Codecov
        if: always() && hashFiles('web-next/coverage/lcov.info') != ''
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          files: web-next/coverage/lcov.info
          flags: web-next
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: web-next
