# Reusable: web-next/ lint, vitest, and Playwright E2E.
# Called by ci.yaml when web-next/ changed.
name: Reusable — web-next Lint + Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: "web-next: Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          output="$(pnpm -r --filter='./packages/*' build 2>&1)" || {
            printf '%s\n' "$output"
            annotation="${output: -3500}"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\n'/'%0A'}"
            annotation="${annotation//$'\r'/'%0D'}"
            echo "::error title=Web package build::${annotation}"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: |
          output="$(pnpm format:check 2>&1)" || {
            printf '%s\n' "$output"
            files="$(pnpm exec prettier --list-different \
              "**/*.{ts,tsx,js,jsx,css,md,json,yaml,yml}" 2>&1 || true)"
            printf '%s\n' "$files" | while IFS= read -r file; do
              echo "::error file=${file}::Prettier formatting required"
            done
            files="${files//'%'/'%25'}"
            files="${files//$'\n'/'%0A'}"
            files="${files//$'\r'/'%0D'}"
            echo "::error title=Prettier files::${files}"
            pnpm exec prettier --write \
              "**/*.{ts,tsx,js,jsx,css,md,json,yaml,yml}" >/dev/null
            diff_output="$(git diff -- .)"
            diff_output="${diff_output//'%'/'%25'}"
            diff_output="${diff_output//$'\n'/'%0A'}"
            diff_output="${diff_output//$'\r'/'%0D'}"
            echo "::error title=Prettier diff::${diff_output}"
            exit 1
          }

  test:
    name: "web-next: Test"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter='./packages/*' build

      - name: Run tests with coverage (fail under 85%)
        run: |
          set -o pipefail
          set +e
          output_file="$(mktemp)"
          pnpm test 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            failure_output="$(grep -E 'All files|ERROR: Coverage' "$output_file" || true)"
            if [[ -f coverage/lcov.info ]]; then
              set +o pipefail
              branch_output="$(awk -F: '
                /^SF:/ { file = substr($0, 4) }
                /^BRF:/ { total = $2 }
                /^BRH:/ {
                  covered = $2
                  if (total > 0) printf "%.2f%% (%d/%d) %s\n", 100 * covered / total, covered, total, file
                }
              ' coverage/lcov.info | sort -n | head -n 20)"
              set -o pipefail
              failure_output+=$'\nLowest per-file branch coverage:\n'
              failure_output+="$branch_output"
            fi
            failure_output+=$'\n'
            failure_output+="$(tail -n 25 "$output_file")"
            failure_output="${failure_output//'%'/'%25'}"
            failure_output="${failure_output//$'\n'/'%0A'}"
            failure_output="${failure_output//$'\r'/'%0D'}"
            echo "::error title=Web test failure::${failure_output}"
          fi
          exit "$status"

      - name: Upload coverage to Codecov
        if: always() && hashFiles('web-next/coverage/lcov.info') != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          files: web-next/coverage/lcov.info
          flags: web-next
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: web-next

  e2e:
    name: "web-next: E2E"
    if: false # Temporarily disabled — re-enable when visual baselines are stabilized
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter='./packages/*' build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests (including visual regression)
        run: echo "E2E skipped"

      - name: Upload Playwright report (with visual diffs on failure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: web-next-playwright-report
          path: web-next/playwright-report/
          retention-days: 7
