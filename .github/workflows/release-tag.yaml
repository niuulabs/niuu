# Runs on every push to main, and can also be triggered manually:
# 1. Builds all container images with "latest" + SHA tags (always)
# 2. Determines version from conventional commits and creates a v* tag (conditional)
# 3. On manual runs, lets maintainers force a semver bump or an exact version tag
#
# The v* tag triggers release.yaml which builds versioned artifacts.
# Uses a GitHub App (Volundr Release Bot) to push tags to protected branches.
# Required secrets: APP_ID, APP_PRIVATE_KEY
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Bump to apply when creating a tag manually"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      version_override:
        description: "Optional exact version to tag (e.g. 0.74.0). Overrides version_bump."
        required: false
        type: string

permissions: read-all

env:
  REGISTRY: ghcr.io

concurrency:
  group: main-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Containers — build per platform natively, then merge manifests
  # ---------------------------------------------------------------------------
  build-container-image:
    name: "Build ${{ matrix.container }} (${{ matrix.platform }})"
    if: github.event_name == 'push'
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [amd64, arm64]
        container: [agent, skuld, openshell, devrunner, volundr-web, niuu-web, niuu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./containers/${{ matrix.container }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ github.sha }}-${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=${{ matrix.container }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Niuu Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.container }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.container }}-${{ matrix.platform }}
          platforms: linux/${{ matrix.platform }}
          provenance: false

  merge-container-manifests:
    name: "Manifest ${{ matrix.container }}"
    if: github.event_name == 'push'
    needs: build-container-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        container: [agent, skuld, openshell, devrunner, volundr-web, niuu-web, niuu]
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          # latest
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
          docker manifest push "${IMAGE}:latest"

          # short sha
          docker manifest create "${IMAGE}:${SHORT_SHA}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
          docker manifest push "${IMAGE}:${SHORT_SHA}"

  # ---------------------------------------------------------------------------
  # Version tagging
  # ---------------------------------------------------------------------------
  tag:
    name: Determine Version & Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine version bump
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "Manual tag creation must run from the main branch." >&2
            exit 1
          fi

          # Get the last stable release tag or use 0.0.0 if none exists
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -v -- '-' | head -1 || true)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          LAST_VERSION=${LAST_TAG#v}
          INPUT_BUMP="${{ inputs.version_bump || 'auto' }}"
          INPUT_VERSION="${{ inputs.version_override || '' }}"

          if [ -n "$INPUT_VERSION" ]; then
            INPUT_VERSION="${INPUT_VERSION#v}"
            if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version_override must be a semver like 0.74.0 or v0.74.0" >&2
              exit 1
            fi
            if git rev-parse "v${INPUT_VERSION}" >/dev/null 2>&1; then
              echo "Tag v${INPUT_VERSION} already exists." >&2
              exit 1
            fi

            echo "Last version: $LAST_VERSION"
            echo "Manual version override: $INPUT_VERSION"
            echo "Version bump type: manual"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "new_version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "version_type=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Collect commit subjects since last tag, skipping merge commits.
          # This ensures version detection works regardless of merge strategy
          # (merge commit, squash, rebase) by looking at the actual feature
          # commits rather than the merge commit message.
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMIT_SUBJECTS=$(git log --no-merges --pretty=format:"%s" HEAD)
          else
            COMMIT_SUBJECTS=$(git log --no-merges --pretty=format:"%s" ${LAST_TAG}..HEAD)
          fi

          echo "Last version: $LAST_VERSION"
          echo "Commit subjects since last release:"
          echo "$COMMIT_SUBJECTS"
          echo "---"

          # Determine version bump type from conventional commit subjects
          VERSION_TYPE="none"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT_BUMP" != "auto" ]; then
            VERSION_TYPE="$INPUT_BUMP"
          else
            if echo "$COMMIT_SUBJECTS" | grep -qiE "^feat(\(.+\))?!:|^BREAKING CHANGE:"; then
              VERSION_TYPE="major"
            elif echo "$COMMIT_SUBJECTS" | grep -qiE "^(feat|refactor)(\(.+\))?:"; then
              VERSION_TYPE="minor"
            elif echo "$COMMIT_SUBJECTS" | grep -qiE "^(fix|style)(\(.+\))?:"; then
              VERSION_TYPE="patch"
            fi
          fi

          echo "Version bump type: $VERSION_TYPE"

          if [ "$VERSION_TYPE" = "none" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Calculate new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          case $VERSION_TYPE in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Summarize tag decision
        if: always()
        run: |
          {
            echo "## Release Tag"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Should release: ${{ steps.version.outputs.should_release || 'false' }}"
            echo "- Version type: ${{ steps.version.outputs.version_type || 'none' }}"
            echo "- Version: ${{ steps.version.outputs.new_version || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
