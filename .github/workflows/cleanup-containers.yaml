# Garbage-collects PR container images and PR Helm charts older than 2 days.
# Runs daily at 03:00 UTC.
#
# A container version is deleted only when every tag on it starts with pr-.
# A digest built on a PR can also carry other tags (dev-<sha>, dev, a
# release tag) once it is promoted, and deploys pin those digests, so a
# version with any other tag is kept. Untagged versions (the per-platform
# children of a multi-arch index) have no tags and are never touched here.
name: Cleanup Dev Packages

on:
  schedule:
    - cron: "0 3 * * *"

permissions: read-all

jobs:
  cleanup-containers:
    name: "Clean stale containers: ${{ matrix.container }}"
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        container:
          - agent
          - skuld
          - openshell
          - devrunner
          - volundr-web
          - niuu-web
          - niuu
          - gbrain
    steps:
      - name: Delete stale PR container versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const container = '${{ matrix.container }}';
            const cutoff = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);

            const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
              package_type: 'container',
              package_name: container,
              org: owner,
              per_page: 100,
            }).catch(() => ({ data: [] }));

            let deleted = 0;
            for (const version of versions.data) {
              const tags = version.metadata?.container?.tags || [];
              const isPr = tags.some(t => t.startsWith('pr-'));
              const isOld = new Date(version.updated_at) < cutoff;
              const kept = tags.filter(t => !t.startsWith('pr-'));

              if (isPr && isOld && kept.length > 0) {
                console.log(`Keeping ${container}@${version.id}: also tagged ${kept.join(', ')}`);
                continue;
              }

              if (isPr && isOld) {
                console.log(`Deleting ${container}@${version.id} (tags: ${tags.join(', ')}, updated: ${version.updated_at})`);
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: container,
                  org: owner,
                  package_version_id: version.id,
                }).catch(e => console.log(`  Failed: ${e.message}`));
                deleted++;
              }
            }
            console.log(`Deleted ${deleted} stale versions of ${container}`);

  cleanup-charts:
    name: "Clean stale charts: ${{ matrix.chart }}"
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        chart:
          - charts/agent
          - charts/ravn
          - charts/skuld
          - charts/volundr
          - charts/ting
          - charts/niuu-shared
          - charts/niuu
    steps:
      - name: Delete stale PR chart versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const chart = '${{ matrix.chart }}';
            const cutoff = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);

            const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
              package_type: 'container',
              package_name: chart,
              org: owner,
              per_page: 100,
            }).catch(() => ({ data: [] }));

            let deleted = 0;
            for (const version of versions.data) {
              const tags = version.metadata?.container?.tags || [];
              const isPr = tags.some(t => t.match(/^0\.0\.0-pr\./));
              const isOld = new Date(version.updated_at) < cutoff;

              if (isPr && isOld) {
                console.log(`Deleting ${chart}@${version.id} (tags: ${tags.join(', ')}, updated: ${version.updated_at})`);
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: chart,
                  org: owner,
                  package_version_id: version.id,
                }).catch(e => console.log(`  Failed: ${e.message}`));
                deleted++;
              }
            }
            console.log(`Deleted ${deleted} stale versions of ${chart}`);
