name: CI

on:
  pull_request:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Change detection + pipeline tier
  #
  # Self-rolled path filter: we diff the PR head against its base and derive
  # per-area flags. Full-tier PRs (anything targeting dev/main rather than
  # feat/*, codex/*, or claude/*) deliberately run the full surface regardless
  # of the fine-grained diff so that heavyweight validation cannot be skipped
  # by a bad classifier.
  #
  # Light-tier PRs still use the diff to keep inner-loop checks fast.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web_next: ${{ steps.filter.outputs.web_next }}
      helm: ${{ steps.filter.outputs.helm }}
      container-names: ${{ steps.filter.outputs.names }}
      has_containers: ${{ steps.filter.outputs.any }}
      tier: ${{ steps.tier.outputs.level }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect path changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          base_ref = os.environ.get("BASE_REF", "")
          light_prefixes = ("feat/", "codex/", "claude/")
          full_tier = not base_ref.startswith(light_prefixes)

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha, head_sha],
              text=True,
          ).splitlines()

          print("Changed files:")
          for path in changed:
              print(f"  {path}")

          def matches(pattern: str) -> bool:
              regex = re.compile(pattern)
              return any(regex.search(path) for path in changed)

          all_containers = ["skuld", "devrunner", "volundr-web", "niuu-web", "niuu"]

          if full_tier:
              outputs = {
                  "python": "true",
                  "web_next": "true",
                  "helm": "true",
                  "names": json.dumps(all_containers),
                  "any": "true",
              }
              print("Full-tier PR detected; enabling Python, web-next, Helm, and container jobs.")
          else:
              python_changed = matches(r"^(src|tests)/|^pyproject\.toml$|^uv\.lock$")
              web_changed = matches(r"^web-next/")
              helm_changed = matches(r"^charts/")
              container_triggers = {
                  "skuld": r"^containers/skuld/|^(src/|pyproject\.toml$|uv\.lock$)",
                  "devrunner": r"^containers/devrunner/",
                  "volundr-web": r"^containers/volundr-web/|^web-next/",
                  "niuu-web": r"^containers/niuu-web/|^web-next/",
                  "niuu": r"^containers/niuu/|^(src/|pyproject\.toml$|uv\.lock$)",
              }
              container_names = [
                  name for name, pattern in container_triggers.items() if matches(pattern)
              ]
              outputs = {
                  "python": "true" if python_changed else "false",
                  "web_next": "true" if web_changed else "false",
                  "helm": "true" if helm_changed else "false",
                  "names": json.dumps(container_names),
                  "any": "true" if container_names else "false",
              }

          print("Computed outputs:")
          for key, value in outputs.items():
              print(f"  {key}={value}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key, value in outputs.items():
                  fh.write(f"{key}={value}\n")
          PY

      - name: Determine pipeline tier
        id: tier
        run: |
          # PRs targeting feat/* branches run a light pipeline (lint + unit tests).
          # PRs targeting dev or main run the full pipeline.
          BASE="${{ github.base_ref }}"
          if [[ "$BASE" == feat/* || "$BASE" == codex/* || "$BASE" == claude/* ]]; then
            echo "level=light" >> $GITHUB_OUTPUT
            echo "Pipeline tier: light (PR targets ${BASE})"
          else
            echo "level=full" >> $GITHUB_OUTPUT
            echo "Pipeline tier: full (PR targets ${BASE})"
          fi

  # ---------------------------------------------------------------------------
  # Python — lint + unit tests (all tiers). Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/reusable-python-lint-test.yaml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Python integration tests — run at both tiers when python changed.
  # These are fast (~6 min, real services via GHA service containers) and
  # catch integration bugs before they reach dev. E2E + container-heavy jobs
  # remain full-tier only.
  # ---------------------------------------------------------------------------
  python-integration-test-volundr:
    name: "Python: Integration Test Volundr"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volundr_test
          POSTGRES_PASSWORD: volundr_test
          POSTGRES_DB: volundr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: volundr_test
          TEST_DATABASE_PASSWORD: volundr_test
          TEST_DATABASE_NAME: volundr_test
        run: |
          uv run pytest tests/integration/volundr/ -v --tb=short -m integration \
            --override-ini="addopts="

  python-integration-test-tyr:
    name: "Python: Integration Test Tyr"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volundr_test
          POSTGRES_PASSWORD: volundr_test
          POSTGRES_DB: volundr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Run integration tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: volundr_test
          TEST_DATABASE_PASSWORD: volundr_test
          TEST_DATABASE_NAME: volundr_test
        run: |
          uv run pytest tests/integration/tyr/ -v --tb=short -m integration \
            --override-ini="addopts="

  python-integration-test-sleipnir:
    name: "Python: Integration Test Sleipnir"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # NATS requires --jetstream flag which GHA service containers can't pass.
      # Start it manually with docker run instead.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine --jetstream --http_port 8222
          for i in $(seq 1 10); do
            curl -sf http://localhost:8222/healthz > /dev/null 2>&1 && break || sleep 1
          done

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          extras: "--extra test --extra nats --extra rabbitmq --extra redis --dev"

      - name: Run Sleipnir broker integration tests
        env:
          TEST_NATS_URL: "nats://localhost:4222"
          TEST_RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
          TEST_REDIS_URL: "redis://localhost:6379"
        run: |
          uv run pytest tests/integration/sleipnir/ -v --tb=short -m broker \
            --override-ini="addopts="

  # ---------------------------------------------------------------------------
  # End-to-end tests — full tier only
  # ---------------------------------------------------------------------------
  e2e-test:
    name: "E2E: Playwright"
    needs: changes
    if: needs.changes.outputs.tier == 'full' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.web_next == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volundr_test
          POSTGRES_PASSWORD: volundr_test
          POSTGRES_DB: volundr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env

      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web-next

      - name: Build workspace packages for dev-mode resolution
        run: pnpm -r --filter='./packages/*' build
        working-directory: web-next

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web-next

      - name: Start backend
        env:
          DATABASE__HOST: localhost
          DATABASE__PORT: "5432"
          DATABASE__USER: volundr_test
          DATABASE__PASSWORD: volundr_test
          DATABASE__NAME: volundr_test
        run: |
          uv run uvicorn volundr.main:app --port 8080 &

      - name: Wait for backend
        run: |
          timeout 30 bash -c '
            until curl -sf http://localhost:8080/health > /dev/null 2>&1; do
              sleep 1
            done
          '
          echo "Backend is ready"

      - name: Run Playwright tests
        run: pnpm test:e2e
        working-directory: web-next

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: web-next-playwright-report
          path: web-next/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # web-next — composable plugin UI. Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  web-next:
    name: web-next
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    uses: ./.github/workflows/reusable-web-next-lint-test.yaml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # web-next — publish dry-run (verifies all @niuulabs/* packages are publishable)
  # ---------------------------------------------------------------------------
  web-next-publish-dryrun:
    name: "web-next: Publish dry-run"
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter='./packages/*' build

      - name: Dry-run publish all @niuulabs/* packages
        # --no-git-checks skips the "working dir must be clean" guard.
        # --dry-run stops before actually pushing to the registry.
        # workspace:* deps are resolved to version numbers before packaging.
        run: pnpm publish -r --filter='./packages/*' --no-git-checks --dry-run

  # ---------------------------------------------------------------------------
  # web-next — consumer E2E (proves the composability loop externally)
  # ---------------------------------------------------------------------------
  web-next-consumer-e2e:
    name: "web-next: Consumer E2E"
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: web-next
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: web-next
        run: pnpm -r --filter='./packages/*' build

      - name: Pack all @niuulabs/* packages
        # pnpm pack converts workspace:* → resolved version numbers in the tarball.
        # All tarballs land in web-next/.packed/ so the install step can glob them.
        run: |
          PACK_DIR="$GITHUB_WORKSPACE/web-next/.packed"
          mkdir -p "$PACK_DIR"
          for pkg_dir in web-next/packages/*/; do
            (cd "$pkg_dir" && pnpm pack --pack-destination "$PACK_DIR")
          done
          echo "Packed tarballs:"
          ls -1 "$PACK_DIR"

      - name: Copy consumer app into isolated temp directory
        run: |
          rm -rf "$RUNNER_TEMP/consumer-app"
          cp -R "$GITHUB_WORKSPACE/web-next/consumer-app" "$RUNNER_TEMP/consumer-app"

      - name: Install consumer app from local tarballs
        # Rewrite the consumer app's @niuulabs/* dependencies to explicit file:
        # tarballs before installation so pnpm never tries to resolve the
        # GitHub Packages publishConfig registry during the external-consumer
        # proof.
        working-directory: ${{ runner.temp }}/consumer-app
        run: |
          PACK_DIR="$GITHUB_WORKSPACE/web-next/.packed"
          PACK_DIR="$PACK_DIR" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const packDir = process.env.PACK_DIR;
          const packageJsonPath = path.join(process.cwd(), "package.json");
          const pkg = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          const packagesDir = path.join(process.env.GITHUB_WORKSPACE, "web-next", "packages");
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};

          for (const packageDir of fs.readdirSync(packagesDir)) {
            const sourcePackageJson = path.join(packagesDir, packageDir, "package.json");
            const sourcePkg = JSON.parse(fs.readFileSync(sourcePackageJson, "utf8"));
            const tarball = fs
              .readdirSync(packDir)
              .find((file) => file.startsWith(`niuulabs-${packageDir}-`) && file.endsWith(".tgz"));
            if (!tarball) {
              throw new Error(`Missing packed tarball for ${sourcePkg.name}`);
            }
            const tarballPath = path.join(packDir, tarball).split(path.sep).join(path.posix.sep);
            pkg.pnpm.overrides[sourcePkg.name] = `file:${tarballPath}`;
            if (pkg.dependencies?.[sourcePkg.name]) {
              pkg.dependencies[sourcePkg.name] = `file:${tarballPath}`;
            }
          }

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ${{ runner.temp }}/consumer-app
        run: npx playwright install --with-deps chromium

      - name: Run consumer Playwright tests
        working-directory: ${{ runner.temp }}/consumer-app
        run: npx playwright test

      - name: Upload consumer Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: consumer-playwright-report
          path: ${{ runner.temp }}/consumer-app/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Helm lint — full tier only. Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    needs: changes
    uses: ./.github/workflows/reusable-helm-lint.yaml
    with:
      run_lint: ${{ needs.changes.outputs.tier == 'full' && needs.changes.outputs.helm == 'true' }}

  # ---------------------------------------------------------------------------
  # Helm — smoke test (kind cluster) — full tier only
  # ---------------------------------------------------------------------------
  helm-smoke-test:
    name: "Helm: Smoke Test"
    needs: [changes, containers]
    if: needs.changes.outputs.tier == 'full' && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Helm
        run: |
          HELM_VERSION="3.14.0"
          curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          echo "f43e1c3387de24547506ab05d24e5309c0ce0b228c23bd8aa64e9ec4b8206651  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ci-test

      - name: Install Postgres in cluster
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm install pg bitnami/postgresql \
            --set auth.postgresPassword=test \
            --set auth.database=volundr \
            --set primary.persistence.enabled=false \
            --set primary.initdb.scripts."init\.sql"="CREATE DATABASE tyr;" \
            --wait --timeout 120s

      - name: Create registry pull secret in kind
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Volundr chart
        run: |
          helm install volundr charts/volundr/ \
            -f charts/volundr/ci-values.yaml \
            --set global.imagePullSecrets[0]=ghcr-pull-secret \
            --set image.tag="pr-${{ github.event.number }}" \
            --wait --timeout 120s

      - name: Install Tyr chart
        run: |
          helm install tyr charts/tyr/ \
            -f charts/tyr/ci-values.yaml \
            --set global.imagePullSecrets[0]=ghcr-pull-secret \
            --set image.tag="pr-${{ github.event.number }}" \
            --wait --timeout 120s

      - name: Install Skuld chart
        run: |
          helm install skuld charts/skuld/ \
            -f charts/skuld/ci-values.yaml \
            --set global.imagePullSecrets[0]=ghcr-pull-secret \
            --set image.tag="pr-${{ github.event.number }}" \
            --wait --timeout 120s

      - name: Verify Volundr pods are ready
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=volundr --timeout=60s

      - name: Verify Tyr pods are ready
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=tyr --timeout=60s

      - name: Verify Skuld pods are ready
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=skuld --timeout=60s

      - name: Health check Volundr
        run: |
          kubectl port-forward svc/volundr 8080:80 &
          PF_PID=$!
          sleep 3
          curl -sf http://localhost:8080/health
          kill $PF_PID || true

      - name: Health check Tyr
        run: |
          kubectl port-forward svc/tyr 8081:80 &
          PF_PID=$!
          sleep 3
          curl -sf http://localhost:8081/health
          kill $PF_PID || true

      - name: Verify Kubernetes resources
        run: |
          echo "--- ConfigMaps ---"
          kubectl get configmaps -l app.kubernetes.io/managed-by=Helm
          echo "--- Secrets ---"
          kubectl get secrets -l app.kubernetes.io/managed-by=Helm
          echo "--- ServiceAccounts ---"
          kubectl get serviceaccounts -l app.kubernetes.io/managed-by=Helm
          echo "--- Services ---"
          kubectl get services
          echo "--- Pods ---"
          kubectl get pods -o wide

      - name: Dump pod logs on failure
        if: failure()
        run: |
          echo "=== Volundr logs ==="
          kubectl logs -l app.kubernetes.io/name=volundr --tail=50 || true
          echo "=== Tyr logs ==="
          kubectl logs -l app.kubernetes.io/name=tyr --tail=50 || true
          echo "=== Skuld logs ==="
          kubectl logs -l app.kubernetes.io/name=skuld --all-containers --tail=50 || true
          echo "=== Events ==="
          kubectl get events --sort-by=.lastTimestamp | tail -30 || true

  # ---------------------------------------------------------------------------
  # Containers — full tier only. PR builds are amd64-only to keep the
  # critical path short; arm64 is built on push-to-dev/main (see dev.yaml).
  # ---------------------------------------------------------------------------
  containers:
    name: Containers
    needs: changes
    if: needs.changes.outputs.tier == 'full' && needs.changes.outputs.has_containers == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-build.yaml
    with:
      containers: ${{ needs.changes.outputs.container-names }}
      platforms: '["amd64"]'
      tag-prefix: pr-${{ github.event.number }}
      manifest-tags: "pr-${{ github.event.number }} pr-${{ github.event.number }}-${{ github.sha }}"
      labels: |
        dev.volundr.pr=${{ github.event.number }}
        dev.volundr.ephemeral=true

  # ---------------------------------------------------------------------------
  # Helm charts — PR versions — full tier only
  # ---------------------------------------------------------------------------
  build-charts:
    name: Build Helm Charts
    needs: changes
    if: needs.changes.outputs.tier == 'full' && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Helm
        run: |
          HELM_VERSION="3.14.0"
          curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          echo "f43e1c3387de24547506ab05d24e5309c0ce0b228c23bd8aa64e9ec4b8206651  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Update chart versions
        run: |
          VERSION="0.0.0-pr.${{ github.event.number }}"

          for CHART in bifrost ravn skuld volundr tyr niuu-shared niuu; do
            sed -i "s/^version:.*/version: $VERSION/" "charts/${CHART}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" "charts/${CHART}/Chart.yaml"
          done

      - name: Package Helm charts
        run: |
          helm package charts/bifrost -d .helm-packages/
          helm package charts/ravn -d .helm-packages/
          helm package charts/skuld -d .helm-packages/
          helm package charts/volundr -d .helm-packages/
          helm package charts/tyr -d .helm-packages/
          helm package charts/niuu-shared -d .helm-packages/
          rm -f charts/niuu/Chart.lock
          helm dependency update charts/niuu
          helm package charts/niuu -d .helm-packages/

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm charts to OCI registry
        run: |
          helm push .helm-packages/bifrost-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push .helm-packages/ravn-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push .helm-packages/skuld-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push .helm-packages/volundr-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push .helm-packages/tyr-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push .helm-packages/niuu-shared-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push .helm-packages/niuu-0*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  # ---------------------------------------------------------------------------
  # Security — container vulnerability scanning — full tier only.
  # Delegated to reusable workflow.
  # ---------------------------------------------------------------------------
  scan:
    name: Scan
    needs: [changes, containers]
    if: needs.changes.outputs.tier == 'full' && needs.changes.outputs.has_containers == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/reusable-container-scan.yaml
    with:
      containers: ${{ needs.changes.outputs.container-names }}
      tag: pr-${{ github.event.number }}

  # ---------------------------------------------------------------------------
  # Security (always runs)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          # npm 11.13.0 is the current pinned bootstrap version and still bundles
          # this advisory through its internal socks -> ip-address dependency chain.
          # Keep dependency review strict elsewhere while allowing this upstream-only case.
          allow-ghsas: GHSA-v2v4-37r5-5v8g
