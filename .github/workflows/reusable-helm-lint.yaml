# Reusable: helm lint for every chart under charts/.
# Called by ci.yaml and dev.yaml.
name: Reusable — Helm Lint

on:
  workflow_call:
    inputs:
      run_lint:
        description: "Whether this invocation should run chart linting or no-op successfully."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: "Helm: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        if: inputs.run_lint
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.0

      - name: Skip lint when charts are unchanged
        if: ${{ !inputs.run_lint }}
        run: echo "No chart changes detected for this workflow run; reporting success for the required Helm check."

      - name: Lint leaf charts
        if: inputs.run_lint
        run: |
          for chart in skuld volundr ting skuld-planner niuu-shared bifrost; do
            echo "::group::helm lint $chart"
            helm lint "charts/${chart}/"
            echo "::endgroup::"
          done

      - name: Lint Bifrost Switchyard values
        if: inputs.run_lint
        run: helm lint charts/bifrost -f charts/bifrost/values-switchyard-nemotron.yaml

      - name: Lint Mímir chart
        if: inputs.run_lint
        run: helm lint charts/mimir --set config.backend.mcpUrl=http://gbrain:3131/mcp --set config.backend.apiTokenSecret.name=gbrain-token

      - name: Lint gbrain chart
        if: inputs.run_lint
        run: helm lint charts/gbrain --set image.repository=ghcr.io/niuulabs/gbrain --set existingSecret=gbrain-runtime

      - name: Lint niuu umbrella chart
        if: inputs.run_lint
        run: |
          helm dependency build charts/niuu
          helm lint charts/niuu/
