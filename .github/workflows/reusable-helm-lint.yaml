# Reusable: helm lint for every chart under charts/.
# Called by ci.yaml and dev.yaml.
name: Reusable — Helm Lint

on:
  workflow_call:
    inputs:
      run_lint:
        description: "Whether this invocation should run chart linting or no-op successfully."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: "Helm: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        if: inputs.run_lint
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Skip lint when charts are unchanged
        if: ${{ !inputs.run_lint }}
        run: echo "No chart changes detected for this workflow run; reporting success for the required Helm check."

      - name: Lint leaf charts
        if: inputs.run_lint
        run: |
          for chart in agent ravn skuld volundr ting skuld-planner niuu-shared; do
            echo "::group::helm lint $chart"
            helm lint "charts/${chart}/"
            echo "::endgroup::"
          done

      - name: Lint niuu umbrella chart
        if: inputs.run_lint
        run: |
          helm dependency build charts/niuu
          helm lint charts/niuu/
