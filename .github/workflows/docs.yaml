name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
      - "scripts/build_docs_bundle.py"
      - "src/volundr/adapters/inbound/rest*.py"
      - "scripts/extract_openapi.py"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
      - "scripts/build_docs_bundle.py"
      - "src/volundr/adapters/inbound/rest*.py"
      - "scripts/extract_openapi.py"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    outputs:
      deploy_enabled: ${{ steps.mode.outputs.deploy_enabled }}
      preview_url: ${{ steps.mode.outputs.preview_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          extras: "--extra dev"

      - name: Decide deploy mode
        id: mode
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          echo "preview_url=" >> "$GITHUB_OUTPUT"

      - name: Build combined site
        run: |
          set -euo pipefail

          uv run python scripts/build_docs_bundle.py \
            --output-dir _site \
            --root-ref HEAD

      - name: Upload artifact
        if: steps.mode.outputs.deploy_enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Summarize preview URL
        if: steps.mode.outputs.preview_url != ''
        run: |
          echo "Preview published at: ${{ steps.mode.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    if: needs.build.outputs.deploy_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
