name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/volundr/adapters/inbound/rest*.py"
      - "scripts/extract_openapi.py"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/volundr/adapters/inbound/rest*.py"
      - "scripts/extract_openapi.py"
    tags:
      - "v*"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          extras: "--extra dev"

      - name: Inject version from latest git tag
        run: |
          VERSION=$(
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -v -- '-' | head -1 | sed 's/^v//' || true
          )
          VERSION=${VERSION:-0.0.0-dev}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          echo "Using version: $VERSION"

      - name: Generate OpenAPI spec
        run: uv run --extra dev python scripts/extract_openapi.py -o docs/site/openapi.json

      - name: Build site
        run: uvx --from mkdocs-material==9.7.5 mkdocs build --strict --site-dir _site

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
