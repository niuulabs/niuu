name: Secret Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          # The action pin fixes the wrapper, not the scanner: it runs
          # ghcr.io/trufflesecurity/trufflehog:latest, so an upstream release
          # changes results with no change here. 3.96.0 began reporting a
          # "verified Lob result" against a diff of Python test functions and
          # a regex — 3.95.2 finds no candidate at all in the same 6,680 bytes,
          # verified or otherwise. Lob is a direct-mail API and appears nowhere
          # in this repo, so its detector can only produce false positives.
          # Every other detector stays on.
          extra_args: --only-verified --exclude-detectors=lob
