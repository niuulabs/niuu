name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"] # stable semver only, skip prerelease (v*-dev.*)

permissions: read-all

env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # Extract version from the tag — single source of truth
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Extract version from tag
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  # ---------------------------------------------------------------------------
  # Containers — build per platform natively, then merge manifests
  # ---------------------------------------------------------------------------
  build-container-image:
    name: "Build ${{ matrix.container }} (${{ matrix.platform }})"
    needs: [version]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [amd64, arm64]
        container: [skuld, openshell, devrunner, niuu-web, niuu, gbrain]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image description from Dockerfile
        id: meta
        run: |
          DESC=$(grep 'org.opencontainers.image.description=' \
            ./containers/${{ matrix.container }}/Dockerfile \
            | head -1 | sed 's/.*description="\(.*\)"/\1/')
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"

      - name: Pick the OS package refresh date
        id: os-refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./containers/${{ matrix.container }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ needs.version.outputs.version }}-${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            OS_PACKAGES_REFRESH=${{ steps.os-refresh.outputs.date }}
          labels: |
            org.opencontainers.image.title=${{ matrix.container }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.licenses=${{ matrix.container == 'gbrain' && 'MIT' || 'Apache-2.0' }}
            org.opencontainers.image.vendor=Niuu Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          # Read-only: dev.yaml owns the registry layer cache (see reusable-container-build.yaml).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:buildcache-${{ matrix.platform }}
          platforms: linux/${{ matrix.platform }}
          provenance: false

  merge-container-manifests:
    name: "Manifest ${{ matrix.container }}"
    needs: [version, build-container-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        container: [skuld, openshell, devrunner, niuu-web, niuu, gbrain]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: containers/${{ matrix.container }}/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Extract image description from Dockerfile
        id: meta
        run: |
          DESC=$(grep 'org.opencontainers.image.description=' \
            ./containers/${{ matrix.container }}/Dockerfile \
            | head -1 | sed 's/.*description="\(.*\)"/\1/')
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}"
          VERSION="${{ needs.version.outputs.version }}"

          ANNOTATIONS=(
            --annotation "index:org.opencontainers.image.title=${{ matrix.container }}"
            --annotation "index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}"
            --annotation "index:org.opencontainers.image.licenses=${{ matrix.container == 'gbrain' && 'MIT' || 'Apache-2.0' }}"
            --annotation "index:org.opencontainers.image.vendor=Niuu Labs"
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}"
            --annotation "index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}"
            --annotation "index:org.opencontainers.image.version=${VERSION}"
          )

          # versioned tag
          docker buildx imagetools create "${ANNOTATIONS[@]}" \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          # latest
          docker buildx imagetools create "${ANNOTATIONS[@]}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Install cosign
        run: |
          COSIGN_VERSION="2.4.3"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
          echo "caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Sign container image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}"
          VERSION="${{ needs.version.outputs.version }}"
          cosign sign --yes "${IMAGE}:${VERSION}"

  # Scan and generate SBOMs after manifests are published
  scan-containers:
    name: "Scan ${{ matrix.container }}"
    needs: [version, merge-container-manifests]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      matrix:
        container: [skuld, openshell, devrunner, niuu-web, niuu, gbrain]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          SYFT_VERSION="1.22.0"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/9ab83874ed21c07479d8eeddd88a6894e1ff8537/install.sh | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version

      - name: Generate SBOM
        run: |
          syft "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ needs.version.outputs.version }}" \
            -o spdx-json > "sbom-${{ matrix.container }}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ matrix.container }}.spdx.json
          path: sbom-${{ matrix.container }}.spdx.json

      # scan.sh needs the pinned Syft that matches Grype, not the SBOM step's Syft above.
      - name: Install Syft and Grype for the scan
        run: bash containers/python-security/install-scanners.sh

      - name: Scan container with Grype
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ needs.version.outputs.version }}
          CONTAINER: ${{ matrix.container }}
        run: bash containers/python-security/scan.sh "$IMAGE" "$CONTAINER"

      - name: Preserve scan and backport evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-evidence-${{ matrix.container }}
          path: |
            grype-${{ matrix.container }}-*.json
            python-security-${{ matrix.container }}*.json
            sbom-${{ matrix.container }}.syft.json
          retention-days: 30

      - name: Detect Grype results
        id: sarif
        if: always()
        run: |
          if [ -f "grype-${{ matrix.container }}.sarif" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && steps.sarif.outputs.present == 'true'
        with:
          sarif_file: grype-${{ matrix.container }}.sarif
          category: grype-${{ matrix.container }}

  # Use the same cached, measured build as the development binary pipeline.
  build-cli:
    needs: version
    uses: ./.github/workflows/reusable-cli-build.yaml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Helm charts
  # ---------------------------------------------------------------------------
  build-charts:
    name: Build Helm Charts
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        run: |
          HELM_VERSION="3.14.0"
          curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          echo "f43e1c3387de24547506ab05d24e5309c0ce0b228c23bd8aa64e9ec4b8206651  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Update chart versions
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          for CHART in bifrost skuld volundr ting skuld-planner niuu-shared niuu mimir gbrain; do
            sed -i "s/^version:.*/version: $VERSION/" "charts/${CHART}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" "charts/${CHART}/Chart.yaml"
          done

          # Update pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Package Helm charts
        run: |
          helm package charts/mimir -d .helm-packages/
          helm package charts/gbrain -d .helm-packages/
          helm package charts/bifrost -d .helm-packages/
          helm package charts/skuld -d .helm-packages/
          helm package charts/skuld-planner -d .helm-packages/
          helm package charts/volundr -d .helm-packages/
          helm package charts/ting -d .helm-packages/
          helm package charts/niuu-shared -d .helm-packages/
          rm -f charts/niuu/Chart.lock
          helm dependency update charts/niuu
          helm package charts/niuu -d .helm-packages/

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm charts to OCI registry
        run: |
          helm push .helm-packages/mimir-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/gbrain-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/bifrost-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/skuld-[0-9]*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/skuld-planner-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/volundr-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/ting-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/niuu-shared-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/niuu-[0-9]*.tgz ${{ env.CHART_REPO }}

  docs-check:
    name: Validate published documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build documentation strictly
        run: |
          uv run --extra dev python scripts/extract_openapi.py -o docs/site/openapi.json
          uv run --extra dev pytest tests/test_scripts/test_check_quickstart.py --no-cov -q
          uvx --from mkdocs-material==9.7.5 mkdocs build --strict

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs:
      [
        version,
        merge-container-manifests,
        scan-containers,
        build-charts,
        build-cli,
        docs-check,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CLI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: cli-binaries
          pattern: niuu-*

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in cli-binaries/niuu-*/; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            cp "${dir}${binary}" "release-assets/${binary}"
            chmod +x "release-assets/${binary}"
          done
          # The installer is a release asset like the binaries, so
          # `releases/latest/download/install.sh` always matches the release.
          # The released copy pins this release's platform image instead of
          # `latest`, so the CLI wrapper and the platform never drift apart.
          VERSION="${{ needs.version.outputs.version }}"
          sed "s|NIUU_IMAGE_TAG:-latest|NIUU_IMAGE_TAG:-${VERSION}|" scripts/install.sh > release-assets/install.sh
          grep -q "NIUU_IMAGE_TAG:-${VERSION}" release-assets/install.sh
          chmod +x release-assets/install.sh
          cd release-assets && sha256sum niuu-* install.sh > checksums.txt
          ls -lh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/niuu-*
            release-assets/install.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "Release v${{ needs.version.outputs.version }}" \
            --generate-notes \
            release-assets/niuu-* \
            release-assets/install.sh \
            release-assets/checksums.txt
