name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"] # stable semver only, skip prerelease (v*-dev.*)

permissions: read-all

env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # Extract version from the tag — single source of truth
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Extract version from tag
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

  # ---------------------------------------------------------------------------
  # Containers — build per platform natively, then merge manifests
  # ---------------------------------------------------------------------------
  build-container-image:
    name: "Build ${{ matrix.container }} (${{ matrix.platform }})"
    needs: [version]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [amd64, arm64]
        container: [agent, skuld, devrunner, volundr-web, niuu-web, niuu]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image description from Dockerfile
        id: meta
        run: |
          DESC=$(grep 'org.opencontainers.image.description=' \
            ./containers/${{ matrix.container }}/Dockerfile \
            | head -1 | sed 's/.*description="\(.*\)"/\1/')
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./containers/${{ matrix.container }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ needs.version.outputs.version }}-${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.container }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Niuu Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.container }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.container }}-${{ matrix.platform }}
          platforms: linux/${{ matrix.platform }}
          provenance: false

  merge-container-manifests:
    name: "Manifest ${{ matrix.container }}"
    needs: [version, build-container-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        container: [agent, skuld, devrunner, volundr-web, niuu-web, niuu]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: containers/${{ matrix.container }}/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Extract image description from Dockerfile
        id: meta
        run: |
          DESC=$(grep 'org.opencontainers.image.description=' \
            ./containers/${{ matrix.container }}/Dockerfile \
            | head -1 | sed 's/.*description="\(.*\)"/\1/')
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}"
          VERSION="${{ needs.version.outputs.version }}"

          ANNOTATIONS=(
            --annotation "index:org.opencontainers.image.title=${{ matrix.container }}"
            --annotation "index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}"
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0"
            --annotation "index:org.opencontainers.image.vendor=Niuu Labs"
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}"
            --annotation "index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}"
            --annotation "index:org.opencontainers.image.version=${VERSION}"
          )

          # versioned tag
          docker buildx imagetools create "${ANNOTATIONS[@]}" \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          # latest
          docker buildx imagetools create "${ANNOTATIONS[@]}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

      - name: Install cosign
        run: |
          COSIGN_VERSION="2.4.3"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
          echo "caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Sign container image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}"
          VERSION="${{ needs.version.outputs.version }}"
          cosign sign --yes "${IMAGE}:${VERSION}"

  # Scan and generate SBOMs after manifests are published
  scan-containers:
    name: "Scan ${{ matrix.container }}"
    needs: [version, merge-container-manifests]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      matrix:
        container: [agent, skuld, devrunner, volundr-web, niuu-web, niuu]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          SYFT_VERSION="1.22.0"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/9ab83874ed21c07479d8eeddd88a6894e1ff8537/install.sh | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version

      - name: Generate SBOM
        run: |
          syft "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ needs.version.outputs.version }}" \
            -o spdx-json > "sbom-${{ matrix.container }}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.container }}.spdx.json
          path: sbom-${{ matrix.container }}.spdx.json

      - name: Install Grype
        env:
          GRYPE_VERSION: "0.87.0"
        run: |
          set -euo pipefail

          install_grype() {
            curl --retry 5 --retry-all-errors --retry-delay 2 -sSfL \
              https://raw.githubusercontent.com/anchore/grype/247f5d72abf2131aa37f3164a98495c121b29029/install.sh \
              | sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"
          }

          for attempt in 1 2 3; do
            if install_grype; then
              grype version
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 5))
          done

          grype version

      - name: Scan container with Grype
        run: |
          grype "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.container }}:${{ needs.version.outputs.version }}" \
            --only-fixed \
            --fail-on critical \
            -o sarif > "grype-${{ matrix.container }}.sarif"

      - name: Detect Grype results
        id: sarif
        if: always()
        run: |
          if [ -f "grype-${{ matrix.container }}.sarif" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always() && steps.sarif.outputs.present == 'true'
        with:
          sarif_file: grype-${{ matrix.container }}.sarif
          category: grype-${{ matrix.container }}

  # ---------------------------------------------------------------------------
  # Shared CLI assets — build once, reuse in packaging jobs
  # ---------------------------------------------------------------------------
  build-cli-web-assets:
    name: Build CLI Web Assets
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Build web assets for embedded CLI
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web-next
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          rm -rf src/cli/web/dist
          mkdir -p src/cli/web
          cp -r web-next/apps/niuu/dist src/cli/web/dist

      - name: Upload CLI web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-web-dist
          path: src/cli/web/dist

  # ---------------------------------------------------------------------------
  # CLI binaries
  # ---------------------------------------------------------------------------
  build-cli:
    name: "Build CLI (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [version, build-cli-web-assets]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download CLI web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-web-dist
          path: src/cli/web

      - name: Restore PostgreSQL bundle cache
        id: pg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: build/pginstall
          key: pginstall-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('src/niuu/pg_versions.py', 'scripts/build_postgres.sh') }}

      - name: Load PostgreSQL versions
        id: pg-versions
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          namespace = {}
          exec(open("src/niuu/pg_versions.py", encoding="utf-8").read(), namespace)
          print(f"postgres_version={namespace['POSTGRES_VERSION']}")
          print(f"pgvector_version={namespace['PGVECTOR_VERSION']}")
          PY

      - name: Build embedded PostgreSQL bundle
        if: steps.pg-cache.outputs.cache-hit != 'true'
        env:
          POSTGRES_VERSION: ${{ steps.pg-versions.outputs.postgres_version }}
          PGVECTOR_VERSION: ${{ steps.pg-versions.outputs.pgvector_version }}
          INSTALL_PREFIX: build/pginstall
        run: scripts/build_postgres.sh

      - name: Install Linux ARM64 Nuitka toolchain
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "LDFLAGS=-fuse-ld=lld"
          } >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --python 3.12 --extra cli --extra dev

      - name: Build
        run: make copy-migrations build-cli

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: niuu-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/niuu-${{ matrix.os }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  # Ravn binary
  # ---------------------------------------------------------------------------
  build-ravn:
    name: "Build Ravn (${{ matrix.os }}/${{ matrix.arch }})"
    needs: [version]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux ARM64 Nuitka toolchain
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          {
            echo "CC=clang"
            echo "CXX=clang++"
            echo "LDFLAGS=-fuse-ld=lld"
          } >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --extra cli --extra dev

      - name: Build
        run: make build-ravn

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ravn-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/ravn-${{ matrix.os }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  # Helm charts
  # ---------------------------------------------------------------------------
  build-charts:
    name: Build Helm Charts
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        run: |
          HELM_VERSION="3.14.0"
          curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
          echo "f43e1c3387de24547506ab05d24e5309c0ce0b228c23bd8aa64e9ec4b8206651  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Update chart versions
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          for CHART in agent bifrost ravn skuld volundr ting skuld-planner niuu-shared niuu; do
            sed -i "s/^version:.*/version: $VERSION/" "charts/${CHART}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" "charts/${CHART}/Chart.yaml"
          done

          # Update pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Package Helm charts
        run: |
          helm package charts/bifrost -d .helm-packages/
          helm package charts/agent -d .helm-packages/
          helm package charts/ravn -d .helm-packages/
          helm package charts/skuld -d .helm-packages/
          helm package charts/skuld-planner -d .helm-packages/
          helm package charts/volundr -d .helm-packages/
          helm package charts/ting -d .helm-packages/
          helm package charts/niuu-shared -d .helm-packages/
          rm -f charts/niuu/Chart.lock
          helm dependency update charts/niuu
          helm package charts/niuu -d .helm-packages/

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm charts to OCI registry
        run: |
          helm push .helm-packages/agent-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/bifrost-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/ravn-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/skuld-[0-9]*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/skuld-planner-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/volundr-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/ting-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/niuu-shared-*.tgz ${{ env.CHART_REPO }}
          helm push .helm-packages/niuu-[0-9]*.tgz ${{ env.CHART_REPO }}

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs:
      [
        version,
        merge-container-manifests,
        scan-containers,
        build-charts,
        build-cli,
        build-ravn,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: cli-binaries
          pattern: niuu-*

      - name: Download Ravn artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: cli-binaries
          pattern: ravn-*

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in cli-binaries/niuu-*/ cli-binaries/ravn-*/; do
            [ -d "$dir" ] || continue
            binary=$(basename "$dir")
            cp "${dir}${binary}" "release-assets/${binary}"
            chmod +x "release-assets/${binary}"
          done
          cd release-assets && sha256sum niuu-* ravn-* > checksums.txt
          ls -lh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: |
            release-assets/niuu-*
            release-assets/ravn-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "Release v${{ needs.version.outputs.version }}" \
            --generate-notes \
            release-assets/niuu-* \
            release-assets/ravn-* \
            release-assets/checksums.txt
