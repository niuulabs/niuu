version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web-next
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      web-next:
        patterns:
          - "*"
        # A TypeScript major drags every other update down with it: the .d.ts
        # build goes through rollup-plugin-dts, which reads compiler internals
        # and breaks until it ships support for the new major. Keep majors out
        # of the group so they arrive as their own reviewable PR.
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - /containers/node/npm-bootstrap
      - /containers/skuld/npm-tools
      - /containers/devrunner/npm-tools
      - /containers/volundr/npm-tools
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-tools:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /containers/niuu
      - /containers/openshell
      - /containers/gbrain
      - /containers/vscode-reh
      - /containers/agent
      - /containers/skuld
      - /containers/devrunner
      - /containers/volundr-web
      - /containers/niuu-web
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
