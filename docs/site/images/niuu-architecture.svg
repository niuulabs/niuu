  <text x="600" y="136" text-anchor="middle" class="small">teams and workflows</text>
  <text x="600" y="154" text-anchor="middle" class="small">handoffs · reviews · approvals</text>

  <rect x="860" y="72" width="220" height="100" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="970" y="112" text-anchor="middle" class="title">Wardens</text>
  <text x="970" y="136" text-anchor="middle" class="small">long-running assistants</text>
  <text x="970" y="154" text-anchor="middle" class="small">dream cycles · source watching · console</text>

  <!-- center title -->
  <rect x="462" y="208" width="276" height="34" rx="17" fill="#0C2532"/>
