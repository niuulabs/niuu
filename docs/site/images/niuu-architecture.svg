<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="0" y="0" width="1200" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
    <style>
      .title { font: 700 18px Inter, Arial, sans-serif; fill: #F8FAFC; }
      .label { font: 600 13px Inter, Arial, sans-serif; fill: #E2E8F0; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #94A3B8; }
      .tiny { font: 600 11px Inter, Arial, sans-serif; fill: #7DD3FC; letter-spacing: 0.08em; text-transform: uppercase; }
      .nodeTitle { font: 700 16px Inter, Arial, sans-serif; fill: #F8FAFC; }
      .nodeSub { font: 500 11px Inter, Arial, sans-serif; fill: #CBD5E1; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#0B1120"/>
  <circle cx="600" cy="385" r="185" fill="#102238" opacity="0.85" filter="url(#glow)"/>

  <!-- top row -->
  <rect x="120" y="72" width="220" height="100" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="230" y="112" text-anchor="middle" class="title">Volundr</text>
  <text x="230" y="136" text-anchor="middle" class="small">live workspaces</text>
  <text x="230" y="154" text-anchor="middle" class="small">repos · terminals · diffs · pods</text>

  <rect x="490" y="72" width="220" height="100" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
