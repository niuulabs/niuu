<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge Session Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app rail · session list · conversation · right dock, the Lexi Mac shell rebuilt in web-next's niuu theme tokens. */
:root {
  color-scheme: dark;
  /* web-next design-tokens, [data-theme='niuu'] */
  --bg: #071019;
  --bg2: #10212d;
  --bg3: #182b38;
  --bg-el: #2b4351;
  --quiet: #0b1722;
  --code: #050c13;
  --fg: #edf4f7;
  --fg2: #a5b7c1;
  --muted: #78909d;
  --faint: #648090;
  --border: #2b4351;
  --border-subtle: #182b38;
  --brand: #86d0e8;
  --brand-300: #a8e7f4;
  --brand-600: #3a8baa;
  --brand-800: #1d5a73;
  --on-brand: #0b2937;
  --sent: #182b38;
  --ok: #76bfa7;
  --warn: #e4bd7e;
  --crit: #e78d94;
  --gate: #c4b5fd;
  --claude: #fb923c;
  --codex: #60a5fa;
  --grok: #22d3ee;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrainsMono NF', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-pill: 9999px;
  --ease: 200ms ease;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
svg.i.lg { width: 18px; height: 18px; }

/* ---------- mockup bar (not product UI) ---------- */
.mockbar { height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: repeating-linear-gradient(135deg, #0b1722 0 10px, #0d1b27 10px 20px); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.mockbar .tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
.mockbar nav { display: flex; gap: 4px; }
.mockbar nav button { padding: 4px 10px; border-radius: var(--r-pill); color: var(--fg2); }
.mockbar nav button[aria-pressed="true"] { background: var(--bg3); color: var(--fg); }
.mockbar .sp { flex: 1; }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--fg2); }
.switch .track { width: 28px; height: 16px; border-radius: 99px; background: var(--bg-el); position: relative; transition: background var(--ease); }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg2); transition: transform var(--ease); }
.switch[aria-checked="true"] .track { background: var(--brand-600); }
.switch[aria-checked="true"] .track::after { transform: translateX(12px); background: var(--fg); }

/* ---------- wiring annotations ---------- */
.wire { display: none; font-family: var(--font-mono); font-size: 10px; line-height: 1.3; font-weight: 500; color: #f5d0fe; background: rgba(192, 132, 252, .14); border: 1px dashed rgba(192, 132, 252, .55); border-radius: 4px; padding: 1px 5px; white-space: nowrap; vertical-align: middle; }
.wire.new { color: #fde68a; background: rgba(250, 204, 21, .10); border-color: rgba(250, 204, 21, .5); }
body.wiring .wire { display: inline-block; }
.wire-row { display: none; gap: 6px; flex-wrap: wrap; }
body.wiring .wire-row { display: flex; }

/* ---------- shell ---------- */
.app { height: calc(100% - 40px); display: grid; grid-template-columns: 52px 296px minmax(0, 1fr) 288px; }
.app.nodock, .app.dockless { grid-template-columns: 52px 296px minmax(0, 1fr) 0; }
.rail { background: var(--quiet); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px; }
.rail .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(140deg, var(--brand) 0%, var(--brand-600) 100%); color: var(--on-brand); font-weight: 700; display: grid; place-items: center; font-size: 13px; margin-bottom: 10px; }
.rail button { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); position: relative; }
.rail button.on { background: var(--bg3); color: var(--brand); }
.rail button .badge { position: absolute; top: 4px; right: 4px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; background: var(--warn); color: #1d1405; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; }

/* ---------- session list ---------- */
.side { border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.side-head { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
.side-title { display: flex; align-items: center; gap: 6px; }
.side-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; }
.iconbtn { width: 30px; height: 30px; border-radius: var(--r-md); display: grid; place-items: center; color: var(--fg2); }
.iconbtn:hover { background: var(--bg3); color: var(--fg); }
.iconbtn.brand { color: var(--brand); }
.today { font-size: 12px; color: var(--muted); margin-top: -8px; }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-md); background: var(--bg2); border: 1px solid var(--border-subtle); color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { flex: none; height: 26px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--border-subtle); background: var(--bg2); font-size: 12px; font-weight: 600; color: var(--fg2); display: inline-flex; align-items: center; gap: 5px; }
.chip .n { font-weight: 500; color: var(--muted); }
.chip.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.chip.on .n { color: var(--on-brand); opacity: .75; }
.groupby { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.groupby b { color: var(--fg2); font-weight: 600; }
.list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; min-height: 0; }
.grp { display: flex; align-items: center; gap: 6px; padding: 10px 6px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.grp .n { font-weight: 500; color: var(--faint); }
.grp .sp { flex: 1; }
.row { width: 100%; text-align: left; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 1px; padding: 9px 10px; border-radius: var(--r-lg); align-items: center; }
.row:hover { background: var(--bg2); }
.row.sel { background: var(--bg3); }
.row .dot { width: 7px; height: 7px; border-radius: 50%; justify-self: center; }
.row .title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .title.unread::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); margin-left: 6px; vertical-align: middle; }
.row .preview { grid-column: 2 / 4; font-size: 12.5px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { grid-column: 2 / 3; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .fact { grid-column: 3; font-size: 11.5px; color: var(--muted); text-align: right; }
.pill { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: var(--r-pill); font-size: 10.5px; font-weight: 600; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border: .5px solid color-mix(in srgb, var(--c) 32%, transparent); }
.side-foot { border-top: 1px solid var(--border-subtle); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.side-foot .sp { flex: 1; }
.eng { font-weight: 600; }

/* ---------- conversation ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.head { padding: 12px 20px 0; border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.head-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.head-top .live { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.head-title { min-width: 0; flex: 1; }
.head-title h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.head-title h2 span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subline { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.subline .sep { color: var(--faint); }
.head-tools { display: flex; align-items: center; gap: 4px; flex: none; }
.meter { display: inline-flex; align-items: center; gap: 7px; padding: 3px 9px 3px 4px; border-radius: var(--r-pill); background: var(--bg2); border: 1px solid var(--border-subtle); font-size: 11.5px; color: var(--fg2); }
.meter svg { width: 20px; height: 20px; }
.prchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); background: var(--bg2); border: 1px solid var(--border-subtle); font-size: 12px; color: var(--fg2); }
.prchip .spin { width: 10px; height: 10px; }
.tabs { display: flex; gap: 2px; margin-bottom: -1px; overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 8px 12px; font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--brand); }
.tabs .n { font-size: 11px; color: var(--faint); margin-left: 3px; }

.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.transcript { max-width: 820px; margin: 0 auto; padding: 22px 28px 28px; display: flex; flex-direction: column; gap: 14px; }
.capsule { align-self: center; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 3px 12px; border-radius: var(--r-pill); background: var(--bg2); border: 1px solid var(--border-subtle); }
.earlier { border: 1px solid var(--border-subtle); border-radius: var(--r-lg); background: var(--quiet); overflow: hidden; }
.earlier-h { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 12px; color: var(--muted); }
.earlier-h .sp { flex: 1; }
.pair { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--border-subtle); font-size: 13px; align-items: baseline; }
.pair .who { font-size: 11px; color: var(--faint); }
.pair .q { color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pair .a { grid-column: 2 / 3; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pair .when { font-size: 11px; color: var(--faint); grid-row: 1 / 3; grid-column: 3; align-self: center; }

.you { align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.you .meta { font-size: 11px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.bubble { background: var(--sent); border: 1px solid color-mix(in srgb, var(--brand) 24%, transparent); border-radius: 18px 18px 6px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.5; }
.bubble.queued { background: color-mix(in srgb, var(--sent) 50%, transparent); border: 1px dashed var(--border); color: var(--fg2); font-style: italic; }
.qstate { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--warn); }
.qstate .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); animation: pulse 1.4s ease-out infinite; }

.speaker { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--c); }
.speaker i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; }
.speaker .when { font-weight: 400; color: var(--faint); font-size: 11.5px; }
.final-tag { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; font-weight: 600; color: var(--fg2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.prose { font-size: 15px; line-height: 1.62; }
.prose p { margin: 0 0 8px; }
.prose p:last-child { margin-bottom: 0; }
.prose ul { margin: 4px 0 8px; padding-left: 20px; }
.prose li { margin: 3px 0; }
.prose code { font-family: var(--font-mono); font-size: 13px; background: var(--bg3); border-radius: 4px; padding: 1px 5px; }
.prose a { color: var(--brand); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--brand) 35%, transparent); }
.commentary { color: color-mix(in srgb, var(--fg) 82%, var(--bg)); }
.answer { display: flex; flex-direction: column; gap: 8px; }
.msgbar { display: flex; gap: 2px; margin-top: 2px; opacity: .0; transition: opacity var(--ease); }
.answer:hover .msgbar, .msgbar:focus-within { opacity: 1; }
.msgbar button { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--r-sm); font-size: 11.5px; color: var(--muted); }
.msgbar button:hover { background: var(--bg2); color: var(--fg); }

/* tool-call session row (hierarchical) */
.toolrun { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 9px 12px; border-radius: var(--r-lg); border: 1px solid var(--border-subtle); background: color-mix(in srgb, var(--bg2) 55%, transparent); }
.toolrun:hover { border-color: var(--border); }
.tr-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tr-icons { display: flex; gap: 3px; flex: none; }
.tr-icons span { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--bg3); color: var(--fg2); }
.tr-sum { flex: 1; min-width: 0; font-size: 13px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-sum b { color: var(--fg); font-weight: 600; }
.tr-diff { font-family: var(--font-mono); font-size: 11.5px; flex: none; }
.tr-diff .add { color: var(--ok); } .tr-diff .del { color: var(--crit); }
.tr-time { font-size: 11.5px; color: var(--muted); flex: none; }
.tr-state { flex: none; display: grid; place-items: center; color: var(--muted); }
.tr-ticker { display: flex; align-items: center; gap: 8px; padding-left: 2px; font-size: 12px; color: var(--brand-300); font-family: var(--font-mono); min-width: 0; }
.tr-ticker span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolrun.live { border-color: color-mix(in srgb, var(--brand) 30%, transparent); }
.spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--brand) 25%, transparent); border-top-color: var(--brand); animation: spin .9s linear infinite; flex: none; }

/* inline mode tool cards */
.inline-calls { display: flex; flex-direction: column; gap: 6px; }
.tcard { border: .5px solid var(--border); border-radius: var(--r-md); background: color-mix(in srgb, var(--bg2) 35%, transparent); }
.tcard.fail { border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.tcard-h { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; text-align: left; font-size: 12.5px; min-width: 0; }
.tcard-h .verb { font-weight: 600; flex: none; }
.tcard-h .subj { font-family: var(--font-mono); font-size: 12px; color: var(--fg2); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard-h .d { font-size: 11px; color: var(--muted); flex: none; }
.tcard-b { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.out { background: var(--code); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); padding: 9px 11px; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; color: var(--fg2); overflow-x: auto; white-space: pre; }
.out .cmd { color: var(--fg); }
.out .err { color: var(--crit); }
.out .okl { color: var(--ok); }
.out .add { color: var(--ok); display: block; background: rgba(118, 191, 167, .08); }
.out .del { color: var(--crit); display: block; background: rgba(231, 141, 148, .08); }
.out .hunk { color: var(--brand); display: block; }
.out .ctx { display: block; }
.outlabel { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted); }
.outlabel .exit { font-family: var(--font-mono); }
.elide { font-size: 11.5px; color: var(--muted); }
.elide button { color: var(--brand); }

/* subagent / deliverable / error / relay cards */
.card { border: 1px solid var(--border); border-radius: 14px; background: linear-gradient(180deg, #13283a 0%, #0e1d29 100%); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card-h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.card-h .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card-h .sp { flex: 1; }
.card .stats { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.card .stats b { color: var(--fg2); font-weight: 500; }
.deliver { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.deliver .ficon { width: 44px; height: 52px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--border); display: grid; place-items: center; color: var(--brand); position: relative; }
.deliver .ficon small { position: absolute; bottom: 4px; font-family: var(--font-mono); font-size: 8.5px; color: var(--fg2); }
.deliver .fn { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deliver .fd { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--bg2); font-size: 12.5px; font-weight: 500; color: var(--fg); white-space: nowrap; }
.btn:hover { background: var(--bg3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; color: var(--fg2); }
.errcard { border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: color-mix(in srgb, var(--crit) 7%, var(--bg)); }
.errcard .card-h { color: var(--crit); font-weight: 600; }
.relay { border-style: dashed; background: var(--quiet); }
.compact-marker { align-self: stretch; display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--muted); }
.compact-marker::before, .compact-marker::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
.worked { display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--faint); }
.worked::before, .worked::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
.dots { display: inline-flex; gap: 5px; padding: 4px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--claude); animation: bounce 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }

/* ---------- bottom band: plan dock / question / composer ---------- */
.band { padding: 0 28px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 876px; width: 100%; margin: 0 auto; }
.plandock { align-self: center; display: flex; flex-direction: column; border-radius: 18px; border: 1px solid var(--border); background: color-mix(in srgb, var(--bg2) 88%, transparent); backdrop-filter: blur(14px); overflow: hidden; max-width: 100%; }
.plandock.open { align-self: stretch; }
.plan-cap { display: flex; align-items: center; gap: 10px; padding: 7px 14px; font-size: 12.5px; color: var(--fg2); text-align: left; }
.plan-cap .ring { width: 16px; height: 16px; flex: none; }
.plan-cap b { color: var(--fg); font-weight: 600; }
.plan-cap .ag { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.plan-list { padding: 4px 14px 12px; display: grid; gap: 4px; border-top: 1px solid var(--border-subtle); }
.plan-item { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--fg2); padding: 3px 0; }
.plan-item.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.plan-item.active { color: var(--fg); font-weight: 500; }
.box { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--faint); display: grid; place-items: center; flex: none; }
.plan-item.done .box { background: var(--ok); border-color: var(--ok); color: var(--on-brand); }
.plan-item.active .box { border-color: var(--brand); }

/* ---------------- render + events ---------------- */
function render() {
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view || (S.view === 'new' && b.dataset.view === 'new'))));
  document.getElementById('fmap').hidden = S.view !== 'map';
  if (S.view === 'map') renderMap();
  renderSide();
  renderMain();
  renderDock();
  document.getElementById('app').classList.toggle('dockless', S.view === 'unread');
  renderOverlay();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-close]');
  if (!t) { if (S.menu) { S.menu = null; render(); } return; }
  if (t.id === 'wiringToggle') { const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', String(on)); document.body.classList.toggle('wiring', on); return; }
  if (t.dataset.view) { S.view = t.dataset.view; S.menu = null; S.drawer = null; render(); return; }
  if (t.dataset.open === 'new') { S.view = 'new'; render(); return; }
  if (t.hasAttribute('data-close')) { S.drawer = null; if (S.view === 'new') S.view = 'workspace'; render(); return; }
  if (t.dataset.sess) { S.sel = t.dataset.sess; S.view = 'workspace'; S.qOpt = 0; S.qTab = 0; S.planOpen = false; const s = SESSIONS.find(x => x.id === S.sel); s.unread = false; render(); return; }
  if (t.dataset.run) { S.drawer = t.dataset.run; renderOverlay(); return; }
  if (t.hasAttribute('data-toggle-call')) { const b = t.nextElementSibling; b.hidden = !b.hidden; t.firstElementChild.outerHTML = ic(b.hidden ? 'right' : 'down', 'sm'); return; }
  if (t.hasAttribute('data-plan')) { S.planOpen = !S.planOpen; renderMain(); return; }
  if (t.dataset.menu) { S.menu = S.menu === t.dataset.menu ? null : t.dataset.menu; renderMain(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; S.menu = null; save(); renderMain(); return; }
  if (t.hasAttribute('data-dock')) { document.getElementById('app').classList.toggle('nodock'); return; }
  if (t.dataset.opt !== undefined) { S.qOpt = +t.dataset.opt; renderMain(); return; }
  if (t.dataset.qtab !== undefined) { S.qTab = +t.dataset.qtab; S.qOpt = 0; renderMain(); return; }
  if (t.hasAttribute('data-qnext')) { if (S.qTab < QUESTIONS.length - 1) { S.qTab++; S.qOpt = 0; renderMain(); } return; }
  if (t.getAttribute('role') === 'switch') { t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true')); return; }
  if (S.menu) { S.menu = null; renderMain(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'draft') return;
  S.draft = e.target.value;
  e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px';
  const send = document.querySelector('.send'); if (send) send.classList.toggle('off', !S.draft);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { S.drawer = null; S.menu = null; if (S.view === 'new') S.view = 'workspace'; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); S.view = 'new'; render(); }
});
const hash = location.hash.slice(1);
if (['workspace', 'unread', 'new', 'map'].includes(hash)) S.view = hash;
render();
</script>
</body>
