{# The six product icons from docs/design/brand/assets/niuu-product-icons.svg. #}
{% macro icon(name, size) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "platform" -%}<path d="M12 3 3 8l9 5 9-5-9-5Zm-9 10 9 5 9-5M3 18l9 5 9-5"/>
  {%- elif name == "workspaces" -%}<rect x="3" y="4" width="18" height="16" rx="1.8"/><path d="M8 4v16M8 9h13"/>
  {%- elif name == "agents" -%}<circle cx="12" cy="7" r="3.2"/><path d="M5 21v-2c0-3.5 3-5.5 7-5.5s7 2 7 5.5v2"/>
  {%- elif name == "forge" -%}<path d="m12 2 9 5.2v9.6L12 22l-9-5.2V7.2L12 2Zm-9 5.2L12 12l9-4.8M12 12v10"/>
  {%- elif name == "memory" -%}<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
  {%- elif name == "observatory" -%}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
  {%- endif -%}
</svg>
{%- endmacro %}
